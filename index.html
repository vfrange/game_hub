<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0014">
<title>Ben & Luca Games</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; min-height:100%; background:#0a0014; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#fff; overscroll-behavior:none; }
  body { display:flex; justify-content:center; min-height:100vh; min-height:100dvh; }

  /* Stage limitado a aspect mobile pra funcionar bonito em desktop também */
  #stage { width:100%; max-width:min(100vw, calc(100vh * 9 / 16)); min-height:100vh; min-height:100dvh; position:relative; display:flex; flex-direction:column; padding:env(safe-area-inset-top,16px) 16px env(safe-area-inset-bottom,16px); }

  #bgCanvas { position:fixed; inset:0; z-index:0; pointer-events:none; }

  /* HEADER */
  header { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:8px 4px 0; }
  .iconBtn { width:44px; height:44px; border:none; background:rgba(255,255,255,.08); color:#fff; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .15s, background .15s; }
  .iconBtn:active { transform:scale(.92); background:rgba(255,255,255,.18); }
  .title { text-align:center; line-height:.95; }
  .brand { font-size:clamp(22px, 6vw, 32px); font-weight:900; letter-spacing:1px; background:linear-gradient(90deg,#ff00cc,#00f0ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand2 { font-size:clamp(13px, 3.5vw, 18px); font-weight:700; letter-spacing:6px; opacity:.65; margin-top:2px; }

  /* STATS */
  .stats { position:relative; z-index:2; display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 4px 8px; }
  .stat-card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:10px 14px; text-align:center; }
  .stat-num { font-size:22px; font-weight:900; color:#ffd700; }
  .stat-label { font-size:11px; opacity:.7; margin-top:2px; }

  /* GRID */
  .grid { position:relative; z-index:2; display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; }
  .card { position:relative; aspect-ratio: 1 / 1.15; background:rgba(255,255,255,.05); border:1.5px solid rgba(255,255,255,.12); border-radius:18px; padding:14px 10px 12px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; text-decoration:none; color:#fff; overflow:hidden; transition:transform .15s, border-color .2s, background .2s; cursor:pointer; }
  .card .icon { font-size:clamp(36px, 11vw, 56px); line-height:1; filter:drop-shadow(0 2px 8px rgba(0,0,0,.6)); margin-top:6px; }
  .card .name { font-size:13px; font-weight:800; text-align:center; margin-top:8px; line-height:1.15; }
  .card .tag { font-size:10px; opacity:.6; margin-top:auto; padding:3px 8px; background:rgba(0,0,0,.3); border-radius:999px; }
  .card.available:active { transform:scale(.96); }
  .card.locked { opacity:.55; cursor:default; }
  .card.locked .lock { position:absolute; top:8px; right:8px; font-size:14px; opacity:.9; }
  .card .progress { position:absolute; left:10px; right:10px; bottom:32px; height:3px; background:rgba(255,255,255,.1); border-radius:99px; overflow:hidden; opacity:0; transition:opacity .3s; }
  .card .progress.show { opacity:1; }
  .card .progress > div { height:100%; background:linear-gradient(90deg,#ffd700,#ff00cc); transition:width .4s; }

  /* Cores por jogo */
  .card[data-game="dash"]      { border-color:rgba(255,215,0,.5); }
  .card[data-game="dash"]:active { background:rgba(255,215,0,.08); }
  .card[data-game="conta"]     { border-color:rgba(251,191,36,.4); }
  .card[data-game="memory"]    { border-color:rgba(74,222,128,.4); }
  .card[data-game="snake"]     { border-color:rgba(34,197,94,.4); }
  .card[data-game="letroca"]   { border-color:rgba(56,189,248,.4); }
  .card[data-game="skyhop"]    { border-color:rgba(6,182,212,.4); }
  .card[data-game="platformer"]{ border-color:rgba(239,68,68,.4); }
  .card[data-game="cruzadas"]  { border-color:rgba(236,72,153,.4); }
  .card[data-game="balloons"]  { border-color:rgba(244,63,94,.4); }
  .card[data-game="animals"]   { border-color:rgba(163,230,53,.4); }
  .card[data-game="paint"]     { border-color:rgba(168,85,247,.4); }
  .card[data-game="piano"]     { border-color:rgba(192,132,252,.4); }
  .card[data-game="mole"]      { border-color:rgba(253,224,71,.4); }
  .card[data-game="g2048"]     { border-color:rgba(96,165,250,.4); }
  .card[data-game="tetris"]    { border-color:rgba(34,211,238,.4); }
  .card[data-game="breakout"]  { border-color:rgba(236,72,153,.4); }
  .card[data-game="race"]      { border-color:rgba(251,146,60,.4); }
  .card[data-game="sokoban"]   { border-color:rgba(251,191,36,.4); }
  .card[data-game="invaders"]  { border-color:rgba(34,197,94,.4); }
  .card[data-game="sudoku"]    { border-color:rgba(96,165,250,.4); }
  .card[data-game="pacman"]    { border-color:rgba(251,191,36,.4); }
  .card[data-game="tower"]     { border-color:rgba(34,197,94,.4); }
  .card[data-game="rpg"]       { border-color:rgba(168,85,247,.4); }

  /* FOOTER */
  footer { position:relative; z-index:2; text-align:center; padding:18px 0 8px; opacity:.5; font-size:11px; }

  /* MODAL LOCKED */
  #lockedModal { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.85); z-index:50; padding:20px; }
  #lockedModal.hidden { display:none; }
  .lockedBox { background:#1a1a2e; padding:28px 24px; border-radius:18px; max-width:300px; width:100%; border:1px solid rgba(255,255,255,.1); text-align:center; }
  .lockedBox .bigIcon { font-size:64px; line-height:1; margin-bottom:12px; }
  .lockedBox h2 { font-size:18px; margin-bottom:6px; }
  .lockedBox p { font-size:13px; opacity:.7; margin-bottom:18px; line-height:1.4; }
  .lockedBox button { width:100%; padding:14px; font-size:14px; font-weight:700; background:linear-gradient(90deg,#a855f7,#06b6d4); color:#fff; border:none; border-radius:12px; cursor:pointer; }
  .lockedBox button:active { transform:scale(.97); }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="stage">
  <header>
    <button class="iconBtn" id="muteBtn" aria-label="Som">🔊</button>
    <div class="title">
      <div class="brand">BEN &amp; LUCA</div>
      <div class="brand2">GAMES</div>
    </div>
    <button class="iconBtn" id="infoBtn" aria-label="Info">ℹ️</button>
  </header>

  <section class="stats">
    <div class="stat-card">
      <div class="stat-num" id="totalTrophies">0/11</div>

  <div class="grid">
    <button class="card available" data-game="dash">

    <button class="card available" data-game="memory">

      <div class="name">Memória</div>

    </button>
    <button class="card available" data-game="snake">
      <div class="icon">🐍</div>
      <div class="name">Snake</div>
      <div class="progress"><div></div></div>
      <div class="tag">todos</div>
    </button>
    <button class="card available" data-game="letroca">
      <div class="icon">🔤</div>
      <div class="name">Letroca</div>
      <div class="progress"><div></div></div>
      <div class="tag">8+</div>
    </button>
    <button class="card available" data-game="skyhop">
      <div class="icon">🚀</div>
      <div class="name">Sky Hop</div>
      <div class="progress"><div></div></div>
      <div class="tag">todos</div>
    </button>
    <button class="card available" data-game="platformer">
      <div class="icon">🍄</div>
      <div class="name">Mini<br>Mario</div>
      <div class="progress"><div></div></div>
      <div class="tag">todos</div>
    </button>
    <button class="card available" data-game="cruzadas">
      <div class="icon">📝</div>
      <div class="name">Palavras<br>Cruzadas</div>
      <div class="progress"><div></div></div>
      <div class="tag">8+</div>

    <button class="card available" data-game="balloons">
      <div class="icon">🎈</div>

    <button class="card available" data-game="animals">
      <div class="icon">🐮</div>

    <button class="card available" data-game="paint">

      <div class="name">Pintar</div>
      <div class="tag">todos</div>
    </button>
    <button class="card available" data-game="piano">
      <div class="icon">🎹</div>
      <div class="name">Pianinho</div>
      <div class="progress"><div></div></div>
      <div class="tag">todos</div>
    </button>
    <button class="card available" data-game="mole">
      <div class="icon">🎯</div>
      <div class="name">Toupeiras</div>

    </button>
    <button class="card available" data-game="g2048">
      <div class="icon">🔢</div>
      <div class="name">2048</div>
      <div class="progress"><div></div></div>
      <div class="tag">8+</div>
    </button>
    <button class="card available" data-game="tetris">
      <div class="icon">🟦</div>
      <div class="name">Tetris</div>

      <div class="tag">8+</div>
    </button>
    <button class="card available" data-game="breakout">
      <div class="icon">🏓</div>
      <div class="name">Quebra<br>Tijolos</div>

    </button>
    <button class="card available" data-game="race">
      <div class="icon">🚗</div>
      <div class="name">Corrida</div>
      <div class="progress"><div></div></div>
      <div class="tag">todos</div>
    </button>
    <button class="card available" data-game="sokoban">
      <div class="icon">📦</div>
      <div class="name">Sokoban</div>
      <div class="progress"><div></div></div>
      <div class="tag">8+</div>
    </button>
    <button class="card available" data-game="invaders">
      <div class="icon">👾</div>
      <div class="name">Invasores</div>

    </button>
    <button class="card available" data-game="sudoku">
      <div class="icon">🔢</div>
      <div class="name">Sudoku</div>

      <div class="tag">8+</div>
    </button>
    <button class="card available" data-game="pacman">
      <div class="icon">🟡</div>
      <div class="name">Pac-Man</div>

      <div class="tag">todos</div>
    </button>
    <button class="card available" data-game="tower">
      <div class="icon">🏰</div>
      <div class="name">Defesa<br>Torres</div>
      <div class="progress"><div></div></div>

    <button class="card available" data-game="rpg">
      <div class="icon">⚔️</div>

  </div>

  <footer>Toque num jogo pra começar</footer>
</div>

<div id="lockedModal" class="hidden">
  <div class="lockedBox">
    <div class="bigIcon" id="lockedIcon">🚧</div>
    <h2 id="lockedName">Em construção</h2>
    <p>Esse jogo ainda está sendo feito. Vai chegar em breve!</p>
    <button id="lockedOkBtn">Voltar</button>
  </div>
</div>

<script>
(() => {
  // ============ AUDIO ============
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }
  function sndTap()    { beep(660, 0.06, 'triangle', 0.08); setTimeout(() => beep(990, 0.08, 'triangle', 0.07), 40); }
  function sndLocked() { beep(220, 0.18, 'sine', 0.06); }
  function sndOpen()   { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.10, 'triangle', 0.06), i * 60)); }

  // ============ MUTE ============
  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // ============ STATS (lê do Dash existente) ============
  // localStorage do Dash: cubo-dash-best-{i}, cubo-dash-done-{i}, cubo-dash-coins-{i}
  // 11 fases (0-10), 5 moedas cada = 55 total
  let totalDone = 0, totalCoins = 0, maxPct = 0;
  for (let i = 0; i < 11; i++) {
    if (localStorage.getItem('cubo-dash-done-' + i) === '1') totalDone++;
    totalCoins += +(localStorage.getItem('cubo-dash-coins-' + i) || 0);
    maxPct = Math.max(maxPct, +(localStorage.getItem('cubo-dash-best-' + i) || 0));
  }
  document.getElementById('totalTrophies').textContent = totalDone + '/11';
  document.getElementById('totalStars').textContent = totalCoins + '/55';

  // Barra de progresso no card do Dash
  const dashProg = document.querySelector('.card[data-game="dash"] .progress');
  const dashProgBar = dashProg.querySelector('div');
  const dashPct = Math.round((totalDone * 100) / 11);
  if (dashPct > 0 || totalCoins > 0) {
    dashProg.classList.add('show');
    dashProgBar.style.width = Math.max(5, dashPct) + '%';
  }

  // Progresso do Conta Comigo
  let contaStars = 0, contaMax = 9;
  for (let i = 0; i < 3; i++) contaStars += +(localStorage.getItem('blg-conta-stars-' + i) || 0);
  const contaProg = document.querySelector('.card[data-game="conta"] .progress');
  if (contaProg) {
    const bar = contaProg.querySelector('div');
    if (contaStars > 0) {
      contaProg.classList.add('show');
      bar.style.width = Math.max(5, (contaStars / contaMax) * 100) + '%';
    }
  }

  // Progresso do Memory
  let memoryStars = 0, memoryMax = 9;
  for (let i = 0; i < 3; i++) memoryStars += +(localStorage.getItem('blg-memory-stars-' + i) || 0);
  const memoryProg = document.querySelector('.card[data-game="memory"] .progress');
  if (memoryProg) {
    const bar = memoryProg.querySelector('div');
    if (memoryStars > 0) {
      memoryProg.classList.add('show');
      bar.style.width = Math.max(5, (memoryStars / memoryMax) * 100) + '%';
    }
  }

  // Progresso do Snake
  let snakeStars = 0, snakeMax = 9;
  for (let i = 0; i < 3; i++) snakeStars += +(localStorage.getItem('blg-snake-stars-' + i) || 0);
  const snakeProg = document.querySelector('.card[data-game="snake"] .progress');
  if (snakeProg) {
    const bar = snakeProg.querySelector('div');
    if (snakeStars > 0) {
      snakeProg.classList.add('show');
      bar.style.width = Math.max(5, (snakeStars / snakeMax) * 100) + '%';
    }
  }

  // Progresso da Letroca
  let letrocaStars = 0, letrocaMax = 9;
  for (let i = 0; i < 3; i++) letrocaStars += +(localStorage.getItem('blg-letroca-stars-' + i) || 0);
  const letrocaProg = document.querySelector('.card[data-game="letroca"] .progress');
  if (letrocaProg) {
    const bar = letrocaProg.querySelector('div');
    if (letrocaStars > 0) {
      letrocaProg.classList.add('show');
      bar.style.width = Math.max(5, (letrocaStars / letrocaMax) * 100) + '%';
    }
  }

  // Progresso do Sky Hop
  let skyhopStars = 0, skyhopMax = 9;
  for (let i = 0; i < 3; i++) skyhopStars += +(localStorage.getItem('blg-skyhop-stars-' + i) || 0);
  const skyhopProg = document.querySelector('.card[data-game="skyhop"] .progress');
  if (skyhopProg) {
    const bar = skyhopProg.querySelector('div');
    if (skyhopStars > 0) {
      skyhopProg.classList.add('show');
      bar.style.width = Math.max(5, (skyhopStars / skyhopMax) * 100) + '%';
    }
  }

  // Progresso do Mini Mario (5 fases × 3 estrelas = 15 max)
  let marioStars = 0, marioMax = 15;
  for (let i = 0; i < 5; i++) marioStars += +(localStorage.getItem('blg-mario-stars-' + i) || 0);
  const marioProg = document.querySelector('.card[data-game="platformer"] .progress');
  if (marioProg) {
    const bar = marioProg.querySelector('div');
    if (marioStars > 0) {
      marioProg.classList.add('show');
      bar.style.width = Math.max(5, (marioStars / marioMax) * 100) + '%';
    }
  }

  // Progresso das Cruzadas (6 fases × 3 estrelas = 18 max)
  let cruzadasStars = 0, cruzadasMax = 18;
  for (let i = 0; i < 6; i++) cruzadasStars += +(localStorage.getItem('blg-cruzadas-stars-' + i) || 0);
  const cruzadasProg = document.querySelector('.card[data-game="cruzadas"] .progress');
  if (cruzadasProg) {
    const bar = cruzadasProg.querySelector('div');
    if (cruzadasStars > 0) {
      cruzadasProg.classList.add('show');
      bar.style.width = Math.max(5, (cruzadasStars / cruzadasMax) * 100) + '%';
    }
  }

  // Progresso Balões
  let balloonsStars = 0, balloonsMax = 9;
  for (let i = 0; i < 3; i++) balloonsStars += +(localStorage.getItem('blg-balloons-stars-' + i) || 0);
  const balloonsProg = document.querySelector('.card[data-game="balloons"] .progress');
  if (balloonsProg) {
    const bar = balloonsProg.querySelector('div');
    if (balloonsStars > 0) {
      balloonsProg.classList.add('show');
      bar.style.width = Math.max(5, (balloonsStars / balloonsMax) * 100) + '%';
    }
  }

  // Progresso Bicharada
  let animalStars = 0, animalMax = 9;
  for (let i = 0; i < 3; i++) animalStars += +(localStorage.getItem('blg-animal-stars-' + i) || 0);
  const animalProg = document.querySelector('.card[data-game="animals"] .progress');
  if (animalProg) {
    const bar = animalProg.querySelector('div');
    if (animalStars > 0) {
      animalProg.classList.add('show');
      bar.style.width = Math.max(5, (animalStars / animalMax) * 100) + '%';
    }
  }

  // Progresso Piano (só 1 modo com stars: Sequência, max 3)
  const pianoStars = +(localStorage.getItem('blg-piano-stars') || 0);
  const pianoProg = document.querySelector('.card[data-game="piano"] .progress');
  if (pianoProg) {
    const bar = pianoProg.querySelector('div');
    if (pianoStars > 0) {
      pianoProg.classList.add('show');
      bar.style.width = Math.max(5, (pianoStars / 3) * 100) + '%';
    }
  }

  // Progresso Toupeiras (4 níveis × 3 = 12)
  let moleStars = 0, moleMax = 12;
  for (let i = 0; i < 4; i++) moleStars += +(localStorage.getItem('blg-mole-stars-' + i) || 0);
  const moleProg = document.querySelector('.card[data-game="mole"] .progress');
  if (moleProg) {
    const bar = moleProg.querySelector('div');
    if (moleStars > 0) {
      moleProg.classList.add('show');
      bar.style.width = Math.max(5, (moleStars / moleMax) * 100) + '%';
    }
  }

  // Progresso 2048
  let g2048Stars = 0, g2048Max = 9;
  for (let i = 0; i < 3; i++) g2048Stars += +(localStorage.getItem('blg-2048-stars-' + i) || 0);
  const g2048Prog = document.querySelector('.card[data-game="g2048"] .progress');
  if (g2048Prog) {
    const bar = g2048Prog.querySelector('div');
    if (g2048Stars > 0) {
      g2048Prog.classList.add('show');
      bar.style.width = Math.max(5, (g2048Stars / g2048Max) * 100) + '%';
    }
  }

  // Progresso Tetris
  let tetrisStars = 0;
  for (let i = 0; i < 3; i++) tetrisStars += +(localStorage.getItem('blg-tetris-stars-' + i) || 0);
  const tetrisProg = document.querySelector('.card[data-game="tetris"] .progress');
  if (tetrisProg) {
    const bar = tetrisProg.querySelector('div');
    if (tetrisStars > 0) {
      tetrisProg.classList.add('show');
      bar.style.width = Math.max(5, (tetrisStars / 9) * 100) + '%';
    }
  }

  // Progresso Breakout
  let breakoutStars = 0;
  for (let i = 0; i < 3; i++) breakoutStars += +(localStorage.getItem('blg-breakout-stars-' + i) || 0);
  const breakoutProg = document.querySelector('.card[data-game="breakout"] .progress');
  if (breakoutProg) {
    const bar = breakoutProg.querySelector('div');
    if (breakoutStars > 0) {
      breakoutProg.classList.add('show');
      bar.style.width = Math.max(5, (breakoutStars / 9) * 100) + '%';
    }
  }

  // Progresso Race
  let raceStars = 0;
  for (let i = 0; i < 5; i++) raceStars += +(localStorage.getItem('blg-race-stars-' + i) || 0);
  const raceProg = document.querySelector('.card[data-game="race"] .progress');
  if (raceProg) {
    const bar = raceProg.querySelector('div');
    if (raceStars > 0) {
      raceProg.classList.add('show');
      bar.style.width = Math.max(5, (raceStars / 15) * 100) + '%';
    }
  }

  // Progresso Sokoban (25 fases × 3 = 75)
  let sokobanStars = 0;
  for (let i = 0; i < 25; i++) sokobanStars += +(localStorage.getItem('blg-sokoban-stars-' + i) || 0);
  const sokobanProg = document.querySelector('.card[data-game="sokoban"] .progress');
  if (sokobanProg) {
    const bar = sokobanProg.querySelector('div');
    if (sokobanStars > 0) {
      sokobanProg.classList.add('show');
      bar.style.width = Math.max(5, (sokobanStars / 75) * 100) + '%';
    }
  }

  // Progresso Invaders (3 waves × 3 = 9)
  let invadersStars = 0;
  for (let i = 0; i < 3; i++) invadersStars += +(localStorage.getItem('blg-invaders-stars-' + i) || 0);
  const invadersProg = document.querySelector('.card[data-game="invaders"] .progress');
  if (invadersProg) {
    const bar = invadersProg.querySelector('div');
    if (invadersStars > 0) {
      invadersProg.classList.add('show');
      bar.style.width = Math.max(5, (invadersStars / 9) * 100) + '%';
    }
  }

  // Progresso Sudoku (3 sizes × 3 diffs × 3 = 27 max)
  let sudokuStars = 0;
  for (const size of [4, 6, 9]) {
    for (const diff of ['Fácil', 'Médio', 'Difícil']) {
      sudokuStars += +(localStorage.getItem('blg-sudoku-' + size + '-' + diff + '-stars') || 0);
    }
  }
  const sudokuProg = document.querySelector('.card[data-game="sudoku"] .progress');
  if (sudokuProg) {
    const bar = sudokuProg.querySelector('div');
    if (sudokuStars > 0) {
      sudokuProg.classList.add('show');
      bar.style.width = Math.max(5, (sudokuStars / 27) * 100) + '%';
    }
  }

  // Progresso Pac-Man (5 níveis × 3 = 15)
  let pacmanStars = 0;
  for (let i = 0; i < 5; i++) pacmanStars += +(localStorage.getItem('blg-pacman-stars-' + i) || 0);
  const pacmanProg = document.querySelector('.card[data-game="pacman"] .progress');
  if (pacmanProg) {
    const bar = pacmanProg.querySelector('div');
    if (pacmanStars > 0) {
      pacmanProg.classList.add('show');
      bar.style.width = Math.max(5, (pacmanStars / 15) * 100) + '%';
    }
  }

  // Progresso Tower Defense (3 níveis × 3 = 9)
  let towerStars = 0;
  for (let i = 0; i < 3; i++) towerStars += +(localStorage.getItem('blg-tower-stars-' + i) || 0);
  const towerProg = document.querySelector('.card[data-game="tower"] .progress');
  if (towerProg) {
    const bar = towerProg.querySelector('div');
    if (towerStars > 0) {
      towerProg.classList.add('show');
      bar.style.width = Math.max(5, (towerStars / 9) * 100) + '%';
    }
  }

  // Progresso RPG (1 fim de jogo, 3 estrelas)
  const rpgStars = +(localStorage.getItem('blg-rpg-best-stars') || 0);
  const rpgProg = document.querySelector('.card[data-game="rpg"] .progress');
  if (rpgProg) {
    const bar = rpgProg.querySelector('div');
    if (rpgStars > 0) {
      rpgProg.classList.add('show');
      bar.style.width = Math.max(5, (rpgStars / 3) * 100) + '%';
    }
  }

  // ============ CARDS ============
  document.querySelectorAll('.card.available').forEach(card => {
    card.addEventListener('pointerdown', () => { ensureAudio(); sndTap(); });
  });

  const lockedModal = document.getElementById('lockedModal');
  const lockedIcon = document.getElementById('lockedIcon');
  const lockedName = document.getElementById('lockedName');
  const gameNames = { conta: 'Conta Comigo', memory: 'Memória', snake: 'Snake', letroca: 'Letroca', skyhop: 'Sky Hop', platformer: 'Mini Mario' };
  const gameIcons = { conta: '🔢', memory: '🧩', snake: '🐍', letroca: '🔤', skyhop: '🚀', platformer: '🍄' };

  document.querySelectorAll('.card.locked').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio();
      sndLocked();
      const g = card.dataset.game;
      lockedIcon.textContent = gameIcons[g] || '🚧';
      lockedName.textContent = gameNames[g] || 'Em construção';
      lockedModal.classList.remove('hidden');
    });
  });

  document.getElementById('lockedOkBtn').addEventListener('click', () => {
    sndTap();
    lockedModal.classList.add('hidden');
  });
  lockedModal.addEventListener('click', (e) => {
    if (e.target === lockedModal) lockedModal.classList.add('hidden');
  });

  document.getElementById('infoBtn').addEventListener('click', () => {
    ensureAudio();
    sndOpen();
    lockedIcon.textContent = '🎮';
    lockedName.textContent = 'Ben & Luca Games';
    document.querySelector('.lockedBox p').textContent = 'Coleção de jogos pro Benício e Luca. Cada jogo tem seu próprio estilo. Mais jogos chegando!';
    lockedModal.classList.remove('hidden');
  });

  // ============ BACKGROUND STARS ============
  const bgCanvas = document.getElementById('bgCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resizeBg() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    bgCanvas.width = W * DPR; bgCanvas.height = H * DPR;
    bgCanvas.style.width = W + 'px'; bgCanvas.style.height = H + 'px';
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resizeBg();
  window.addEventListener('resize', resizeBg);

  const stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      s: 0.3 + Math.random() * 1.4,
      a: 0.2 + Math.random() * 0.6,
      twinkle: Math.random() * Math.PI * 2,
    });
  }
  function drawBg() {
    // gradient escuro de fundo
    const grad = bgCtx.createRadialGradient(W/2, H*0.4, 0, W/2, H*0.5, Math.max(W, H));
    grad.addColorStop(0, 'rgba(51,0,102,0.6)');
    grad.addColorStop(1, 'rgba(10,0,20,0.95)');
    bgCtx.fillStyle = '#0a0014';
    bgCtx.fillRect(0, 0, W, H);
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, W, H);
    // estrelas
    for (const st of stars) {
      st.twinkle += 0.02;
      const a = st.a * (0.6 + Math.sin(st.twinkle) * 0.4);
      bgCtx.fillStyle = `rgba(255,255,255,${a})`;
      bgCtx.beginPath();
      bgCtx.arc(st.x, st.y, st.s, 0, Math.PI * 2);
      bgCtx.fill();
      // movimento lento
      st.y += 0.08;
      if (st.y > H) { st.y = -2; st.x = Math.random() * W; }
    }
    requestAnimationFrame(drawBg);
  }
  drawBg();
})();
</script>

<script>
(() => {
  // Suprime callout/lupa/menu de contexto do iOS no long-press
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());

  let audioCtx = null;
  let muted = localStorage.getItem('cubo-dash-muted') === '1';
  muteBtn.textContent = muted ? '🔇' : '🔊';
  function initAudio() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { audioCtx = null; } }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type='square', vol=0.07) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }

  // === DRUMS / BASS / LEAD synths ===
  // Buffer de noise reutilizável
  let _noiseBuf = null;
  function getNoiseBuf() {
    if (_noiseBuf) return _noiseBuf;
    if (!audioCtx) return null;
    const sr = audioCtx.sampleRate;
    _noiseBuf = audioCtx.createBuffer(1, sr * 0.5, sr);
    const d = _noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return _noiseBuf;
  }

  function playKick(t, vol=0.55) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.10);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.25);
    // click no início (transiente)
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.type = 'triangle'; o2.frequency.value = 800;
    g2.gain.setValueAtTime(vol * 0.4, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.015);
    o2.connect(g2).connect(audioCtx.destination);
    o2.start(t); o2.stop(t + 0.02);
  }

  function playSnare(t, vol=0.22) {
    if (!audioCtx || muted) return;
    const buf = getNoiseBuf(); if (!buf) return;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 1.2;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    src.connect(bp).connect(g).connect(audioCtx.destination);
    src.start(t); src.stop(t + 0.16);
    // tonal layer
    const o = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o.type = 'triangle'; o.frequency.value = 220;
    g2.gain.setValueAtTime(vol * 0.6, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    o.connect(g2).connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.1);
  }

  function playHat(t, vol=0.10) {
    if (!audioCtx || muted) return;
    const buf = getNoiseBuf(); if (!buf) return;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 7500;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    src.connect(hp).connect(g).connect(audioCtx.destination);
    src.start(t); src.stop(t + 0.05);
  }

  function playBass(t, freq, dur, vol=0.18) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator();
    const sub = audioCtx.createOscillator();
    o.type = 'sawtooth'; o.frequency.value = freq;
    sub.type = 'sine'; sub.frequency.value = freq / 2;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 5;
    lp.frequency.setValueAtTime(1400, t);
    lp.frequency.exponentialRampToValueAtTime(220, t + dur * 0.85);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.setValueAtTime(vol * 0.9, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(lp); sub.connect(g);  // sub bypassa filter pra ficar mais grave
    lp.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.05);
    sub.start(t); sub.stop(t + dur + 0.05);
  }

  function playLead(t, freq, dur, vol=0.07) {
    if (!audioCtx || muted) return;
    // duas saws em detune leve (synth lead clássico)
    const o1 = audioCtx.createOscillator();
    const o2 = audioCtx.createOscillator();
    o1.type = 'sawtooth'; o1.frequency.value = freq;
    o2.type = 'sawtooth'; o2.frequency.value = freq * 1.007;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 3;
    lp.frequency.setValueAtTime(4500, t);
    lp.frequency.exponentialRampToValueAtTime(1100, t + dur * 0.7);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.setValueAtTime(vol * 0.7, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.95);
    o1.connect(lp); o2.connect(lp);
    lp.connect(g).connect(audioCtx.destination);
    o1.start(t); o1.stop(t + dur);
    o2.start(t); o2.stop(t + dur);
  }

  let musicToken = 0;
  function startMusic(idx) {
    if (!audioCtx || muted) return;
    const m = MUSIC[idx];
    if (!m) return;
    musicToken++;
    const myToken = musicToken;
    const beatDur = 60 / m.bpm;
    const stepDur = beatDur / 4;       // 16 steps em 4 beats (1/16th notes)
    const barDur  = 4 * beatDur;       // 1 compasso = 4 beats

    // Loop 1: drum + bass (1 bar repete)
    function playDrumBar(startTime) {
      if (myToken !== musicToken || muted) return;
      // drums
      for (let i = 0; i < 16; i++) {
        const stepT = startTime + i * stepDur;
        const c = m.drum[i] || '-';
        if (c === 'K') playKick(stepT);
        else if (c === 'S') playSnare(stepT);
        else if (c === 'H') playHat(stepT);
      }
      // bass
      let bt = startTime;
      for (const note of m.bass) {
        const dur = beatDur * note.d;
        if (note.f > 0) playBass(bt, note.f, dur * 0.96);
        bt += dur;
      }
      setTimeout(() => playDrumBar(startTime + barDur), barDur * 1000 - 30);
    }

    // Loop 2: melody (toca completa, depois repete)
    function playMelodyOnce(startTime) {
      if (myToken !== musicToken || muted) return;
      let t = startTime;
      for (const note of m.melody) {
        const dur = beatDur * note.d;
        if (note.f > 0) playLead(t, note.f, dur * 0.92, m.vol);
        t += dur;
      }
      const totalMs = (t - startTime) * 1000;
      setTimeout(() => playMelodyOnce(audioCtx.currentTime + 0.02), Math.max(0, totalMs - 30));
    }

    const startT = audioCtx.currentTime + 0.15;
    playDrumBar(startT);
    playMelodyOnce(startT);
  }
  function stopMusic() { musicToken++; }

  muteBtn.addEventListener('click', () => {

  function stairsDownWalk(x, n, h_top=250, gap=30, W=100) {

  function resetPlayer() {
    player.scale = 1;
    player.y = GROUND_Y() - PLAYER_SIZE;
    player.vy = 0; player.rot = 0;
    player.onGround = true; player.dead = false;
    player.mode = 'cubo';

  function startLevel(idx) {
    initAudio();
    levelIdx = idx; level = LEVELS[idx];
    scroll = 0; frame = 0;
    particles = []; trailPts = [];
    inputHeld = false;
    timeMult = 1.0; slowFrames = 0;
    growFrames = 0;
    miniFrames = 0;
    speedMult = 1.0;
    coinsCollected = 0;
    deathFlash = 0; deathShake = 0;
    shockwaves = []; shards = [];
    prevWx = 0;

    for (const o of level.obs) { o.consumed = false; }
    levelTag.textContent = level.name;
    levelTag.style.background = level.tagColor;
    overlay.classList.add('hidden');
    menuEl.classList.add('hidden');

  // =========== STORAGE ===========
  function getStat(i) {
    return {
      bestPct: +(localStorage.getItem(`cubo-dash-best-${i}`) || 0),

      coins:   +(localStorage.getItem(`cubo-dash-coins-${i}`) || 0)
    };
  }
  function saveStat(i, pct, completed, coins) {
    const cur = getStat(i);
    const newPct = Math.max(cur.bestPct, Math.floor(pct));
    const newCoins = Math.max(cur.coins, coins || 0);
    localStorage.setItem(`cubo-dash-best-${i}`, newPct);
    localStorage.setItem(`cubo-dash-coins-${i}`, newCoins);
    if (completed) localStorage.setItem(`cubo-dash-done-${i}`, '1');
    return { bestPct:newPct, complete: cur.complete || completed, coins:newCoins };
  }
  function refreshStats() {
    let totalCoins = 0, maxCoins = 0;
    for (let i=0; i<LEVELS.length; i++) {
      const s = getStat(i);
      totalCoins += s.coins;
      maxCoins += 5;
      const el = document.getElementById('stat'+i);
      if (!el) continue;
      const coinStr = `<span class="coinStat">⭐ ${s.coins}/5</span>`;
      if (s.complete) el.innerHTML = `<span class="done">✓ Completou</span> · ${coinStr}`;
      else if (s.bestPct > 0) el.innerHTML = `<span class="pct">Recorde: ${s.bestPct}%</span> · ${coinStr}`;
      else el.innerHTML = `<span class="empty">— ainda não tentou —</span> · ${coinStr}`;
    }
    const totEl = document.getElementById('totalCoins');
    if (totEl) totEl.textContent = `⭐ ${totalCoins}/${maxCoins} moedas`;
  }

  // =========== INPUT ===========
  function jump() {
    if (!running || player.dead) return;
    if (player.mode === 'ball' && player.onGround) {
      // Ball: tap inverte gravidade (não pula livre)
      player.gravityDir *= -1;
      player.onGround = false;
      sndFlip();
      for (let i=0; i<12; i++) {
        const a = Math.random()*Math.PI*2;
        particles.push({
          x: PLAYER_X() + PLAYER_SIZE*player.scale/2,
          y: player.y + PLAYER_SIZE*player.scale/2,
          vx: Math.cos(a)*3, vy: Math.sin(a)*3,
          life: 30, max:30, col: '#ff8800'
        });
      }
      return;
    }
    if (player.mode === 'cubo' && player.onGround) {
      player.vy = level.jumpForce * player.gravityDir;
      player.onGround = false;
      // partículas (sem som)
      for (let i=0; i<8; i++) {
        particles.push({
          x: PLAYER_X() + PLAYER_SIZE*player.scale/2,
          y: player.gravityDir === 1 ? player.y + PLAYER_SIZE*player.scale : player.y,
          vx: (Math.random()-0.5)*4,
          vy: -Math.random()*1.5 * player.gravityDir,
          life: 26, max:26, col: level.accent2
        });
      }
    }
  }
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault(); inputHeld = true; jump();
  }, { passive:false });
  function releaseInput() { inputHeld = false; }
  canvas.addEventListener('pointerup',     releaseInput);
  canvas.addEventListener('pointercancel', releaseInput);
  canvas.addEventListener('pointerleave',  releaseInput);
  canvas.addEventListener('touchend',      releaseInput);
  canvas.addEventListener('touchcancel',   releaseInput);
  window.addEventListener('blur', releaseInput);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { releaseInput(); stopMusic(); }
    else if (running && level) startMusic(levelIdx);
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (running) { inputHeld = true; jump(); }
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') inputHeld = false;
  });

  // =========== PHYSICS ===========
  function pxOnScreen(worldX) { return worldX - scroll; }
  function worldPlayerX()     { return scroll + PLAYER_X(); }
  function pHitbox() {
    const s = player.scale;
    return { x: PLAYER_X() + 4*s, y: player.y + 4*s, w: (PLAYER_SIZE - 8)*s, h: (PLAYER_SIZE - 8)*s };
  }
  function rectOverlap(a, b) {
    return a.x + a.w > b.x && a.x < b.x + b.w && a.y + a.h > b.y && a.y < b.y + b.h;
  }
  function circleRectHit(cx, cy, r, rect) {
    const dx = cx - Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const dy = cy - Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    return dx*dx + dy*dy < r*r;
  }

  function update() {
    if (!running || player.dead) return;
    frame++;

    // ---- GROW (independente de timeMult) ----
    if (growFrames > 0) {
      growFrames--;
      if (player.scale !== 2) {
        if (player.onGround && player.gravityDir === 1) {
          player.y = GROUND_Y() - PLAYER_SIZE * 2;
        }
      }
      player.scale = 2;
    } else if (miniFrames > 0) {
      miniFrames--;
      if (player.scale !== 0.5) {
        if (player.onGround && player.gravityDir === 1) {
          player.y = GROUND_Y() - PLAYER_SIZE * 0.5;
        }
      }
      player.scale = 0.5;
    } else {
      if (player.scale !== 1) {
        if (player.onGround && player.gravityDir === 1) {
          player.y = GROUND_Y() - PLAYER_SIZE;
        }
      }
      player.scale = 1;
    }

    // ---- SLOW MO ----
    if (slowFrames > 0) {
      slowFrames--;
      const k = slowFrames / SLOW_DURATION;
      timeMult = SLOW_MIN + (1 - SLOW_MIN) * (1 - k);
    } else {
      timeMult = 1.0;
    }

    scroll += level.speed * timeMult * speedMult;
    const wx = worldPlayerX();

    // ---- DETECTAR JETPACK / WAVE / BALL ZONE ----
    let inJetpack = false, inWave = false, inBall = false;
    for (const o of level.obs) {
      if (o.t === 'jetpack' && wx >= o.x && wx <= o.end) { inJetpack = true; break; }
    }
    if (!inJetpack) {
      for (const o of level.obs) {
        if (o.t === 'wave' && wx >= o.x && wx <= o.end) { inWave = true; break; }
      }
    }
    if (!inJetpack && !inWave) {
      for (const o of level.obs) {
        if (o.t === 'ballz' && wx >= o.x && wx <= o.end) { inBall = true; break; }
      }
    }
    const prevMode = player.mode;
    player.mode = inJetpack ? 'jetpack' : (inWave ? 'wave' : (inBall ? 'ball' : 'cubo'));
    if (prevMode !== player.mode) {
      player.vy = 0;
      if (player.mode === 'jetpack' || player.mode === 'wave') {
        player.onGround = false;
        player.gravityDir = 1;
      }
      // ball mantém gravityDir atual
    }

    // ---- DETECTAR SPEED PORTAL CROSSING ----
    for (const o of level.obs) {
      if (o.t === 'speedp' && prevWx < o.x && wx >= o.x) {
        speedMult *= o.mult;
        sndSlow();  // reaproveita som existente
      }
    }

    // ---- DETECTAR GRAVITY FLIP PORTAL CROSSING ----
    if (player.mode === 'cubo') {
      for (const o of level.obs) {
        if (o.t === 'gflip' && prevWx < o.x && wx >= o.x) {
          player.gravityDir *= -1;
          player.onGround = false;
          sndFlip();
          for (let i=0; i<30; i++) {
            const a = Math.random()*Math.PI*2;
            particles.push({
              x: PLAYER_X() + PLAYER_SIZE/2,
              y: player.y + PLAYER_SIZE/2,
              vx: Math.cos(a)*4, vy: Math.sin(a)*4,
              life: 40, max:40, col: i%2 ? '#dc2626' : '#fff'
            });
          }
        }
      }
    }
    prevWx = wx;

    // ---- FÍSICA ----
    const ps = player.scale;
    if (player.mode === 'wave') {
      // Wave: diagonal constante. Segura = sobe (vy negativo), solta = desce (vy positivo)
      // sem gravidade — vy é diretamente controlada pelo input. Speed vertical = level.speed pra 45°
      const waveSpeed = level.speed * 0.85;
      player.vy = inputHeld ? -waveSpeed : waveSpeed;
      player.y += player.vy * timeMult;
      player.rot = inputHeld ? -Math.PI/4 : Math.PI/4;

      // Rastro
      if (frame % 2 === 0) {
        trailPts.push({ x: PLAYER_X() + PLAYER_SIZE/2, y: player.y + PLAYER_SIZE/2, life: 22, max: 22 });
      }

      const ceil_y = CEILING_Y();
      const ground_y = GROUND_Y();
      if (player.y < ceil_y) { die(); return; }                          // bate teto = mata
      if (player.y + PLAYER_SIZE*ps > ground_y) { die(); return; }       // bate chão = mata
      player.onGround = false;
    } else if (player.mode === 'jetpack') {
      const grav = level.gravity * 0.55;
      const thrust = 0.95;
      if (inputHeld) {
        player.vy -= thrust * timeMult;
        if (frame % 2 === 0) sndJetpack();
      }
      player.vy += grav * timeMult;
      if (player.vy >  10) player.vy =  10;
      if (player.vy < -10) player.vy = -10;
      player.y += player.vy * timeMult;
      player.rot = Math.min(0.4, Math.max(-0.4, player.vy * 0.04));

      const ceil_y = CEILING_Y();
      const ground_y = GROUND_Y();
      if (player.y < ceil_y) { player.y = ceil_y; if (player.vy < 0) player.vy = 0; }
      if (player.y + PLAYER_SIZE*ps > ground_y) { player.y = ground_y - PLAYER_SIZE*ps; if (player.vy > 0) player.vy = 0; }
      player.onGround = false;
    } else {
      // Modo cubo / ball (com gravityDir = +1 ou -1)
      const gd = player.gravityDir;
      if (player.mode === 'cubo' && inputHeld && player.onGround) jump();
      // ball mode: tap inverte gravidade (não auto-flip, só pointerdown)
      player.vy += level.gravity * timeMult * gd;
      player.y += player.vy * timeMult;
      if (!player.onGround) player.rot += (player.mode === 'ball' ? 0.22 : 0.16) * timeMult * gd;

      if (gd === 1) {
        // Gravity normal: detecta chão
        if (player.y + PLAYER_SIZE*ps >= GROUND_Y()) {
          player.y = GROUND_Y() - PLAYER_SIZE*ps;
          player.vy = 0;
          if (!player.onGround) player.rot = Math.round(player.rot / (Math.PI/2)) * (Math.PI/2);
          player.onGround = true;
        }
      } else {
        // Gravity invertida: detecta TETO
        if (player.y <= CEILING_Y()) {
          player.y = CEILING_Y();
          player.vy = 0;
          if (!player.onGround) player.rot = Math.round(player.rot / (Math.PI/2)) * (Math.PI/2);
          player.onGround = true;
        }
        if (player.y + PLAYER_SIZE*ps >= GROUND_Y()) {
          player.y = GROUND_Y() - PLAYER_SIZE*ps;
          if (player.vy > 0) player.vy = 0;
        }
      }
    }

    // ---- COLISÕES ----
    const px = PLAYER_X();
    const ph = pHitbox();
    let landedOnBlock = false;

    for (const o of level.obs) {
      const sx = pxOnScreen(o.x);
      if (sx < -260 || sx > W + 300) continue;

      if (o.t === 'spike') {
        const h = o.h || 0;
        const baseY = GROUND_Y() - h;
        const sb = { x: sx + 6, y: baseY - SP + 8, w: SP - 12, h: SP - 8 };
        if (rectOverlap(ph, sb)) { die(); return; }
      }
      else if (o.t === 'cspike') {
        const baseY = CEILING_Y();
        const sb = { x: sx + 8, y: baseY + 12, w: SP - 16, h: SP - 18 };
        if (rectOverlap(ph, sb)) { die(); return; }
      }
      else if (o.t === 'block') {
        // só interage em gd=+1 modo cubo
        if (player.mode !== 'cubo' || player.gravityDir !== 1) continue;
        const top = GROUND_Y() - o.h;
        const bbox = { x: sx, y: top, w: o.w, h: o.h };
        if (rectOverlap(ph, bbox)) {
          if (player.vy >= 0 && player.y + PLAYER_SIZE*ps - player.vy * timeMult <= top + 4) {
            player.y = top - PLAYER_SIZE*ps;
            player.vy = 0;
            if (!player.onGround) player.rot = Math.round(player.rot / (Math.PI/2)) * (Math.PI/2);
            player.onGround = true;
            landedOnBlock = true;
          } else { die(); return; }
        }
      }
      else if (o.t === 'platform') {
        if (player.mode !== 'cubo' || player.gravityDir !== 1) continue;
        const top = GROUND_Y() - o.y;
        const thickness = 14;
        const bbox = { x: sx, y: top, w: o.w, h: thickness };
        if (rectOverlap(ph, bbox)) {
          if (player.vy >= 0 && player.y + PLAYER_SIZE*ps - player.vy * timeMult <= top + 4) {
            player.y = top - PLAYER_SIZE*ps;
            player.vy = 0;
            if (!player.onGround) player.rot = Math.round(player.rot / (Math.PI/2)) * (Math.PI/2);
            player.onGround = true;
            landedOnBlock = true;
          }
        }
      }
      else if (o.t === 'spring') {
        if (player.mode !== 'cubo' || player.gravityDir !== 1) continue;
        const sw = 44, sh = 14;
        const bbox = { x: sx - sw/2, y: GROUND_Y() - sh, w: sw, h: sh };
        if (rectOverlap(ph, bbox)) {
          player.vy = level.jumpForce * 1.55;
          player.onGround = false;
          sndSpring();
          for (let i=0; i<14; i++) {
            particles.push({
              x: sx, y: GROUND_Y() - sh,
              vx: (Math.random()-0.5)*5, vy: -Math.random()*4 - 2,
              life: 34, max:34, col: '#ffeb00'
            });
          }
        }
      }
      else if (o.t === 'saw') {
        const cx = sx;
        const cy = GROUND_Y() - o.y;
        const r = 22;
        if (circleRectHit(cx, cy, r - 4, ph)) { die(); return; }
      }
      else if (o.t === 'slow' && !o.consumed) {
        const cx = sx;
        const cy = GROUND_Y() - o.y;
        const bbox = { x: cx - 24, y: cy - 80, w: 48, h: 160 };
        if (rectOverlap(ph, bbox)) {
          o.consumed = true;
          slowFrames = SLOW_DURATION;
          timeMult = SLOW_MIN;
          sndSlow();
          for (let i=0; i<20; i++) {
            particles.push({
              x: cx, y: cy,
              vx: (Math.random()-0.5)*7, vy: (Math.random()-0.5)*7,
              life: 50, max:50, col: '#7dd3fc'
            });
          }
        }
      }
      else if (o.t === 'grow' && !o.consumed) {
        const cx = sx;
        const cy = GROUND_Y() - o.y;
        const bbox = { x: cx - 24, y: cy - 80, w: 48, h: 160 };
        if (rectOverlap(ph, bbox)) {
          o.consumed = true;
          growFrames = GROW_DURATION;
          if (player.onGround && player.gravityDir === 1) {
            player.y = GROUND_Y() - PLAYER_SIZE * 2;
          }
          sndGrow();
          for (let i=0; i<24; i++) {
            const a = Math.random()*Math.PI*2;
            particles.push({
              x: cx, y: cy,
              vx: Math.cos(a)*6, vy: Math.sin(a)*6,
              life: 55, max:55, col: i%2 ? '#ffd700' : '#ff8c00'
            });
          }
        }
      }
      else if (o.t === 'mini' && !o.consumed) {
        const cx = sx;
        const cy = GROUND_Y() - o.y;
        const bbox = { x: cx - 24, y: cy - 80, w: 48, h: 160 };
        if (rectOverlap(ph, bbox)) {
          o.consumed = true;
          miniFrames = MINI_DURATION;
          sndSlow();
          for (let i=0; i<20; i++) {
            const a = Math.random()*Math.PI*2;
            particles.push({
              x: cx, y: cy,
              vx: Math.cos(a)*5, vy: Math.sin(a)*5,
              life: 45, max:45, col: i%2 ? '#06b6d4' : '#fff'
            });
          }
        }
      }
      else if (o.t === 'coin' && !o.consumed) {
        const cx = sx;
        const cy = GROUND_Y() - o.y;
        const r = 18;
        const bbox = { x: cx - r, y: cy - r, w: r*2, h: r*2 };
        if (rectOverlap(ph, bbox)) {
          o.consumed = true;
          coinsCollected++;
          beep(880, 0.08, 'triangle', 0.10);
          setTimeout(() => beep(1320, 0.10, 'triangle', 0.08), 50);
          for (let i=0; i<18; i++) {
            const a = Math.random()*Math.PI*2;
            particles.push({
              x: cx, y: cy,
              vx: Math.cos(a)*4, vy: Math.sin(a)*4,
              life: 36, max:36, col: i%2 ? '#ffd700' : '#fff7b3'
            });
          }
        }
      }
      else if (o.t === 'movplat') {
        // y oscila ±amp em period frames
        const phase = (frame / o.period) * Math.PI * 2;
        const curY = o.y + Math.sin(phase) * o.amp;
        const top = GROUND_Y() - curY;
        const thickness = 14;
        const bbox = { x: sx, y: top, w: o.w, h: thickness };
        if (player.mode === 'cubo' && player.gravityDir === 1 && rectOverlap(ph, bbox)) {
          if (player.vy >= 0 && player.y + PLAYER_SIZE*ps - player.vy * timeMult <= top + 6) {
            player.y = top - PLAYER_SIZE*ps;
            player.vy = 0;
            if (!player.onGround) player.rot = Math.round(player.rot / (Math.PI/2)) * (Math.PI/2);
            player.onGround = true;
            landedOnBlock = true;
          }
        }
      }
      else if (o.t === 'laser') {
        // piscante: ativo durante "duty" do period
        const t = (frame % o.period) / o.period;
        const active = t < o.duty;
        if (active) {
          const ceilY = CEILING_Y();
          const groundY = GROUND_Y();
          const top = o.h === null ? ceilY : (groundY - o.y - o.h);
          const h = o.h === null ? (groundY - ceilY) : o.h;
          const bbox = { x: sx - 8, y: top, w: 16, h: h };
          if (rectOverlap(ph, bbox)) { die(); return; }
        }
      }
    }

    // FINISH
    for (const o of level.obs) {
      if (o.t === 'finish' && wx + PLAYER_SIZE*ps/2 >= o.x) { win(); return; }
    }

    // Detect "no ar" do modo cubo (gravityDir=+1 pousa em platforms)
    if (player.mode === 'cubo' && player.gravityDir === 1 && !landedOnBlock && player.y + PLAYER_SIZE*ps < GROUND_Y() - 1) {
      let onTop = false;
      for (const o of level.obs) {
        const sx = pxOnScreen(o.x);
        if (sx < -150 || sx > W + 150) continue;
        if (o.t === 'block') {
          const top = GROUND_Y() - o.h;
          if (Math.abs(player.y + PLAYER_SIZE*ps - top) < 2 && px + PLAYER_SIZE*ps - 4 > sx && px + 4 < sx + o.w) { onTop = true; break; }
        } else if (o.t === 'platform') {
          const top = GROUND_Y() - o.y;
          if (Math.abs(player.y + PLAYER_SIZE*ps - top) < 2 && px + PLAYER_SIZE*ps - 4 > sx && px + 4 < sx + o.w) { onTop = true; break; }
        }
      }
      if (!onTop) player.onGround = false;
    }

    // trail
    const inAir = (player.mode === 'jetpack') || !player.onGround;
    if (inAir && frame % 2 === 0) {
      trailPts.push({ x: PLAYER_X() + PLAYER_SIZE*ps/2, y: player.y + PLAYER_SIZE*ps/2, life: 14, rot: player.rot, sz: PLAYER_SIZE*ps });
    }
    for (const t of trailPts) t.life--;
    trailPts = trailPts.filter(t => t.life > 0);

    if (player.mode === 'jetpack' && inputHeld && frame % 2 === 0) {
      for (let i=0; i<2; i++) {
        particles.push({
          x: PLAYER_X() + PLAYER_SIZE*ps/2 + (Math.random()-0.5)*8,
          y: player.y + PLAYER_SIZE*ps,
          vx: (Math.random()-0.5)*2, vy: Math.random()*3 + 1,
          life: 16, max:16, col: i%2 ? '#ff6600' : '#ffeb00'
        });
      }
    }

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--; }
    particles = particles.filter(p => p.life > 0);

    for (const s of stars) {
      s.x -= s.s * level.speed * 0.4 * timeMult;
      if (s.x < 0) { s.x = W; s.y = Math.random() * H * 0.65; }
    }

    const progress = Math.min(100, wx / level.length * 100);
    progressFill.style.width = progress + '%';
    document.getElementById('coinCounter').textContent = `⭐ ${coinsCollected}/5`;
  }

  function explode() {
    sndDie();
    const ps = player.scale;
    const cx = PLAYER_X() + PLAYER_SIZE*ps/2;
    const cy = player.y + PLAYER_SIZE*ps/2;

    // Flash branco + shake
    deathFlash = 12;
    deathShake = 28;

    // Anéis de choque (3 ondas)
    shockwaves.push({ x: cx, y: cy, r: 8, max: 240*ps, life: 32, col: '#ffffff' });
    shockwaves.push({ x: cx, y: cy, r: 4, max: 180*ps, life: 26, col: level.accent1 });
    shockwaves.push({ x: cx, y: cy, r: 2, max: 140*ps, life: 22, col: level.accent2 });

    // Shards: 8 fragmentos quadrados girando (pedaços do cubo)
    const fragSize = PLAYER_SIZE * ps / 2.4;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + Math.random() * 0.3;
      const v = 6 + Math.random() * 5;
      shards.push({
        x: cx, y: cy,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2,
        size: fragSize * (0.7 + Math.random() * 0.5),
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.4,
        life: 60, max: 60,
        col: i % 2 ? level.accent1 : level.accent2
      });
    }

    // Partículas de explosão (poeira/faíscas) — mais coloridas
    const palette = ['#fff', '#ffeb00', level.accent1, level.accent2];
    for (let i = 0; i < 90; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = Math.random() * 11 + 2;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1,
        life: 70 + Math.random() * 20, max: 80,
        col: palette[Math.floor(Math.random() * palette.length)]
      });
    }
  }
  function die() {
    if (player.dead) return;
    player.dead = true; inputHeld = false; stopMusic();
    explode();
    const pct = Math.min(100, worldPlayerX() / level.length * 100);
    const s = saveStat(levelIdx, pct, false, coinsCollected);
    setTimeout(() => showGameOver(pct, s.bestPct), 1400);
  }
  function win() {
    if (player.dead) return;
    player.dead = true; inputHeld = false; stopMusic();
    sndWin();
    saveStat(levelIdx, 100, true, coinsCollected);
    const ps = player.scale;
    for (let i=0; i<80; i++) {
      particles.push({
        x: PLAYER_X() + PLAYER_SIZE*ps/2, y: player.y + PLAYER_SIZE*ps/2,
        vx: (Math.random()-0.5)*10, vy: -Math.random()*8 - 2,
        life: 90, max:90,
        col: ['#ffeb00','#ff00cc','#00f0ff','#4ade80'][i%4]
      });
    }
    setTimeout(showWin, 1000);
  }
  function showGameOver(pct, best) {
    running = false;
    hud.classList.remove('show');
    goPct.textContent = Math.floor(pct);
    goBest.textContent = best > 0 ? `Recorde nesta fase: ${best}%` : '';
    menuEl.classList.add('hidden');
    winEl.classList.add('hidden');
    goEl.classList.remove('hidden');
    overlay.classList.remove('hidden');
  }
  function showWin() {
    running = false;
    hud.classList.remove('show');
    winLabel.textContent = `Você completou: ${level.name}`;
    const hasNext = levelIdx < LEVELS.length - 1;
    document.getElementById('winNextBtn').textContent = hasNext ? 'PRÓXIMA' : 'MENU';
    winNext.textContent = hasNext ? `A seguir: ${LEVELS[levelIdx+1].name}` : 'Todas as fases concluídas!';
    menuEl.classList.add('hidden');
    goEl.classList.add('hidden');
    winEl.classList.remove('hidden');
    overlay.classList.remove('hidden');
  }

  // =========== DRAW ===========
  function draw() {
    if (!level) { ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H); return; }

    // Screen shake na morte
    let shakeX = 0, shakeY = 0;
    if (deathShake > 0) {
      const mag = (deathShake / 28) * 14;
      shakeX = (Math.random() - 0.5) * mag * 2;
      shakeY = (Math.random() - 0.5) * mag * 2;
    }
    ctx.save();
    ctx.translate(shakeX, shakeY);

    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, level.bg[0]);
    g.addColorStop(0.55, level.bg[1]);
    g.addColorStop(1, level.bg[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    for (const s of stars) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y());
    const mOff = (scroll * 0.15) % 200;
    for (let x = -mOff; x < W + 200; x += 100) {
      ctx.lineTo(x + 50, GROUND_Y() - 90);
      ctx.lineTo(x + 100, GROUND_Y());
    }
    ctx.lineTo(W, GROUND_Y());
    ctx.closePath();
    ctx.fill();

    const gy = GROUND_Y();

    // Zona jetpack
    for (const o of level.obs) {
      if (o.t !== 'jetpack') continue;
      const sx1 = pxOnScreen(o.x);
      const sx2 = pxOnScreen(o.end);
      if (sx2 < -50 || sx1 > W + 50) continue;
      ctx.fillStyle = 'rgba(168,85,247,0.07)';
      ctx.fillRect(Math.max(0,sx1), CEILING_Y(), Math.min(W,sx2)-Math.max(0,sx1), gy-CEILING_Y());
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#a855f7';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(Math.max(0,sx1), CEILING_Y());
      ctx.lineTo(Math.min(W,sx2), CEILING_Y());
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Em modo cubo invertido, mostra "teto" como chão visualmente
    if (player.mode === 'cubo' && player.gravityDir === -1) {
      // overlay vermelho sutil
      ctx.fillStyle = 'rgba(220,38,38,0.06)';
      ctx.fillRect(0, CEILING_Y(), W, gy-CEILING_Y());
      // linha do teto (chão do player invertido)
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#dc2626';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(0, CEILING_Y());
      ctx.lineTo(W, CEILING_Y());
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    const gg = ctx.createLinearGradient(0, gy-30, 0, gy+40);
    gg.addColorStop(0, 'rgba(255,255,255,0)');
    gg.addColorStop(0.5, hexA(level.accent1, 0.4));
    gg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(0, gy-30, W, 70);

    ctx.strokeStyle = level.accent2;
    ctx.lineWidth = 3;
    ctx.shadowColor = level.accent2;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(W, gy);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = hexA(level.accent1, 0.08);
    ctx.fillRect(0, gy, W, H-gy);

    ctx.strokeStyle = hexA(level.accent2, 0.18);
    ctx.lineWidth = 1;
    const gOff = scroll % 60;
    for (let x = -gOff; x < W; x += 60) {
      ctx.beginPath();
      ctx.moveTo(x, gy);
      ctx.lineTo(x - 80, H);
      ctx.stroke();
    }
    for (let y = gy + 20; y < H; y += 25) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    for (const o of level.obs) {
      const sx = pxOnScreen(o.x);
      if (o.t === 'wave' || o.t === 'jetpack' || o.t === 'ballz') {
        const sxEnd = pxOnScreen(o.end);
        if (sxEnd < -10 || sx > W + 10) continue;
        if (o.t === 'wave') drawWaveZone(Math.max(-50, sx), Math.min(W+50, sxEnd));
        else if (o.t === 'ballz') drawBallZone(Math.max(-50, sx), Math.min(W+50, sxEnd));
        continue;
      }
      if (sx < -260 || sx > W + 300) continue;
      if (o.t === 'spike')        drawSpike(sx, gy, o.h || 0);
      else if (o.t === 'cspike')   drawCSpike(sx);
      else if (o.t === 'block')    drawBlock(sx, gy - o.h, o.w, o.h);
      else if (o.t === 'platform') drawPlatform(sx, gy - o.y, o.w);
      else if (o.t === 'movplat')  drawMovPlat(sx, gy, o);
      else if (o.t === 'laser')    drawLaser(sx, gy, o);
      else if (o.t === 'spring')   drawSpring(sx, gy);
      else if (o.t === 'saw')      drawSaw(sx, gy - o.y);
      else if (o.t === 'slow' && !o.consumed) drawSlowOrb(sx, gy - o.y);
      else if (o.t === 'grow' && !o.consumed) drawGrowOrb(sx, gy - o.y);
      else if (o.t === 'mini' && !o.consumed) drawMiniOrb(sx, gy - o.y);
      else if (o.t === 'coin' && !o.consumed) drawCoin(sx, gy - o.y);
      else if (o.t === 'speedp')   drawSpeedPortal(sx, gy, o.mult);
      else if (o.t === 'gflip')    drawGFlip(sx, gy);
      else if (o.t === 'finish')   drawFinish(sx, gy);
    }

    for (const t of trailPts) {
      const a = t.life / 14;
      const sz = t.sz || PLAYER_SIZE;
      ctx.save();
      ctx.translate(t.x, t.y);
      ctx.rotate(t.rot);
      ctx.globalAlpha = a * 0.3;
      ctx.fillStyle = '#ffeb00';
      ctx.fillRect(-sz/2, -sz/2, sz, sz);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    if (!player.dead) {
      const sz = PLAYER_SIZE * player.scale;
      ctx.save();
      ctx.translate(PLAYER_X() + sz/2, player.y + sz/2);
      if (player.mode === 'wave') {
        // chevron diagonal — triângulo apontando na direção do movimento
        ctx.rotate(player.rot);
        ctx.fillStyle = '#a855f7';
        ctx.shadowColor = '#a855f7';
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.moveTo(sz/2, 0);
        ctx.lineTo(-sz/2, -sz/2);
        ctx.lineTo(-sz/4, 0);
        ctx.lineTo(-sz/2, sz/2);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();
      } else if (player.mode === 'ball') {
        // bola laranja com indicador de gravidade
        ctx.rotate(player.rot);
        const r = sz/2;
        const grad = ctx.createRadialGradient(-r*0.3, -r*0.3*player.gravityDir, r*0.1, 0, 0, r);
        grad.addColorStop(0, '#fff');
        grad.addColorStop(0.4, '#fb923c');
        grad.addColorStop(1, '#9a3412');
        ctx.fillStyle = grad;
        ctx.shadowColor = '#fb923c';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        // linha central indicando rotação
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-r*0.6, 0); ctx.lineTo(r*0.6, 0);
        ctx.stroke();
        ctx.restore();
      } else {
      // aura dourada se gigante
      if (player.scale > 1) {
        const auraR = sz/2 + 10 + Math.sin(frame * 0.2) * 5;
        ctx.fillStyle = 'rgba(255,215,0,0.22)';
        ctx.beginPath();
        ctx.arc(0, 0, auraR, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.rotate(player.rot);
      // Flip vertical se gravity invertida
      if (player.mode === 'cubo' && player.gravityDir === -1) ctx.scale(1, -1);
      const baseColor = player.scale > 1 ? '#ffd700'
                      : (player.mode === 'jetpack' ? '#ff6600'
                      : (player.gravityDir === -1 ? '#ff4d4d' : '#ffeb00'));
      ctx.fillStyle = baseColor;
      ctx.shadowColor = baseColor;
      ctx.shadowBlur = 20;
      ctx.fillRect(-sz/2, -sz/2, sz, sz);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(-sz/2, -sz/2, sz, sz);
      const innerS = (PLAYER_SIZE - 14) * player.scale;
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(-innerS/2, -innerS/2, innerS, innerS);
      ctx.fillStyle = '#000';
      const eo = 8 * player.scale;
      const es = 4 * player.scale;
      const ey = -4 * player.scale;
      const eh = 6 * player.scale;
      ctx.fillRect(-eo, ey, es, eh);
      ctx.fillRect(eo - es, ey, es, eh);
      ctx.restore();
      }
    }

    for (const p of particles) {
      ctx.fillStyle = p.col;
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      const sz = 3 + (p.life / p.max) * 3;
      ctx.fillRect(p.x - sz/2, p.y - sz/2, sz, sz);
    }
    ctx.globalAlpha = 1;

    // SLOW overlay
    if (slowFrames > 0) {
      const alpha = 0.10 + 0.15 * (slowFrames / SLOW_DURATION);
      ctx.fillStyle = `rgba(125,211,252,${alpha})`;
      ctx.fillRect(0, 0, W, H);
      const grad = ctx.createLinearGradient(0,0,0,H);
      grad.addColorStop(0, 'rgba(125,211,252,0.4)');
      grad.addColorStop(0.1, 'rgba(125,211,252,0)');
      grad.addColorStop(0.9, 'rgba(125,211,252,0)');
      grad.addColorStop(1, 'rgba(125,211,252,0.4)');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,W,H);
    }

    // Shockwaves (anéis expandindo na morte)
    for (const sw of shockwaves) {
      const a = sw.life / 32;
      ctx.strokeStyle = hexA(sw.col, a * 0.85);
      ctx.lineWidth = 4 * a + 1;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI*2);
      ctx.stroke();
    }

    // Shards (pedaços do cubo girando)
    for (const sh of shards) {
      const a = Math.min(1, sh.life / 30);
      ctx.save();
      ctx.translate(sh.x, sh.y);
      ctx.rotate(sh.rot);
      ctx.globalAlpha = a;
      ctx.fillStyle = sh.col;
      ctx.shadowColor = sh.col;
      ctx.shadowBlur = 12 * a;
      ctx.fillRect(-sh.size/2, -sh.size/2, sh.size, sh.size);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-sh.size/2, -sh.size/2, sh.size, sh.size);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // Fecha shake transform
    ctx.restore();

    // Flash branco (após shake pra não tremer com o flash)
    if (deathFlash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${(deathFlash/12) * 0.85})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawSpike(sx, gy, h=0) {

  function drawSpring(sx, gy) {

    ctx.fillStyle = '#ffeb00';

    ctx.strokeRect(x, y, sw, sh);
    ctx.fillStyle = '#000';
    ctx.beginPath();

  function drawSaw(cx, cy) {
    const r = 22;
    const rot = frame * 0.35;
    ctx.fillStyle = hexA('#ff3030', 0.25);
    ctx.beginPath();
    ctx.arc(cx, cy, r + 8, 0, Math.PI*2);
    ctx.fill();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.fillStyle = '#bbb';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.72, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 1;
    const teeth = 10;
    for (let i = 0; i < teeth; i++) {
      const a1 = (i / teeth) * Math.PI * 2 - 0.12;
      const a2 = (i / teeth) * Math.PI * 2 + 0.12;
      const am = (a1 + a2) / 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a1) * (r * 0.72), Math.sin(a1) * (r * 0.72));
      ctx.lineTo(Math.cos(am) * r, Math.sin(am) * r);
      ctx.lineTo(Math.cos(a2) * (r * 0.72), Math.sin(a2) * (r * 0.72));
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.fillStyle = '#cc0000';
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(0, 0, 2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  function drawSlowOrb(cx, cy) {

  function drawGrowOrb(cx, cy) {

  function drawCoin(cx, cy) {
    const pulse = Math.sin(frame * 0.22) * 0.15 + 1;
    const r = 14 * pulse;
    const skew = Math.sin(frame * 0.18) * 0.7 + 1; // gira em torno do eixo vertical
    // halo
    ctx.fillStyle = 'rgba(255,215,0,0.35)';

  function drawSpeedPortal(sx, gy, mult) {
    const ceilY = CEILING_Y();
    const portalH = gy - ceilY;
    const wid = 18;
    const fast = mult > 1;
    const c1 = fast ? '#fb923c' : '#38bdf8';
    const c2 = fast ? '#fff' : '#0c4a6e';
    ctx.fillStyle = fast ? 'rgba(251,146,60,0.18)' : 'rgba(56,189,248,0.18)';
    ctx.fillRect(sx - wid - 10, ceilY - 10, (wid + 10)*2, portalH + 20);
    const grad = ctx.createLinearGradient(sx, ceilY, sx, gy);
    grad.addColorStop(0, c1);
    grad.addColorStop(0.5, c2);
    grad.addColorStop(1, c1);
    ctx.fillStyle = grad;
    ctx.fillRect(sx - wid, ceilY, wid*2, portalH);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.shadowColor = c1; ctx.shadowBlur = 12;
    ctx.strokeRect(sx - wid, ceilY, wid*2, portalH);
    ctx.shadowBlur = 0;
    // setas indicando direção
    ctx.fillStyle = '#fff';
    const arrowY = ceilY + portalH/2;
    const dir = fast ? 1 : -1;
    for (let i = -1; i <= 1; i++) {
      const ay = arrowY + i * 22;
      ctx.beginPath();
      ctx.moveTo(sx - 6*dir, ay - 5);
      ctx.lineTo(sx + 6*dir, ay);
      ctx.lineTo(sx - 6*dir, ay + 5);
      ctx.closePath();
      ctx.fill();
    }
  }
  function drawWaveZone(sx, ex) {

  function drawMovPlat(sx, gy, o) {
    const phase = (frame / o.period) * Math.PI * 2;
    const curY = o.y + Math.sin(phase) * o.amp;
    const top = gy - curY;
    ctx.fillStyle = 'rgba(168,85,247,0.15)';
    ctx.fillRect(sx, gy - (o.y + o.amp), o.w, 2 * o.amp);
    const g = ctx.createLinearGradient(sx, top, sx, top + 14);
    g.addColorStop(0, '#a855f7'); g.addColorStop(1, '#6b21a8');
    ctx.fillStyle = g;
    ctx.fillRect(sx, top, o.w, 14);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx, top, o.w, 14);
    const dirY = Math.cos(phase);
    if (Math.abs(dirY) > 0.3) {
      ctx.fillStyle = '#fff';
      const ay = top + 7;
      const dir = dirY > 0 ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(sx + o.w/2 - 5, ay - 4*dir);
      ctx.lineTo(sx + o.w/2 + 5, ay - 4*dir);
      ctx.lineTo(sx + o.w/2, ay + 4*dir);
      ctx.closePath();
      ctx.fill();
    }
  }
  function drawLaser(sx, gy, o) {
    const t = (frame % o.period) / o.period;
    const active = t < o.duty;
    const warning = !active && t > 0.85;
    const ceilY = CEILING_Y();
    const top = o.h === null ? ceilY : (gy - o.y - o.h);
    const h = o.h === null ? (gy - ceilY) : o.h;
    if (active) {
      ctx.fillStyle = 'rgba(255,0,80,0.25)';
      ctx.fillRect(sx - 24, top, 48, h);
      const g = ctx.createLinearGradient(sx - 8, 0, sx + 8, 0);
      g.addColorStop(0, 'rgba(255,0,80,0.4)');
      g.addColorStop(0.5, '#fff');
      g.addColorStop(1, 'rgba(255,0,80,0.4)');
      ctx.fillStyle = g;
      ctx.shadowColor = '#ff0050'; ctx.shadowBlur = 20;
      ctx.fillRect(sx - 8, top, 16, h);
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = warning ? '#fff' : '#ff0050';
      ctx.fillRect(sx - 12, top - 4, 24, 4);
      ctx.fillRect(sx - 12, top + h, 24, 4);
      if (warning) {
        ctx.strokeStyle = 'rgba(255,0,80,0.6)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(sx, top); ctx.lineTo(sx, top + h);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
  function drawBallZone(sx, ex) {

  function drawGFlip(sx, gy) {
    // Portal vermelho/preto, ocupando do chão ao teto
    const ceilY = CEILING_Y();
    const portalH = gy - ceilY;
    const cx = sx;
    const wid = 22;
    // brilho
    ctx.fillStyle = 'rgba(220,38,38,0.18)';
    ctx.fillRect(cx - wid - 10, ceilY - 10, (wid + 10) * 2, portalH + 20);
    // gradient vertical
    const grad = ctx.createLinearGradient(cx, ceilY, cx, gy);
    grad.addColorStop(0, '#dc2626');
    grad.addColorStop(0.5, '#000');
    grad.addColorStop(1, '#dc2626');
    ctx.fillStyle = grad;
    ctx.fillRect(cx - wid, ceilY, wid * 2, portalH);
    // bordas
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#dc2626';
    ctx.shadowBlur = 14;
    ctx.strokeRect(cx - wid, ceilY, wid * 2, portalH);
    ctx.shadowBlur = 0;

    const ph = (frame * 0.1) % 1;

      const t = (ph + i * 0.25) % 1;
      const ay = ceilY + t * portalH;
      ctx.fillStyle = `rgba(255,255,255,${1 - t})`;
      ctx.beginPath();
      ctx.moveTo(cx - 8, ay - 5);

  function drawFinish(sx, gy) {
    const top = gy - 200;
    const h = 200;
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx, top, 5, h);
    ctx.fillStyle = hexA(level.accent1, 0.25);
    ctx.fillRect(sx - 30, top - 20, 60, h + 30);
    const fw = 60, fh = 50;
    for (let r=0; r<5; r++) {
      for (let c=0; c<6; c++) {
        ctx.fillStyle = (r+c)%2 ? '#fff' : '#000';
        ctx.fillRect(sx + 5 + c*(fw/6), top + r*(fh/5), fw/6, fh/5);
      }
    }
    ctx.fillStyle = level.accent1;
    ctx.shadowColor = level.accent1;
    ctx.shadowBlur = 20;
    ctx.fillRect(sx + 5, top + fh + 8, 4, 8);
    ctx.shadowBlur = 0;

  function hexA(hex, a) {
    const h = hex.replace('#','');
    const r = parseInt(h.substring(0,2),16);
    const g = parseInt(h.substring(2,4),16);
    const b = parseInt(h.substring(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function updateDeathFX() {
    // Roda mesmo quando player.dead pra continuar a animação
    if (deathFlash > 0) deathFlash--;
    if (deathShake > 0) deathShake--;
    for (const sw of shockwaves) {
      sw.r += (sw.max - sw.r) * 0.18;
      sw.life--;
    }
    shockwaves = shockwaves.filter(s => s.life > 0);
    for (const sh of shards) {
      sh.x += sh.vx; sh.y += sh.vy;
      sh.vy += 0.4;
      sh.vx *= 0.985;
      sh.rot += sh.vrot;
      sh.life--;
    }
    shards = shards.filter(s => s.life > 0);
    // partículas continuam mesmo após morte
    if (player.dead) {
      for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--; }
      particles = particles.filter(p => p.life > 0);
    }
  }

  function loop() { update(); updateDeathFX(); draw(); requestAnimationFrame(loop); }
