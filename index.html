<script type="text/html" id="game-mario">
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a0808">
<title>Mini Mario</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; min-height:100%; background:#1a0808; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#fff; overscroll-behavior:none; touch-action:none; }
  body { display:flex; justify-content:center; min-height:100vh; min-height:100dvh; }
  #stage { width:100%; max-width:min(100vw, calc(100vh * 9 / 16)); min-height:100vh; min-height:100dvh; position:relative; display:flex; flex-direction:column; padding:env(safe-area-inset-top,12px) 14px env(safe-area-inset-bottom,12px); background:linear-gradient(180deg,#1a0808,#3a1010); }

  header { display:flex; align-items:center; justify-content:space-between; padding:6px 0 4px; z-index:5; position:relative; }
  .iconBtn { width:46px; height:46px; border:none; background:rgba(255,255,255,.1); color:#fff; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .15s; text-decoration:none; }
  .iconBtn:active { transform:scale(.9); }
  .infoBar { display:flex; align-items:center; gap:12px; background:rgba(0,0,0,.35); padding:8px 14px; border-radius:999px; font-size:13px; font-weight:700; }
  .infoBar .lives { letter-spacing:2px; }
  .infoBar .coins { color:#fbbf24; font-weight:900; }

  .screen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .screen.hidden { display:none; }

  /* MENU */
  #menuScreen h1 { font-size:clamp(28px, 8vw, 40px); font-weight:900; margin-bottom:6px; background:linear-gradient(90deg,#ef4444,#fbbf24); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #menuScreen .sub { opacity:.7; font-size:14px; margin-bottom:18px; text-align:center; padding:0 20px; }

  .stageGrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; width:100%; max-width:340px; }
  .stageCard { background:rgba(255,255,255,.06); border:2px solid rgba(239,68,68,.4); border-radius:14px; padding:12px 8px; cursor:pointer; transition:transform .15s; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .stageCard:active { transform:scale(.94); }
  .stageCard.locked { opacity:.4; pointer-events:none; }
  .stageNum { font-size:22px; font-weight:900; }
  .stageName { font-size:10px; opacity:.7; }
  .stageStars { display:flex; gap:1px; font-size:13px; margin-top:2px; }
  .stageStars .s { opacity:.25; }
  .stageStars .s.lit { opacity:1; filter:drop-shadow(0 0 3px #ffd700); }

  /* JOGO */
  #gameScreen { padding:0; justify-content:flex-start; }
  #gameCanvas { width:100%; flex:1; display:block; }

  /* Controles touch */
  .controls { position:fixed; bottom:env(safe-area-inset-bottom,20px); left:0; right:0; display:flex; justify-content:space-between; padding:0 20px; z-index:6; pointer-events:none; }
  .ctrlSide { display:flex; gap:10px; pointer-events:auto; }
  .ctrlBtn { width:64px; height:64px; background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.3); border-radius:50%; color:#fff; font-size:24px; font-weight:900; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 0 rgba(0,0,0,.3); }
  .ctrlBtn.active { background:rgba(239,68,68,.4); transform:scale(.92) translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.3); }
  .ctrlBtn.jump { width:72px; height:72px; background:rgba(251,191,36,.25); border-color:rgba(251,191,36,.6); }

  /* OVERLAY (vidas, fase) */
  .stageInfo { position:absolute; top:8px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.5); padding:4px 14px; border-radius:99px; font-size:12px; font-weight:700; z-index:5; }

  /* FIM */
  #endScreen { text-align:center; padding:20px; background:rgba(0,0,0,.6); }
  #endScreen .bigEmoji { font-size:88px; line-height:1; margin-bottom:14px; animation:bounce .8s; }
  @keyframes bounce { 0% { transform:scale(0); } 60% { transform:scale(1.2); } 100% { transform:scale(1); } }
  #endScreen h2 { font-size:24px; margin-bottom:8px; }
  #endScreen .score { font-size:14px; margin:8px 0 4px; opacity:.85; }
  #endScreen .earnedStars { font-size:50px; margin:10px 0 20px; letter-spacing:6px; }
  #endScreen .earnedStars .s { opacity:.25; display:inline-block; }
  #endScreen .earnedStars .s.lit { opacity:1; filter:drop-shadow(0 0 12px #ffd700); }
  #endScreen .btnRow { display:flex; gap:10px; max-width:340px; width:100%; }
  #endScreen button { flex:1; padding:14px; font-size:14px; font-weight:800; border:none; border-radius:14px; cursor:pointer; color:#fff; }
  #endScreen button:active { transform:scale(.96); }
  .primaryBtn { background:linear-gradient(90deg,#ef4444,#dc2626); }
  .secondaryBtn { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2) !important; }
</style>
</head>
<body>

<div id="stage">
  <header>
    <button class="iconBtn" id="backBtn" aria-label="Voltar">←</button>
    <div class="infoBar">
      <span class="lives" id="livesEl">❤️❤️❤️</span>
      <span class="coins" id="coinsEl">🪙 0/0</span>
    </div>
    <button class="iconBtn" id="homeBtn" aria-label="Início">🏠</button>
    <button class="iconBtn" id="muteBtn">🔊</button>
  </header>

  <!-- MENU -->
  <div id="menuScreen" class="screen">
    <h1>Mini Mario</h1>
    <div class="sub">Pule, pise nos inimigos, pegue moedas e chegue na bandeira!</div>
    <div class="stageGrid" id="stageGrid"></div>
  </div>

  <!-- JOGO -->
  <div id="gameScreen" class="screen hidden">
    <div class="stageInfo" id="stageInfo">Fase 1</div>
    <canvas id="gameCanvas"></canvas>
    <div class="controls">
      <div class="ctrlSide">
        <button class="ctrlBtn" id="btnLeft">◀</button>
        <button class="ctrlBtn" id="btnRight">▶</button>
      </div>
      <div class="ctrlSide">
        <button class="ctrlBtn jump" id="btnJump">▲</button>
      </div>
    </div>
  </div>

  <!-- FIM -->
  <div id="endScreen" class="screen hidden">
    <div class="bigEmoji" id="endEmoji">🏁</div>
    <h2 id="endTitle">Chegou!</h2>
    <div class="score" id="endScore"></div>
    <div class="earnedStars" id="earnedStars"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
    <div class="btnRow">
      <button class="secondaryBtn" id="backMenuBtn">Mapa</button>
      <button class="primaryBtn" id="nextBtn">Próxima</button>
    </div>
  </div>
</div>

<script>
(() => {
  // =========== AUDIO ===========
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndJump()  { beep(440, 0.06, 'square', 0.05); setTimeout(() => beep(660, 0.06, 'square', 0.04), 40); }
  function sndCoin()  { beep(988, 0.05, 'triangle', 0.06); setTimeout(() => beep(1318, 0.08, 'triangle', 0.05), 30); }
  function sndStomp() { beep(220, 0.08, 'square', 0.06); setTimeout(() => beep(165, 0.1, 'square', 0.05), 50); }
  function sndDie()   { [440, 330, 220, 165].forEach((f, i) => beep(f, 0.15, 'sawtooth', 0.06, i*0.1)); }
  function sndWin()   { [523, 659, 784, 1047, 1318].forEach((f, i) => beep(f, 0.15, 'square', 0.06, i*0.1)); }
  function sndTap()   { beep(660, 0.04, 'triangle', 0.05); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // =========== FASES ===========
  // Tile map: '.' vazio, '#' chão, '=' plataforma, '?' moeda, 'E' inimigo, 'F' bandeira, 'P' start
  const STAGES = [
    {
      name: 'Tutorial',
      map: [
        '..............................',
        '..............................',
        '..............................',
        '..............................',
        '..............................',
        '..............................',
        '...........?......?......?....',
        '..............................',
        '..............................',
        '....P...................E....F',
        '##############################',
        '##############################',
      ],
    },
    {
      name: 'Buracos',
      map: [
        '..............................',
        '..............................',
        '..............................',
        '..............................',
        '..............................',
        '..............................',
        '..?...........?..........?....',
        '..............................',
        '..............................',
        '....P.....E...........E......F',
        '######....######...####....###',
        '######....######...####....###',
      ],
    },
    {
      name: 'Plataformas',
      map: [
        '..............................',
        '..............................',
        '..............................',
        '......?......?......?......?.',
        '....====...====...====...====',
        '..............................',
        '..............................',
        '..............................',
        '........E........E........E...',
        '....P........................F',
        '##############################',
        '##############################',
      ],
    },
    {
      name: 'Inimigos',
      map: [
        '..............................',
        '..............................',
        '..?.?.?.?.....?....?......?...',
        '..............................',
        '..====........====............',
        '..............................',
        '..............E.....E.........',
        '..............................',
        '....P..E.E..........E....E...F',
        '##############################',
        '##############################',
        '##############################',
      ],
    },
    {
      name: 'Boss',
      map: [
        '..............................',
        '..............................',
        '..............................',
        '......?....?....?....?....?...',
        '......=====================...',
        '..............................',
        '..............................',
        '......===......===......===...',
        '..............................',
        '....P.E....E....E....E....E..F',
        '##############################',
        '##############################',
      ],
    },
  ];
  const TILE = 32;       // pixels por tile
  const GRAVITY = 0.55;
  const JUMP_V = -11.5;
  const JUMP_HOLD = -0.45;  // boost por frame enquanto segura
  const MAX_HOLD = 14;       // frames de boost
  const MOVE_SPEED = 3.5;
  const PLAYER_W = 22;
  const PLAYER_H = 28;
  const ENEMY_W = 24;
  const ENEMY_H = 24;
  const ENEMY_SPEED = 1.0;

  // =========== STATS ===========
  function getStars(stage) { return +(localStorage.getItem('blg-mario-stars-' + stage) || 0); }
  function saveStars(stage, n) {
    const cur = getStars(stage);
    if (n > cur) localStorage.setItem('blg-mario-stars-' + stage, n);
  }
  function isUnlocked(stage) {
    return stage === 0 || getStars(stage - 1) > 0;
  }
  function refreshMenu() {
    const grid = document.getElementById('stageGrid');
    grid.innerHTML = '';
    STAGES.forEach((st, i) => {
      const card = document.createElement('div');
      card.className = 'stageCard' + (isUnlocked(i) ? '' : ' locked');
      const stars = getStars(i);
      card.innerHTML = `
        <div class="stageNum">${i + 1}</div>
        <div class="stageName">${st.name}</div>
        <div class="stageStars">
          <span class="s${stars >= 1 ? ' lit' : ''}">★</span>
          <span class="s${stars >= 2 ? ' lit' : ''}">★</span>
          <span class="s${stars >= 3 ? ' lit' : ''}">★</span>
        </div>`;
      card.addEventListener('click', () => {
        if (!isUnlocked(i)) return;
        ensureAudio(); sndTap();
        startStage(i);
      });
      grid.appendChild(card);
    });
  }
  refreshMenu();

  // =========== CANVAS / RENDER ===========
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let CW = 0, CH = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    CW = rect.width; CH = rect.height;
    canvas.width = CW * DPR; canvas.height = CH * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // =========== STATE ===========
  let currentStage = 0;
  let tiles = [];
  let WORLD_W = 0, WORLD_H = 0;
  let player, enemies, coins, flag;
  let coinsTotal = 0, coinsGot = 0;
  let lives = 3;
  let cameraX = 0;
  let running = false;
  let lastTime = 0;
  let inputLeft = false, inputRight = false, inputJump = false;
  let jumpHoldFrames = 0;
  let invuln = 0;
  let stageWon = false;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  function parseStage(stage) {
    const m = STAGES[stage].map;
    tiles = m.map(row => row.split(''));
    WORLD_W = m[0].length * TILE;
    WORLD_H = m.length * TILE;

    enemies = [];
    coins = [];
    flag = null;
    let startX = 0, startY = 0;
    coinsTotal = 0;

    for (let r = 0; r < tiles.length; r++) {
      for (let c = 0; c < tiles[r].length; c++) {
        const ch = tiles[r][c];
        const px = c * TILE, py = r * TILE;
        if (ch === 'P') { startX = px; startY = py - 4; tiles[r][c] = '.'; }
        else if (ch === 'E') { enemies.push({ x: px + 4, y: py + TILE - ENEMY_H, vx: -ENEMY_SPEED, vy: 0, alive: true }); tiles[r][c] = '.'; }
        else if (ch === '?') { coins.push({ x: px + TILE/2, y: py + TILE/2, taken: false, anim: Math.random() * Math.PI * 2 }); coinsTotal++; tiles[r][c] = '.'; }
        else if (ch === 'F') { flag = { x: px, y: py }; tiles[r][c] = '.'; }
      }
    }
    player = { x: startX, y: startY, vx: 0, vy: 0, onGround: false, facing: 1, alive: true };
  }

  function isSolid(r, c) {
    if (r < 0 || r >= tiles.length || c < 0 || c >= tiles[0].length) return false;
    const ch = tiles[r][c];
    return ch === '#' || ch === '=';
  }

  function startStage(stage) {
    currentStage = stage;
    lives = 3;
    document.getElementById('stageInfo').textContent = `Fase ${stage + 1}`;
    showScreen(gameScreen);
    setTimeout(() => { resize(); spawnStage(); }, 50);
  }

  function spawnStage() {
    parseStage(currentStage);
    coinsGot = 0;
    cameraX = 0;
    invuln = 30;
    stageWon = false;
    running = true;
    updateHUD();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function updateHUD() {
    document.getElementById('livesEl').textContent = '❤️'.repeat(lives) + '🤍'.repeat(Math.max(0, 3 - lives));
    document.getElementById('coinsEl').textContent = `🪙 ${coinsGot}/${coinsTotal}`;
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(2, (now - lastTime) / 16.67);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function tryMoveX(entity, dx, w, h) {
    entity.x += dx;
    // colide left/right
    const tilesToCheck = [
      { x: entity.x, y: entity.y },
      { x: entity.x + w - 1, y: entity.y },
      { x: entity.x, y: entity.y + h - 1 },
      { x: entity.x + w - 1, y: entity.y + h - 1 },
      { x: entity.x, y: entity.y + h/2 },
      { x: entity.x + w - 1, y: entity.y + h/2 },
    ];
    for (const p of tilesToCheck) {
      const c = Math.floor(p.x / TILE), r = Math.floor(p.y / TILE);
      if (isSolid(r, c)) {
        if (dx > 0) entity.x = c * TILE - w - 0.01;
        else if (dx < 0) entity.x = (c + 1) * TILE + 0.01;
        return true;
      }
    }
    return false;
  }

  function tryMoveY(entity, dy, w, h) {
    entity.y += dy;
    const tilesToCheck = [
      { x: entity.x, y: entity.y },
      { x: entity.x + w - 1, y: entity.y },
      { x: entity.x, y: entity.y + h - 1 },
      { x: entity.x + w - 1, y: entity.y + h - 1 },
      { x: entity.x + w/2, y: entity.y },
      { x: entity.x + w/2, y: entity.y + h - 1 },
    ];
    for (const p of tilesToCheck) {
      const c = Math.floor(p.x / TILE), r = Math.floor(p.y / TILE);
      if (isSolid(r, c)) {
        if (dy > 0) { entity.y = r * TILE - h - 0.01; return 'ground'; }
        else if (dy < 0) { entity.y = (r + 1) * TILE + 0.01; return 'ceil'; }
      }
    }
    return null;
  }

  function update(dt) {
    if (!player.alive || stageWon) return;
    if (invuln > 0) invuln--;

    // Input horizontal
    if (inputLeft && !inputRight) { player.vx = -MOVE_SPEED; player.facing = -1; }
    else if (inputRight && !inputLeft) { player.vx = MOVE_SPEED; player.facing = 1; }
    else player.vx *= 0.7;

    // Pulo
    if (inputJump && player.onGround && jumpHoldFrames === 0) {
      player.vy = JUMP_V;
      player.onGround = false;
      jumpHoldFrames = 1;
      sndJump();
    } else if (inputJump && jumpHoldFrames > 0 && jumpHoldFrames < MAX_HOLD && player.vy < 0) {
      player.vy += JUMP_HOLD;
      jumpHoldFrames++;
    } else if (!inputJump) {
      jumpHoldFrames = 0;
    }

    // Gravidade
    player.vy += GRAVITY * dt;
    if (player.vy > 14) player.vy = 14;

    // Movimento + colisão
    tryMoveX(player, player.vx * dt, PLAYER_W, PLAYER_H);
    const yResult = tryMoveY(player, player.vy * dt, PLAYER_W, PLAYER_H);
    if (yResult === 'ground') { player.onGround = true; player.vy = 0; }
    else if (yResult === 'ceil') { player.vy = 0; }
    else { player.onGround = false; }

    // World bounds
    if (player.x < 0) player.x = 0;
    if (player.x + PLAYER_W > WORLD_W) player.x = WORLD_W - PLAYER_W;

    // Caiu fora do mapa
    if (player.y > WORLD_H + 100) {
      die();
      return;
    }

    // Inimigos
    for (const e of enemies) {
      if (!e.alive) continue;
      // patrulha: se chão à frente não tem suporte, vira
      const aheadX = e.vx > 0 ? e.x + ENEMY_W : e.x - 1;
      const footY = e.y + ENEMY_H + 1;
      const aheadCol = Math.floor(aheadX / TILE);
      const footRow = Math.floor(footY / TILE);
      if (!isSolid(footRow, aheadCol)) e.vx *= -1;

      // gravidade
      e.vy += GRAVITY * dt;
      if (e.vy > 12) e.vy = 12;

      if (tryMoveX(e, e.vx * dt, ENEMY_W, ENEMY_H)) e.vx *= -1;
      tryMoveY(e, e.vy * dt, ENEMY_W, ENEMY_H);
    }

    // Colisão player vs inimigos
    if (invuln === 0) {
      for (const e of enemies) {
        if (!e.alive) continue;
        if (player.x < e.x + ENEMY_W && player.x + PLAYER_W > e.x &&
            player.y < e.y + ENEMY_H && player.y + PLAYER_H > e.y) {
          // Pisou em cima? (player descendo + bottom no topo do inimigo)
          if (player.vy > 0 && player.y + PLAYER_H - 10 < e.y) {
            e.alive = false;
            player.vy = JUMP_V * 0.7;  // pulinho
            sndStomp();
          } else {
            die();
            return;
          }
        }
      }
    }

    // Coleta moedas
    for (const c of coins) {
      if (c.taken) continue;
      c.anim += 0.1;
      const cx = c.x, cy = c.y;
      if (cx > player.x && cx < player.x + PLAYER_W &&
          cy > player.y && cy < player.y + PLAYER_H) {
        c.taken = true;
        coinsGot++;
        updateHUD();
        sndCoin();
      }
    }

    // Bandeira (vitória)
    if (flag && player.x + PLAYER_W > flag.x && player.x < flag.x + TILE &&
        player.y + PLAYER_H > flag.y && player.y < flag.y + TILE * 2) {
      stageWon = true;
      sndWin();
      setTimeout(winStage, 800);
    }

    // Câmera
    const targetCam = player.x - CW / 3;
    cameraX += (targetCam - cameraX) * 0.15;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > WORLD_W - CW) cameraX = WORLD_W - CW;
  }

  function die() {
    if (!player.alive) return;
    player.alive = false;
    lives--;
    updateHUD();
    sndDie();
    if (lives <= 0) {
      setTimeout(() => {
        running = false;
        stageWon = false;
        showEnd(false);
      }, 800);
    } else {
      setTimeout(spawnStage, 800);  // respawn da fase
    }
  }

  function winStage() {
    running = false;
    let earned = 1;
    const pct = coinsTotal > 0 ? coinsGot / coinsTotal : 1;
    if (pct >= 1) earned = 3;
    else if (pct >= 0.5) earned = 2;
    saveStars(currentStage, earned);
    refreshMenu();
    showEnd(true, earned);
  }

  function showEnd(won, earned) {
    if (won) {
      document.getElementById('endEmoji').textContent = earned === 3 ? '🏆' : (earned === 2 ? '🎉' : '🏁');
      document.getElementById('endTitle').textContent = earned === 3 ? 'PERFEITO!' : 'Você venceu!';
      document.getElementById('endScore').textContent =
        `${coinsGot}/${coinsTotal} moedas`;
      const earnedStars = document.getElementById('earnedStars');
      earnedStars.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const s = document.createElement('span');
        s.className = 's' + (i < earned ? ' lit' : '');
        s.textContent = '★';
        earnedStars.appendChild(s);
      }
      // Habilita próxima fase se houver
      const nextBtn = document.getElementById('nextBtn');
      if (currentStage < STAGES.length - 1) {
        nextBtn.textContent = 'Próxima';
        nextBtn.style.display = '';
        nextBtn.onclick = () => { sndTap(); startStage(currentStage + 1); };
      } else {
        nextBtn.style.display = 'none';
      }
    } else {
      document.getElementById('endEmoji').textContent = '💀';
      document.getElementById('endTitle').textContent = 'Sem vidas!';
      document.getElementById('endScore').textContent = 'Vai pegando o jeito!';
      document.getElementById('earnedStars').innerHTML = '<span class="s">★</span><span class="s">★</span><span class="s">★</span>';
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.textContent = 'Tentar de novo';
      nextBtn.style.display = '';
      nextBtn.onclick = () => { sndTap(); startStage(currentStage); };
    }
    showScreen(endScreen);
  }

  function render() {
    // céu
    const grad = ctx.createLinearGradient(0, 0, 0, CH);
    grad.addColorStop(0, '#3b82f6');
    grad.addColorStop(1, '#7dd3fc');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CW, CH);

    // nuvens parallax
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 220 - cameraX * 0.3) % (CW + 200)) - 100;
      const cy = 30 + (i * 17) % 80;
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.beginPath();
      ctx.arc(cx, cy, 18, 0, Math.PI*2);
      ctx.arc(cx + 18, cy + 4, 14, 0, Math.PI*2);
      ctx.arc(cx - 14, cy + 6, 12, 0, Math.PI*2);
      ctx.fill();
    }

    // scale world para caber na tela (mantém aspect)
    // simples: render direto, câmera só X
    const offsetY = CH - WORLD_H;  // alinha chão na base

    // tiles
    const startCol = Math.floor(cameraX / TILE);
    const endCol = Math.ceil((cameraX + CW) / TILE);
    for (let r = 0; r < tiles.length; r++) {
      for (let c = Math.max(0, startCol); c < Math.min(tiles[0].length, endCol + 1); c++) {
        const ch = tiles[r][c];
        if (ch === '#') {
          // chão (marrom com topo verde)
          const x = c * TILE - cameraX, y = r * TILE + offsetY;
          ctx.fillStyle = '#92400e';
          ctx.fillRect(x, y, TILE, TILE);
          if (r === 0 || tiles[r-1][c] !== '#') {
            ctx.fillStyle = '#16a34a';
            ctx.fillRect(x, y, TILE, 6);
          }
          ctx.strokeStyle = 'rgba(0,0,0,.2)';
          ctx.strokeRect(x, y, TILE, TILE);
        } else if (ch === '=') {
          // plataforma flutuante
          const x = c * TILE - cameraX, y = r * TILE + offsetY;
          ctx.fillStyle = '#d97706';
          ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = '#fbbf24';
          ctx.fillRect(x, y, TILE, 5);
          ctx.strokeStyle = 'rgba(0,0,0,.2)';
          ctx.strokeRect(x, y, TILE, TILE);
        }
      }
    }

    // moedas
    for (const co of coins) {
      if (co.taken) continue;
      const x = co.x - cameraX, y = co.y + offsetY;
      const wobble = Math.sin(co.anim) * 3;
      ctx.save();
      ctx.translate(x, y + wobble);
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#d97706';
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('$', 0, 1);
      ctx.restore();
    }

    // bandeira
    if (flag) {
      const x = flag.x - cameraX, y = flag.y + offsetY;
      ctx.fillStyle = '#666';
      ctx.fillRect(x + 14, y, 4, TILE * 3);
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(x + 18, y);
      ctx.lineTo(x + 18 + 18, y + 8);
      ctx.lineTo(x + 18, y + 16);
      ctx.closePath();
      ctx.fill();
    }

    // inimigos
    for (const e of enemies) {
      if (!e.alive) continue;
      const x = e.x - cameraX, y = e.y + offsetY;
      ctx.fillStyle = '#7c2d12';
      ctx.beginPath();
      ctx.ellipse(x + ENEMY_W/2, y + ENEMY_H/2, ENEMY_W/2, ENEMY_H/2, 0, 0, Math.PI*2);
      ctx.fill();
      // olhos
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x + 8, y + 10, 3, 0, Math.PI*2);
      ctx.arc(x + 16, y + 10, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(x + 8 + e.vx, y + 10, 1.5, 0, Math.PI*2);
      ctx.arc(x + 16 + e.vx, y + 10, 1.5, 0, Math.PI*2);
      ctx.fill();
    }

    // Player
    if (player.alive && (invuln === 0 || Math.floor(invuln / 4) % 2 === 0)) {
      const x = player.x - cameraX, y = player.y + offsetY;
      // corpo vermelho
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(x, y + 10, PLAYER_W, PLAYER_H - 10);
      // boné
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(x - 2, y, PLAYER_W + 4, 8);
      ctx.fillRect(x + 2, y - 2, PLAYER_W - 4, 4);
      // pele do rosto
      ctx.fillStyle = '#fde68a';
      ctx.fillRect(x + 2, y + 7, PLAYER_W - 4, 8);
      // olhos
      ctx.fillStyle = '#000';
      const eyeOffset = player.facing > 0 ? 0 : -2;
      ctx.fillRect(x + 8 + eyeOffset, y + 10, 2, 2);
      ctx.fillRect(x + 14 + eyeOffset, y + 10, 2, 2);
      // suspensórios
      ctx.fillStyle = '#1e40af';
      ctx.fillRect(x + 3, y + 15, 3, 13);
      ctx.fillRect(x + PLAYER_W - 6, y + 15, 3, 13);
    }
  }

  // =========== INPUTS ===========
  function bindBtn(el, set) {
    el.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); set(true); el.classList.add('active'); }, { passive:false });
    el.addEventListener('touchend', (e) => { e.preventDefault(); set(false); el.classList.remove('active'); }, { passive:false });
    el.addEventListener('touchcancel', () => { set(false); el.classList.remove('active'); });
    // mouse fallback
    el.addEventListener('mousedown', () => { ensureAudio(); set(true); el.classList.add('active'); });
    el.addEventListener('mouseup', () => { set(false); el.classList.remove('active'); });
    el.addEventListener('mouseleave', () => { set(false); el.classList.remove('active'); });
  }
  bindBtn(document.getElementById('btnLeft'),  (v) => inputLeft = v);
  bindBtn(document.getElementById('btnRight'), (v) => inputRight = v);
  bindBtn(document.getElementById('btnJump'),  (v) => inputJump = v);

  // Keyboard
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputLeft = true;
    if (e.key === 'ArrowRight' || e.key === 'd') inputRight = true;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') inputJump = true;
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputLeft = false;
    if (e.key === 'ArrowRight' || e.key === 'd') inputRight = false;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') inputJump = false;
  });

  window.addEventListener('resize', () => {
    if (!gameScreen.classList.contains('hidden')) resize();
  });

  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    running = false;
    showScreen(menuScreen);
  });

  // NAVEGAÇÃO (back + home)
  (function setupNav() {
    const backEl = document.getElementById('backBtn');
    const homeEl = document.getElementById('homeBtn');
    function goHub() { parent.postMessage('back-to-hub', '*'); }
    function tap() { if (typeof ensureAudio === 'function') ensureAudio(); if (typeof sndTap === 'function') sndTap(); }
    if (backEl) backEl.addEventListener('click', () => {
      tap();
      const menu = document.getElementById('menuScreen');
      if (!menu || !menu.classList.contains('hidden')) { goHub(); return; }
      if (typeof showScreen === 'function') showScreen(menu);
      else { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); menu.classList.remove('hidden'); }
    });
    if (homeEl) homeEl.addEventListener('click', () => { tap(); goHub(); });
  })();

})();

      const pct = Math.round((totalDone * 100) / 11);
      if (pct > 0 || totalCoins > 0) {
        dashProg.classList.add('show');
        bar.style.width = Math.max(5, pct) + '%';

      ['invaders', 'blg-invaders-stars-', 3, 9],
      ['pacman', 'blg-pacman-stars-', 5, 15],
      ['tower', 'blg-tower-stars-', 3, 9],
    ];
    for (const [game, prefix, levels, max] of games) {
      let stars = 0;
      for (let i = 0; i < levels; i++) stars += +(localStorage.getItem(prefix + i) || 0);
      const prog = document.querySelector('.card[data-game="' + game + '"] .progress');
      if (prog) {
        const bar = prog.querySelector('div');
        if (stars > 0) {
          prog.classList.add('show');
          bar.style.width = Math.max(5, (stars / max) * 100) + '%';
        }
      }
    }
    // Piano: 1 valor único
    const pianoS = +(localStorage.getItem('blg-piano-stars') || 0);
    const pianoP = document.querySelector('.card[data-game="piano"] .progress');
    if (pianoP) {
      const bar = pianoP.querySelector('div');
      if (pianoS > 0) {
        pianoP.classList.add('show');
        bar.style.width = Math.max(5, (pianoS / 3) * 100) + '%';
      }
    }
    // Sudoku: 3 sizes × 3 diffs
    let sudokuS = 0;
    for (const sz of [4, 6, 9]) for (const df of ['Fácil', 'Médio', 'Difícil']) {
      sudokuS += +(localStorage.getItem('blg-sudoku-' + sz + '-' + df + '-stars') || 0);
    }
    const sudokuP = document.querySelector('.card[data-game="sudoku"] .progress');
    if (sudokuP) {
      const bar = sudokuP.querySelector('div');
      if (sudokuS > 0) {
        sudokuP.classList.add('show');
        bar.style.width = Math.max(5, (sudokuS / 27) * 100) + '%';
      }
    }
    // RPG: 1 valor único
    const rpgS = +(localStorage.getItem('blg-rpg-best-stars') || 0);
    const rpgP = document.querySelector('.card[data-game="rpg"] .progress');
    if (rpgP) {

      if (rpgS > 0) {
        rpgP.classList.add('show');
        bar.style.width = Math.max(5, (rpgS / 3) * 100) + '%';
      }
    }
  };

        { word:'CADEIRA', clue:'A gente senta nela',          row:0, col:0, dir:'A' },
        { word:'DEDOS',   clue:'Cada mão tem cinco',          row:0, col:2, dir:'D' },
        { word:'IRMAO',   clue:'Filho dos meus pais',         row:0, col:4, dir:'D' },
        { word:'DOM',     clue:'Talento, presente',           row:2, col:2, dir:'A' },
        { word:'SAO',     clue:'Verbo ser (eles ___ amigos)', row:4, col:2, dir:'A' },
      ],
    },
    {
      name: 'Escola',
      size: 7,
      words: [
        { word:'MOCHILA', clue:'Leva os cadernos pra escola', row:0, col:0, dir:'A' },
        { word:'OURO',    clue:'Metal precioso amarelo',      row:0, col:1, dir:'D' },
        { word:'HOJE',    clue:'Não é ontem, não é amanhã',   row:0, col:3, dir:'D' },
        { word:'LIRA',    clue:'Instrumento musical antigo',  row:0, col:5, dir:'D' },
      ],
    },
    {
      name: 'Mundo',
      size: 8,
      words: [
        { word:'ELEFANTE', clue:'Animal grande de tromba',    row:0, col:0, dir:'A' },
        { word:'LUA',      clue:'À noite no céu, redonda',    row:0, col:1, dir:'D' },
        { word:'FOGO',     clue:'Queima e esquenta',          row:0, col:3, dir:'D' },
        { word:'NOITE',    clue:'Quando o sol se põe',        row:0, col:5, dir:'D' },
        { word:'TIO',      clue:'Irmão do meu pai',           row:0, col:6, dir:'D' },
        { word:'COCO',     clue:'Fruta com leite por dentro', row:1, col:2, dir:'A' },
      ],
    },
  ];

  // =========== AUDIO ===========
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndTap()    { beep(660, 0.04, 'triangle', 0.05); }
  function sndKey()    { beep(880, 0.04, 'triangle', 0.04); }
  function sndOk()     { [523, 784, 1047].forEach((f, i) => beep(f, 0.10, 'triangle', 0.06, i*0.05)); }
  function sndWrong()  { beep(220, 0.12, 'sine', 0.05); }
  function sndHint()   { [659, 988, 1318].forEach((f, i) => beep(f, 0.08, 'triangle', 0.05, i*0.04)); }
  function sndWin()    { [523, 659, 784, 880, 1047, 1318, 1568].forEach((f, i) => beep(f, 0.15, 'square', 0.06, i*0.09)); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // =========== STATS ===========
  function getStars(stage) { return +(localStorage.getItem('blg-cruzadas-stars-' + stage) || 0); }
  function saveStars(stage, n) {
    const cur = getStars(stage);
    if (n > cur) localStorage.setItem('blg-cruzadas-stars-' + stage, n);
  }
  function isUnlocked(stage) {
    return stage === 0 || getStars(stage - 1) > 0;
  }
  function refreshMenu() {
    const gr = document.getElementById('stageGrid');
    gr.innerHTML = '';
    PUZZLES.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'stageCard' + (isUnlocked(i) ? '' : ' locked');
      const stars = getStars(i);
      card.innerHTML = `
        <div class="stageNum">${i + 1}</div>
        <div class="stageName">${p.name}</div>
        <div class="stageStars">
          <span class="s${stars >= 1 ? ' lit' : ''}">★</span>
          <span class="s${stars >= 2 ? ' lit' : ''}">★</span>
          <span class="s${stars >= 3 ? ' lit' : ''}">★</span>
        </div>`;
      card.addEventListener('click', () => {
        if (!isUnlocked(i)) return;
        ensureAudio(); sndTap();
        startPuzzle(i);
      });
      gr.appendChild(card);
    });
  }
  refreshMenu();

  // =========== STATE ===========
  let currentStage = 0;
  let currentPuzzle = null;
  let cells = [];        // cells[r][c] = { letter, userInput, wordIds, num, white } | null
  let words = [];        // [{ id, word, clue, row, col, dir, cells:[{r,c}], solved }]
  let activeWordId = 0;
  let activeCell = null; // {r, c}
  let hintsUsed = 0;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  function startPuzzle(stage) {
    currentStage = stage;
    currentPuzzle = PUZZLES[stage];
    hintsUsed = 0;
    document.getElementById('hintsUsedNum').textContent = '0';
    document.getElementById('stageInfo').textContent = `Fase ${stage + 1} · ${currentPuzzle.name}`;
    buildGrid();
    renderGrid();
    renderKeyboard();
    activeWordId = 0;
    setActiveWord(0);
    showScreen(gameScreen);
  }

  function buildGrid() {
    const size = currentPuzzle.size;
    cells = Array.from({ length: size }, () => Array.from({ length: size }, () => null));
    words = [];

    // Insert each word
    currentPuzzle.words.forEach((w, idx) => {
      const wordCells = [];
      for (let i = 0; i < w.word.length; i++) {
        const r = w.dir === 'D' ? w.row + i : w.row;
        const c = w.dir === 'A' ? w.col + i : w.col;
        if (!cells[r][c]) {
          cells[r][c] = { letter: w.word[i], userInput: '', wordIds: [], num: 0, isStart: false };
        }
        cells[r][c].wordIds.push(idx);
        wordCells.push({ r, c });
      }
      const first = wordCells[0];
      cells[first.r][first.c].isStart = true;
      words.push({
        id: idx,
        word: w.word,
        clue: w.clue,
        row: w.row,
        col: w.col,
        dir: w.dir,
        cells: wordCells,
        solved: false,
      });
    });

    // Numerar células de início (na ordem leitura)
    let n = 1;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (cells[r][c] && cells[r][c].isStart) {
          cells[r][c].num = n;
          // marcar n também no objeto da palavra que começa aqui
          words.forEach(w => {
            if (w.row === r && w.col === c) w.startNum = n;
          });
          n++;
        }
      }
    }
  }

  function renderGrid() {
    const size = currentPuzzle.size;
    const grid = document.getElementById('grid');
    grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    grid.style.maxWidth = `min(${size * 50}px, 95vw)`;
    grid.innerHTML = '';
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const el = document.createElement('div');
        el.className = 'cell';
        const cell = cells[r][c];
        if (cell) {
          el.classList.add('white');
          el.dataset.r = r; el.dataset.c = c;
          if (cell.num) {
            const numEl = document.createElement('span');
            numEl.className = 'num';
            numEl.textContent = cell.num;
            el.appendChild(numEl);
          }
          const letterEl = document.createElement('span');
          letterEl.textContent = cell.userInput || '';
          el.appendChild(letterEl);
          el.addEventListener('click', () => handleCellTap(r, c));
        }
        grid.appendChild(el);
      }
    }
  }

  function updateCellsClasses() {
    const allCells = document.querySelectorAll('.cell.white');
    const word = words[activeWordId];
    const wordSet = new Set(word.cells.map(c => c.r * 100 + c.c));
    allCells.forEach(el => {
      const r = +el.dataset.r, c = +el.dataset.c;
      const cell = cells[r][c];
      const key = r * 100 + c;
      el.classList.remove('selected', 'in-word', 'correct');
      // Letra display
      const letterSpan = el.querySelector('span:not(.num)');
      if (letterSpan) letterSpan.textContent = cell.userInput || '';
      // Estado de cor
      if (activeCell && activeCell.r === r && activeCell.c === c) {
        el.classList.add('selected');
      } else if (wordSet.has(key)) {
        el.classList.add('in-word');
      }
      // Marca correto se TODAS palavras desta cell estão solved
      const allWordsSolved = cell.wordIds.every(wid => words[wid].solved);
      if (allWordsSolved) el.classList.add('correct');
    });
  }

  function setActiveWord(wid) {
    activeWordId = wid;
    const w = words[wid];
    // Primeira célula vazia da palavra (ou primeira mesmo)
    const firstEmpty = w.cells.find(({r,c}) => !cells[r][c].userInput) || w.cells[0];
    activeCell = firstEmpty;
    document.getElementById('cluePrefix').textContent = `${w.startNum} ${w.dir === 'A' ? '→' : '↓'}`;
    document.getElementById('clueText').textContent = w.clue;
    updateCellsClasses();
  }

  function handleCellTap(r, c) {
    ensureAudio();
    sndTap();
    const cell = cells[r][c];
    if (!cell) return;
    // Se há múltiplas palavras na célula, alterna
    if (cell.wordIds.length > 1 && activeCell && activeCell.r === r && activeCell.c === c) {
      const idx = cell.wordIds.indexOf(activeWordId);
      const next = cell.wordIds[(idx + 1) % cell.wordIds.length];
      activeWordId = next;
    } else if (!cell.wordIds.includes(activeWordId)) {
      activeWordId = cell.wordIds[0];
    }
    activeCell = { r, c };
    const w = words[activeWordId];
    document.getElementById('cluePrefix').textContent = `${w.startNum} ${w.dir === 'A' ? '→' : '↓'}`;
    document.getElementById('clueText').textContent = w.clue;
    updateCellsClasses();
  }

  function typeLetter(letter) {
    if (!activeCell) return;
    const cell = cells[activeCell.r][activeCell.c];
    if (!cell) return;
    ensureAudio();
    sndKey();
    cell.userInput = letter.toUpperCase();
    // Avançar pra próxima célula da palavra ativa
    const w = words[activeWordId];
    const idx = w.cells.findIndex(c => c.r === activeCell.r && c.c === activeCell.c);
    // Próxima célula vazia na palavra
    let nextIdx = idx + 1;
    while (nextIdx < w.cells.length) {
      const nc = w.cells[nextIdx];
      if (!cells[nc.r][nc.c].userInput) break;
      nextIdx++;
    }
    if (nextIdx < w.cells.length) {
      activeCell = w.cells[nextIdx];
    }
    checkWord(activeWordId);
    updateCellsClasses();
    checkWin();
  }

  function deleteLetter() {
    if (!activeCell) return;
    const cell = cells[activeCell.r][activeCell.c];
    if (!cell) return;
    ensureAudio();
    sndKey();
    if (cell.userInput) {
      cell.userInput = '';
    } else {
      // Volta uma célula
      const w = words[activeWordId];
      const idx = w.cells.findIndex(c => c.r === activeCell.r && c.c === activeCell.c);
      if (idx > 0) {
        activeCell = w.cells[idx - 1];
        cells[activeCell.r][activeCell.c].userInput = '';
      }
    }
    // Reset estado solved da palavra se foi unsolved
    const w = words[activeWordId];
    w.solved = false;
    updateCellsClasses();
  }

  function checkWord(wid) {
    const w = words[wid];
    const typed = w.cells.map(({r,c}) => cells[r][c].userInput).join('');
    if (typed === w.word) {
      if (!w.solved) {
        w.solved = true;
        sndOk();
      }
    } else {
      w.solved = false;
    }
  }

  function checkWin() {
    if (words.every(w => w.solved)) {
      setTimeout(endPuzzle, 600);
    }
  }

  function useHint() {
    if (!activeCell) return;
    const cell = cells[activeCell.r][activeCell.c];
    if (!cell || cell.userInput === cell.letter) {
      // já tá certo, tentar achar uma vazia
      const w = words[activeWordId];
      const empty = w.cells.find(({r,c}) => cells[r][c].userInput !== cells[r][c].letter);
      if (!empty) return;
      activeCell = empty;
    }
    const target = cells[activeCell.r][activeCell.c];
    target.userInput = target.letter;
    hintsUsed++;
    document.getElementById('hintsUsedNum').textContent = hintsUsed;
    sndHint();
    // valida todas palavras desta cell
    target.wordIds.forEach(wid => checkWord(wid));
    updateCellsClasses();
    checkWin();
  }

  function endPuzzle() {
    sndWin();
    let earned = 3;
    if (hintsUsed >= 3) earned = 1;
    else if (hintsUsed >= 1) earned = 2;
    saveStars(currentStage, earned);
    refreshMenu();

    document.getElementById('endEmoji').textContent = earned === 3 ? '🏆' : (earned === 2 ? '🎉' : '👍');
    document.getElementById('endTitle').textContent = earned === 3 ? 'PERFEITO!' : 'Resolveu!';
    document.getElementById('endScore').textContent =
      hintsUsed === 0 ? 'Sem dicas!' : `${hintsUsed} dica${hintsUsed === 1 ? '' : 's'} usada${hintsUsed === 1 ? '' : 's'}`;
    const es = document.getElementById('earnedStars');
    es.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      es.appendChild(s);
    }
    const nextBtn = document.getElementById('nextBtn');
    if (currentStage < PUZZLES.length - 1) {
      nextBtn.textContent = 'Próxima';
      nextBtn.style.display = '';
      nextBtn.onclick = () => { sndTap(); startPuzzle(currentStage + 1); };
    } else {
      nextBtn.style.display = 'none';
    }
    showScreen(endScreen);
  }

  // =========== TECLADO ===========
  function renderKeyboard() {
    const rows = [
      ['Q','W','E','R','T','Y','U','I','O','P'],
      ['A','S','D','F','G','H','J','K','L'],
      ['HINT','Z','X','C','V','B','N','M','BACK'],
    ];
    const kb = document.getElementById('keyboard');
    kb.innerHTML = '';
    rows.forEach(row => {
      const rEl = document.createElement('div');
      rEl.className = 'keyRow';
      row.forEach(k => {
        const btn = document.createElement('button');
        btn.className = 'key';
        if (k === 'HINT') {
          btn.classList.add('wide', 'hint');
          btn.textContent = '💡';
          btn.addEventListener('click', useHint);
        } else if (k === 'BACK') {
          btn.classList.add('wide', 'back');
          btn.textContent = '⌫';
          btn.addEventListener('click', deleteLetter);
        } else {
          btn.textContent = k;
          btn.addEventListener('click', () => typeLetter(k));
        }
        rEl.appendChild(btn);
      });
      kb.appendChild(rEl);
    });
  }

  // Navegação entre dicas (palavras)
  document.getElementById('prevClueBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    setActiveWord((activeWordId - 1 + words.length) % words.length);
  });
  document.getElementById('nextClueBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    setActiveWord((activeWordId + 1) % words.length);
  });

  // Teclado físico (desktop)
  window.addEventListener('keydown', (e) => {
    if (gameScreen.classList.contains('hidden')) return;
    if (e.key === 'Backspace') { deleteLetter(); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      // próxima célula vazia
      const w = words[activeWordId];
      const idx = w.cells.findIndex(c => c.r === activeCell.r && c.c === activeCell.c);
      if (idx + 1 < w.cells.length) {
        activeCell = w.cells[idx + 1];
        updateCellsClasses();
      }
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      const w = words[activeWordId];
      const idx = w.cells.findIndex(c => c.r === activeCell.r && c.c === activeCell.c);
      if (idx > 0) {
        activeCell = w.cells[idx - 1];
        updateCellsClasses();
      }
    } else if (/^[a-zA-Z]$/.test(e.key)) {
      typeLetter(e.key);
    }
  });

  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    showScreen(menuScreen);
  });

  // NAVEGAÇÃO (back + home)
  (function setupNav() {
    const backEl = document.getElementById('backBtn');
    const homeEl = document.getElementById('homeBtn');
    function goHub() { parent.postMessage('back-to-hub', '*'); }
    function tap() { if (typeof ensureAudio === 'function') ensureAudio(); if (typeof sndTap === 'function') sndTap(); }
    if (backEl) backEl.addEventListener('click', () => {
      tap();
      const menu = document.getElementById('menuScreen');
      if (!menu || !menu.classList.contains('hidden')) { goHub(); return; }
      if (typeof showScreen === 'function') showScreen(menu);
      else { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); menu.classList.remove('hidden'); }
    });
    if (homeEl) homeEl.addEventListener('click', () => { tap(); goHub(); });
  })();

})();

      const prog = document.querySelector('.card[data-game="' + game + '"] .progress');
      if (prog) {
        const bar = prog.querySelector('div');
        if (stars > 0) {

        pianoP.classList.add('show');
        bar.style.width = Math.max(5, (pianoS / 3) * 100) + '%';

    // Sudoku: 3 sizes × 3 diffs
    let sudokuS = 0;

      sudokuS += +(localStorage.getItem('blg-sudoku-' + sz + '-' + df + '-stars') || 0);
    }
    const sudokuP = document.querySelector('.card[data-game="sudoku"] .progress');
    if (sudokuP) {
      const bar = sudokuP.querySelector('div');
      if (sudokuS > 0) {
        sudokuP.classList.add('show');
        bar.style.width = Math.max(5, (sudokuS / 27) * 100) + '%';
      }
    }
    // RPG: 1 valor único
    const rpgS = +(localStorage.getItem('blg-rpg-best-stars') || 0);
    const rpgP = document.querySelector('.card[data-game="rpg"] .progress');
    if (rpgP) {
      const bar = rpgP.querySelector('div');
      if (rpgS > 0) {
        rpgP.classList.add('show');
        bar.style.width = Math.max(5, (rpgS / 3) * 100) + '%';
      }
    }
  };

  .iconBtn { width:46px; height:46px; border:none; background:rgba(255,255,255,.15); color:#fff; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .15s; }
  .iconBtn:active { transform:scale(.9); }
  .infoBar { display:flex; align-items:center; gap:14px; background:rgba(0,0,0,.4); padding:8px 14px; border-radius:999px; font-size:13px; font-weight:700; }
  .infoBar .num { color:#fde047; font-weight:900; font-size:15px; }

  .screen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .screen.hidden { display:none; }

  /* MENU */
  #menuScreen h1 { font-size:clamp(28px, 8vw, 40px); font-weight:900; margin-bottom:6px; background:linear-gradient(90deg,#fde047,#ec4899); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #menuScreen .sub { opacity:.85; font-size:14px; margin-bottom:24px; text-align:center; padding:0 20px; }
  .levelGrid { display:flex; flex-direction:column; gap:14px; width:100%; max-width:340px; }
  .levelCard { background:rgba(0,0,0,.3); border:2px solid rgba(253,224,71,.5); border-radius:18px; padding:18px 20px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:transform .15s; }
  .levelCard:active { transform:scale(.97); }
  .levelCard .lvlIcon { font-size:38px; line-height:1; }
  .levelCard .lvlInfo { flex:1; }
  .levelCard .lvlName { font-size:18px; font-weight:800; }
  .levelCard .lvlRange { font-size:12px; opacity:.7; margin-top:2px; }
  .levelCard .lvlStars { display:flex; gap:2px; font-size:20px; }
  .levelCard .lvlStars .s { opacity:.25; }
  .levelCard .lvlStars .s.lit { opacity:1; filter:drop-shadow(0 0 4px #ffd700); }

  /* JOGO */
  #gameScreen { padding:0; justify-content:flex-start; }
  #gameCanvas { width:100%; flex:1; display:block; cursor:pointer; }

  /* FIM */
  #endScreen { text-align:center; padding:20px; background:rgba(0,0,0,.5); }
  #endScreen .bigEmoji { font-size:88px; line-height:1; margin-bottom:14px; animation:bounce .8s; }
  @keyframes bounce { 0% { transform:scale(0); } 60% { transform:scale(1.2); } 100% { transform:scale(1); } }
  #endScreen h2 { font-size:24px; margin-bottom:8px; }
  #endScreen .score { font-size:14px; margin:8px 0 4px; }
  #endScreen .score .big { font-size:42px; font-weight:900; color:#fde047; display:block; margin-top:4px; }
  #endScreen .best { font-size:13px; opacity:.7; margin-bottom:14px; }
  #endScreen .earnedStars { font-size:50px; margin:10px 0 20px; letter-spacing:6px; }
  #endScreen .earnedStars .s { opacity:.25; display:inline-block; }
  #endScreen .earnedStars .s.lit { opacity:1; filter:drop-shadow(0 0 12px #ffd700); }
  #endScreen .btnRow { display:flex; gap:10px; max-width:340px; width:100%; }
  #endScreen button { flex:1; padding:14px; font-size:14px; font-weight:800; border:none; border-radius:14px; cursor:pointer; color:#fff; }
  #endScreen button:active { transform:scale(.96); }
  .primaryBtn { background:linear-gradient(90deg,#ec4899,#dc2626); }
  .secondaryBtn { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2) !important; }

  .timer { position:absolute; top:60px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.5); padding:6px 16px; border-radius:99px; font-weight:900; font-size:18px; color:#fde047; z-index:6; font-variant-numeric:tabular-nums; }
  .timer.warn { color:#fb923c; }
  .timer.crit { color:#ef4444; animation:pulse .5s infinite; }
  @keyframes pulse { 50% { transform:translateX(-50%) scale(1.15); } }
</style>
</head>
<body>

<div id="stage">
  <header>
    <button class="iconBtn" id="backBtn" aria-label="Voltar">←</button>
    <div class="infoBar">🎈 <span class="num" id="scoreNum">0</span></div>
    <button class="iconBtn" id="homeBtn" aria-label="Início">🏠</button>
    <button class="iconBtn" id="muteBtn">🔊</button>
  </header>

  <!-- MENU -->
  <div id="menuScreen" class="screen">
    <h1>Estourar Balões</h1>
    <div class="sub">Toque rápido nos balões pra estourar!</div>
    <div class="levelGrid">
      <div class="levelCard" data-lvl="0">
        <div class="lvlIcon">🌱</div>
        <div class="lvlInfo">
          <div class="lvlName">Calmo</div>
          <div class="lvlRange">Balões devagar</div>
        </div>
        <div class="lvlStars" id="stars0"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
      <div class="levelCard" data-lvl="1">
        <div class="lvlIcon">⚡</div>
        <div class="lvlInfo">
          <div class="lvlName">Médio</div>
          <div class="lvlRange">Mais balões</div>
        </div>
        <div class="lvlStars" id="stars1"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
      <div class="levelCard" data-lvl="2">
        <div class="lvlIcon">🔥</div>
        <div class="lvlInfo">
          <div class="lvlName">Caótico</div>
          <div class="lvlRange">Tudo voando!</div>
        </div>
        <div class="lvlStars" id="stars2"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
      <div class="levelCard" data-lvl="3">
        <div class="lvlIcon">⚠️</div>
        <div class="lvlInfo">
          <div class="lvlName">Cuidado</div>
          <div class="lvlRange">Não toca nas estrelas pretas!</div>
        </div>
        <div class="lvlStars" id="stars3"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
      <div class="levelCard" data-lvl="4">
        <div class="lvlIcon">💀</div>
        <div class="lvlInfo">
          <div class="lvlName">Perigo</div>
          <div class="lvlRange">Mais estrelas, mais rápido</div>
        </div>
        <div class="lvlStars" id="stars4"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
      <div class="levelCard" data-lvl="5">
        <div class="lvlIcon">☠️</div>
        <div class="lvlInfo">
          <div class="lvlName">Caos</div>
          <div class="lvlRange">O nível mais difícil</div>
        </div>
        <div class="lvlStars" id="stars5"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
    </div>
  </div>

  <!-- JOGO -->
  <div id="gameScreen" class="screen hidden">
    <div class="timer" id="timerEl">1:00</div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- FIM -->
  <div id="endScreen" class="screen hidden">
    <div class="bigEmoji" id="endEmoji">🎉</div>
    <h2 id="endTitle">Acabou!</h2>
    <div class="score">Estourou<span class="big" id="finalScore">0</span></div>
    <div class="best" id="bestMsg"></div>
    <div class="earnedStars" id="earnedStars"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
    <div class="btnRow">
      <button class="secondaryBtn" id="backMenuBtn">Voltar</button>
      <button class="primaryBtn" id="playAgainBtn">Jogar de novo</button>
    </div>
  </div>
</div>

<script>
(() => {
  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndPop(value=1) {
    const base = value === 5 ? 1200 : (value === 2 ? 880 : 660);
    beep(base, 0.06, 'triangle', 0.07);
    setTimeout(() => beep(base * 1.5, 0.08, 'triangle', 0.05), 30);
  }
  function sndBad()  { beep(180, 0.18, 'sawtooth', 0.08); setTimeout(() => beep(110, 0.20, 'sawtooth', 0.07), 70); }
  function sndTap()  { beep(660, 0.04, 'triangle', 0.05); }
  function sndTick() { beep(800, 0.04, 'square', 0.03); }
  function sndWin()  { [523, 659, 784, 880, 1047, 1318].forEach((f, i) => beep(f, 0.15, 'triangle', 0.06, i*0.08)); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  const LEVELS = [
    { name:'Calmo',    spawnMs:1500, minSpeed:0.6, maxSpeed:1.2, time:60, badRate:0,    goal3:15, goal2:8,  goal1:3  },
    { name:'Médio',    spawnMs:900,  minSpeed:0.9, maxSpeed:1.8, time:60, badRate:0,    goal3:25, goal2:14, goal1:6  },
    { name:'Caótico',  spawnMs:550,  minSpeed:1.3, maxSpeed:2.6, time:60, badRate:0,    goal3:40, goal2:22, goal1:10 },
    { name:'Cuidado',  spawnMs:900,  minSpeed:0.9, maxSpeed:1.8, time:60, badRate:0.20, goal3:25, goal2:14, goal1:5  },
    { name:'Perigo',   spawnMs:700,  minSpeed:1.1, maxSpeed:2.2, time:60, badRate:0.28, goal3:30, goal2:17, goal1:6  },
    { name:'Caos',     spawnMs:500,  minSpeed:1.4, maxSpeed:2.8, time:60, badRate:0.35, goal3:38, goal2:22, goal1:8  },
  ];

  // BALÕES BONS
  const NORMAL_TYPES = [
    { color:'#3b82f6', stroke:'#1e40af', value:1, weight:60, shape:'oval' },
    { color:'#ec4899', stroke:'#9d174d', value:2, weight:30, shape:'oval' },
    { color:'#fde047', stroke:'#a16207', value:5, weight:10, shape:'oval' },
  ];
  // BALÕES "EVITAR" — formato de estrela com X
  const BAD_TYPES = [
    { color:'#1f2937', stroke:'#7f1d1d', value:-3, shape:'star' },
  ];
  function pickType(badRate) {
    if (badRate > 0 && Math.random() < badRate) return BAD_TYPES[0];
    const total = NORMAL_TYPES.reduce((s, t) => s + t.weight, 0);
    let r = Math.random() * total;
    for (const t of NORMAL_TYPES) { r -= t.weight; if (r < 0) return t; }
    return NORMAL_TYPES[0];
  }

  // STATS
  function getStars(l) { return +(localStorage.getItem('blg-balloons-stars-' + l) || 0); }
  function saveStars(l, n) { if (n > getStars(l)) localStorage.setItem('blg-balloons-stars-' + l, n); }
  function getBest(l) { return +(localStorage.getItem('blg-balloons-best-' + l) || 0); }
  function saveBest(l, s) { if (s > getBest(l)) localStorage.setItem('blg-balloons-best-' + l, s); }
  function refreshMenu() {
    for (let i = 0; i < 6; i++) {
      const s = getStars(i);
      const ct = document.getElementById('stars' + i);
      if (!ct) continue;
      ct.querySelectorAll('.s').forEach((el, idx) => el.classList.toggle('lit', idx < s));
    }
  }
  refreshMenu();

  // STATE
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let currentLevel = 0, balloons = [], particles = [], score = 0, timeLeft = 0;
  let running = false, lastSpawn = 0, lastTime = 0, timerId = null;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      showScreen(gameScreen);
      setTimeout(() => { resize(); startGame(); }, 50);
    });
  });

  function startGame() {
    balloons = []; particles = []; score = 0;
    const lvl = LEVELS[currentLevel];
    timeLeft = lvl.time;
    updateTimer();
    document.getElementById('scoreNum').textContent = '0';
    running = true;
    lastSpawn = 0;
    lastTime = performance.now();
    if (timerId) clearInterval(timerId);
    timerId = setInterval(() => {
      timeLeft--;
      updateTimer();
      if (timeLeft <= 5 && timeLeft > 0) sndTick();
      if (timeLeft <= 0) endGame();
    }, 1000);
    requestAnimationFrame(loop);
  }

  function updateTimer() {
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    const t = document.getElementById('timerEl');
    t.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    t.classList.toggle('warn', timeLeft <= 15 && timeLeft > 5);
    t.classList.toggle('crit', timeLeft <= 5);
  }

  function spawnBalloon() {
    const lvl = LEVELS[currentLevel];
    const type = pickType(lvl.badRate);
    const size = 38 + Math.random() * 8;
    balloons.push({
      x: 40 + Math.random() * (W - 80),
      y: H + size,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -(lvl.minSpeed + Math.random() * (lvl.maxSpeed - lvl.minSpeed)),
      r: size,
      type,
      wobble: Math.random() * Math.PI * 2,
    });
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(2, (now - lastTime) / 16.67);
    lastTime = now;
    lastSpawn += (now - (lastTime - dt * 16.67));  // delta in ms
    update(dt, now);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt, now) {
    const lvl = LEVELS[currentLevel];
    // Spawn
    if (!update.lastSpawnTime) update.lastSpawnTime = now;
    if (now - update.lastSpawnTime > lvl.spawnMs) {
      spawnBalloon();
      update.lastSpawnTime = now;
    }
    // Move balloons
    for (const b of balloons) {
      b.wobble += 0.04;
      b.x += b.vx * dt + Math.sin(b.wobble) * 0.3;
      b.y += b.vy * dt;
    }
    // Remove off-screen
    balloons = balloons.filter(b => b.y > -b.r * 2.5);
    // Particles
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 0.15 * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function render() {
    // limpa
    ctx.clearRect(0, 0, W, H);
    // balões
    for (const b of balloons) {
      if (b.type.shape === 'star') {
        drawBadStar(b);
      } else {
        drawOvalBalloon(b);
      }
    }
    // particles
    for (const p of particles) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.min(1, p.life / 30);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawOvalBalloon(b) {
    // string
    ctx.strokeStyle = 'rgba(255,255,255,.3)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y + b.r);
    ctx.quadraticCurveTo(b.x + 6, b.y + b.r + 20, b.x, b.y + b.r + 35);
    ctx.stroke();
    // corpo
    const grad = ctx.createRadialGradient(b.x - b.r/3, b.y - b.r/3, b.r * 0.1, b.x, b.y, b.r);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.3, b.type.color);
    grad.addColorStop(1, b.type.stroke);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, b.r * 0.85, b.r, 0, 0, Math.PI*2);
    ctx.fill();
    // nó embaixo
    ctx.fillStyle = b.type.stroke;
    ctx.beginPath();
    ctx.moveTo(b.x - 4, b.y + b.r - 2);
    ctx.lineTo(b.x + 4, b.y + b.r - 2);
    ctx.lineTo(b.x, b.y + b.r + 5);
    ctx.closePath();
    ctx.fill();
  }

  function drawBadStar(b) {
    const cx = b.x, cy = b.y, outer = b.r * 0.95, inner = b.r * 0.42;
    const n = 5;
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 === 0 ? outer : inner;
      const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    // gradiente perigoso
    const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, outer);
    grad.addColorStop(0, '#374151');
    grad.addColorStop(1, '#000');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = b.type.stroke;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    // X vermelho no centro pra indicar "NÃO TOCAR"
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 3.5;
    const xs = outer * 0.32;
    ctx.beginPath();
    ctx.moveTo(cx - xs, cy - xs);
    ctx.lineTo(cx + xs, cy + xs);
    ctx.moveTo(cx + xs, cy - xs);
    ctx.lineTo(cx - xs, cy + xs);
    ctx.stroke();
  }

  function popBalloon(b, tapX, tapY) {
    const isBad = b.type.value < 0;
    if (isBad) sndBad(); else sndPop(b.type.value);
    score = Math.max(0, score + b.type.value);
    document.getElementById('scoreNum').textContent = score;
    // explosão de partículas
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      particles.push({
        x: b.x, y: b.y,
        vx: Math.cos(a) * (2 + Math.random() * 3),
        vy: Math.sin(a) * (2 + Math.random() * 3) - 1,
        size: 3 + Math.random() * 3,
        color: b.type.color,
        life: 25 + Math.random() * 15,
      });
    }
    balloons = balloons.filter(x => x !== b);
  }

  function handleTap(e) {
    if (!running) return;
    ensureAudio();
    const rect = canvas.getBoundingClientRect();
    const evs = e.touches ? Array.from(e.changedTouches) : [e];
    for (const ev of evs) {
      const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
      // Verifica colisão (do mais próximo do topo pra baixo)
      for (const b of [...balloons].reverse()) {
        const dx = x - b.x, dy = y - b.y;
        const inside = (dx*dx) / (b.r * 0.85 * b.r * 0.85) + (dy*dy) / (b.r * b.r) <= 1.0;
        if (inside) { popBalloon(b, x, y); break; }
      }
    }
  }

  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(e); }, { passive:false });
  canvas.addEventListener('mousedown', handleTap);

  function endGame() {
    running = false;
    clearInterval(timerId);
    sndWin();
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, score);
    let earned = 0;
    if (score >= lvl.goal3) earned = 3;
    else if (score >= lvl.goal2) earned = 2;
    else if (score >= lvl.goal1) earned = 1;
    saveStars(currentLevel, earned);
    refreshMenu();

    document.getElementById('finalScore').textContent = score;
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent = score >= best ? `🏆 Novo recorde!` : `Melhor: ${best}`;
    const es = document.getElementById('earnedStars');
    es.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      es.appendChild(s);
    }
    let emoji, title;
    if (earned === 3) { emoji = '🏆'; title = 'PERFEITO!'; }
    else if (earned === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else if (earned === 1) { emoji = '👍'; title = 'Bom!'; }
    else { emoji = '🎈'; title = 'Tenta de novo!'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;

    setTimeout(() => showScreen(endScreen), 700);
  }

  window.addEventListener('resize', () => { if (!gameScreen.classList.contains('hidden')) resize(); });

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    showScreen(gameScreen);
    setTimeout(() => { resize(); startGame(); }, 50);
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    running = false;
    if (timerId) clearInterval(timerId);
    showScreen(menuScreen);
  });

  // NAVEGAÇÃO (back + home)
  (function setupNav() {
    const backEl = document.getElementById('backBtn');
    const homeEl = document.getElementById('homeBtn');
    function goHub() { parent.postMessage('back-to-hub', '*'); }
    function tap() { if (typeof ensureAudio === 'function') ensureAudio(); if (typeof sndTap === 'function') sndTap(); }
    if (backEl) backEl.addEventListener('click', () => {
      tap();

<script>
(() => {
  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndTap()     { beep(660, 0.04, 'triangle', 0.05); }
  function sndCorrect() { [523, 659, 880, 1047].forEach((f, i) => beep(f, 0.12, 'triangle', 0.06, i*0.05)); }
  function sndWrong()   { beep(220, 0.18, 'sine', 0.06); setTimeout(() => beep(196, 0.18, 'sine', 0.05), 100); }
  function sndStar()    { beep(880, 0.08, 'triangle', 0.05); setTimeout(() => beep(1318, 0.10, 'triangle', 0.05), 50); }
  function sndWin()     { [523, 659, 784, 880, 1047, 1318].forEach((f, i) => beep(f, 0.18, 'triangle', 0.07, i*0.08)); }

  function speakText(text) {
    if (muted) return;
    if (!window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'pt-BR';
      u.rate = 0.9;
      u.pitch = 1.1;
      window.speechSynthesis.speak(u);
    } catch(e) {}
  }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // ANIMAIS
  const ANIMALS = {
    easy: [
      { name:'GATO', emoji:'🐱' },
      { name:'CACHORRO', emoji:'🐶' },
      { name:'VACA', emoji:'🐮' },
      { name:'PORCO', emoji:'🐷' },
      { name:'PATO', emoji:'🦆' },
      { name:'PEIXE', emoji:'🐟' },
      { name:'GALINHA', emoji:'🐔' },
      { name:'COELHO', emoji:'🐰' },
    ],
    medium: [
      { name:'LEÃO', emoji:'🦁' },
      { name:'URSO', emoji:'🐻' },
      { name:'ELEFANTE', emoji:'🐘' },
      { name:'MACACO', emoji:'🐵' },
      { name:'CAVALO', emoji:'🐴' },
      { name:'TIGRE', emoji:'🐯' },
      { name:'OVELHA', emoji:'🐑' },
      { name:'COBRA', emoji:'🐍' },
      { name:'SAPO', emoji:'🐸' },
      { name:'RATO', emoji:'🐭' },
      { name:'PANDA', emoji:'🐼' },
    ],
    hard: [
      { name:'DRAGÃO', emoji:'🐉' },
      { name:'UNICÓRNIO', emoji:'🦄' },
      { name:'POLVO', emoji:'🐙' },
      { name:'BORBOLETA', emoji:'🦋' },
      { name:'ABELHA', emoji:'🐝' },
      { name:'PINGUIM', emoji:'🐧' },
      { name:'CORUJA', emoji:'🦉' },
      { name:'TUBARÃO', emoji:'🦈' },
      { name:'JACARÉ', emoji:'🐊' },
      { name:'GIRAFA', emoji:'🦒' },
      { name:'ZEBRA', emoji:'🦓' },
      { name:'CAMELO', emoji:'🐫' },
      { name:'RAPOSA', emoji:'🦊' },
      { name:'CANGURU', emoji:'🦘' },
      { name:'FLAMINGO', emoji:'🦩' },
    ],
  };
  const LEVELS = [
    { name:'Fácil',   pool:ANIMALS.easy,                                opts:3 },
    { name:'Médio',   pool:[...ANIMALS.easy, ...ANIMALS.medium],         opts:3 },
    { name:'Difícil', pool:[...ANIMALS.medium, ...ANIMALS.hard],         opts:3 },
  ];
  const Q_PER_ROUND = 10;

  // STATS
  function getStars(l) { return +(localStorage.getItem('blg-animal-stars-' + l) || 0); }
  function saveStars(l, n) { if (n > getStars(l)) localStorage.setItem('blg-animal-stars-' + l, n); }
  function refreshMenu() {
    let totalStars = 0;
    for (let i = 0; i < 3; i++) {
      const s = getStars(i); totalStars += s;
      const ct = document.getElementById('stars' + i);
      ct.querySelectorAll('.s').forEach((el, idx) => el.classList.toggle('lit', idx < s));
    }
    document.getElementById('scoreNum').textContent = totalStars;
  }
  refreshMenu();

  // STATE
  let currentLevel = 0, currentQ = 0, correct = 0, firstTryWrong = false, currentAnimal = null;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      startRound();
    });
  });

  function startRound() {
    currentQ = 0; correct = 0;
    showScreen(gameScreen);
    nextQuestion();
  }

  function nextQuestion() {
    if (currentQ >= Q_PER_ROUND) { endRound(); return; }
    firstTryWrong = false;
    const lvl = LEVELS[currentLevel];
    const pool = lvl.pool;
    currentAnimal = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById('questionWord').textContent = currentAnimal.name;
    document.getElementById('progressFill').style.width = ((currentQ / Q_PER_ROUND) * 100) + '%';

    // gera 3 opções
    const opts = new Set([currentAnimal]);
    while (opts.size < lvl.opts) {
      const cand = pool[Math.floor(Math.random() * pool.length)];
      opts.add(cand);
    }
    const arr = Array.from(opts).sort(() => Math.random() - 0.5);
    const grid = document.getElementById('optionsGrid');
    grid.className = 'options' + (lvl.opts === 2 ? ' cols2' : '');
    grid.innerHTML = '';
    arr.forEach(animal => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = animal.emoji;
      btn.addEventListener('click', () => handleAnswer(btn, animal));
      grid.appendChild(btn);
    });

    speakText(currentAnimal.name);
  }

  function handleAnswer(btn, chosen) {
    ensureAudio();
    if (chosen === currentAnimal) {
      sndCorrect();
      btn.classList.add('correct');
      document.querySelectorAll('.opt').forEach(b => b.classList.add('disabled'));
      showConfetti(btn);
      if (!firstTryWrong) {
        correct++;
        sndStar();
        const score = document.getElementById('scoreNum');
        const cur = +score.textContent;
        score.textContent = cur + 1;
      }
      setTimeout(() => { currentQ++; nextQuestion(); }, 1100);
    } else {
      sndWrong();
      btn.classList.add('wrong');
      firstTryWrong = true;
      setTimeout(() => {
        document.querySelectorAll('.opt').forEach(b => {
          if (b.textContent === currentAnimal.emoji) b.classList.add('correct');
        });
      }, 400);
      btn.classList.add('disabled');
    }
  }

  function showConfetti(originBtn) {
    const rect = originBtn.getBoundingClientRect();
    const emojis = ['⭐', '✨', '🎉', '💫', '🌟'];
    for (let i = 0; i < 10; i++) {
      const c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      c.style.left = (rect.left + rect.width/2) + 'px';
      c.style.top = (rect.top + rect.height/2) + 'px';
      c.style.setProperty('--dx', ((Math.random() - 0.5) * 280) + 'px');
      c.style.animationDuration = (1 + Math.random() * 0.7) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2100);
    }
  }

  function endRound() {
    showScreen(endScreen);
    sndWin();
    const pct = correct / Q_PER_ROUND;
    let earned = 0;
    if (pct >= 1) earned = 3;
    else if (pct >= 0.8) earned = 2;
    else if (pct >= 0.6) earned = 1;
    saveStars(currentLevel, earned);
    refreshMenu();

    document.getElementById('endScore').textContent = `Acertou ${correct} de ${Q_PER_ROUND}`;
    const es = document.getElementById('earnedStars');
    es.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      es.appendChild(s);
    }

(() => {
  // AUDIO
  let audioCtx = null;

  function beep(freq, dur=0.08, type='sine', vol=0.04, when=0) {

    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);

    o.start(t); o.stop(t + dur);
