          '<div class="dName">' + diff + '</div>' +
          '<div class="dStars">' + [0,1,2].map(i => '<span class="s' + (i < stars ? ' lit' : '') + '">★</span>').join('') + '</div>';
        card.addEventListener('click', () => {
          ensureAudio(); sndTap();
          startPuzzle(size, diff);
        });
        ct.appendChild(card);
      }
    }
  }
  refreshMenu();

  // STATE
  let currentSize = 4, currentDiff = 'Fácil', currentPuzzle = null;
  let n = 4, boxH = 2, boxW = 2;
  let grid = [], candidates = [], given = [];
  let solution = [];
  let selected = -1;
  let hintsUsed = 0, errors = 0;
  let history = [];
  let mode = 'number'; // 'number' or 'candidate'
  let startTime = 0, timerInterval = null, elapsed = 0;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
    if (s === menuScreen) refreshMenu();
  }

  function startPuzzle(size, diff) {
    // sortear puzzle
    const pool = PUZZLES.filter(p => p.size === size && p.difficulty === diff);
    if (pool.length === 0) return;
    currentPuzzle = pool[Math.floor(Math.random() * pool.length)];
    currentSize = size; currentDiff = diff;
    n = size; boxH = currentPuzzle.boxH; boxW = currentPuzzle.boxW;
    grid = []; given = []; candidates = [];
    for (let i = 0; i < n * n; i++) {
      const c = currentPuzzle.puzzle[i];
      const v = c === '.' ? 0 : parseInt(c, 10);
      grid.push(v);
      given.push(v !== 0);
      candidates.push(new Set());
    }
    solution = currentPuzzle.solution.split('').map(c => parseInt(c, 10));
    selected = -1; hintsUsed = 0; errors = 0;
    history = []; mode = 'number';
    document.getElementById('candBtn').classList.remove('active');
    document.getElementById('hintsVal').textContent = '0';
    document.getElementById('hintsVal').className = 'val';
    document.getElementById('errorsVal').textContent = '0';
    document.getElementById('errorsVal').className = 'val';
    document.getElementById('headerText').textContent = size + '×' + size + ' ' + diff;
    // numpad
    const pad = document.getElementById('numPad');
    pad.className = 'numPad size' + size;
    pad.innerHTML = '';
    for (let v = 1; v <= size; v++) {
      const b = document.createElement('button');
      b.className = 'numBtn';
      b.textContent = v;
      b.addEventListener('click', () => { ensureAudio(); pressNumber(v); });
      pad.appendChild(b);
    }
    showScreen(gameScreen);
    startTime = Date.now(); elapsed = 0;
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
    updateTimer();
    setTimeout(() => { resize(); render(); }, 30);
  }

  function updateTimer() {
    elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    document.getElementById('timerVal').textContent = m + ':' + s.toString().padStart(2, '0');
  }

  // CANVAS
  const canvas = document.getElementById('gridCanvas');
  const ctx = canvas.getContext('2d');
  let CELL = 0, GW = 0;
  function resize() {
    const wrap = document.getElementById('gridWrap');
    const r = wrap.getBoundingClientRect();
    const maxW = r.width - 8;
    const maxH = r.height - 8;
    CELL = Math.floor(Math.min(maxW, maxH) / n);
    GW = CELL * n;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = GW * dpr; canvas.height = GW * dpr;
    canvas.style.width = GW + 'px'; canvas.style.height = GW + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function getCellInfo(idx) {
    const r = Math.floor(idx / n);
    const c = idx % n;
    return { r, c, x: c * CELL, y: r * CELL };
  }

  function getPeers(idx) {
    // retorna conjunto de indices peers (row, col, box, exceto self)
    const peers = new Set();
    const r = Math.floor(idx / n), c = idx % n;
    for (let cc = 0; cc < n; cc++) if (cc !== c) peers.add(r * n + cc);
    for (let rr = 0; rr < n; rr++) if (rr !== r) peers.add(rr * n + c);
    const br = Math.floor(r / boxH) * boxH;
    const bc = Math.floor(c / boxW) * boxW;
    for (let rr = br; rr < br + boxH; rr++) {
      for (let cc = bc; cc < bc + boxW; cc++) {
        if (rr !== r || cc !== c) peers.add(rr * n + cc);
      }
    }
    return peers;
  }

  function isConflict(idx, val) {
    if (val === 0) return false;
    const peers = getPeers(idx);
    for (const p of peers) {
      if (grid[p] === val) return true;
    }
    return false;
  }

  function render() {
    if (!CELL) return;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, GW, GW);

    // highlight selected + peers
    if (selected >= 0) {
      const info = getCellInfo(selected);
      const peers = getPeers(selected);
      // peers in light blue
      for (const p of peers) {
        const pi = getCellInfo(p);
        ctx.fillStyle = '#dbeafe';
        ctx.fillRect(pi.x, pi.y, CELL, CELL);
      }
      // same-value cells highlight
      const selV = grid[selected];
      if (selV > 0) {
        for (let i = 0; i < n * n; i++) {
          if (i !== selected && grid[i] === selV) {
            const ii = getCellInfo(i);
            ctx.fillStyle = '#bfdbfe';
            ctx.fillRect(ii.x, ii.y, CELL, CELL);
          }
        }
      }
      // selected cell
      ctx.fillStyle = '#93c5fd';
      ctx.fillRect(info.x, info.y, CELL, CELL);
    }

    // numbers
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < n * n; i++) {
      const info = getCellInfo(i);
      const cx = info.x + CELL / 2;
      const cy = info.y + CELL / 2;
      const v = grid[i];
      if (v > 0) {
        const conflicted = isConflict(i, v);
        if (given[i]) ctx.fillStyle = '#0c1426';
        else if (conflicted) ctx.fillStyle = '#dc2626';
        else ctx.fillStyle = '#2563eb';
        ctx.font = '900 ' + Math.floor(CELL * 0.55) + 'px -apple-system, sans-serif';
        ctx.fillText(v, cx, cy);
      } else if (candidates[i].size > 0) {
        // candidates em sub-grid
        ctx.fillStyle = '#94a3b8';
        const subW = boxW, subH = boxH;
        const sw = CELL / Math.max(subW, subH);
        ctx.font = '700 ' + Math.floor(CELL * 0.2) + 'px monospace';
        for (let v2 = 1; v2 <= n; v2++) {
          if (!candidates[i].has(v2)) continue;
          const ci = (v2 - 1) % subW;
          const ri = Math.floor((v2 - 1) / subW);
          const px = info.x + (ci + 0.5) * (CELL / subW);
          const py = info.y + (ri + 0.5) * (CELL / Math.ceil(n / subW));
          ctx.fillText(v2, px, py);
        }
      }
    }

    // grid lines
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1;
    for (let i = 0; i <= n; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, GW); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL); ctx.lineTo(GW, i * CELL); ctx.stroke();
    }
    // box borders mais grossas
    ctx.strokeStyle = '#0c1426';
    ctx.lineWidth = 2.5;
    for (let i = 0; i <= n; i += boxW) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, GW); ctx.stroke();
    }
    for (let i = 0; i <= n; i += boxH) {
      ctx.beginPath();
      ctx.moveTo(0, i * CELL); ctx.lineTo(GW, i * CELL); ctx.stroke();
    }
    // border externa
    ctx.lineWidth = 3;
    ctx.strokeRect(0, 0, GW, GW);
  }

  canvas.addEventListener('click', (e) => {
    ensureAudio();
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const c = Math.floor(x / CELL);
    const r = Math.floor(y / CELL);
    if (c < 0 || c >= n || r < 0 || r >= n) return;
    selected = r * n + c;
    render();
  });

  function pressNumber(v) {
    if (selected < 0) return;
    if (given[selected]) return;
    if (mode === 'candidate') {
      const cs = candidates[selected];
      // salva history ANTES da mudança
      history.push({ idx: selected, prevValue: grid[selected], prevCands: new Set(cs), prevGiven: given[selected], action: 'candidate' });
      if (cs.has(v)) cs.delete(v); else cs.add(v);
      sndPlace();
    } else {
      // salva history ANTES da mudança
      history.push({ idx: selected, prevValue: grid[selected], prevCands: new Set(candidates[selected]), prevGiven: given[selected], action: 'number' });
      grid[selected] = v;
      candidates[selected] = new Set();
      sndPlace();
      if (v !== solution[selected]) {
        errors++;
        document.getElementById('errorsVal').textContent = errors;
        document.getElementById('errorsVal').className = errors >= 5 ? 'val warn' : 'val';
        sndError();
      } else {
        checkWin();
      }
    }
    render();
  }

  function eraseCell() {
    if (selected < 0 || given[selected]) return;
    if (grid[selected] === 0 && candidates[selected].size === 0) return;
    history.push({ idx: selected, prevValue: grid[selected], prevCands: new Set(candidates[selected]), prevGiven: given[selected], action: 'erase' });
    grid[selected] = 0;
    candidates[selected].clear();
    sndUndo();
    render();
  }

  function undo() {
    if (history.length === 0) return;
    const h = history.pop();
    grid[h.idx] = h.prevValue;
    candidates[h.idx] = new Set(h.prevCands);
    if (h.prevGiven !== undefined) given[h.idx] = h.prevGiven;
    selected = h.idx;
    sndUndo();
    render();
  }

  function giveHint() {
    const candidatesIdx = [];
    for (let i = 0; i < n * n; i++) {
      if (!given[i] && grid[i] !== solution[i]) candidatesIdx.push(i);
    }
    if (candidatesIdx.length === 0) return;
    const idx = candidatesIdx[Math.floor(Math.random() * candidatesIdx.length)];
    history.push({ idx, prevValue: grid[idx], prevCands: new Set(candidates[idx]), prevGiven: given[idx], action: 'hint' });
    grid[idx] = solution[idx];
    candidates[idx].clear();
    given[idx] = true;
    hintsUsed++;
    document.getElementById('hintsVal').textContent = hintsUsed;
    document.getElementById('hintsVal').className = hintsUsed > 3 ? 'val warn' : 'val';
    selected = idx;
    sndHint();
    render();
    checkWin();
  }

  function checkWin() {
    for (let i = 0; i < n * n; i++) {
      if (grid[i] !== solution[i]) return;
    }
    // win!
    if (timerInterval) clearInterval(timerInterval);
    sndWin();
    let stars = 1;
    if (hintsUsed === 0) stars = 3;
    else if (hintsUsed <= 3) stars = 2;
    saveStars(currentSize, currentDiff, stars);
    saveBest(currentSize, currentDiff, elapsed);
    document.getElementById('finalTime').textContent = formatTime(elapsed);
    document.getElementById('finalHints').textContent = hintsUsed;
    const es = document.getElementById('earnedStars');
    es.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < stars ? ' lit' : '');
      s.textContent = '★';
      es.appendChild(s);
    }
    let emoji, title;
    if (stars === 3) { emoji = '🏆'; title = 'PERFEITO!'; }
    else if (stars === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else { emoji = '👍'; title = 'Completou!'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;
    setTimeout(() => showScreen(endScreen), 600);
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    return m + ':' + (s % 60).toString().padStart(2, '0');
  }

  // BUTTONS
  document.getElementById('candBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    mode = mode === 'candidate' ? 'number' : 'candidate';
    document.getElementById('candBtn').classList.toggle('active', mode === 'candidate');
  });
  document.getElementById('undoBtn').addEventListener('click', () => { ensureAudio(); undo(); });
  document.getElementById('eraseBtn').addEventListener('click', () => { ensureAudio(); eraseCell(); });
  document.getElementById('hintBtn').addEventListener('click', () => { ensureAudio(); giveHint(); });

  // KEYBOARD
  window.addEventListener('keydown', (e) => {
    if (gameScreen.classList.contains('hidden')) return;
    if (e.key >= '1' && e.key <= '9') {
      const v = parseInt(e.key, 10);
      if (v <= n) pressNumber(v);
    } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
      eraseCell();
    } else if (e.key === 'z' || e.key === 'Z') {
      undo();
    } else if (selected >= 0) {
      const r = Math.floor(selected / n), c = selected % n;
      if (e.key === 'ArrowLeft' && c > 0) { selected--; render(); }
      else if (e.key === 'ArrowRight' && c < n - 1) { selected++; render(); }
      else if (e.key === 'ArrowUp' && r > 0) { selected -= n; render(); }
      else if (e.key === 'ArrowDown' && r < n - 1) { selected += n; render(); }
    }
  });

  window.addEventListener('resize', () => { if (!gameScreen.classList.contains('hidden')) { resize(); render(); } });

  document.getElementById('backBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    if (timerInterval) clearInterval(timerInterval);
    if (!menuScreen.classList.contains('hidden')) {
      parent.postMessage('back-to-hub', '*');
    } else {
      showScreen(menuScreen);
    }
  });
  document.getElementById('newPuzzleBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    startPuzzle(currentSize, currentDiff);
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    if (timerInterval) clearInterval(timerInterval);
    showScreen(menuScreen);
  });


  // HOME button
  document.getElementById('homeBtn').addEventListener('click', () => {
    if (typeof ensureAudio === 'function') ensureAudio();
    if (typeof sndTap === 'function') sndTap();
    parent.postMessage('back-to-hub', '*');
  });

})();

<script>
  // Helper global pra atualizar progresso após voltar de jogo
  window.refreshHubStats = function() {
    // Dash
    let totalDone = 0, totalCoins = 0;
    for (let i = 0; i < 11; i++) {
      if (localStorage.getItem('cubo-dash-done-' + i) === '1') totalDone++;
      totalCoins += +(localStorage.getItem('cubo-dash-coins-' + i) || 0);
    }
    const td = document.getElementById('totalTrophies');
    const ts = document.getElementById('totalStars');
    if (td) td.textContent = totalDone + '/11';
    if (ts) ts.textContent = totalCoins + '/55';
    const dashProg = document.querySelector('.card[data-game="dash"] .progress');
    if (dashProg) {
      const bar = dashProg.querySelector('div');
      const pct = Math.round((totalDone * 100) / 11);
      if (pct > 0 || totalCoins > 0) {
        dashProg.classList.add('show');
        bar.style.width = Math.max(5, pct) + '%';
      }
    }
    // Outros jogos
    const games = [
      ['conta', 'blg-conta-stars-', 3, 9],
      ['memory', 'blg-memory-stars-', 4, 12],
      ['snake', 'blg-snake-stars-', 3, 9],
      ['letroca', 'blg-letroca-stars-', 3, 9],
      ['skyhop', 'blg-skyhop-stars-', 3, 9],
      ['platformer', 'blg-mario-stars-', 5, 15],
      ['cruzadas', 'blg-cruzadas-stars-', 6, 18],
      ['balloons', 'blg-balloons-stars-', 6, 18],
      ['animals', 'blg-animal-stars-', 3, 9],
      ['mole', 'blg-mole-stars-', 4, 12],
      ['g2048', 'blg-2048-stars-', 3, 9],
      ['tetris', 'blg-tetris-stars-', 3, 9],
      ['breakout', 'blg-breakout-stars-', 3, 9],
      ['race', 'blg-race-stars-', 5, 15],
      ['sokoban', 'blg-sokoban-stars-', 25, 75],
      ['invaders', 'blg-invaders-stars-', 3, 9],
      ['pacman', 'blg-pacman-stars-', 5, 15],
      ['tower', 'blg-tower-stars-', 3, 9],
    ];
    for (const [game, prefix, levels, max] of games) {
      let stars = 0;
      for (let i = 0; i < levels; i++) stars += +(localStorage.getItem(prefix + i) || 0);
      const prog = document.querySelector('.card[data-game="' + game + '"] .progress');
      if (prog) {
        const bar = prog.querySelector('div');
        if (stars > 0) {
          prog.classList.add('show');
          bar.style.width = Math.max(5, (stars / max) * 100) + '%';
        }
      }
    }
    // Piano: 1 valor único
    const pianoS = +(localStorage.getItem('blg-piano-stars') || 0);
    const pianoP = document.querySelector('.card[data-game="piano"] .progress');
    if (pianoP) {
      const bar = pianoP.querySelector('div');
      if (pianoS > 0) {
        pianoP.classList.add('show');
        bar.style.width = Math.max(5, (pianoS / 3) * 100) + '%';
      }
    }
    // Sudoku: 3 sizes × 3 diffs
    let sudokuS = 0;
    for (const sz of [4, 6, 9]) for (const df of ['Fácil', 'Médio', 'Difícil']) {
      sudokuS += +(localStorage.getItem('blg-sudoku-' + sz + '-' + df + '-stars') || 0);
    }
    const sudokuP = document.querySelector('.card[data-game="sudoku"] .progress');
    if (sudokuP) {
      const bar = sudokuP.querySelector('div');
      if (sudokuS > 0) {
        sudokuP.classList.add('show');
        bar.style.width = Math.max(5, (sudokuS / 27) * 100) + '%';
      }
    }
    // RPG: 1 valor único
    const rpgS = +(localStorage.getItem('blg-rpg-best-stars') || 0);
    const rpgP = document.querySelector('.card[data-game="rpg"] .progress');
    if (rpgP) {
      const bar = rpgP.querySelector('div');
      if (rpgS > 0) {
        rpgP.classList.add('show');
        bar.style.width = Math.max(5, (rpgS / 3) * 100) + '%';
      }
    }
  };

  #endScreen { text-align:center; padding:20px; justify-content:center; }
  #endScreen .bigEmoji { font-size:80px; line-height:1; margin-bottom:14px; animation:bounce .8s; }
  @keyframes bounce { 0% { transform:scale(0); } 60% { transform:scale(1.2); } 100% { transform:scale(1); } }
  #endScreen h2 { font-size:22px; margin-bottom:8px; font-family:monospace; letter-spacing:2px; }
  #endScreen .score { font-size:14px; margin:8px 0 4px; }
  #endScreen .score .big { font-size:42px; font-weight:900; color:#fbbf24; display:block; margin-top:4px; font-family:monospace; }
  #endScreen .best { font-size:13px; opacity:.7; margin-bottom:14px; }
  #endScreen .earnedStars { font-size:46px; margin:8px 0 18px; letter-spacing:6px; }
  #endScreen .earnedStars .s { opacity:.25; display:inline-block; }
  #endScreen .earnedStars .s.lit { opacity:1; filter:drop-shadow(0 0 12px #ffd700); }
  #endScreen .btnRow { display:flex; gap:10px; max-width:340px; width:100%; }
  #endScreen button { flex:1; padding:14px; font-size:14px; font-weight:800; border:none; border-radius:14px; cursor:pointer; color:#fff; }
  #endScreen button:active { transform:scale(.96); }
  .primaryBtn { background:linear-gradient(90deg,#fbbf24,#d97706); }
  .secondaryBtn { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2) !important; }
</style>
</head>
<body>

<div id="stage">
  <header>
    <button class="iconBtn" id="backBtn" aria-label="Voltar">←</button>
    <div class="hud">
      <span><span>SCORE</span> <span class="num" id="scoreVal">0</span></span>
      <span class="lives" id="livesEl">●●●</span>
    </div>
    <button class="iconBtn" id="homeBtn" aria-label="Início">🏠</button>
    <button class="iconBtn" id="muteBtn">🔊</button>
  </header>

  <!-- MENU -->
  <div id="menuScreen" class="screen">
    <h1>PAC-MAN</h1>
    <div class="sub">Coma todas as bolinhas. Cuidado com os 4 fantasmas — cada um tem personalidade diferente.</div>
    <div class="ghostRow">
      <div><div class="dot" style="color:#ef4444">●</div>Blinky<br>persegue</div>
      <div><div class="dot" style="color:#f9a8d4">●</div>Pinky<br>antecipa</div>
      <div><div class="dot" style="color:#22d3ee">●</div>Inky<br>arma cilada</div>
      <div><div class="dot" style="color:#fb923c">●</div>Clyde<br>imprevisível</div>
    </div>
    <div class="levelGrid">
      <div class="levelCard" data-lvl="0">
        <div class="lvlIcon">🐣</div>
        <div class="lvlInfo">
          <div class="lvlName">Bebê</div>

        </div>
        <div class="lvlStars" id="stars0"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
      <div class="levelCard" data-lvl="1">
        <div class="lvlIcon">🌱</div>
        <div class="lvlInfo">
          <div class="lvlName">Aprendiz</div>
          <div class="lvlRange">Devagar</div>
        </div>
        <div class="lvlStars" id="stars1"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
      <div class="levelCard" data-lvl="2">
        <div class="lvlIcon">🍀</div>
        <div class="lvlInfo">
          <div class="lvlName">Fácil</div>
          <div class="lvlRange">Fantasmas lentos</div>
        </div>
        <div class="lvlStars" id="stars2"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
      <div class="levelCard" data-lvl="3">
        <div class="lvlIcon">⚡</div>
        <div class="lvlInfo">
          <div class="lvlName">Normal</div>
          <div class="lvlRange">Padrão arcade</div>
        </div>
        <div class="lvlStars" id="stars3"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
      <div class="levelCard" data-lvl="4">
        <div class="lvlIcon">🔥</div>
        <div class="lvlInfo">
          <div class="lvlName">Difícil</div>

        </div>
        <div class="lvlStars" id="stars4"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
    </div>
  </div>

  <!-- JOGO -->
  <div id="gameScreen" class="screen hidden">
    <div class="ready" id="readyText">READY!</div>
    <canvas id="mazeCanvas"></canvas>
    <div class="dpad">
      <div class="empty"></div>
      <button class="dBtn up" id="btnUp">▲</button>
      <div class="empty"></div>
      <button class="dBtn left" id="btnLeft">◀</button>
      <div class="empty"></div>
      <button class="dBtn right" id="btnRight">▶</button>

      <div class="empty"></div>
    </div>

  <!-- FIM -->
  <div id="endScreen" class="screen hidden">
    <div class="bigEmoji" id="endEmoji">👻</div>
    <h2 id="endTitle">GAME OVER</h2>
    <div class="score">Pontuação<span class="big" id="finalScore">0</span></div>
    <div class="best" id="bestMsg"></div>
    <div class="earnedStars" id="earnedStars"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
    <div class="btnRow">
      <button class="secondaryBtn" id="backMenuBtn">Menu</button>
      <button class="primaryBtn" id="playAgainBtn">Jogar de novo</button>
    </div>
  </div>
</div>

<script>
(() => {
  const MAZE = ["###################","#........#........#","#.##.###.#.###.##.#","#o##.###.#.###.##o#","#.................#","#.##.#.#####.#.##.#","#....#...#...#....#","####.###.#.###.####","   #.#       #.#   ","####.# ##-## #.####","T  ....# G #....  T","####.# ##### #.####","   #.#       #.#   ","####.# ##### #.####","#........#........#","#.##.###.#.###.##.#","#o..#....P....#..o#","###.#.###.###.#.###","#.....#.....#.....#","#.###.###.###.###.#","#.................#","###################"];
  const COLS = MAZE[0].length;
  const ROWS = MAZE.length;
  const PAC_SPAWN = (() => { for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (MAZE[y][x] === 'P') return {x, y}; })();
  const GHOST_SPAWN = (() => { for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (MAZE[y][x] === 'G') return {x, y}; })();
  // Tunnel row (y constante)
  const TUNNEL_Y = (() => { for (let y = 0; y < ROWS; y++) if (MAZE[y][0] === 'T') return y; return -1; })();

  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndChomp(toggle) {
    // alterna 2 tons rápidos
    beep(toggle ? 320 : 220, 0.04, 'square', 0.03);
  }
  function sndPower() { [440, 660, 880, 1100].forEach((f, i) => beep(f, 0.10, 'triangle', 0.05, i*0.05)); }
  function sndEatGhost() { [220, 330, 440, 660, 880].forEach((f, i) => beep(f, 0.08, 'square', 0.06, i*0.04)); }
  function sndEatFruit() { [880, 1175, 1568].forEach((f, i) => beep(f, 0.12, 'triangle', 0.06, i*0.06)); }
  function sndDie() {
    [880, 740, 620, 520, 440, 370, 310, 260, 220, 180].forEach((f, i) => beep(f, 0.10, 'sawtooth', 0.06, i*0.08));
  }
  function sndStart() { [392, 523, 659, 880, 1047].forEach((f, i) => beep(f, 0.14, 'triangle', 0.06, i*0.12)); }
  function sndTap() { beep(660, 0.04, 'triangle', 0.05); }
  function sndWin() { [523, 659, 784, 1047, 1318, 1568].forEach((f, i) => beep(f, 0.16, 'triangle', 0.07, i*0.09)); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // LEVELS
  const LEVELS = [
    { name:'Bebê',     pacSpeed:0.08, ghostSpeed:0.05, frightSpeed:0.04, frightenedMs:10000, goal3:2500, goal2:1500, goal1:800  },
    { name:'Aprendiz', pacSpeed:0.10, ghostSpeed:0.07, frightSpeed:0.05, frightenedMs:9000,  goal3:3500, goal2:2000, goal1:1000 },
    { name:'Fácil',    pacSpeed:0.12, ghostSpeed:0.09, frightSpeed:0.06, frightenedMs:8000,  goal3:6000, goal2:3500, goal1:1500 },
    { name:'Normal',   pacSpeed:0.14, ghostSpeed:0.12, frightSpeed:0.08, frightenedMs:7000,  goal3:8000, goal2:4500, goal1:2000 },
    { name:'Difícil',  pacSpeed:0.16, ghostSpeed:0.15, frightSpeed:0.09, frightenedMs:5000,  goal3:10000, goal2:5500, goal1:2500 },
  ];

  // STATS
  function getStars(l) { return +(localStorage.getItem('blg-pacman-stars-' + l) || 0); }
  function saveStars(l, n) { if (n > getStars(l)) localStorage.setItem('blg-pacman-stars-' + l, n); }
  function getBest(l) { return +(localStorage.getItem('blg-pacman-best-' + l) || 0); }
  function saveBest(l, s) { if (s > getBest(l)) localStorage.setItem('blg-pacman-best-' + l, s); }
  function refreshMenu() {
    for (let i = 0; i < 5; i++) {
      const s = getStars(i);
      const ct = document.getElementById('stars' + i);
      if (!ct) continue;
      ct.querySelectorAll('.s').forEach((el, idx) => el.classList.toggle('lit', idx < s));
    }
  }
  refreshMenu();

  // STATE
  let currentLevel = 0;
  let score = 0, lives = 3, running = false;
  let pellets = null;  // 2D array: 0=nada, 1=pellet, 2=power
  let pelletsRemaining = 0;
  let pac = null;
  let ghosts = [];
  let modeTimer = 0;
  let mode = 'scatter';  // scatter, chase, frightened
  let prevMode = 'scatter';
  let lastTime = 0;
  let inputDir = null;
  let queuedDir = null;
  let readyTimer = 0;  // contagem regressiva inicial
  let frightenedEndTime = 0;
  let deathPause = 0;
  let waveStartTime = 0;
  let chompToggle = 0;
  let chompLastTime = 0;
  let consecutiveGhosts = 0;  // pra score bonus crescente

  // SCREENS
  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
    if (s === menuScreen) refreshMenu();
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      showScreen(gameScreen);
      setTimeout(() => { resize(); startGame(); }, 30);
    });
  });

  // CANVAS
  const canvas = document.getElementById('mazeCanvas');
  const ctx = canvas.getContext('2d');
  let CELL = 0, DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const stage = document.getElementById('stage');
    const stageRect = stage.getBoundingClientRect();
    const maxW = stageRect.width - 16;
    const maxH = window.innerHeight - 280;  // header + ready + dpad + padding
    CELL = Math.max(10, Math.floor(Math.min(maxW / COLS, maxH / ROWS)));
    W = CELL * COLS; H = CELL * ROWS;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }

  function isWall(x, y) {
    if (y < 0 || y >= ROWS) return true;
    if (x < 0 || x >= COLS) return false;  // tunnels passam por fora
    const c = MAZE[y][x];
    return c === '#';
  }
  function isDoor(x, y) {
    if (y < 0 || y >= ROWS || x < 0 || x >= COLS) return false;
    return MAZE[y][x] === '-';
  }

  function startGame() {
    score = 0;
    lives = 3;
    running = true;
    document.getElementById('scoreVal').textContent = '0';
    pellets = [];
    pelletsRemaining = 0;
    for (let y = 0; y < ROWS; y++) {
      const row = [];
      for (let x = 0; x < COLS; x++) {
        const c = MAZE[y][x];
        if (c === '.') { row.push(1); pelletsRemaining++; }
        else if (c === 'o') { row.push(2); pelletsRemaining++; }
        else row.push(0);
      }
      pellets.push(row);
    }
    setupEntities();
    mode = 'scatter';
    modeTimer = 7000;
    readyTimer = 2000;
    inputDir = null;
    queuedDir = null;
    waveStartTime = performance.now();
    updateLives();
    document.getElementById('readyText').textContent = 'READY!';
    document.getElementById('readyText').className = 'ready';
    sndStart();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function setupEntities() {
    pac = {
      x: PAC_SPAWN.x + 0.5,
      y: PAC_SPAWN.y + 0.5,
      dir: 'left',
      mouth: 0,  // 0 fechada, 1 aberta
      mouthTimer: 0,
      alive: true,
    };
    ghosts = [
      // Blinky: começa fora do ghost house (no spot acima da porta)
      makeGhost('blinky', '#ef4444', GHOST_SPAWN.x + 0.5, GHOST_SPAWN.y - 1.5, { x: COLS - 2, y: 1 }, 0, false),
      // Pinky: dentro, sai em 4s
      makeGhost('pinky',  '#f9a8d4', GHOST_SPAWN.x + 0.5, GHOST_SPAWN.y + 0.5, { x: 1, y: 1 }, 4000, true),
      // Inky: dentro, sai em 8s
      makeGhost('inky',   '#22d3ee', GHOST_SPAWN.x - 1 + 0.5, GHOST_SPAWN.y + 0.5, { x: COLS - 2, y: ROWS - 2 }, 8000, true),
      // Clyde: dentro, sai em 12s
      makeGhost('clyde',  '#fb923c', GHOST_SPAWN.x + 1 + 0.5, GHOST_SPAWN.y + 0.5, { x: 1, y: ROWS - 2 }, 12000, true),
    ];
  }

  function makeGhost(name, color, x, y, corner, releaseDelay, inHouse) {
    return {
      name, color, x, y,
      dir: name === 'blinky' ? 'left' : 'up',
      scatterCorner: corner,
      releaseDelay,  // ms after game start
      inHouse,
      state: 'normal',  // normal, frightened, eaten
      stateTimer: 0,
      lastDecisionTile: '',
    };
  }

  function updateLives() {
    document.getElementById('livesEl').textContent = '●'.repeat(Math.max(0, lives - 1));
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(2.5, (now - lastTime) / 16.67);
    lastTime = now;
    update(dt, now);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt, now) {
    const lvl = LEVELS[currentLevel];

    if (deathPause > 0) {
      deathPause -= dt * 16.67;
      if (deathPause <= 0) {
        if (lives > 0) {
          setupEntities();
          mode = 'scatter';
          modeTimer = 7000;
          readyTimer = 1500;
          inputDir = null;
          queuedDir = null;
          waveStartTime = now;
          document.getElementById('readyText').textContent = 'READY!';
          document.getElementById('readyText').className = 'ready';
        } else {
          endGame(false);
          return;
        }
      }
      return;
    }

    if (readyTimer > 0) {
      readyTimer -= dt * 16.67;
      if (readyTimer <= 0) {
        document.getElementById('readyText').textContent = 'GO!';
        document.getElementById('readyText').className = 'ready go';
        setTimeout(() => { document.getElementById('readyText').textContent = ''; }, 400);
      }
      return;
    }

    // Mode timer (scatter/chase)
    if (mode !== 'frightened') {
      modeTimer -= dt * 16.67;
      if (modeTimer <= 0) {
        if (mode === 'scatter') { mode = 'chase'; modeTimer = 20000; }
        else { mode = 'scatter'; modeTimer = 5000; }
        // ao mudar de modo, ghosts revertem direção (clássico)
        for (const g of ghosts) {
          if (g.state === 'normal' && !g.inHouse) g.dir = reverseDir(g.dir);
        }
      }
    } else {
      if (now > frightenedEndTime) {
        mode = prevMode;
        for (const g of ghosts) {
          if (g.state === 'frightened') g.state = 'normal';
        }
        consecutiveGhosts = 0;
      }
    }

    // PAC INPUT
    if (inputDir) {
      // tenta mudar de direção
      if (canMove(pac.x, pac.y, inputDir)) {
        pac.dir = inputDir;
        queuedDir = null;
      } else {
        queuedDir = inputDir;
      }
      inputDir = null;
    }
    // queued direction quando possível
    if (queuedDir && canMove(pac.x, pac.y, queuedDir)) {
      pac.dir = queuedDir;
      queuedDir = null;
    }
    // movimento Pac
    movePac(pac, pac.dir, lvl.pacSpeed * dt);

    // Tunnel wrap
    if (pac.x < -0.5) pac.x = COLS - 0.5;
    if (pac.x > COLS + 0.5) pac.x = 0.5;

    // Comer pellet
    const ptx = Math.floor(pac.x), pty = Math.floor(pac.y);
    if (ptx >= 0 && ptx < COLS && pty >= 0 && pty < ROWS && pellets[pty][ptx] > 0) {
      const wasPower = pellets[pty][ptx] === 2;
      pellets[pty][ptx] = 0;
      pelletsRemaining--;
      if (wasPower) {
        score += 50;
        // ativar frightened
        prevMode = mode === 'frightened' ? prevMode : mode;
        mode = 'frightened';
        frightenedEndTime = now + lvl.frightenedMs;
        for (const g of ghosts) {
          if (g.state === 'normal' && !g.inHouse) {
            g.state = 'frightened';
            g.dir = reverseDir(g.dir);
          }
        }
        consecutiveGhosts = 0;
        sndPower();
      } else {
        score += 10;
        if (now - chompLastTime > 90) {
          sndChomp(chompToggle);
          chompToggle = 1 - chompToggle;
          chompLastTime = now;
        }
      }
      document.getElementById('scoreVal').textContent = score;
      pac.mouthTimer += 1;
    }

    // Pac mouth animation
    pac.mouthTimer += dt * 0.18;
    pac.mouth = (Math.floor(pac.mouthTimer) % 2);

    // GHOSTS
    for (const g of ghosts) {
      const elapsed = now - waveStartTime;
      if (g.inHouse && elapsed >= g.releaseDelay) {
        // sair da casa: aproximar do centro X então subir
        const houseX = GHOST_SPAWN.x + 0.5;
        const houseY = GHOST_SPAWN.y + 0.5;
        // primeiro alinhar X
        if (Math.abs(g.x - houseX) > 0.05) {
          g.x += Math.sign(houseX - g.x) * lvl.ghostSpeed * 0.5 * dt;
        } else {
          // subir
          g.x = houseX;
          g.y -= lvl.ghostSpeed * 0.5 * dt;
          if (g.y <= GHOST_SPAWN.y - 1.5) {
            g.y = GHOST_SPAWN.y - 1.5;
            g.inHouse = false;
            g.dir = ['left', 'right'][Math.floor(Math.random() * 2)];
          }
        }
        continue;
      }
      if (g.inHouse) {
        // bobbling no lugar
        g.y += Math.sin(now * 0.005) * 0.005;
        continue;
      }

      const speed = g.state === 'eaten' ? lvl.ghostSpeed * 1.6 :
                    g.state === 'frightened' ? lvl.frightSpeed : lvl.ghostSpeed;

      // Decisão de direção: ao chegar próximo do centro de um tile (uma vez por tile)
      const cx = Math.floor(g.x) + 0.5;
      const cy = Math.floor(g.y) + 0.5;
      const tileKey = Math.floor(g.x) + ',' + Math.floor(g.y);
      const atCenter = Math.abs(g.x - cx) < speed * dt + 0.01 && Math.abs(g.y - cy) < speed * dt + 0.01;
      if (atCenter && g.lastDecisionTile !== tileKey) {
        g.lastDecisionTile = tileKey;
        g.x = cx; g.y = cy;
        // Decide próxima direção
        const candidates = ['up', 'left', 'down', 'right'].filter(d => d !== reverseDir(g.dir));
        const validDirs = candidates.filter(d => {
          const dx2 = d === 'left' ? -1 : d === 'right' ? 1 : 0;
          const dy2 = d === 'up' ? -1 : d === 'down' ? 1 : 0;
          const nx2 = Math.floor(cx + dx2), ny2 = Math.floor(cy + dy2);
          if (isWall(nx2, ny2)) return false;
          if (isDoor(nx2, ny2) && g.state !== 'eaten') return false;
          return true;
        });
        if (validDirs.length > 0) {
          if (g.state === 'frightened') {
            // movimento aleatório
            g.dir = validDirs[Math.floor(Math.random() * validDirs.length)];
          } else {
            // chase/scatter: minimiza distância pro target
            const target = getGhostTarget(g);
            if (target) {
              let bestDir = validDirs[0], bestDist = Infinity;
              for (const d of validDirs) {
                const dx2 = d === 'left' ? -1 : d === 'right' ? 1 : 0;
                const dy2 = d === 'up' ? -1 : d === 'down' ? 1 : 0;
                const nx2 = Math.floor(cx + dx2), ny2 = Math.floor(cy + dy2);
                const dist = (nx2 - target.x) * (nx2 - target.x) + (ny2 - target.y) * (ny2 - target.y);
                if (dist < bestDist) { bestDist = dist; bestDir = d; }
              }
              g.dir = bestDir;
            }
          }
        }

        // Check eaten arrived at house
        if (g.state === 'eaten') {
          const dx2 = g.x - (GHOST_SPAWN.x + 0.5);
          const dy2 = g.y - (GHOST_SPAWN.y + 0.5);
          if (Math.abs(dx2) < 0.6 && Math.abs(dy2) < 0.6) {
            g.state = 'normal';
            g.x = GHOST_SPAWN.x + 0.5;
            g.y = GHOST_SPAWN.y - 1.5;
            g.dir = 'left';
            g.lastDecisionTile = '';
          }
        }
      }

      // movimentação
      const dx = g.dir === 'left' ? -1 : g.dir === 'right' ? 1 : 0;
      const dy = g.dir === 'up' ? -1 : g.dir === 'down' ? 1 : 0;
      g.x += dx * speed * dt;
      g.y += dy * speed * dt;

      // Tunnel
      if (g.x < -0.5) g.x = COLS - 0.5;
      if (g.x > COLS + 0.5) g.x = 0.5;

      // Colisão Pac
      const dxp = g.x - pac.x, dyp = g.y - pac.y;
      if (Math.abs(dxp) < 0.7 && Math.abs(dyp) < 0.7) {
        if (g.state === 'frightened') {
          // come fantasma
          consecutiveGhosts++;
          const pts = 200 * consecutiveGhosts;
          score += pts;
          document.getElementById('scoreVal').textContent = score;
          g.state = 'eaten';
          sndEatGhost();
        } else if (g.state === 'normal') {
          // morre
          pacDeath();
          return;
        }
      }
    }

    // VITÓRIA: todos pellets comidos
    if (pelletsRemaining === 0) {
      running = false;
      sndWin();
      setTimeout(() => endGame(true), 800);
      return;
    }
  }

  function canMove(x, y, dir) {
    // verifica se pode entrar no tile na direção
    const cx = Math.floor(x), cy = Math.floor(y);
    let nx = cx, ny = cy;
    if (dir === 'left') nx--;
    else if (dir === 'right') nx++;
    else if (dir === 'up') ny--;
    else if (dir === 'down') ny++;
    if (isWall(nx, ny)) return false;
    if (isDoor(nx, ny)) return false;  // pac não atravessa porta
    return true;
  }

  function movePac(p, dir, speed) {
    const cx = Math.floor(p.x), cy = Math.floor(p.y);
    let nx = cx, ny = cy;
    let dx = 0, dy = 0;
    if (dir === 'left') { dx = -1; nx--; }
    else if (dir === 'right') { dx = 1; nx++; }
    else if (dir === 'up') { dy = -1; ny--; }
    else if (dir === 'down') { dy = 1; ny++; }
    let newX = p.x + dx * speed;
    let newY = p.y + dy * speed;
    // Se há parede à frente, não permite passar do centro do tile atual
    if (isWall(nx, ny) || isDoor(nx, ny)) {
      if (dx > 0 && newX > cx + 0.5) newX = cx + 0.5;
      if (dx < 0 && newX < cx + 0.5) newX = cx + 0.5;
      if (dy > 0 && newY > cy + 0.5) newY = cy + 0.5;
      if (dy < 0 && newY < cy + 0.5) newY = cy + 0.5;
    }
    p.x = newX;
    p.y = newY;
    // alinha cross-axis ao centro (pra não andar diagonal)
    if (dx !== 0) p.y = cy + 0.5;
    if (dy !== 0) p.x = cx + 0.5;
  }

  function reverseDir(d) {
    return d === 'left' ? 'right' : d === 'right' ? 'left' : d === 'up' ? 'down' : 'up';
  }

  function getGhostTarget(g) {
    if (g.state === 'eaten') return { x: GHOST_SPAWN.x, y: GHOST_SPAWN.y };
    if (g.state === 'frightened') return null;
    if (mode === 'scatter') return g.scatterCorner;
    // chase mode
    const px = Math.floor(pac.x), py = Math.floor(pac.y);
    if (g.name === 'blinky') return { x: px, y: py };
    if (g.name === 'pinky') {
      const dxp = pac.dir === 'left' ? -4 : pac.dir === 'right' ? 4 : 0;
      const dyp = pac.dir === 'up' ? -4 : pac.dir === 'down' ? 4 : 0;
      return { x: px + dxp, y: py + dyp };
    }
    if (g.name === 'inky') {
      // 2 tiles à frente do Pac
      const dxp = pac.dir === 'left' ? -2 : pac.dir === 'right' ? 2 : 0;
      const dyp = pac.dir === 'up' ? -2 : pac.dir === 'down' ? 2 : 0;
      const ahead = { x: px + dxp, y: py + dyp };
      // vetor Blinky → ahead, dobrado
      const blinky = ghosts.find(gg => gg.name === 'blinky');
      const bx = Math.floor(blinky.x), by = Math.floor(blinky.y);
      return { x: ahead.x + (ahead.x - bx), y: ahead.y + (ahead.y - by) };
    }
    if (g.name === 'clyde') {
      const gx = Math.floor(g.x), gy = Math.floor(g.y);
      const dist = Math.sqrt((gx - px) * (gx - px) + (gy - py) * (gy - py));
      if (dist >= 8) return { x: px, y: py };
      return g.scatterCorner;
    }
  }

  function pacDeath() {
    pac.alive = false;
    lives--;
    updateLives();
    sndDie();
    deathPause = 2000;
    document.getElementById('readyText').textContent = '💀';
    document.getElementById('readyText').className = 'ready dead';
  }

  function endGame(victory) {
    running = false;
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, score);
    let earned = 0;
    if (score >= lvl.goal3) earned = 3;
    else if (score >= lvl.goal2) earned = 2;
    else if (score >= lvl.goal1) earned = 1;
    saveStars(currentLevel, earned);
    document.getElementById('finalScore').textContent = score;
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent = score >= best ? '🏆 Novo recorde!' : 'Melhor: ' + best;
    const es = document.getElementById('earnedStars');
    es.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      es.appendChild(s);
    }
    let emoji, title;
    if (victory) { emoji = '🏆'; title = 'PERFEITO!'; }
    else if (earned >= 2) { emoji = '🎉'; title = 'BOA!'; }
    else { emoji = '👻'; title = 'GAME OVER'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;
    setTimeout(() => showScreen(endScreen), 600);
  }

  function render() {
    if (!CELL) return;
    // BG
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // MAZE walls
    ctx.fillStyle = '#1e40af';
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 1;
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const c = MAZE[y][x];
        if (c === '#') {
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        } else if (c === '-') {
          // porta
          ctx.fillStyle = '#f9a8d4';
          ctx.fillRect(x * CELL, y * CELL + CELL * 0.4, CELL, CELL * 0.2);
          ctx.fillStyle = '#1e40af';
        }
      }
    }
    // wall outline
    ctx.strokeStyle = '#60a5fa';
    ctx.lineWidth = 1.5;
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (MAZE[y][x] === '#') {
          ctx.strokeRect(x * CELL + 0.5, y * CELL + 0.5, CELL - 1, CELL - 1);
        }
      }
    }

    // PELLETS
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const p = pellets[y][x];
        if (p === 1) {
          ctx.fillStyle = '#fde047';
          ctx.fillRect(x * CELL + CELL * 0.4, y * CELL + CELL * 0.4, CELL * 0.2, CELL * 0.2);
        } else if (p === 2) {
          // power pellet pulse
          const pulse = 0.7 + 0.3 * Math.sin(performance.now() * 0.008);
          ctx.fillStyle = '#fde047';
          ctx.beginPath();
          ctx.arc(x * CELL + CELL / 2, y * CELL + CELL / 2, CELL * 0.35 * pulse, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // GHOSTS
    for (const g of ghosts) {
      drawGhost(g);
    }

    // PAC-MAN
    if (pac && pac.alive) drawPac(pac);
  }

  function drawPac(p) {
    const cx = p.x * CELL;
    const cy = p.y * CELL;
    const r = CELL * 0.45;
    let startAngle, endAngle;
    const open = 0.3 + p.mouth * 0.3;  // 0.3 to 0.6
    if (p.dir === 'right') { startAngle = open; endAngle = -open; }
    else if (p.dir === 'left') { startAngle = Math.PI + open; endAngle = Math.PI - open; }
    else if (p.dir === 'up') { startAngle = -Math.PI / 2 + open; endAngle = -Math.PI / 2 - open; }
    else { startAngle = Math.PI / 2 + open; endAngle = Math.PI / 2 - open; }
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(cx, cy, r, startAngle, endAngle, false);
    ctx.lineTo(cx, cy);
    ctx.closePath();
    ctx.fill();
  }

  function drawGhost(g) {
    const cx = g.x * CELL;
    const cy = g.y * CELL;
    const r = CELL * 0.42;
    // corpo
    let color = g.color;
    if (g.state === 'frightened') {
      // pisca azul/branco no final
      const remaining = frightenedEndTime - performance.now();
      if (remaining < 2000 && Math.floor(remaining / 200) % 2 === 0) color = '#fff';
      else color = '#3b82f6';
    } else if (g.state === 'eaten') {
      color = null; // só olhos
    }
    if (color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(cx, cy - r * 0.1, r, Math.PI, 0, false);
      ctx.lineTo(cx + r, cy + r * 0.6);
      // ondulação inferior
      const wobble = Math.floor(performance.now() / 200) % 2;
      const points = 4;
      for (let i = 0; i <= points; i++) {
        const px = cx + r - (2 * r * i) / points;
        const py = cy + r * 0.6 + (i % 2 === wobble ? -r * 0.2 : 0);
        ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }
    // olhos
    if (g.state !== 'frightened') {
      const eyeOffX = g.dir === 'left' ? -2 : g.dir === 'right' ? 2 : 0;
      const eyeOffY = g.dir === 'up' ? -2 : g.dir === 'down' ? 2 : 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx - r * 0.35, cy - r * 0.15, r * 0.25, 0, Math.PI * 2);
      ctx.arc(cx + r * 0.35, cy - r * 0.15, r * 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0c1426';
      ctx.beginPath();
      ctx.arc(cx - r * 0.35 + eyeOffX, cy - r * 0.15 + eyeOffY, r * 0.12, 0, Math.PI * 2);
      ctx.arc(cx + r * 0.35 + eyeOffX, cy - r * 0.15 + eyeOffY, r * 0.12, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // boca assustada
      ctx.fillStyle = '#fff';
      // olhos pequenos
      ctx.fillRect(cx - r * 0.4, cy - r * 0.2, r * 0.2, r * 0.2);
      ctx.fillRect(cx + r * 0.2, cy - r * 0.2, r * 0.2, r * 0.2);
      // boca zigue-zague
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      const yMouth = cy + r * 0.2;
      ctx.moveTo(cx - r * 0.5, yMouth);
      ctx.lineTo(cx - r * 0.25, yMouth - r * 0.15);
      ctx.lineTo(cx, yMouth);
      ctx.lineTo(cx + r * 0.25, yMouth - r * 0.15);
      ctx.lineTo(cx + r * 0.5, yMouth);
      ctx.stroke();
    }
  }

  // CONTROLES
  function setDir(d) {
    ensureAudio();
    inputDir = d;
  }
  document.getElementById('btnUp').addEventListener('click', () => setDir('up'));
  document.getElementById('btnDown').addEventListener('click', () => setDir('down'));
  document.getElementById('btnLeft').addEventListener('click', () => setDir('left'));
  document.getElementById('btnRight').addEventListener('click', () => setDir('right'));

  // KEYBOARD
  window.addEventListener('keydown', (e) => {
    if (gameScreen.classList.contains('hidden')) return;
    if (e.key === 'ArrowUp' || e.key === 'w') { setDir('up'); e.preventDefault(); }
    else if (e.key === 'ArrowDown' || e.key === 's') { setDir('down'); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'a') { setDir('left'); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd') { setDir('right'); e.preventDefault(); }
  });

  // SWIPE no canvas
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    ensureAudio();
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive:true });
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left');
    else setDir(dy > 0 ? 'down' : 'up');
  }, { passive:true });

  window.addEventListener('resize', () => { if (!gameScreen.classList.contains('hidden')) resize(); });

  document.getElementById('backBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    if (!menuScreen.classList.contains('hidden')) {
      parent.postMessage('back-to-hub', '*');
    } else {
      running = false;
      showScreen(menuScreen);
    }
  });
  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    showScreen(gameScreen);
    setTimeout(() => { resize(); startGame(); }, 30);
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    running = false;
    showScreen(menuScreen);
  });


  // HOME button
  document.getElementById('homeBtn').addEventListener('click', () => {
    if (typeof ensureAudio === 'function') ensureAudio();
    if (typeof sndTap === 'function') sndTap();
    parent.postMessage('back-to-hub', '*');
  });

})();

<script>
  // Helper global pra atualizar progresso após voltar de jogo
  window.refreshHubStats = function() {
    // Dash
    let totalDone = 0, totalCoins = 0;
    for (let i = 0; i < 11; i++) {
      if (localStorage.getItem('cubo-dash-done-' + i) === '1') totalDone++;
      totalCoins += +(localStorage.getItem('cubo-dash-coins-' + i) || 0);
    }
    const td = document.getElementById('totalTrophies');
    const ts = document.getElementById('totalStars');
    if (td) td.textContent = totalDone + '/11';
    if (ts) ts.textContent = totalCoins + '/55';
    const dashProg = document.querySelector('.card[data-game="dash"] .progress');
    if (dashProg) {
      const bar = dashProg.querySelector('div');
      const pct = Math.round((totalDone * 100) / 11);
      if (pct > 0 || totalCoins > 0) {
        dashProg.classList.add('show');
        bar.style.width = Math.max(5, pct) + '%';
      }
    }
    // Outros jogos
    const games = [
      ['conta', 'blg-conta-stars-', 3, 9],
      ['memory', 'blg-memory-stars-', 4, 12],
      ['snake', 'blg-snake-stars-', 3, 9],
      ['letroca', 'blg-letroca-stars-', 3, 9],
      ['skyhop', 'blg-skyhop-stars-', 3, 9],
      ['platformer', 'blg-mario-stars-', 5, 15],
      ['cruzadas', 'blg-cruzadas-stars-', 6, 18],
      ['balloons', 'blg-balloons-stars-', 6, 18],
      ['animals', 'blg-animal-stars-', 3, 9],
      ['mole', 'blg-mole-stars-', 4, 12],
      ['g2048', 'blg-2048-stars-', 3, 9],
      ['tetris', 'blg-tetris-stars-', 3, 9],
      ['breakout', 'blg-breakout-stars-', 3, 9],
      ['race', 'blg-race-stars-', 5, 15],
      ['sokoban', 'blg-sokoban-stars-', 25, 75],
      ['invaders', 'blg-invaders-stars-', 3, 9],
      ['pacman', 'blg-pacman-stars-', 5, 15],
      ['tower', 'blg-tower-stars-', 3, 9],
    ];
    for (const [game, prefix, levels, max] of games) {
      let stars = 0;
      for (let i = 0; i < levels; i++) stars += +(localStorage.getItem(prefix + i) || 0);
      const prog = document.querySelector('.card[data-game="' + game + '"] .progress');
      if (prog) {
        const bar = prog.querySelector('div');
        if (stars > 0) {
          prog.classList.add('show');
          bar.style.width = Math.max(5, (stars / max) * 100) + '%';
        }
      }
    }
    // Piano: 1 valor único
    const pianoS = +(localStorage.getItem('blg-piano-stars') || 0);
    const pianoP = document.querySelector('.card[data-game="piano"] .progress');
    if (pianoP) {
      const bar = pianoP.querySelector('div');
      if (pianoS > 0) {
        pianoP.classList.add('show');
        bar.style.width = Math.max(5, (pianoS / 3) * 100) + '%';
      }
    }
    // Sudoku: 3 sizes × 3 diffs
    let sudokuS = 0;
    for (const sz of [4, 6, 9]) for (const df of ['Fácil', 'Médio', 'Difícil']) {
      sudokuS += +(localStorage.getItem('blg-sudoku-' + sz + '-' + df + '-stars') || 0);
    }
    const sudokuP = document.querySelector('.card[data-game="sudoku"] .progress');
    if (sudokuP) {
      const bar = sudokuP.querySelector('div');
      if (sudokuS > 0) {
        sudokuP.classList.add('show');
        bar.style.width = Math.max(5, (sudokuS / 27) * 100) + '%';
      }
    }
    // RPG: 1 valor único
    const rpgS = +(localStorage.getItem('blg-rpg-best-stars') || 0);
    const rpgP = document.querySelector('.card[data-game="rpg"] .progress');
    if (rpgP) {
      const bar = rpgP.querySelector('div');
      if (rpgS > 0) {
        rpgP.classList.add('show');
        bar.style.width = Math.max(5, (rpgS / 3) * 100) + '%';
      }
    }
  };
