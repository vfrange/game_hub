<script>
(() => {
  // ============ AUDIO ============
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.06, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndTap()     { beep(660, 0.04, 'triangle', 0.05); }
  function sndCount(i)  { beep(440 + i*60, 0.05, 'sine', 0.04); }
  function sndCorrect() { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.12, 'triangle', 0.07, i*0.06)); }
  function sndWrong()   { beep(220, 0.18, 'sine', 0.06); setTimeout(() => beep(196, 0.18, 'sine', 0.05), 100); }
  function sndStar()    { beep(880, 0.08, 'triangle', 0.06); setTimeout(() => beep(1318, 0.10, 'triangle', 0.05), 50); }
  function sndWin()     { [523, 659, 784, 880, 1047, 1318].forEach((f, i) => beep(f, 0.18, 'triangle', 0.07, i*0.08)); }

  // ============ MUTE ============
  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // ============ LEVELS ============
  const LEVELS = [
    { name:'Fácil',   range:[1,5],  emoji:'🌱' },
    { name:'Médio',   range:[1,10], emoji:'⚡' },
    { name:'Difícil', range:[1,20], emoji:'🔥' },
  ];
  const OBJECTS = [
    { emoji:'🍎', word:'maçãs' },
    { emoji:'⭐', word:'estrelas' },
    { emoji:'🐠', word:'peixes' },
    { emoji:'🎈', word:'balões' },
    { emoji:'⚽', word:'bolas' },
    { emoji:'🌸', word:'flores' },
    { emoji:'🐝', word:'abelhas' },
    { emoji:'🦋', word:'borboletas' },
  ];
  const QUESTIONS_PER_ROUND = 10;

  // ============ STATS ============
  function getStars(lvlIdx) { return +(localStorage.getItem('blg-conta-stars-' + lvlIdx) || 0); }
  function saveStars(lvlIdx, n) {
    const cur = getStars(lvlIdx);
    if (n > cur) localStorage.setItem('blg-conta-stars-' + lvlIdx, n);
  }
  function refreshMenu() {
    let totalStars = 0;
    for (let i = 0; i < 3; i++) {
      const s = getStars(i);
      totalStars += s;
      const container = document.getElementById('stars' + i);
      container.querySelectorAll('.s').forEach((el, idx) => {
        el.classList.toggle('lit', idx < s);
      });
    }
    document.getElementById('scoreNum').textContent = totalStars;
  }
  refreshMenu();

  // ============ STATE ============
  let currentLevel = 0;
  let currentQ = 0;        // index 0..9
  let correct = 0;         // acertos completos
  let firstTryWrong = false;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');

  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  // ============ INICIAR NÍVEL ============
  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio();
      sndTap();
      currentLevel = +card.dataset.lvl;
      startRound();
    });
  });

  function startRound() {
    currentQ = 0;
    correct = 0;
    showScreen(gameScreen);
    nextQuestion();
  }

  function nextQuestion() {
    if (currentQ >= QUESTIONS_PER_ROUND) { endRound(); return; }
    firstTryWrong = false;
    const lvl = LEVELS[currentLevel];
    const n = lvl.range[0] + Math.floor(Math.random() * (lvl.range[1] - lvl.range[0] + 1));
    const obj = OBJECTS[Math.floor(Math.random() * OBJECTS.length)];

    document.getElementById('questionText').textContent = 'Quantas ' + obj.word + '?';
    document.getElementById('progressFill').style.width = ((currentQ / QUESTIONS_PER_ROUND) * 100) + '%';

    // Render objetos
    const grid = document.getElementById('objGrid');
    grid.innerHTML = '';
    // grid responsive: até 5 col
    const cols = Math.min(5, Math.ceil(Math.sqrt(n)));
    grid.style.gridTemplateColumns = `repeat(${cols}, auto)`;
    for (let i = 0; i < n; i++) {
      const el = document.createElement('span');
      el.className = 'obj';
      el.textContent = obj.emoji;
      el.style.animationDelay = (i * 0.04) + 's';
      grid.appendChild(el);
    }

    // Som de contagem ao revelar (pra Luca associar)
    for (let i = 0; i < Math.min(n, 8); i++) {
      setTimeout(() => sndCount(i), i * 60);
    }

    // Gerar 4 opções: correto + 3 distratores próximos
    const options = new Set([n]);
    let attempts = 0;
    while (options.size < 4 && attempts < 40) {
      attempts++;
      const offset = Math.floor(Math.random() * 5) - 2;  // -2..2
      const cand = n + offset;
      if (cand >= lvl.range[0] && cand <= lvl.range[1] && cand !== n) options.add(cand);
    }
    // se ainda < 4 (range pequeno), preenche com aleatórios do range
    while (options.size < 4) {
      const cand = lvl.range[0] + Math.floor(Math.random() * (lvl.range[1] - lvl.range[0] + 1));
      options.add(cand);
    }
    const optsArr = Array.from(options).sort(() => Math.random() - 0.5);

    const answersGrid = document.getElementById('answersGrid');
    answersGrid.innerHTML = '';
    optsArr.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'ansBtn';
      btn.textContent = opt;
      btn.addEventListener('click', () => handleAnswer(btn, opt, n));
      answersGrid.appendChild(btn);
    });
  }

  function handleAnswer(btn, chosen, correctNum) {
    ensureAudio();
    if (chosen === correctNum) {
      sndCorrect();
      btn.classList.add('correct');
      document.querySelectorAll('.ansBtn').forEach(b => b.classList.add('disabled'));
      // Animação dos objetos pulando
      document.querySelectorAll('.obj').forEach((o, i) => {
        setTimeout(() => o.classList.add('celebrate'), i * 30);
      });
      // Confete
      showConfetti(btn);
      if (!firstTryWrong) {
        correct++;
        sndStar();
        flyStarTo();
      }
      setTimeout(() => {
        currentQ++;
        nextQuestion();
      }, 1300);
    } else {
      sndWrong();
      btn.classList.add('wrong');
      firstTryWrong = true;
      // destaca correto após pequeno delay
      setTimeout(() => {
        document.querySelectorAll('.ansBtn').forEach(b => {
          if (+b.textContent === correctNum) b.classList.add('correct');
        });
      }, 400);
      // re-habilita só o errado fica desabilitado
      btn.classList.add('disabled');
    }
  }

  function showConfetti(originBtn) {
    const rect = originBtn.getBoundingClientRect();
    const emojis = ['⭐', '✨', '🎉', '💫'];
    for (let i = 0; i < 12; i++) {
      const c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      c.style.left = (rect.left + rect.width/2) + 'px';
      c.style.top = (rect.top + rect.height/2) + 'px';
      c.style.setProperty('--dx', ((Math.random() - 0.5) * 300) + 'px');
      c.style.animationDuration = (1 + Math.random() * 0.8) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2200);
    }
  }

  function flyStarTo() {
    const score = document.getElementById('scoreNum');
    const cur = +score.textContent;
    score.textContent = cur + 1;
    score.style.animation = '';
    void score.offsetWidth;
    score.style.animation = 'jump .35s';
  }

  function endRound() {
    showScreen(endScreen);
    sndWin();
    const pct = correct / QUESTIONS_PER_ROUND;
    let earned = 0;
    if (pct >= 1) earned = 3;
    else if (pct >= 0.8) earned = 2;
    else if (pct >= 0.6) earned = 1;

    saveStars(currentLevel, earned);
    refreshMenu();

    document.getElementById('endScore').textContent = `Acertou ${correct} de ${QUESTIONS_PER_ROUND}`;
    const earnedStars = document.getElementById('earnedStars');
    earnedStars.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      s.style.animationDelay = (i * 0.15) + 's';
      earnedStars.appendChild(s);
    }

    let emoji, title;
    if (earned === 3) { emoji = '🏆'; title = 'PERFEITO!'; }
    else if (earned === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else if (earned === 1) { emoji = '👍'; title = 'Mandou bem!'; }
    else { emoji = '💪'; title = 'Tenta de novo!'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;
  }

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    startRound();
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    showScreen(menuScreen);
  });

  // NAVEGAÇÃO (back + home)
  (function setupNav() {
    const backEl = document.getElementById('backBtn');
    const homeEl = document.getElementById('homeBtn');
    function goHub() { parent.postMessage('back-to-hub', '*'); }
    function tap() { if (typeof ensureAudio === 'function') ensureAudio(); if (typeof sndTap === 'function') sndTap(); }
    if (backEl) backEl.addEventListener('click', () => {
      tap();
      const menu = document.getElementById('menuScreen');
      if (!menu || !menu.classList.contains('hidden')) { goHub(); return; }
      if (typeof showScreen === 'function') showScreen(menu);
      else { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); menu.classList.remove('hidden'); }
    });
    if (homeEl) homeEl.addEventListener('click', () => { tap(); goHub(); });
  })();

})();

      ['pacman', 'blg-pacman-stars-', 5, 15],
      ['tower', 'blg-tower-stars-', 3, 9],
    ];
    for (const [game, prefix, levels, max] of games) {

      const prog = document.querySelector('.card[data-game="' + game + '"] .progress');
      if (prog) {

<script>
(() => {
  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndFlip()    { beep(440, 0.05, 'triangle', 0.05); }
  function sndMatch()   { [523, 784, 1047].forEach((f, i) => beep(f, 0.10, 'triangle', 0.06, i*0.05)); }
  function sndNoMatch() { beep(220, 0.15, 'sine', 0.05); }
  function sndTap()     { beep(660, 0.04, 'triangle', 0.05); }
  function sndWin()     { [523, 659, 784, 880, 1047, 1318].forEach((f, i) => beep(f, 0.18, 'triangle', 0.07, i*0.08)); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // LEVELS
  const LEVELS = [
    { name:'Fácil',   pairs:3,  cols:2, optimal:3,  ok:5,  poor:8 },
    { name:'Médio',   pairs:8,  cols:4, optimal:10, ok:16, poor:24 },
    { name:'Difícil', pairs:12, cols:4, optimal:15, ok:25, poor:36 },
    { name:'Insano',  pairs:15, cols:5, optimal:20, ok:32, poor:48 },
  ];
  const EMOJI_POOL = ['🐶','🐱','🦊','🐻','🐼','🐨','🦁','🐯','🐸','🐵','🦄','🐙','🦋','🐝','🐠','🦖','🦓','🦩','🐧','🦚','🍎','🍊','🍋','🍇','🍓','🍑','🍒','🥝'];

  // STATS
  function getStars(lvl) { return +(localStorage.getItem('blg-memory-stars-' + lvl) || 0); }
  function saveStars(lvl, n) {
    const cur = getStars(lvl);
    if (n > cur) localStorage.setItem('blg-memory-stars-' + lvl, n);
  }
  function refreshMenu() {
    for (let i = 0; i < 4; i++) {
      const s = getStars(i);
      const container = document.getElementById('stars' + i);
      if (!container) continue;
      container.querySelectorAll('.s').forEach((el, idx) => {
        el.classList.toggle('lit', idx < s);
      });
    }
  }
  refreshMenu();

  // STATE
  let currentLevel = 0;
  let moves = 0, matches = 0;
  let firstPick = null;
  let lock = false;
  let totalPairs = 0;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      startGame();
    });
  });

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startGame() {
    const lvl = LEVELS[currentLevel];
    totalPairs = lvl.pairs;
    moves = 0;
    matches = 0;
    firstPick = null;
    lock = false;
    document.getElementById('movesNum').textContent = '0';
    document.getElementById('matchesNum').textContent = '0/' + totalPairs;

    // Pegar N emojis aleatórios, duplicar, embaralhar
    const pool = shuffle(EMOJI_POOL.slice()).slice(0, lvl.pairs);
    const cards = shuffle([...pool, ...pool]);

    const board = document.getElementById('board');
    board.className = 'board cols' + lvl.cols;
    board.innerHTML = '';
    cards.forEach((emoji, idx) => {
      const el = document.createElement('div');
      el.className = 'card3d';
      el.dataset.emoji = emoji;
      el.innerHTML = `
        <div class="card3d-inner">
          <div class="face face-back"></div>
          <div class="face face-front">${emoji}</div>
        </div>`;
      el.addEventListener('click', () => handleFlip(el));
      board.appendChild(el);
    });

    showScreen(gameScreen);
  }

  function handleFlip(el) {
    if (lock) return;
    if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
    ensureAudio();
    sndFlip();
    el.classList.add('flipped');

    if (!firstPick) {
      firstPick = el;
      return;
    }

    moves++;
    document.getElementById('movesNum').textContent = moves;

    if (firstPick.dataset.emoji === el.dataset.emoji) {
      // match
      const a = firstPick, b = el;
      firstPick = null;
      setTimeout(() => {
        sndMatch();
        a.classList.add('matched');
        b.classList.add('matched');
        matches++;
        document.getElementById('matchesNum').textContent = matches + '/' + totalPairs;
        if (matches === totalPairs) setTimeout(endGame, 700);
      }, 350);
    } else {
      // no match
      lock = true;
      const a = firstPick, b = el;
      firstPick = null;
      setTimeout(() => {
        sndNoMatch();
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        lock = false;
      }, 900);
    }
  }

  function endGame() {
    sndWin();
    const lvl = LEVELS[currentLevel];
    let earned;
    if (moves <= lvl.ok) earned = 3;
    else if (moves <= lvl.poor) earned = 2;
    else earned = 1;
    saveStars(currentLevel, earned);
    refreshMenu();

    showScreen(endScreen);
    document.getElementById('endScore').textContent =

<script>
(() => {
  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndEat()  { beep(880, 0.06, 'triangle', 0.07); setTimeout(() => beep(1320, 0.08, 'triangle', 0.06), 30); }
  function sndDie()  { beep(220, 0.3, 'sawtooth', 0.07); setTimeout(() => beep(110, 0.4, 'sawtooth', 0.06), 150); }
  function sndTap()  { beep(660, 0.04, 'triangle', 0.05); }
  function sndTurn() { beep(550, 0.03, 'triangle', 0.03); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // LEVELS
  const LEVELS = [
    { name:'Lento',  speed:200, goal3:10, goal2:6,  goal1:3 },
    { name:'Médio',  speed:130, goal3:15, goal2:8,  goal1:4 },
    { name:'Rápido', speed:90,  goal3:20, goal2:10, goal1:5 },
  ];
  const GRID_N = 15;     // 15x15 board
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const CELL = canvas.width / GRID_N;

  // STATS
  function getStars(lvl) { return +(localStorage.getItem('blg-snake-stars-' + lvl) || 0); }
  function saveStars(lvl, n) {
    const cur = getStars(lvl);
    if (n > cur) localStorage.setItem('blg-snake-stars-' + lvl, n);
  }
  function getBest(lvl) { return +(localStorage.getItem('blg-snake-best-' + lvl) || 0); }
  function saveBest(lvl, score) {
    if (score > getBest(lvl)) localStorage.setItem('blg-snake-best-' + lvl, score);
  }
  function refreshMenu() {
    for (let i = 0; i < 3; i++) {
      const s = getStars(i);
      const container = document.getElementById('stars' + i);
      container.querySelectorAll('.s').forEach((el, idx) => {
        el.classList.toggle('lit', idx < s);
      });
    }
  }
  refreshMenu();

  // STATE
  let currentLevel = 0;
  let snake = [];
  let dir = { x:1, y:0 };
  let nextDir = { x:1, y:0 };
  let fruit = null;
  let score = 0;
  let timerId = null;
  let running = false;
  let started = false;  // só começa a mexer após primeiro input

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      startGame();
    });
  });

  function startGame() {
    snake = [{x:7, y:7}, {x:6, y:7}, {x:5, y:7}];
    dir = { x:1, y:0 };
    nextDir = { x:1, y:0 };
    score = 0;
    started = false;
    running = true;
    document.getElementById('scoreNum').textContent = '0';
    document.getElementById('swipeHint').style.display = '';
    spawnFruit();
    render();
    showScreen(gameScreen);
  }

  function spawnFruit() {
    while (true) {
      const x = Math.floor(Math.random() * GRID_N);
      const y = Math.floor(Math.random() * GRID_N);
      if (!snake.some(s => s.x === x && s.y === y)) {
        fruit = { x, y };
        return;
      }
    }
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.x >= GRID_N || head.y < 0 || head.y >= GRID_N) return die();
    // self collision (exceto cauda que vai sair)
    for (let i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return die();
    }

    snake.unshift(head);

    if (head.x === fruit.x && head.y === fruit.y) {
      score++;
      document.getElementById('scoreNum').textContent = score;
      sndEat();
      spawnFruit();
    } else {
      snake.pop();
    }
    render();
  }

  function render() {
    ctx.fillStyle = '#0a2014';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // grid sutil
    ctx.strokeStyle = 'rgba(255,255,255,.03)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID_N; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height);
      ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }
    // fruta
    ctx.fillStyle = '#ef4444';
    ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(fruit.x * CELL + CELL/2, fruit.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // cobra
    snake.forEach((seg, i) => {
      const grad = ctx.createRadialGradient(
        seg.x * CELL + CELL/2, seg.y * CELL + CELL/2, 2,
        seg.x * CELL + CELL/2, seg.y * CELL + CELL/2, CELL
      );
      grad.addColorStop(0, i === 0 ? '#86efac' : '#4ade80');
      grad.addColorStop(1, '#16a34a');
      ctx.fillStyle = grad;
      const pad = i === 0 ? 1 : 2;
      ctx.fillRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - 2*pad, CELL - 2*pad);
      // olhos na cabeça
      if (i === 0) {
        ctx.fillStyle = '#000';
        const ex = seg.x * CELL + CELL/2 + dir.x * 4;
        const ey = seg.y * CELL + CELL/2 + dir.y * 4;
        ctx.beginPath();
        ctx.arc(ex - (dir.x === 0 ? 4 : 0), ey - (dir.y === 0 ? 4 : 0), 2, 0, Math.PI*2);
        ctx.arc(ex + (dir.x === 0 ? 4 : 0), ey + (dir.y === 0 ? 4 : 0), 2, 0, Math.PI*2);
        ctx.fill();
      }
    });
  }

  function die() {
    running = false;
    clearInterval(timerId);
    sndDie();
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, score);
    let earned = 0;
    if (score >= lvl.goal3) earned = 3;
    else if (score >= lvl.goal2) earned = 2;
    else if (score >= lvl.goal1) earned = 1;
    saveStars(currentLevel, earned);
    refreshMenu();

    document.getElementById('finalScore').textContent = score;
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent = score >= best ? `🏆 Novo recorde!` : `Melhor: ${best}`;
    const earnedStars = document.getElementById('earnedStars');
    earnedStars.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      s.style.animationDelay = (i * 0.15) + 's';
      earnedStars.appendChild(s);
    }
    let emoji, title;
    if (earned === 3) { emoji = '🏆'; title = 'PERFEITO!'; }
    else if (earned === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else if (earned === 1) { emoji = '👍'; title = 'Mandou bem!'; }
    else { emoji = '🐍'; title = 'Tenta de novo!'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;

    setTimeout(() => showScreen(endScreen), 600);
  }

  function setDir(dx, dy) {
    if (snake.length > 1) {
      // não deixa virar 180°
      if (dx === -dir.x && dy === -dir.y) return;
    }
    nextDir = { x: dx, y: dy };
    if (!started) {
      started = true;
      document.getElementById('swipeHint').style.display = 'none';
      const lvl = LEVELS[currentLevel];
      timerId = setInterval(step, lvl.speed);
    }
    sndTurn();
  }

  // DPAD
  document.querySelectorAll('.dpadBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      ensureAudio();
      const d = btn.dataset.dir;
      if (d === 'up')    setDir(0, -1);
      if (d === 'down')  setDir(0, 1);
      if (d === 'left')  setDir(-1, 0);
      if (d === 'right') setDir(1, 0);
    });
  });

  // SWIPE
  let touchStart = null;
  const board = canvas;
  board.addEventListener('touchstart', (e) => {
    ensureAudio();
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive:true });
  board.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX, absY) < 20) {  // tap = não conta como swipe
      touchStart = null;
      return;
    }
    if (absX > absY) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
  });

  // Teclado (desktop)
  window.addEventListener('keydown', (e) => {
    if (gameScreen.classList.contains('hidden')) return;
    if (e.key === 'ArrowUp' || e.key === 'w') setDir(0, -1);
    else if (e.key === 'ArrowDown' || e.key === 's') setDir(0, 1);
    else if (e.key === 'ArrowLeft' || e.key === 'a') setDir(-1, 0);
    else if (e.key === 'ArrowRight' || e.key === 'd') setDir(1, 0);
  });

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    startGame();
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    if (timerId) clearInterval(timerId);
    showScreen(menuScreen);
  });

  // NAVEGAÇÃO (back + home)
  (function setupNav() {
    const backEl = document.getElementById('backBtn');
    const homeEl = document.getElementById('homeBtn');
    function goHub() { parent.postMessage('back-to-hub', '*'); }
    function tap() { if (typeof ensureAudio === 'function') ensureAudio(); if (typeof sndTap === 'function') sndTap(); }
    if (backEl) backEl.addEventListener('click', () => {
      tap();
      const menu = document.getElementById('menuScreen');
      if (!menu || !menu.classList.contains('hidden')) { goHub(); return; }
      if (typeof showScreen === 'function') showScreen(menu);
      else { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); menu.classList.remove('hidden'); }
    });
    if (homeEl) homeEl.addEventListener('click', () => { tap(); goHub(); });
  })();

})();

<script>
  // Helper global pra atualizar progresso após voltar de jogo
  window.refreshHubStats = function() {
    // Dash
    let totalDone = 0, totalCoins = 0;
    for (let i = 0; i < 11; i++) {
      if (localStorage.getItem('cubo-dash-done-' + i) === '1') totalDone++;
      totalCoins += +(localStorage.getItem('cubo-dash-coins-' + i) || 0);
    }
    const td = document.getElementById('totalTrophies');
    const ts = document.getElementById('totalStars');
    if (td) td.textContent = totalDone + '/11';
    if (ts) ts.textContent = totalCoins + '/55';
    const dashProg = document.querySelector('.card[data-game="dash"] .progress');
    if (dashProg) {
      const bar = dashProg.querySelector('div');
      const pct = Math.round((totalDone * 100) / 11);
      if (pct > 0 || totalCoins > 0) {
        dashProg.classList.add('show');
        bar.style.width = Math.max(5, pct) + '%';
      }
    }
    // Outros jogos
    const games = [
      ['conta', 'blg-conta-stars-', 3, 9],
      ['memory', 'blg-memory-stars-', 4, 12],
      ['snake', 'blg-snake-stars-', 3, 9],
      ['letroca', 'blg-letroca-stars-', 3, 9],
      ['skyhop', 'blg-skyhop-stars-', 3, 9],
      ['platformer', 'blg-mario-stars-', 5, 15],
      ['cruzadas', 'blg-cruzadas-stars-', 6, 18],
      ['balloons', 'blg-balloons-stars-', 6, 18],
      ['animals', 'blg-animal-stars-', 3, 9],
      ['mole', 'blg-mole-stars-', 4, 12],
      ['g2048', 'blg-2048-stars-', 3, 9],
      ['tetris', 'blg-tetris-stars-', 3, 9],
      ['breakout', 'blg-breakout-stars-', 3, 9],
      ['race', 'blg-race-stars-', 5, 15],
      ['sokoban', 'blg-sokoban-stars-', 25, 75],
      ['invaders', 'blg-invaders-stars-', 3, 9],
      ['pacman', 'blg-pacman-stars-', 5, 15],
      ['tower', 'blg-tower-stars-', 3, 9],
    ];
    for (const [game, prefix, levels, max] of games) {
      let stars = 0;
      for (let i = 0; i < levels; i++) stars += +(localStorage.getItem(prefix + i) || 0);
      const prog = document.querySelector('.card[data-game="' + game + '"] .progress');
      if (prog) {
        const bar = prog.querySelector('div');
        if (stars > 0) {
          prog.classList.add('show');
          bar.style.width = Math.max(5, (stars / max) * 100) + '%';
        }
      }
    }
    // Piano: 1 valor único
    const pianoS = +(localStorage.getItem('blg-piano-stars') || 0);
    const pianoP = document.querySelector('.card[data-game="piano"] .progress');
    if (pianoP) {
      const bar = pianoP.querySelector('div');
      if (pianoS > 0) {
        pianoP.classList.add('show');
        bar.style.width = Math.max(5, (pianoS / 3) * 100) + '%';
      }
    }
    // Sudoku: 3 sizes × 3 diffs
    let sudokuS = 0;
    for (const sz of [4, 6, 9]) for (const df of ['Fácil', 'Médio', 'Difícil']) {
      sudokuS += +(localStorage.getItem('blg-sudoku-' + sz + '-' + df + '-stars') || 0);
    }
    const sudokuP = document.querySelector('.card[data-game="sudoku"] .progress');
    if (sudokuP) {
      const bar = sudokuP.querySelector('div');
      if (sudokuS > 0) {
        sudokuP.classList.add('show');
        bar.style.width = Math.max(5, (sudokuS / 27) * 100) + '%';
      }
    }
    // RPG: 1 valor único
    const rpgS = +(localStorage.getItem('blg-rpg-best-stars') || 0);
    const rpgP = document.querySelector('.card[data-game="rpg"] .progress');
    if (rpgP) {
      const bar = rpgP.querySelector('div');
      if (rpgS > 0) {
        rpgP.classList.add('show');
        bar.style.width = Math.max(5, (rpgS / 3) * 100) + '%';
      }
    }
  };

      { letters:'PALMA', words:['PALMA'] },
    ],
    2: [ // 6 letras
      { letters:'BANANA', words:['BANANA'] },
      { letters:'ESCOLA', words:['ESCOLA'] },
      { letters:'SALADA', words:['SALADA'] },
      { letters:'CINEMA', words:['CINEMA'] },
      { letters:'PIPOCA', words:['PIPOCA'] },
      { letters:'TUCANO', words:['TUCANO'] },
      { letters:'JANELA', words:['JANELA'] },
      { letters:'GORILA', words:['GORILA'] },
      { letters:'CABELO', words:['CABELO'] },
      { letters:'AMARGO', words:['AMARGO'] },
      { letters:'LIMITE', words:['LIMITE'] },
      { letters:'FUTURO', words:['FUTURO'] },
      { letters:'CAVALO', words:['CAVALO'] },
      { letters:'CADEIA', words:['CADEIA'] },
      { letters:'ONIBUS', words:['ONIBUS'] },
      { letters:'COMIDA', words:['COMIDA'] },
      { letters:'ESCURO', words:['ESCURO'] },
      { letters:'FERIAS', words:['FERIAS'] },
      { letters:'TIGELA', words:['TIGELA'] },
      { letters:'BOLERO', words:['BOLERO'] },
      { letters:'FAROIS', words:['FAROIS'] },
      { letters:'PRENDA', words:['PRENDA'] },
      { letters:'COELHO', words:['COELHO'] },
      { letters:'CIRCUS', words:['CIRCUS'] },
    ],
  };

  // Filtra puzzles sem words (sentinels) e palavras válidas (palavras reais)
  // Vou simplificar: só uso puzzles cuja primeira word seja a palavra-base mesmo
  function getPuzzles(lvl) {
    return PUZZLES[lvl].filter(p => p.words.length > 0 && p.words[0].length === p.letters.length);
  }

  const LEVELS = [
    { name:'Fácil',   time:90,  goal3:5,  goal2:3, goal1:1 },
    { name:'Médio',   time:90,  goal3:6,  goal2:3, goal1:1 },
    { name:'Difícil', time:120, goal3:6,  goal2:3, goal1:1 },
  ];

  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndTap()     { beep(660, 0.04, 'triangle', 0.05); }
  function sndLetter()  { beep(440 + Math.random()*200, 0.04, 'triangle', 0.04); }
  function sndValid()   { [523, 659, 880, 1047, 1318].forEach((f, i) => beep(f, 0.10, 'triangle', 0.06, i*0.05)); }
  function sndInvalid() { beep(180, 0.15, 'sawtooth', 0.06); setTimeout(() => beep(140, 0.18, 'sawtooth', 0.05), 80); }
  function sndHint()    { [659, 988, 1318].forEach((f, i) => beep(f, 0.08, 'triangle', 0.05, i*0.04)); }
  function sndTick()    { beep(800, 0.05, 'square', 0.03); }
  function sndEnd()     { [880, 659, 523, 392].forEach((f, i) => beep(f, 0.15, 'triangle', 0.06, i*0.1)); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // STATS
  function getStars(lvl) { return +(localStorage.getItem('blg-letroca-stars-' + lvl) || 0); }
  function saveStars(lvl, n) {
    const cur = getStars(lvl);
    if (n > cur) localStorage.setItem('blg-letroca-stars-' + lvl, n);
  }
  function getBest(lvl) { return +(localStorage.getItem('blg-letroca-best-' + lvl) || 0); }
  function saveBest(lvl, score) {
    if (score > getBest(lvl)) localStorage.setItem('blg-letroca-best-' + lvl, score);
  }
  function refreshMenu() {
    for (let i = 0; i < 3; i++) {
      const s = getStars(i);
      const container = document.getElementById('stars' + i);
      container.querySelectorAll('.s').forEach((el, idx) => {
        el.classList.toggle('lit', idx < s);
      });
    }
  }
  refreshMenu();

  // STATE
  let currentLevel = 0;
  let currentPuzzle = null;
  let formed = [];           // array de {char, tileIdx}
  let foundWords = [];
  let hintsRevealed = new Set();  // palavras com 1ª letra revelada
  let score = 0;
  let timeLeft = 0;
  let timerId = null;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      startGame();
    });
  });

  function shuffleStr(s) {
    return s.split('').sort(() => Math.random() - 0.5).join('');
  }

  function pickPuzzle() {
    const pool = getPuzzles(currentLevel);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function startGame() {
    score = 0;
    foundWords = [];
    document.getElementById('scoreNum').textContent = '0';
    document.getElementById('foundChips').innerHTML = '';
    currentPuzzle = pickPuzzle();
    timeLeft = LEVELS[currentLevel].time;
    updateTimer();
    renderPuzzle();
    showScreen(gameScreen);

    if (timerId) clearInterval(timerId);
    timerId = setInterval(() => {
      timeLeft--;
      updateTimer();
      if (timeLeft <= 10) sndTick();
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function updateTimer() {
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    const t = document.getElementById('timer');
    t.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    t.classList.toggle('warn', timeLeft <= 20 && timeLeft > 10);
    t.classList.toggle('crit', timeLeft <= 10);
  }

  function renderPuzzle() {
    formed = [];
    hintsRevealed = new Set();
    const letters = shuffleStr(currentPuzzle.letters);
    const row = document.getElementById('letters');
    row.innerHTML = '';
    [...letters].forEach((ch, idx) => {
      const btn = document.createElement('button');
      btn.className = 'letterTile';
      btn.textContent = ch;
      btn.dataset.idx = idx;
      btn.addEventListener('click', () => {
        if (btn.classList.contains('used')) return;
        ensureAudio();
        sndLetter();
        formed.push({ char: ch, tileIdx: idx });
        btn.classList.add('used');
        updateFormed();
        // Auto-confirma quando usar todas as letras disponíveis
        if (formed.length === currentPuzzle.letters.length) {
          setTimeout(() => document.getElementById('submitBtn').click(), 200);
        }
      });
      row.appendChild(btn);
    });
    updateFormed();
    updateHints();
  }

  function updateHints() {
    const remaining = currentPuzzle.words.filter(w => !foundWords.includes(w));
    const el = document.getElementById('hintsList');
    el.innerHTML = '';
    if (remaining.length === 0) {
      el.innerHTML = '<div style="opacity:.5;font-size:12px;">Próximo puzzle...</div>';
      return;
    }
    remaining.forEach(w => {
      const div = document.createElement('div');
      div.className = 'hintWord';
      let html = '';
      for (let i = 0; i < w.length; i++) {
        if (i === 0 && hintsRevealed.has(w)) {
          html += `<span class="rev">${w[0]}</span> `;
        } else {
          html += '_ ';
        }
      }
      div.innerHTML = html.trim();
      el.appendChild(div);
    });
  }

  function useHint() {
    ensureAudio();
    const remaining = currentPuzzle.words.filter(w => !foundWords.includes(w) && !hintsRevealed.has(w));
    if (remaining.length === 0) { sndInvalid(); return; }
    if (score < 5) {
      sndInvalid();
      const btn = document.getElementById('hintBtn');
      btn.classList.add('shake');
      setTimeout(() => btn.classList.remove('shake'), 400);
      return;
    }
    score -= 5;
    document.getElementById('scoreNum').textContent = score;
    const pick = remaining[Math.floor(Math.random() * remaining.length)];
    hintsRevealed.add(pick);
    updateHints();
    sndHint();
  }

  function updateFormed() {
    const el = document.getElementById('formed');
    el.textContent = formed.map(f => f.char).join('');
    el.classList.toggle('empty', formed.length === 0);
  }

  function clearFormed() {
    formed = [];
    document.querySelectorAll('.letterTile').forEach(t => t.classList.remove('used'));
    updateFormed();
  }

  document.getElementById('clearBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    clearFormed();
  });

  function fireErrorAnim() {
    const el = document.getElementById('formed');
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    const fl = document.getElementById('errorFlash');
    fl.classList.remove('fire'); void fl.offsetWidth; fl.classList.add('fire');
    const xx = document.getElementById('errorX');
    xx.classList.remove('fire'); void xx.offsetWidth; xx.classList.add('fire');
  }

  document.getElementById('submitBtn').addEventListener('click', () => {
    ensureAudio();
    const word = formed.map(f => f.char).join('');
    const el = document.getElementById('formed');

    if (word.length < 3) {
      sndInvalid();
      fireErrorAnim();
      return;
    }
    if (foundWords.includes(word)) {
      sndInvalid();
      fireErrorAnim();
      setTimeout(clearFormed, 500);
      return;
    }
    if (currentPuzzle.words.includes(word)) {
      // VÁLIDA
      sndValid();
      foundWords.push(word);
      score += word.length * 10;
      document.getElementById('scoreNum').textContent = score;
      const chip = document.createElement('span');
      chip.className = 'wordChip';
      chip.textContent = word;
      document.getElementById('foundChips').appendChild(chip);
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      updateHints();

      // Se achou todas, próximo puzzle
      if (foundWords.length >= currentPuzzle.words.length) {
        setTimeout(() => {
          foundWords = [];
          document.getElementById('foundChips').innerHTML = '';
          currentPuzzle = pickPuzzle();
          renderPuzzle();
        }, 900);
      } else {
        setTimeout(clearFormed, 400);
      }
    } else {
      sndInvalid();
      fireErrorAnim();
      setTimeout(clearFormed, 500);
    }
  });

  document.getElementById('hintBtn').addEventListener('click', useHint);

  function endGame() {
    clearInterval(timerId);
    sndEnd();
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, score);
    const numWords = foundWords.length;
    let earned = 0;
    if (numWords >= lvl.goal3) earned = 3;
    else if (numWords >= lvl.goal2) earned = 2;
    else if (numWords >= lvl.goal1) earned = 1;
    saveStars(currentLevel, earned);
    refreshMenu();

    document.getElementById('finalScore').textContent = score;
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent =
      `${numWords} palavra${numWords === 1 ? '' : 's'} encontrada${numWords === 1 ? '' : 's'}` +
      (score >= best ? ` · 🏆 recorde!` : best > 0 ? ` · melhor ${best}` : '');
    const earnedStars = document.getElementById('earnedStars');
    earnedStars.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      earnedStars.appendChild(s);
    }
    let emoji, title;
    if (earned === 3) { emoji = '🏆'; title = 'PERFEITO!'; }
    else if (earned === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else if (earned === 1) { emoji = '👍'; title = 'Conseguiu!'; }
    else { emoji = '🔤'; title = 'Tenta de novo!'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;

    setTimeout(() => showScreen(endScreen), 600);
  }

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    startGame();
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    if (timerId) clearInterval(timerId);
    showScreen(menuScreen);
  });

  // NAVEGAÇÃO (back + home)
  (function setupNav() {
    const backEl = document.getElementById('backBtn');
    const homeEl = document.getElementById('homeBtn');
    function goHub() { parent.postMessage('back-to-hub', '*'); }
    function tap() { if (typeof ensureAudio === 'function') ensureAudio(); if (typeof sndTap === 'function') sndTap(); }
    if (backEl) backEl.addEventListener('click', () => {
      tap();
      const menu = document.getElementById('menuScreen');
      if (!menu || !menu.classList.contains('hidden')) { goHub(); return; }
      if (typeof showScreen === 'function') showScreen(menu);
      else { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); menu.classList.remove('hidden'); }
    });
    if (homeEl) homeEl.addEventListener('click', () => { tap(); goHub(); });
  })();

})();

<script>
  // Helper global pra atualizar progresso após voltar de jogo
  window.refreshHubStats = function() {
    // Dash
    let totalDone = 0, totalCoins = 0;
    for (let i = 0; i < 11; i++) {
      if (localStorage.getItem('cubo-dash-done-' + i) === '1') totalDone++;
      totalCoins += +(localStorage.getItem('cubo-dash-coins-' + i) || 0);
    }
    const td = document.getElementById('totalTrophies');
    const ts = document.getElementById('totalStars');
    if (td) td.textContent = totalDone + '/11';
    if (ts) ts.textContent = totalCoins + '/55';
    const dashProg = document.querySelector('.card[data-game="dash"] .progress');
    if (dashProg) {
      const bar = dashProg.querySelector('div');
      const pct = Math.round((totalDone * 100) / 11);
      if (pct > 0 || totalCoins > 0) {
        dashProg.classList.add('show');
        bar.style.width = Math.max(5, pct) + '%';
      }
    }
    // Outros jogos
    const games = [
      ['conta', 'blg-conta-stars-', 3, 9],
      ['memory', 'blg-memory-stars-', 4, 12],
      ['snake', 'blg-snake-stars-', 3, 9],
      ['letroca', 'blg-letroca-stars-', 3, 9],
      ['skyhop', 'blg-skyhop-stars-', 3, 9],
      ['platformer', 'blg-mario-stars-', 5, 15],
      ['cruzadas', 'blg-cruzadas-stars-', 6, 18],
      ['balloons', 'blg-balloons-stars-', 6, 18],
      ['animals', 'blg-animal-stars-', 3, 9],
      ['mole', 'blg-mole-stars-', 4, 12],
      ['g2048', 'blg-2048-stars-', 3, 9],
      ['tetris', 'blg-tetris-stars-', 3, 9],
      ['breakout', 'blg-breakout-stars-', 3, 9],
      ['race', 'blg-race-stars-', 5, 15],
      ['sokoban', 'blg-sokoban-stars-', 25, 75],
      ['invaders', 'blg-invaders-stars-', 3, 9],
      ['pacman', 'blg-pacman-stars-', 5, 15],
      ['tower', 'blg-tower-stars-', 3, 9],
    ];
    for (const [game, prefix, levels, max] of games) {
      let stars = 0;
      for (let i = 0; i < levels; i++) stars += +(localStorage.getItem(prefix + i) || 0);
      const prog = document.querySelector('.card[data-game="' + game + '"] .progress');
      if (prog) {
        const bar = prog.querySelector('div');
        if (stars > 0) {
          prog.classList.add('show');
          bar.style.width = Math.max(5, (stars / max) * 100) + '%';
        }
      }
    }
    // Piano: 1 valor único
    const pianoS = +(localStorage.getItem('blg-piano-stars') || 0);
    const pianoP = document.querySelector('.card[data-game="piano"] .progress');
    if (pianoP) {
      const bar = pianoP.querySelector('div');
      if (pianoS > 0) {
        pianoP.classList.add('show');
        bar.style.width = Math.max(5, (pianoS / 3) * 100) + '%';
      }
    }
    // Sudoku: 3 sizes × 3 diffs
    let sudokuS = 0;
    for (const sz of [4, 6, 9]) for (const df of ['Fácil', 'Médio', 'Difícil']) {
      sudokuS += +(localStorage.getItem('blg-sudoku-' + sz + '-' + df + '-stars') || 0);
    }
    const sudokuP = document.querySelector('.card[data-game="sudoku"] .progress');
    if (sudokuP) {
      const bar = sudokuP.querySelector('div');
      if (sudokuS > 0) {
        sudokuP.classList.add('show');
        bar.style.width = Math.max(5, (sudokuS / 27) * 100) + '%';
      }
    }
    // RPG: 1 valor único
    const rpgS = +(localStorage.getItem('blg-rpg-best-stars') || 0);
    const rpgP = document.querySelector('.card[data-game="rpg"] .progress');
    if (rpgP) {
      const bar = rpgP.querySelector('div');
      if (rpgS > 0) {
        rpgP.classList.add('show');
        bar.style.width = Math.max(5, (rpgS / 3) * 100) + '%';
      }
    }
  };

<div id="stage">
  <header>
    <button class="iconBtn" id="backBtn" aria-label="Voltar">←</button>
    <div class="infoBar">🚀 <span class="num" id="scoreNum">0</span>m</div>
    <button class="iconBtn" id="homeBtn" aria-label="Início">🏠</button>
    <button class="iconBtn" id="muteBtn">🔊</button>
  </header>

  <!-- MENU -->
  <div id="menuScreen" class="screen">
    <h1>Sky Hop</h1>
    <div class="sub">Toque na lateral pra mover. Pule o mais alto que conseguir!</div>
    <div class="levelGrid">
      <div class="levelCard" data-lvl="0">
        <div class="lvlIcon">🌱</div>
        <div class="lvlInfo">
          <div class="lvlName">Tranquilo</div>
          <div class="lvlRange">Plataformas grandes</div>
        </div>
        <div class="lvlStars" id="stars0"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
      <div class="levelCard" data-lvl="1">
        <div class="lvlIcon">⚡</div>
        <div class="lvlInfo">
          <div class="lvlName">Normal</div>
          <div class="lvlRange">Mistura de plataformas</div>
        </div>
        <div class="lvlStars" id="stars1"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
      <div class="levelCard" data-lvl="2">
        <div class="lvlIcon">🔥</div>
        <div class="lvlInfo">
          <div class="lvlName">Caótico</div>
          <div class="lvlRange">Plataformas móveis</div>
        </div>
        <div class="lvlStars" id="stars2"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
    </div>
  </div>

  <!-- JOGO -->
  <div id="gameScreen" class="screen hidden">
    <canvas id="gameCanvas"></canvas>
    <div class="controls">
      <button class="ctrlBtn" id="btnLeft">◀</button>
      <button class="ctrlBtn" id="btnRight">▶</button>
    </div>
  </div>

  <!-- FIM -->
  <div id="endScreen" class="screen hidden">
    <div class="bigEmoji" id="endEmoji">🚀</div>
    <h2 id="endTitle">Acabou!</h2>
    <div class="score">Altura<span class="big" id="finalScore">0</span></div>
    <div class="best" id="bestMsg"></div>
    <div class="earnedStars" id="earnedStars"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
    <div class="btnRow">
      <button class="secondaryBtn" id="backMenuBtn">Voltar</button>
      <button class="primaryBtn" id="playAgainBtn">Jogar de novo</button>
    </div>
  </div>
</div>

<script>
(() => {
  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndJump()   { beep(440, 0.06, 'triangle', 0.05); setTimeout(() => beep(660, 0.04, 'triangle', 0.04), 30); }
  function sndSpring() { [660, 880, 1320].forEach((f, i) => beep(f, 0.08, 'triangle', 0.06, i*0.04)); }
  function sndDie()    { beep(330, 0.2, 'sawtooth', 0.07); setTimeout(() => beep(165, 0.3, 'sawtooth', 0.06), 100); }
  function sndTap()    { beep(660, 0.04, 'triangle', 0.05); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // LEVELS
  const LEVELS = [
    { name:'Tranquilo', plat_w:90,  spacing:80,  moveChance:0,    fragileChance:0,   springChance:0.15, goal3:150, goal2:80,  goal1:30 },
    { name:'Normal',    plat_w:75,  spacing:95,  moveChance:0.15, fragileChance:0.10, springChance:0.10, goal3:200, goal2:100, goal1:40 },
    { name:'Caótico',   plat_w:60,  spacing:110, moveChance:0.35, fragileChance:0.25, springChance:0.08, goal3:250, goal2:120, goal1:50 },
  ];

  // STATS
  function getStars(lvl) { return +(localStorage.getItem('blg-skyhop-stars-' + lvl) || 0); }
  function saveStars(lvl, n) {
    const cur = getStars(lvl);
    if (n > cur) localStorage.setItem('blg-skyhop-stars-' + lvl, n);
  }
  function getBest(lvl) { return +(localStorage.getItem('blg-skyhop-best-' + lvl) || 0); }
  function saveBest(lvl, score) {
    if (score > getBest(lvl)) localStorage.setItem('blg-skyhop-best-' + lvl, score);
  }
  function refreshMenu() {
    for (let i = 0; i < 3; i++) {
      const s = getStars(i);
      const container = document.getElementById('stars' + i);
      container.querySelectorAll('.s').forEach((el, idx) => {
        el.classList.toggle('lit', idx < s);
      });
    }
  }
  refreshMenu();

  // CANVAS
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // STATE
  let currentLevel = 0;
  let player, platforms, scroll, maxHeight, running = false;
  let inputLeft = false, inputRight = false;
  let lastTime = 0;

  const PLAYER_W = 36;
  const PLAYER_H = 38;
  const GRAVITY = 0.35;
  const JUMP_V = -12;
  const SPRING_V = -22;
  const MOVE_SPEED = 4.2;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      showScreen(gameScreen);
      setTimeout(() => { resize(); startGame(); }, 50);
    });
  });

  function startGame() {
    const lvl = LEVELS[currentLevel];
    platforms = [];
    scroll = 0;
    maxHeight = 0;
    running = true;
    player = { x: W/2 - PLAYER_W/2, y: H - 100, vx: 0, vy: JUMP_V };

    // Plataforma inicial (chão de partida)
    platforms.push({ x: W/2 - 60, y: H - 50, w: 120, type:'normal', dir:0, fragile:false, springged:false });

    // Gerar mais plataformas até bem acima do topo
    let lastY = H - 50;
    while (lastY > -2000) {
      lastY -= 40 + Math.random() * lvl.spacing;
      const px = Math.random() * (W - lvl.plat_w);
      const moving = Math.random() < lvl.moveChance;
      const fragile = !moving && Math.random() < lvl.fragileChance;
      const spring = !fragile && Math.random() < lvl.springChance;
      platforms.push({
        x: px,
        y: lastY,
        w: lvl.plat_w,
        type: moving ? 'moving' : (fragile ? 'fragile' : (spring ? 'spring' : 'normal')),
        dir: moving ? (Math.random() < 0.5 ? -1 : 1) : 0,
        fragile,
        used: false,
      });
    }

    document.getElementById('scoreNum').textContent = '0';
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(2, (now - lastTime) / 16.67);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    // input horizontal
    if (inputLeft) player.vx = -MOVE_SPEED;
    else if (inputRight) player.vx = MOVE_SPEED;
    else player.vx *= 0.85;

    player.x += player.vx * dt;
    // wrap horizontal
    if (player.x < -PLAYER_W) player.x = W;
    if (player.x > W) player.x = -PLAYER_W;

    // gravity
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;

    // colisão com plataformas (só descendo)
    if (player.vy > 0) {
      for (const p of platforms) {
        if (p.used) continue;
        const pad = 6;
        const playerBottom = player.y + PLAYER_H;
        if (playerBottom >= p.y && playerBottom <= p.y + 12 &&
            player.x + PLAYER_W - pad > p.x && player.x + pad < p.x + p.w) {
          // pousou
          if (p.type === 'spring') {
            player.vy = SPRING_V;
            sndSpring();
          } else {
            player.vy = JUMP_V;
            sndJump();
          }
          player.y = p.y - PLAYER_H;
          if (p.type === 'fragile') p.used = true;
          break;
        }
      }
    }

    // mover plataformas
    for (const p of platforms) {
      if (p.type === 'moving') {
        p.x += p.dir * 1.5 * dt;
        if (p.x < 0) { p.x = 0; p.dir = 1; }
        if (p.x + p.w > W) { p.x = W - p.w; p.dir = -1; }
      }
    }

    // scroll: quando player sobe acima da metade, mover cenário
    const threshold = H * 0.4;
    if (player.y < threshold) {
      const diff = threshold - player.y;
      player.y = threshold;
      scroll += diff;
      maxHeight = Math.max(maxHeight, Math.floor(scroll / 10));
      document.getElementById('scoreNum').textContent = maxHeight;
      // mover plataformas pra baixo (= mundo sobe)
      for (const p of platforms) p.y += diff;
      // remover plats fora do canvas
      platforms = platforms.filter(p => p.y < H + 200);
      // gerar novas no topo se necessário
      const lvl = LEVELS[currentLevel];
      let topY = Math.min(...platforms.map(p => p.y));
      while (topY > -500) {
        topY -= 40 + Math.random() * lvl.spacing;
        const moving = Math.random() < lvl.moveChance;
        const fragile = !moving && Math.random() < lvl.fragileChance;
        const spring = !fragile && Math.random() < lvl.springChance;
        platforms.push({
          x: Math.random() * (W - lvl.plat_w),
          y: topY,
          w: lvl.plat_w,
          type: moving ? 'moving' : (fragile ? 'fragile' : (spring ? 'spring' : 'normal')),
          dir: moving ? (Math.random() < 0.5 ? -1 : 1) : 0,
          fragile,
          used: false,
        });
      }
    }

    // morte: caiu fora da tela
    if (player.y > H + 50) die();
  }

  function render() {
    ctx.fillStyle = '#0c2540';
    ctx.fillRect(0, 0, W, H);
    // background com estrelas
    const numStars = 30;
    for (let i = 0; i < numStars; i++) {
      const sx = (i * 47 + scroll * 0.1) % W;
      const sy = (i * 71 + scroll * 0.2) % H;
      ctx.fillStyle = `rgba(255,255,255,${0.2 + (i % 5) * 0.1})`;
      ctx.beginPath();
      ctx.arc(sx, sy, 1 + (i % 3) * 0.5, 0, Math.PI*2);
      ctx.fill();
    }

    // plataformas
    for (const p of platforms) {
      if (p.y < -50 || p.y > H + 20) continue;
      let color1, color2;
      if (p.type === 'spring')      { color1 = '#fbbf24'; color2 = '#d97706'; }
      else if (p.type === 'fragile') { color1 = '#a78bfa'; color2 = '#7c3aed'; }
      else if (p.type === 'moving')  { color1 = '#f472b6'; color2 = '#be185d'; }
      else                           { color1 = '#06b6d4'; color2 = '#0284c7'; }
      const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + 12);
      grad.addColorStop(0, color1); grad.addColorStop(1, color2);
      ctx.fillStyle = grad;
      ctx.fillRect(p.x, p.y, p.w, 12);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(p.x, p.y, p.w, 12);
      // mola visualmente
      if (p.type === 'spring') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('↑', p.x + p.w/2, p.y + 9);
      }
    }

    // player
    ctx.save();
    ctx.translate(player.x + PLAYER_W/2, player.y + PLAYER_H/2);
    const tilt = player.vx * 0.05;
    ctx.rotate(tilt);
    // corpo (foguete estilizado)
    const grad = ctx.createLinearGradient(0, -PLAYER_H/2, 0, PLAYER_H/2);
    grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#06b6d4');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, -PLAYER_H/2);
    ctx.lineTo(PLAYER_W/2, PLAYER_H/4);
    ctx.lineTo(PLAYER_W/4, PLAYER_H/2);
    ctx.lineTo(-PLAYER_W/4, PLAYER_H/2);
    ctx.lineTo(-PLAYER_W/2, PLAYER_H/4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // janela do foguete
    ctx.fillStyle = '#0c2540';
    ctx.beginPath();
    ctx.arc(0, -2, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function die() {
    running = false;
    sndDie();
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, maxHeight);
    let earned = 0;
    if (maxHeight >= lvl.goal3) earned = 3;
    else if (maxHeight >= lvl.goal2) earned = 2;
    else if (maxHeight >= lvl.goal1) earned = 1;
    saveStars(currentLevel, earned);
    refreshMenu();

    document.getElementById('finalScore').textContent = maxHeight + 'm';
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent = maxHeight >= best ? '🏆 Novo recorde!' : `Melhor: ${best}m`;
    const earnedStars = document.getElementById('earnedStars');
    earnedStars.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      earnedStars.appendChild(s);
    }
    let emoji, title;
    if (earned === 3) { emoji = '🏆'; title = 'PERFEITO!'; }
    else if (earned === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else if (earned === 1) { emoji = '👍'; title = 'Bom!'; }
    else { emoji = '🚀'; title = 'Tenta de novo!'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;

    setTimeout(() => showScreen(endScreen), 800);
  }

  // Controles touch (botões visíveis)
  function bindBtn(el, set) {
    el.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); set(true); el.classList.add('active'); }, { passive:false });
    el.addEventListener('touchend',   (e) => { e.preventDefault(); set(false); el.classList.remove('active'); }, { passive:false });
    el.addEventListener('touchcancel', () => { set(false); el.classList.remove('active'); });
    el.addEventListener('mousedown',  () => { ensureAudio(); set(true); el.classList.add('active'); });
    el.addEventListener('mouseup',    () => { set(false); el.classList.remove('active'); });
    el.addEventListener('mouseleave', () => { set(false); el.classList.remove('active'); });
  }
  bindBtn(document.getElementById('btnLeft'),  (v) => inputLeft = v);
  bindBtn(document.getElementById('btnRight'), (v) => inputRight = v);

  // Teclado (desktop)
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputLeft = true;
    if (e.key === 'ArrowRight' || e.key === 'd') inputRight = true;
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputLeft = false;
    if (e.key === 'ArrowRight' || e.key === 'd') inputRight = false;
  });

  window.addEventListener('resize', () => {
    if (!gameScreen.classList.contains('hidden')) resize();
  });

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    showScreen(gameScreen);
    setTimeout(() => { resize(); startGame(); }, 50);
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    running = false;
    showScreen(menuScreen);
  });

  // NAVEGAÇÃO (back + home)
  (function setupNav() {
    const backEl = document.getElementById('backBtn');
    const homeEl = document.getElementById('homeBtn');
    function goHub() { parent.postMessage('back-to-hub', '*'); }
    function tap() { if (typeof ensureAudio === 'function') ensureAudio(); if (typeof sndTap === 'function') sndTap(); }
    if (backEl) backEl.addEventListener('click', () => {
      tap();
      const menu = document.getElementById('menuScreen');
      if (!menu || !menu.classList.contains('hidden')) { goHub(); return; }
      if (typeof showScreen === 'function') showScreen(menu);
      else { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); menu.classList.remove('hidden'); }
    });
    if (homeEl) homeEl.addEventListener('click', () => { tap(); goHub(); });
  })();

})();

<script>
  // Helper global pra atualizar progresso após voltar de jogo
  window.refreshHubStats = function() {
    // Dash
    let totalDone = 0, totalCoins = 0;
    for (let i = 0; i < 11; i++) {
      if (localStorage.getItem('cubo-dash-done-' + i) === '1') totalDone++;
      totalCoins += +(localStorage.getItem('cubo-dash-coins-' + i) || 0);
    }
    const td = document.getElementById('totalTrophies');
    const ts = document.getElementById('totalStars');
    if (td) td.textContent = totalDone + '/11';
    if (ts) ts.textContent = totalCoins + '/55';
    const dashProg = document.querySelector('.card[data-game="dash"] .progress');
    if (dashProg) {
      const bar = dashProg.querySelector('div');
      const pct = Math.round((totalDone * 100) / 11);
      if (pct > 0 || totalCoins > 0) {
        dashProg.classList.add('show');
        bar.style.width = Math.max(5, pct) + '%';
      }
    }
    // Outros jogos
    const games = [
      ['conta', 'blg-conta-stars-', 3, 9],
      ['memory', 'blg-memory-stars-', 4, 12],
      ['snake', 'blg-snake-stars-', 3, 9],
      ['letroca', 'blg-letroca-stars-', 3, 9],
      ['skyhop', 'blg-skyhop-stars-', 3, 9],
      ['platformer', 'blg-mario-stars-', 5, 15],
      ['cruzadas', 'blg-cruzadas-stars-', 6, 18],
      ['balloons', 'blg-balloons-stars-', 6, 18],
      ['animals', 'blg-animal-stars-', 3, 9],
      ['mole', 'blg-mole-stars-', 4, 12],
      ['g2048', 'blg-2048-stars-', 3, 9],
      ['tetris', 'blg-tetris-stars-', 3, 9],
      ['breakout', 'blg-breakout-stars-', 3, 9],
      ['race', 'blg-race-stars-', 5, 15],
      ['sokoban', 'blg-sokoban-stars-', 25, 75],
      ['invaders', 'blg-invaders-stars-', 3, 9],
      ['pacman', 'blg-pacman-stars-', 5, 15],
      ['tower', 'blg-tower-stars-', 3, 9],
    ];
    for (const [game, prefix, levels, max] of games) {
      let stars = 0;
      for (let i = 0; i < levels; i++) stars += +(localStorage.getItem(prefix + i) || 0);
      const prog = document.querySelector('.card[data-game="' + game + '"] .progress');
      if (prog) {
        const bar = prog.querySelector('div');
        if (stars > 0) {
          prog.classList.add('show');
          bar.style.width = Math.max(5, (stars / max) * 100) + '%';
        }
      }
    }
    // Piano: 1 valor único
    const pianoS = +(localStorage.getItem('blg-piano-stars') || 0);
    const pianoP = document.querySelector('.card[data-game="piano"] .progress');
    if (pianoP) {
      const bar = pianoP.querySelector('div');
      if (pianoS > 0) {
        pianoP.classList.add('show');
        bar.style.width = Math.max(5, (pianoS / 3) * 100) + '%';
      }
    }
    // Sudoku: 3 sizes × 3 diffs
    let sudokuS = 0;
    for (const sz of [4, 6, 9]) for (const df of ['Fácil', 'Médio', 'Difícil']) {
      sudokuS += +(localStorage.getItem('blg-sudoku-' + sz + '-' + df + '-stars') || 0);
    }
    const sudokuP = document.querySelector('.card[data-game="sudoku"] .progress');
    if (sudokuP) {
      const bar = sudokuP.querySelector('div');
      if (sudokuS > 0) {
        sudokuP.classList.add('show');
        bar.style.width = Math.max(5, (sudokuS / 27) * 100) + '%';
      }
    }
    // RPG: 1 valor único
    const rpgS = +(localStorage.getItem('blg-rpg-best-stars') || 0);
    const rpgP = document.querySelector('.card[data-game="rpg"] .progress');
    if (rpgP) {
      const bar = rpgP.querySelector('div');
      if (rpgS > 0) {
        rpgP.classList.add('show');
        bar.style.width = Math.max(5, (rpgS / 3) * 100) + '%';
      }
    }
  };
</script>
