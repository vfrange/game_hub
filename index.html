    { name:'Insano',  pairs:15, cols:5, optimal:20, ok:32, poor:48 },
  ];
  const EMOJI_POOL = ['🐶','🐱','🦊','🐻','🐼','🐨','🦁','🐯','🐸','🐵','🦄','🐙','🦋','🐝','🐠','🦖','🦓','🦩','🐧','🦚','🍎','🍊','🍋','🍇','🍓','🍑','🍒','🥝'];

  function getStars(lvl) { return +(localStorage.getItem('blg-memory-stars-' + lvl) || 0); }

  }
  function refreshMenu() {
    for (let i = 0; i < 4; i++) {
      const s = getStars(i);
      const container = document.getElementById('stars' + i);

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {

    if (el.classList.contains('flipped') || el.classList.contains('matched')) return;

  });

<script>
(() => {
  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndEat()  { beep(880, 0.06, 'triangle', 0.07); setTimeout(() => beep(1320, 0.08, 'triangle', 0.06), 30); }
  function sndDie()  { beep(220, 0.3, 'sawtooth', 0.07); setTimeout(() => beep(110, 0.4, 'sawtooth', 0.06), 150); }
  function sndTap()  { beep(660, 0.04, 'triangle', 0.05); }
  function sndTurn() { beep(550, 0.03, 'triangle', 0.03); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // LEVELS
  const LEVELS = [
    { name:'Lento',  speed:200, goal3:10, goal2:6,  goal1:3 },
    { name:'Médio',  speed:130, goal3:15, goal2:8,  goal1:4 },
    { name:'Rápido', speed:90,  goal3:20, goal2:10, goal1:5 },
  ];
  const GRID_N = 15;     // 15x15 board
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const CELL = canvas.width / GRID_N;

  // STATS
  function getStars(lvl) { return +(localStorage.getItem('blg-snake-stars-' + lvl) || 0); }
  function saveStars(lvl, n) {
    const cur = getStars(lvl);
    if (n > cur) localStorage.setItem('blg-snake-stars-' + lvl, n);
  }
  function getBest(lvl) { return +(localStorage.getItem('blg-snake-best-' + lvl) || 0); }
  function saveBest(lvl, score) {
    if (score > getBest(lvl)) localStorage.setItem('blg-snake-best-' + lvl, score);
  }
  function refreshMenu() {
    for (let i = 0; i < 3; i++) {
      const s = getStars(i);
      const container = document.getElementById('stars' + i);
      container.querySelectorAll('.s').forEach((el, idx) => {
        el.classList.toggle('lit', idx < s);
      });
    }
  }
  refreshMenu();

  // STATE
  let currentLevel = 0;
  let snake = [];
  let dir = { x:1, y:0 };
  let nextDir = { x:1, y:0 };
  let fruit = null;
  let score = 0;
  let timerId = null;
  let running = false;
  let started = false;  // só começa a mexer após primeiro input

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      startGame();
    });
  });

  function startGame() {
    snake = [{x:7, y:7}, {x:6, y:7}, {x:5, y:7}];
    dir = { x:1, y:0 };
    nextDir = { x:1, y:0 };
    score = 0;
    started = false;
    running = true;
    document.getElementById('scoreNum').textContent = '0';
    document.getElementById('swipeHint').style.display = '';
    spawnFruit();
    render();
    showScreen(gameScreen);
  }

  function spawnFruit() {
    while (true) {
      const x = Math.floor(Math.random() * GRID_N);
      const y = Math.floor(Math.random() * GRID_N);
      if (!snake.some(s => s.x === x && s.y === y)) {
        fruit = { x, y };
        return;
      }
    }
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.x >= GRID_N || head.y < 0 || head.y >= GRID_N) return die();
    // self collision (exceto cauda que vai sair)
    for (let i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return die();
    }

    snake.unshift(head);

    if (head.x === fruit.x && head.y === fruit.y) {
      score++;
      document.getElementById('scoreNum').textContent = score;
      sndEat();
      spawnFruit();
    } else {
      snake.pop();
    }
    render();
  }

  function render() {
    ctx.fillStyle = '#0a2014';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // grid sutil
    ctx.strokeStyle = 'rgba(255,255,255,.03)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID_N; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height);
      ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }
    // fruta
    ctx.fillStyle = '#ef4444';
    ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(fruit.x * CELL + CELL/2, fruit.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // cobra
    snake.forEach((seg, i) => {
      const grad = ctx.createRadialGradient(
        seg.x * CELL + CELL/2, seg.y * CELL + CELL/2, 2,
        seg.x * CELL + CELL/2, seg.y * CELL + CELL/2, CELL
      );
      grad.addColorStop(0, i === 0 ? '#86efac' : '#4ade80');
      grad.addColorStop(1, '#16a34a');
      ctx.fillStyle = grad;
      const pad = i === 0 ? 1 : 2;
      ctx.fillRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - 2*pad, CELL - 2*pad);
      // olhos na cabeça
      if (i === 0) {
        ctx.fillStyle = '#000';
        const ex = seg.x * CELL + CELL/2 + dir.x * 4;
        const ey = seg.y * CELL + CELL/2 + dir.y * 4;
        ctx.beginPath();
        ctx.arc(ex - (dir.x === 0 ? 4 : 0), ey - (dir.y === 0 ? 4 : 0), 2, 0, Math.PI*2);
        ctx.arc(ex + (dir.x === 0 ? 4 : 0), ey + (dir.y === 0 ? 4 : 0), 2, 0, Math.PI*2);
        ctx.fill();
      }
    });
  }

  function die() {
    running = false;
    clearInterval(timerId);
    sndDie();
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, score);
    let earned = 0;
    if (score >= lvl.goal3) earned = 3;
    else if (score >= lvl.goal2) earned = 2;
    else if (score >= lvl.goal1) earned = 1;
    saveStars(currentLevel, earned);
    refreshMenu();

    document.getElementById('finalScore').textContent = score;
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent = score >= best ? `🏆 Novo recorde!` : `Melhor: ${best}`;
    const earnedStars = document.getElementById('earnedStars');
    earnedStars.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      s.style.animationDelay = (i * 0.15) + 's';
      earnedStars.appendChild(s);
    }
    let emoji, title;
    if (earned === 3) { emoji = '🏆'; title = 'PERFEITO!'; }
    else if (earned === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else if (earned === 1) { emoji = '👍'; title = 'Mandou bem!'; }
    else { emoji = '🐍'; title = 'Tenta de novo!'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;

    setTimeout(() => showScreen(endScreen), 600);
  }

  function setDir(dx, dy) {
    if (snake.length > 1) {
      // não deixa virar 180°
      if (dx === -dir.x && dy === -dir.y) return;
    }
    nextDir = { x: dx, y: dy };
    if (!started) {
      started = true;
      document.getElementById('swipeHint').style.display = 'none';
      const lvl = LEVELS[currentLevel];
      timerId = setInterval(step, lvl.speed);
    }
    sndTurn();
  }

  // DPAD
  document.querySelectorAll('.dpadBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      ensureAudio();
      const d = btn.dataset.dir;
      if (d === 'up')    setDir(0, -1);
      if (d === 'down')  setDir(0, 1);
      if (d === 'left')  setDir(-1, 0);
      if (d === 'right') setDir(1, 0);
    });
  });

  // SWIPE
  let touchStart = null;
  const board = canvas;
  board.addEventListener('touchstart', (e) => {
    ensureAudio();
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive:true });
  board.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX, absY) < 20) {  // tap = não conta como swipe
      touchStart = null;
      return;
    }
    if (absX > absY) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
  });

  // Teclado (desktop)
  window.addEventListener('keydown', (e) => {
    if (gameScreen.classList.contains('hidden')) return;
    if (e.key === 'ArrowUp' || e.key === 'w') setDir(0, -1);
    else if (e.key === 'ArrowDown' || e.key === 's') setDir(0, 1);
    else if (e.key === 'ArrowLeft' || e.key === 'a') setDir(-1, 0);
    else if (e.key === 'ArrowRight' || e.key === 'd') setDir(1, 0);
  });

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    startGame();
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    if (timerId) clearInterval(timerId);
    showScreen(menuScreen);
  });
})();

      { letters:'FAROIS', words:['FAROIS','FARIOS'] },
      { letters:'GORILA', words:['GORILA','LARGIO'] },
      { letters:'JANELA', words:['JANELA','ALENAJ'] },
      { letters:'PRATEL', words:[] },
      { letters:'TUCANO', words:['TUCANO','CANUTO'] },
      { letters:'TRENZO', words:[] },
      { letters:'CINEMA', words:['CINEMA','AMICEN'] },
      { letters:'LIMITE', words:['LIMITE','MILITE'] },
      { letters:'CIRCUL', words:[] },
    ],
  };

  // Filtra puzzles sem words (sentinels) e palavras válidas (palavras reais)
  // Vou simplificar: só uso puzzles cuja primeira word seja a palavra-base mesmo
  function getPuzzles(lvl) {
    return PUZZLES[lvl].filter(p => p.words.length > 0 && p.words[0].length === p.letters.length);
  }

  const LEVELS = [
    { name:'Fácil',   time:90,  goal3:5,  goal2:3, goal1:1 },
    { name:'Médio',   time:90,  goal3:6,  goal2:3, goal1:1 },
    { name:'Difícil', time:120, goal3:6,  goal2:3, goal1:1 },
  ];

  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndTap()     { beep(660, 0.04, 'triangle', 0.05); }
  function sndLetter()  { beep(440 + Math.random()*200, 0.04, 'triangle', 0.04); }
  function sndValid()   { [523, 659, 880, 1047, 1318].forEach((f, i) => beep(f, 0.10, 'triangle', 0.06, i*0.05)); }
  function sndInvalid() { beep(180, 0.15, 'sawtooth', 0.06); setTimeout(() => beep(140, 0.18, 'sawtooth', 0.05), 80); }
  function sndHint()    { [659, 988, 1318].forEach((f, i) => beep(f, 0.08, 'triangle', 0.05, i*0.04)); }
  function sndTick()    { beep(800, 0.05, 'square', 0.03); }
  function sndEnd()     { [880, 659, 523, 392].forEach((f, i) => beep(f, 0.15, 'triangle', 0.06, i*0.1)); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // STATS
  function getStars(lvl) { return +(localStorage.getItem('blg-letroca-stars-' + lvl) || 0); }
  function saveStars(lvl, n) {
    const cur = getStars(lvl);
    if (n > cur) localStorage.setItem('blg-letroca-stars-' + lvl, n);
  }
  function getBest(lvl) { return +(localStorage.getItem('blg-letroca-best-' + lvl) || 0); }
  function saveBest(lvl, score) {
    if (score > getBest(lvl)) localStorage.setItem('blg-letroca-best-' + lvl, score);
  }
  function refreshMenu() {
    for (let i = 0; i < 3; i++) {
      const s = getStars(i);
      const container = document.getElementById('stars' + i);
      container.querySelectorAll('.s').forEach((el, idx) => {
        el.classList.toggle('lit', idx < s);
      });
    }
  }
  refreshMenu();

  // STATE
  let currentLevel = 0;
  let currentPuzzle = null;
  let formed = [];           // array de {char, tileIdx}
  let foundWords = [];
  let hintsRevealed = new Set();  // palavras com 1ª letra revelada
  let score = 0;
  let timeLeft = 0;
  let timerId = null;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {

  function shuffleStr(s) {
    return s.split('').sort(() => Math.random() - 0.5).join('');

  function pickPuzzle() {
    const pool = getPuzzles(currentLevel);

  function startGame() {

  function renderPuzzle() {
    formed = [];

    const letters = shuffleStr(currentPuzzle.letters);
    const row = document.getElementById('letters');
    row.innerHTML = '';
    [...letters].forEach((ch, idx) => {
      const btn = document.createElement('button');
      btn.className = 'letterTile';
      btn.textContent = ch;
      btn.dataset.idx = idx;
      btn.addEventListener('click', () => {
        if (btn.classList.contains('used')) return;
        ensureAudio();
        sndLetter();
        formed.push({ char: ch, tileIdx: idx });
        btn.classList.add('used');

      });
      row.appendChild(btn);
    });
    updateFormed();
    updateHints();
  }

  function updateHints() {
    const remaining = currentPuzzle.words.filter(w => !foundWords.includes(w));
    const el = document.getElementById('hintsList');
    el.innerHTML = '';
    if (remaining.length === 0) {
      el.innerHTML = '<div style="opacity:.5;font-size:12px;">Próximo puzzle...</div>';

          html += '_ ';
        }
      }
      div.innerHTML = html.trim();
      el.appendChild(div);
    });
  }

  function useHint() {
    ensureAudio();
    const remaining = currentPuzzle.words.filter(w => !foundWords.includes(w) && !hintsRevealed.has(w));
    if (remaining.length === 0) { sndInvalid(); return; }
    if (score < 5) {
      sndInvalid();
      const btn = document.getElementById('hintBtn');
      btn.classList.add('shake');
      setTimeout(() => btn.classList.remove('shake'), 400);
      return;
    }
    score -= 5;
    document.getElementById('scoreNum').textContent = score;
    const pick = remaining[Math.floor(Math.random() * remaining.length)];
    hintsRevealed.add(pick);

  }

  function updateFormed() {
    const el = document.getElementById('formed');

  }

  function clearFormed() {
    formed = [];

  }

  document.getElementById('clearBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();

  });

  function fireErrorAnim() {
    const el = document.getElementById('formed');
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    const fl = document.getElementById('errorFlash');
    fl.classList.remove('fire'); void fl.offsetWidth; fl.classList.add('fire');
    const xx = document.getElementById('errorX');
    xx.classList.remove('fire'); void xx.offsetWidth; xx.classList.add('fire');
  }

  document.getElementById('submitBtn').addEventListener('click', () => {
    ensureAudio();
    const word = formed.map(f => f.char).join('');
    const el = document.getElementById('formed');

    if (word.length < 3) {
      sndInvalid();
      fireErrorAnim();
      return;
    }
    if (foundWords.includes(word)) {
      sndInvalid();
      fireErrorAnim();
      setTimeout(clearFormed, 500);
      return;
    }
    if (currentPuzzle.words.includes(word)) {
      // VÁLIDA
      sndValid();
      foundWords.push(word);
      score += word.length * 10;
      document.getElementById('scoreNum').textContent = score;
      const chip = document.createElement('span');
      chip.className = 'wordChip';
      chip.textContent = word;
      document.getElementById('foundChips').appendChild(chip);
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      updateHints();

      // Se achou todas, próximo puzzle
      if (foundWords.length >= currentPuzzle.words.length) {
        setTimeout(() => {
          foundWords = [];
          document.getElementById('foundChips').innerHTML = '';
          currentPuzzle = pickPuzzle();
          renderPuzzle();
        }, 900);
      } else {
        setTimeout(clearFormed, 400);
      }
    } else {
      sndInvalid();
      fireErrorAnim();
      setTimeout(clearFormed, 500);
    }
  });

  document.getElementById('hintBtn').addEventListener('click', useHint);

  function endGame() {
    clearInterval(timerId);
    sndEnd();
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, score);
    const numWords = foundWords.length;
    let earned = 0;
    if (numWords >= lvl.goal3) earned = 3;
    else if (numWords >= lvl.goal2) earned = 2;
    else if (numWords >= lvl.goal1) earned = 1;
    saveStars(currentLevel, earned);
    refreshMenu();

    document.getElementById('finalScore').textContent = score;
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent =
      `${numWords} palavra${numWords === 1 ? '' : 's'} encontrada${numWords === 1 ? '' : 's'}` +
      (score >= best ? ` · 🏆 recorde!` : best > 0 ? ` · melhor ${best}` : '');
    const earnedStars = document.getElementById('earnedStars');
    earnedStars.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      earnedStars.appendChild(s);
    }
    let emoji, title;
    if (earned === 3) { emoji = '🏆'; title = 'PERFEITO!'; }
    else if (earned === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else if (earned === 1) { emoji = '👍'; title = 'Conseguiu!'; }
    else { emoji = '🔤'; title = 'Tenta de novo!'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;

    setTimeout(() => showScreen(endScreen), 600);
  }

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    startGame();
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    if (timerId) clearInterval(timerId);
    showScreen(menuScreen);
  });
})();

  function sndJump()   { beep(440, 0.06, 'triangle', 0.05); setTimeout(() => beep(660, 0.04, 'triangle', 0.04), 30); }
  function sndSpring() { [660, 880, 1320].forEach((f, i) => beep(f, 0.08, 'triangle', 0.06, i*0.04)); }
  function sndDie()    { beep(330, 0.2, 'sawtooth', 0.07); setTimeout(() => beep(165, 0.3, 'sawtooth', 0.06), 100); }
  function sndTap()    { beep(660, 0.04, 'triangle', 0.05); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // LEVELS
  const LEVELS = [
    { name:'Tranquilo', plat_w:90,  spacing:80,  moveChance:0,    fragileChance:0,   springChance:0.15, goal3:150, goal2:80,  goal1:30 },
    { name:'Normal',    plat_w:75,  spacing:95,  moveChance:0.15, fragileChance:0.10, springChance:0.10, goal3:200, goal2:100, goal1:40 },
    { name:'Caótico',   plat_w:60,  spacing:110, moveChance:0.35, fragileChance:0.25, springChance:0.08, goal3:250, goal2:120, goal1:50 },
  ];

  // STATS
  function getStars(lvl) { return +(localStorage.getItem('blg-skyhop-stars-' + lvl) || 0); }
  function saveStars(lvl, n) {
    const cur = getStars(lvl);
    if (n > cur) localStorage.setItem('blg-skyhop-stars-' + lvl, n);
  }
  function getBest(lvl) { return +(localStorage.getItem('blg-skyhop-best-' + lvl) || 0); }
  function saveBest(lvl, score) {
    if (score > getBest(lvl)) localStorage.setItem('blg-skyhop-best-' + lvl, score);
  }
  function refreshMenu() {
    for (let i = 0; i < 3; i++) {
      const s = getStars(i);
      const container = document.getElementById('stars' + i);
      container.querySelectorAll('.s').forEach((el, idx) => {
        el.classList.toggle('lit', idx < s);
      });
    }
  }
  refreshMenu();

  // CANVAS
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // STATE
  let currentLevel = 0;
  let player, platforms, scroll, maxHeight, running = false;
  let inputLeft = false, inputRight = false;
  let lastTime = 0;

  const PLAYER_W = 36;
  const PLAYER_H = 38;
  const GRAVITY = 0.35;
  const JUMP_V = -12;
  const SPRING_V = -22;
  const MOVE_SPEED = 4.2;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      showScreen(gameScreen);
      setTimeout(() => { resize(); startGame(); }, 50);
    });
  });

  function startGame() {
    const lvl = LEVELS[currentLevel];
    platforms = [];
    scroll = 0;
    maxHeight = 0;
    running = true;
    player = { x: W/2 - PLAYER_W/2, y: H - 100, vx: 0, vy: JUMP_V };

    // Plataforma inicial (chão de partida)
    platforms.push({ x: W/2 - 60, y: H - 50, w: 120, type:'normal', dir:0, fragile:false, springged:false });

    // Gerar mais plataformas até bem acima do topo
    let lastY = H - 50;
    while (lastY > -2000) {
      lastY -= 40 + Math.random() * lvl.spacing;
      const px = Math.random() * (W - lvl.plat_w);
      const moving = Math.random() < lvl.moveChance;
      const fragile = !moving && Math.random() < lvl.fragileChance;
      const spring = !fragile && Math.random() < lvl.springChance;
      platforms.push({
        x: px,
        y: lastY,
        w: lvl.plat_w,
        type: moving ? 'moving' : (fragile ? 'fragile' : (spring ? 'spring' : 'normal')),
        dir: moving ? (Math.random() < 0.5 ? -1 : 1) : 0,
        fragile,
        used: false,
      });
    }

    document.getElementById('scoreNum').textContent = '0';
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(2, (now - lastTime) / 16.67);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    // input horizontal
    if (inputLeft) player.vx = -MOVE_SPEED;
    else if (inputRight) player.vx = MOVE_SPEED;
    else player.vx *= 0.85;

    player.x += player.vx * dt;
    // wrap horizontal
    if (player.x < -PLAYER_W) player.x = W;
    if (player.x > W) player.x = -PLAYER_W;

    // gravity
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;

    // colisão com plataformas (só descendo)
    if (player.vy > 0) {
      for (const p of platforms) {
        if (p.used) continue;
        const pad = 6;
        const playerBottom = player.y + PLAYER_H;
        if (playerBottom >= p.y && playerBottom <= p.y + 12 &&
            player.x + PLAYER_W - pad > p.x && player.x + pad < p.x + p.w) {
          // pousou
          if (p.type === 'spring') {
            player.vy = SPRING_V;
            sndSpring();
          } else {
            player.vy = JUMP_V;
            sndJump();
          }
          player.y = p.y - PLAYER_H;
          if (p.type === 'fragile') p.used = true;
          break;
        }
      }
    }

    // mover plataformas
    for (const p of platforms) {
      if (p.type === 'moving') {
        p.x += p.dir * 1.5 * dt;
        if (p.x < 0) { p.x = 0; p.dir = 1; }
        if (p.x + p.w > W) { p.x = W - p.w; p.dir = -1; }
      }
    }

    // scroll: quando player sobe acima da metade, mover cenário
    const threshold = H * 0.4;
    if (player.y < threshold) {
      const diff = threshold - player.y;
      player.y = threshold;
      scroll += diff;
      maxHeight = Math.max(maxHeight, Math.floor(scroll / 10));
      document.getElementById('scoreNum').textContent = maxHeight;
      // mover plataformas pra baixo (= mundo sobe)
      for (const p of platforms) p.y += diff;
      // remover plats fora do canvas
      platforms = platforms.filter(p => p.y < H + 200);
      // gerar novas no topo se necessário
      const lvl = LEVELS[currentLevel];
      let topY = Math.min(...platforms.map(p => p.y));
      while (topY > -500) {
        topY -= 40 + Math.random() * lvl.spacing;
        const moving = Math.random() < lvl.moveChance;
        const fragile = !moving && Math.random() < lvl.fragileChance;
        const spring = !fragile && Math.random() < lvl.springChance;
        platforms.push({
          x: Math.random() * (W - lvl.plat_w),
          y: topY,
          w: lvl.plat_w,
          type: moving ? 'moving' : (fragile ? 'fragile' : (spring ? 'spring' : 'normal')),
          dir: moving ? (Math.random() < 0.5 ? -1 : 1) : 0,
          fragile,
          used: false,
        });
      }
    }

    // morte: caiu fora da tela
    if (player.y > H + 50) die();
  }

  function render() {
    ctx.fillStyle = '#0c2540';
    ctx.fillRect(0, 0, W, H);
    // background com estrelas
    const numStars = 30;
    for (let i = 0; i < numStars; i++) {
      const sx = (i * 47 + scroll * 0.1) % W;
      const sy = (i * 71 + scroll * 0.2) % H;
      ctx.fillStyle = `rgba(255,255,255,${0.2 + (i % 5) * 0.1})`;
      ctx.beginPath();
      ctx.arc(sx, sy, 1 + (i % 3) * 0.5, 0, Math.PI*2);
      ctx.fill();
    }

    // plataformas
    for (const p of platforms) {
      if (p.y < -50 || p.y > H + 20) continue;
      let color1, color2;
      if (p.type === 'spring')      { color1 = '#fbbf24'; color2 = '#d97706'; }
      else if (p.type === 'fragile') { color1 = '#a78bfa'; color2 = '#7c3aed'; }
      else if (p.type === 'moving')  { color1 = '#f472b6'; color2 = '#be185d'; }
      else                           { color1 = '#06b6d4'; color2 = '#0284c7'; }
      const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + 12);
      grad.addColorStop(0, color1); grad.addColorStop(1, color2);
      ctx.fillStyle = grad;
      ctx.fillRect(p.x, p.y, p.w, 12);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(p.x, p.y, p.w, 12);
      // mola visualmente
      if (p.type === 'spring') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('↑', p.x + p.w/2, p.y + 9);
      }
    }

    // player
    ctx.save();
    ctx.translate(player.x + PLAYER_W/2, player.y + PLAYER_H/2);
    const tilt = player.vx * 0.05;
    ctx.rotate(tilt);
    // corpo (foguete estilizado)
    const grad = ctx.createLinearGradient(0, -PLAYER_H/2, 0, PLAYER_H/2);
    grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#06b6d4');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, -PLAYER_H/2);
    ctx.lineTo(PLAYER_W/2, PLAYER_H/4);
    ctx.lineTo(PLAYER_W/4, PLAYER_H/2);
    ctx.lineTo(-PLAYER_W/4, PLAYER_H/2);
    ctx.lineTo(-PLAYER_W/2, PLAYER_H/4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // janela do foguete
    ctx.fillStyle = '#0c2540';
    ctx.beginPath();
    ctx.arc(0, -2, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function die() {
    running = false;
    sndDie();
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, maxHeight);
    let earned = 0;
    if (maxHeight >= lvl.goal3) earned = 3;
    else if (maxHeight >= lvl.goal2) earned = 2;
    else if (maxHeight >= lvl.goal1) earned = 1;
    saveStars(currentLevel, earned);
    refreshMenu();

    document.getElementById('finalScore').textContent = maxHeight + 'm';
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent = maxHeight >= best ? '🏆 Novo recorde!' : `Melhor: ${best}m`;
    const earnedStars = document.getElementById('earnedStars');
    earnedStars.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      earnedStars.appendChild(s);
    }
    let emoji, title;
    if (earned === 3) { emoji = '🏆'; title = 'PERFEITO!'; }
    else if (earned === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else if (earned === 1) { emoji = '👍'; title = 'Bom!'; }
    else { emoji = '🚀'; title = 'Tenta de novo!'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;

    setTimeout(() => showScreen(endScreen), 800);
  }

  // Controles touch (botões visíveis)
  function bindBtn(el, set) {
    el.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); set(true); el.classList.add('active'); }, { passive:false });
    el.addEventListener('touchend',   (e) => { e.preventDefault(); set(false); el.classList.remove('active'); }, { passive:false });
    el.addEventListener('touchcancel', () => { set(false); el.classList.remove('active'); });
    el.addEventListener('mousedown',  () => { ensureAudio(); set(true); el.classList.add('active'); });
    el.addEventListener('mouseup',    () => { set(false); el.classList.remove('active'); });
    el.addEventListener('mouseleave', () => { set(false); el.classList.remove('active'); });
  }
  bindBtn(document.getElementById('btnLeft'),  (v) => inputLeft = v);
  bindBtn(document.getElementById('btnRight'), (v) => inputRight = v);

  // Teclado (desktop)
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputLeft = true;
    if (e.key === 'ArrowRight' || e.key === 'd') inputRight = true;
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputLeft = false;
    if (e.key === 'ArrowRight' || e.key === 'd') inputRight = false;
  });

  window.addEventListener('resize', () => {
    if (!gameScreen.classList.contains('hidden')) resize();
  });

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    showScreen(gameScreen);
    setTimeout(() => { resize(); startGame(); }, 50);
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    running = false;
    showScreen(menuScreen);
  });
})();

<script>
  // Helper global pra atualizar progresso após voltar de jogo
  window.refreshHubStats = function() {
    // Dash
    let totalDone = 0, totalCoins = 0;
    for (let i = 0; i < 11; i++) {
      if (localStorage.getItem('cubo-dash-done-' + i) === '1') totalDone++;
      totalCoins += +(localStorage.getItem('cubo-dash-coins-' + i) || 0);
    }
    const td = document.getElementById('totalTrophies');
    const ts = document.getElementById('totalStars');
    if (td) td.textContent = totalDone + '/11';
    if (ts) ts.textContent = totalCoins + '/55';
    const dashProg = document.querySelector('.card[data-game="dash"] .progress');
    if (dashProg) {
      const bar = dashProg.querySelector('div');
      const pct = Math.round((totalDone * 100) / 11);
      if (pct > 0 || totalCoins > 0) {
        dashProg.classList.add('show');
        bar.style.width = Math.max(5, pct) + '%';
      }
    }
    // Outros jogos (todos com max 9 stars exceto Mario com 15)
    const games = [
      ['conta', 'blg-conta-stars-', 3, 9],
      ['memory', 'blg-memory-stars-', 3, 9],
      ['snake', 'blg-snake-stars-', 3, 9],
      ['letroca', 'blg-letroca-stars-', 3, 9],
      ['skyhop', 'blg-skyhop-stars-', 3, 9],
      ['platformer', 'blg-mario-stars-', 5, 15],
    ];
    for (const [game, prefix, levels, max] of games) {
      let stars = 0;
      for (let i = 0; i < levels; i++) stars += +(localStorage.getItem(prefix + i) || 0);
      const prog = document.querySelector('.card[data-game="' + game + '"] .progress');
      if (prog) {
        const bar = prog.querySelector('div');
        if (stars > 0) {
          prog.classList.add('show');
          bar.style.width = Math.max(5, (stars / max) * 100) + '%';
        }
      }
    }
  };

(() => {
  // =========== AUDIO ===========
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndJump()  { beep(440, 0.06, 'square', 0.05); setTimeout(() => beep(660, 0.06, 'square', 0.04), 40); }
  function sndCoin()  { beep(988, 0.05, 'triangle', 0.06); setTimeout(() => beep(1318, 0.08, 'triangle', 0.05), 30); }
  function sndStomp() { beep(220, 0.08, 'square', 0.06); setTimeout(() => beep(165, 0.1, 'square', 0.05), 50); }
  function sndDie()   { [440, 330, 220, 165].forEach((f, i) => beep(f, 0.15, 'sawtooth', 0.06, i*0.1)); }
  function sndWin()   { [523, 659, 784, 1047, 1318].forEach((f, i) => beep(f, 0.15, 'square', 0.06, i*0.1)); }
  function sndTap()   { beep(660, 0.04, 'triangle', 0.05); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // =========== FASES ===========
  // Tile map: '.' vazio, '#' chão, '=' plataforma, '?' moeda, 'E' inimigo, 'F' bandeira, 'P' start
  const STAGES = [
    {
      name: 'Tutorial',
      map: [
        '..............................',
        '..............................',
        '..............................',
        '..............................',
        '..............................',
        '..............................',
        '...........?......?......?....',
        '..............................',
        '..............................',
        '....P...................E....F',
        '##############################',
        '##############################',
      ],
    },
    {
      name: 'Buracos',
      map: [
        '..............................',
        '..............................',
        '..............................',
        '..............................',
        '..............................',
        '..............................',
        '..?...........?..........?....',
        '..............................',
        '..............................',
        '....P.....E...........E......F',
        '######....######...####....###',
        '######....######...####....###',
      ],
    },
    {
      name: 'Plataformas',
      map: [
        '..............................',
        '..............................',
        '..............................',
        '......?......?......?......?.',
        '....====...====...====...====',
        '..............................',
        '..............................',
        '..............................',
        '........E........E........E...',
        '....P........................F',
        '##############################',
        '##############################',
      ],
    },
    {
      name: 'Inimigos',
      map: [
        '..............................',
        '..............................',
        '..?.?.?.?.....?....?......?...',
        '..............................',
        '..====........====............',
        '..............................',
        '..............E.....E.........',
        '..............................',
        '....P..E.E..........E....E...F',
        '##############################',
        '##############################',
        '##############################',
      ],
    },
    {
      name: 'Boss',
      map: [
        '..............................',
        '..............................',
        '..............................',
        '......?....?....?....?....?...',
        '......=====================...',
        '..............................',
        '..............................',
        '......===......===......===...',
        '..............................',
        '....P.E....E....E....E....E..F',
        '##############################',
        '##############################',
      ],
    },
  ];
  const TILE = 32;       // pixels por tile
  const GRAVITY = 0.55;
  const JUMP_V = -11.5;
  const JUMP_HOLD = -0.45;  // boost por frame enquanto segura
  const MAX_HOLD = 14;       // frames de boost
  const MOVE_SPEED = 3.5;
  const PLAYER_W = 22;
  const PLAYER_H = 28;
  const ENEMY_W = 24;
  const ENEMY_H = 24;
  const ENEMY_SPEED = 1.0;

  // =========== STATS ===========
  function getStars(stage) { return +(localStorage.getItem('blg-mario-stars-' + stage) || 0); }
  function saveStars(stage, n) {
    const cur = getStars(stage);
    if (n > cur) localStorage.setItem('blg-mario-stars-' + stage, n);
  }
  function isUnlocked(stage) {
    return stage === 0 || getStars(stage - 1) > 0;
  }
  function refreshMenu() {
    const grid = document.getElementById('stageGrid');
    grid.innerHTML = '';
    STAGES.forEach((st, i) => {
      const card = document.createElement('div');
      card.className = 'stageCard' + (isUnlocked(i) ? '' : ' locked');
      const stars = getStars(i);
      card.innerHTML = `
        <div class="stageNum">${i + 1}</div>
        <div class="stageName">${st.name}</div>
        <div class="stageStars">
          <span class="s${stars >= 1 ? ' lit' : ''}">★</span>
          <span class="s${stars >= 2 ? ' lit' : ''}">★</span>
          <span class="s${stars >= 3 ? ' lit' : ''}">★</span>
        </div>`;
      card.addEventListener('click', () => {
        if (!isUnlocked(i)) return;
        ensureAudio(); sndTap();
        startStage(i);
      });
      grid.appendChild(card);
    });
  }
  refreshMenu();

  // =========== CANVAS / RENDER ===========
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let CW = 0, CH = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    CW = rect.width; CH = rect.height;
    canvas.width = CW * DPR; canvas.height = CH * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // =========== STATE ===========
  let currentStage = 0;
  let tiles = [];
  let WORLD_W = 0, WORLD_H = 0;
  let player, enemies, coins, flag;
  let coinsTotal = 0, coinsGot = 0;
  let lives = 3;
  let cameraX = 0;
  let running = false;
  let lastTime = 0;
  let inputLeft = false, inputRight = false, inputJump = false;
  let jumpHoldFrames = 0;
  let invuln = 0;
  let stageWon = false;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  function parseStage(stage) {
    const m = STAGES[stage].map;
    tiles = m.map(row => row.split(''));
    WORLD_W = m[0].length * TILE;
    WORLD_H = m.length * TILE;

    enemies = [];
    coins = [];
    flag = null;
    let startX = 0, startY = 0;
    coinsTotal = 0;

    for (let r = 0; r < tiles.length; r++) {
      for (let c = 0; c < tiles[r].length; c++) {
        const ch = tiles[r][c];
        const px = c * TILE, py = r * TILE;
        if (ch === 'P') { startX = px; startY = py - 4; tiles[r][c] = '.'; }
        else if (ch === 'E') { enemies.push({ x: px + 4, y: py + TILE - ENEMY_H, vx: -ENEMY_SPEED, vy: 0, alive: true }); tiles[r][c] = '.'; }
        else if (ch === '?') { coins.push({ x: px + TILE/2, y: py + TILE/2, taken: false, anim: Math.random() * Math.PI * 2 }); coinsTotal++; tiles[r][c] = '.'; }
        else if (ch === 'F') { flag = { x: px, y: py }; tiles[r][c] = '.'; }
      }
    }
    player = { x: startX, y: startY, vx: 0, vy: 0, onGround: false, facing: 1, alive: true };
  }

  function isSolid(r, c) {
    if (r < 0 || r >= tiles.length || c < 0 || c >= tiles[0].length) return false;
    const ch = tiles[r][c];
    return ch === '#' || ch === '=';
  }

  function startStage(stage) {
    currentStage = stage;
    lives = 3;
    document.getElementById('stageInfo').textContent = `Fase ${stage + 1}`;
    showScreen(gameScreen);
    setTimeout(() => { resize(); spawnStage(); }, 50);
  }

  function spawnStage() {
    parseStage(currentStage);
    coinsGot = 0;
    cameraX = 0;
    invuln = 30;
    stageWon = false;
    running = true;
    updateHUD();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function updateHUD() {
    document.getElementById('livesEl').textContent = '❤️'.repeat(lives) + '🤍'.repeat(Math.max(0, 3 - lives));
    document.getElementById('coinsEl').textContent = `🪙 ${coinsGot}/${coinsTotal}`;
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(2, (now - lastTime) / 16.67);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function tryMoveX(entity, dx, w, h) {
    entity.x += dx;
    // colide left/right
    const tilesToCheck = [
      { x: entity.x, y: entity.y },
      { x: entity.x + w - 1, y: entity.y },
      { x: entity.x, y: entity.y + h - 1 },
      { x: entity.x + w - 1, y: entity.y + h - 1 },
      { x: entity.x, y: entity.y + h/2 },
      { x: entity.x + w - 1, y: entity.y + h/2 },
    ];
    for (const p of tilesToCheck) {
      const c = Math.floor(p.x / TILE), r = Math.floor(p.y / TILE);
      if (isSolid(r, c)) {
        if (dx > 0) entity.x = c * TILE - w - 0.01;
        else if (dx < 0) entity.x = (c + 1) * TILE + 0.01;
        return true;
      }
    }
    return false;
  }

  function tryMoveY(entity, dy, w, h) {
    entity.y += dy;
    const tilesToCheck = [
      { x: entity.x, y: entity.y },
      { x: entity.x + w - 1, y: entity.y },
      { x: entity.x, y: entity.y + h - 1 },
      { x: entity.x + w - 1, y: entity.y + h - 1 },
      { x: entity.x + w/2, y: entity.y },
      { x: entity.x + w/2, y: entity.y + h - 1 },
    ];
    for (const p of tilesToCheck) {
      const c = Math.floor(p.x / TILE), r = Math.floor(p.y / TILE);
      if (isSolid(r, c)) {
        if (dy > 0) { entity.y = r * TILE - h - 0.01; return 'ground'; }
        else if (dy < 0) { entity.y = (r + 1) * TILE + 0.01; return 'ceil'; }
      }
    }
    return null;
  }

  function update(dt) {
    if (!player.alive || stageWon) return;
    if (invuln > 0) invuln--;

    // Input horizontal
    if (inputLeft && !inputRight) { player.vx = -MOVE_SPEED; player.facing = -1; }
    else if (inputRight && !inputLeft) { player.vx = MOVE_SPEED; player.facing = 1; }
    else player.vx *= 0.7;

    // Pulo
    if (inputJump && player.onGround && jumpHoldFrames === 0) {
      player.vy = JUMP_V;
      player.onGround = false;
      jumpHoldFrames = 1;
      sndJump();
    } else if (inputJump && jumpHoldFrames > 0 && jumpHoldFrames < MAX_HOLD && player.vy < 0) {
      player.vy += JUMP_HOLD;
      jumpHoldFrames++;
    } else if (!inputJump) {
      jumpHoldFrames = 0;
    }

    // Gravidade
    player.vy += GRAVITY * dt;
    if (player.vy > 14) player.vy = 14;

    // Movimento + colisão
    tryMoveX(player, player.vx * dt, PLAYER_W, PLAYER_H);
    const yResult = tryMoveY(player, player.vy * dt, PLAYER_W, PLAYER_H);
    if (yResult === 'ground') { player.onGround = true; player.vy = 0; }
    else if (yResult === 'ceil') { player.vy = 0; }
    else { player.onGround = false; }

    // World bounds
    if (player.x < 0) player.x = 0;
    if (player.x + PLAYER_W > WORLD_W) player.x = WORLD_W - PLAYER_W;

    // Caiu fora do mapa
    if (player.y > WORLD_H + 100) {
      die();
      return;
    }

    // Inimigos
    for (const e of enemies) {
      if (!e.alive) continue;
      // patrulha: se chão à frente não tem suporte, vira
      const aheadX = e.vx > 0 ? e.x + ENEMY_W : e.x - 1;
      const footY = e.y + ENEMY_H + 1;
      const aheadCol = Math.floor(aheadX / TILE);
      const footRow = Math.floor(footY / TILE);
      if (!isSolid(footRow, aheadCol)) e.vx *= -1;

      // gravidade
      e.vy += GRAVITY * dt;
      if (e.vy > 12) e.vy = 12;

      if (tryMoveX(e, e.vx * dt, ENEMY_W, ENEMY_H)) e.vx *= -1;
      tryMoveY(e, e.vy * dt, ENEMY_W, ENEMY_H);
    }

    // Colisão player vs inimigos
    if (invuln === 0) {
      for (const e of enemies) {
        if (!e.alive) continue;
        if (player.x < e.x + ENEMY_W && player.x + PLAYER_W > e.x &&
            player.y < e.y + ENEMY_H && player.y + PLAYER_H > e.y) {
          // Pisou em cima? (player descendo + bottom no topo do inimigo)
          if (player.vy > 0 && player.y + PLAYER_H - 10 < e.y) {
            e.alive = false;
            player.vy = JUMP_V * 0.7;  // pulinho
            sndStomp();
          } else {
            die();
            return;
          }
        }
      }
    }

    // Coleta moedas
    for (const c of coins) {
      if (c.taken) continue;
      c.anim += 0.1;
      const cx = c.x, cy = c.y;
      if (cx > player.x && cx < player.x + PLAYER_W &&
          cy > player.y && cy < player.y + PLAYER_H) {
        c.taken = true;
        coinsGot++;
        updateHUD();
        sndCoin();
      }
    }

    // Bandeira (vitória)
    if (flag && player.x + PLAYER_W > flag.x && player.x < flag.x + TILE &&
        player.y + PLAYER_H > flag.y && player.y < flag.y + TILE * 2) {
      stageWon = true;
      sndWin();
      setTimeout(winStage, 800);
    }

    // Câmera
    const targetCam = player.x - CW / 3;
    cameraX += (targetCam - cameraX) * 0.15;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > WORLD_W - CW) cameraX = WORLD_W - CW;
  }

  function die() {
    if (!player.alive) return;
    player.alive = false;
    lives--;
    updateHUD();
    sndDie();
    if (lives <= 0) {
      setTimeout(() => {
        running = false;
        stageWon = false;
        showEnd(false);
      }, 800);
    } else {
      setTimeout(spawnStage, 800);  // respawn da fase
    }
  }

  function winStage() {
    running = false;
    let earned = 1;
    const pct = coinsTotal > 0 ? coinsGot / coinsTotal : 1;
    if (pct >= 1) earned = 3;
    else if (pct >= 0.5) earned = 2;
    saveStars(currentStage, earned);
    refreshMenu();
    showEnd(true, earned);
  }

  function showEnd(won, earned) {
    if (won) {
      document.getElementById('endEmoji').textContent = earned === 3 ? '🏆' : (earned === 2 ? '🎉' : '🏁');
      document.getElementById('endTitle').textContent = earned === 3 ? 'PERFEITO!' : 'Você venceu!';
      document.getElementById('endScore').textContent =
        `${coinsGot}/${coinsTotal} moedas`;
      const earnedStars = document.getElementById('earnedStars');
      earnedStars.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const s = document.createElement('span');
        s.className = 's' + (i < earned ? ' lit' : '');
        s.textContent = '★';
        earnedStars.appendChild(s);
      }
      // Habilita próxima fase se houver
      const nextBtn = document.getElementById('nextBtn');
      if (currentStage < STAGES.length - 1) {
        nextBtn.textContent = 'Próxima';
        nextBtn.style.display = '';
        nextBtn.onclick = () => { sndTap(); startStage(currentStage + 1); };
      } else {
        nextBtn.style.display = 'none';
      }
    } else {
      document.getElementById('endEmoji').textContent = '💀';
      document.getElementById('endTitle').textContent = 'Sem vidas!';
      document.getElementById('endScore').textContent = 'Vai pegando o jeito!';
      document.getElementById('earnedStars').innerHTML = '<span class="s">★</span><span class="s">★</span><span class="s">★</span>';
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.textContent = 'Tentar de novo';
      nextBtn.style.display = '';
      nextBtn.onclick = () => { sndTap(); startStage(currentStage); };
    }
    showScreen(endScreen);
  }

  function render() {
    // céu
    const grad = ctx.createLinearGradient(0, 0, 0, CH);
    grad.addColorStop(0, '#3b82f6');
    grad.addColorStop(1, '#7dd3fc');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CW, CH);

    // nuvens parallax
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 220 - cameraX * 0.3) % (CW + 200)) - 100;
      const cy = 30 + (i * 17) % 80;
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.beginPath();
      ctx.arc(cx, cy, 18, 0, Math.PI*2);
      ctx.arc(cx + 18, cy + 4, 14, 0, Math.PI*2);
      ctx.arc(cx - 14, cy + 6, 12, 0, Math.PI*2);
      ctx.fill();
    }

    // scale world para caber na tela (mantém aspect)
    // simples: render direto, câmera só X
    const offsetY = CH - WORLD_H;  // alinha chão na base

    // tiles
    const startCol = Math.floor(cameraX / TILE);
    const endCol = Math.ceil((cameraX + CW) / TILE);
    for (let r = 0; r < tiles.length; r++) {
      for (let c = Math.max(0, startCol); c < Math.min(tiles[0].length, endCol + 1); c++) {
        const ch = tiles[r][c];
        if (ch === '#') {
          // chão (marrom com topo verde)
          const x = c * TILE - cameraX, y = r * TILE + offsetY;
          ctx.fillStyle = '#92400e';
          ctx.fillRect(x, y, TILE, TILE);
          if (r === 0 || tiles[r-1][c] !== '#') {
            ctx.fillStyle = '#16a34a';
            ctx.fillRect(x, y, TILE, 6);
          }
          ctx.strokeStyle = 'rgba(0,0,0,.2)';
          ctx.strokeRect(x, y, TILE, TILE);
        } else if (ch === '=') {
          // plataforma flutuante
          const x = c * TILE - cameraX, y = r * TILE + offsetY;
          ctx.fillStyle = '#d97706';
          ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = '#fbbf24';
          ctx.fillRect(x, y, TILE, 5);
          ctx.strokeStyle = 'rgba(0,0,0,.2)';
          ctx.strokeRect(x, y, TILE, TILE);
        }
      }
    }

    // moedas
    for (const co of coins) {
      if (co.taken) continue;
      const x = co.x - cameraX, y = co.y + offsetY;
      const wobble = Math.sin(co.anim) * 3;
      ctx.save();
      ctx.translate(x, y + wobble);
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#d97706';
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('$', 0, 1);
      ctx.restore();
    }

    // bandeira
    if (flag) {
      const x = flag.x - cameraX, y = flag.y + offsetY;
      ctx.fillStyle = '#666';
      ctx.fillRect(x + 14, y, 4, TILE * 3);
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(x + 18, y);
      ctx.lineTo(x + 18 + 18, y + 8);
      ctx.lineTo(x + 18, y + 16);
      ctx.closePath();
      ctx.fill();
    }

    // inimigos
    for (const e of enemies) {
      if (!e.alive) continue;
      const x = e.x - cameraX, y = e.y + offsetY;
      ctx.fillStyle = '#7c2d12';
      ctx.beginPath();
      ctx.ellipse(x + ENEMY_W/2, y + ENEMY_H/2, ENEMY_W/2, ENEMY_H/2, 0, 0, Math.PI*2);
      ctx.fill();
      // olhos
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x + 8, y + 10, 3, 0, Math.PI*2);
      ctx.arc(x + 16, y + 10, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(x + 8 + e.vx, y + 10, 1.5, 0, Math.PI*2);
      ctx.arc(x + 16 + e.vx, y + 10, 1.5, 0, Math.PI*2);
      ctx.fill();
    }

    // Player
    if (player.alive && (invuln === 0 || Math.floor(invuln / 4) % 2 === 0)) {
      const x = player.x - cameraX, y = player.y + offsetY;
      // corpo vermelho
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(x, y + 10, PLAYER_W, PLAYER_H - 10);
      // boné
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(x - 2, y, PLAYER_W + 4, 8);
      ctx.fillRect(x + 2, y - 2, PLAYER_W - 4, 4);
      // pele do rosto
      ctx.fillStyle = '#fde68a';
      ctx.fillRect(x + 2, y + 7, PLAYER_W - 4, 8);
      // olhos
      ctx.fillStyle = '#000';
      const eyeOffset = player.facing > 0 ? 0 : -2;
      ctx.fillRect(x + 8 + eyeOffset, y + 10, 2, 2);
      ctx.fillRect(x + 14 + eyeOffset, y + 10, 2, 2);
      // suspensórios
      ctx.fillStyle = '#1e40af';
      ctx.fillRect(x + 3, y + 15, 3, 13);
      ctx.fillRect(x + PLAYER_W - 6, y + 15, 3, 13);
    }
  }

  // =========== INPUTS ===========
  function bindBtn(el, set) {
    el.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); set(true); el.classList.add('active'); }, { passive:false });
    el.addEventListener('touchend', (e) => { e.preventDefault(); set(false); el.classList.remove('active'); }, { passive:false });
    el.addEventListener('touchcancel', () => { set(false); el.classList.remove('active'); });
    // mouse fallback
    el.addEventListener('mousedown', () => { ensureAudio(); set(true); el.classList.add('active'); });
    el.addEventListener('mouseup', () => { set(false); el.classList.remove('active'); });
    el.addEventListener('mouseleave', () => { set(false); el.classList.remove('active'); });
  }
  bindBtn(document.getElementById('btnLeft'),  (v) => inputLeft = v);
  bindBtn(document.getElementById('btnRight'), (v) => inputRight = v);
  bindBtn(document.getElementById('btnJump'),  (v) => inputJump = v);

  // Keyboard
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputLeft = true;
    if (e.key === 'ArrowRight' || e.key === 'd') inputRight = true;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') inputJump = true;
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputLeft = false;
    if (e.key === 'ArrowRight' || e.key === 'd') inputRight = false;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') inputJump = false;
  });

  window.addEventListener('resize', () => {
    if (!gameScreen.classList.contains('hidden')) resize();
  });

  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    running = false;
    showScreen(menuScreen);
  });
})();

<script>
  (() => {
    const iframe = document.getElementById('gameFrame');
    function loadGame(name) {
      const tpl = document.getElementById('game-' + name);
      if (!tpl) return;
      const src = tpl.textContent.replace(/<<<__SCRIPT_END__>>>/g, '<' + '/script>');
      iframe.srcdoc = src;
      iframe.classList.add('active');
      document.body.classList.add('gameMode');
    }
    function backToHub() {
      iframe.classList.remove('active');
      iframe.srcdoc = 'about:blank';
      document.body.classList.remove('gameMode');
      // Re-renderizar progresso lendo localStorage atualizado
      if (typeof window.refreshHubStats === 'function') window.refreshHubStats();
    }
    window.addEventListener('message', (e) => {
      if (e.data === 'back-to-hub' || (e.data && e.data.type === 'back-to-hub')) backToHub();
    });
    // Interceptar clique nos cards available
    document.querySelectorAll('button.card.available[data-game]').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        const g = btn.dataset.game;
        // map game name → template id
        const map = { dash:'dash', conta:'conta', memory:'memory', snake:'snake', letroca:'letroca', skyhop:'skyhop', platformer:'mario' };
        const tplId = map[g] || g;
        loadGame(tplId);
      });
    });
  })();
</script>
