  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndCrash() { beep(110, 0.4, 'sawtooth', 0.08); setTimeout(() => beep(55, 0.5, 'sawtooth', 0.07), 100); }
  function sndTap()   { beep(660, 0.04, 'triangle', 0.05); }
  function sndCheck() { beep(880, 0.06, 'triangle', 0.04); setTimeout(() => beep(1318, 0.08, 'triangle', 0.04), 30); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  const LEVELS = [
    { name:'Fácil',      speed:5,  spawnMs:1400, doubleProb:0,    goal3:1500, goal2:800,  goal1:300 },
    { name:'Médio',      speed:7,  spawnMs:900,  doubleProb:0,    goal3:2000, goal2:1100, goal1:400 },
    { name:'Difícil',    speed:9,  spawnMs:600,  doubleProb:0.15, goal3:2500, goal2:1400, goal1:500 },
    { name:'Insano',     speed:11, spawnMs:500,  doubleProb:0.40, goal3:3500, goal2:2000, goal1:700 },
    { name:'Impossível', speed:13, spawnMs:400,  doubleProb:0.60, goal3:4500, goal2:2500, goal1:900 },
  ];

  function getStars(l) { return +(localStorage.getItem('blg-race-stars-' + l) || 0); }
  function saveStars(l, n) { if (n > getStars(l)) localStorage.setItem('blg-race-stars-' + l, n); }
  function getBest(l) { return +(localStorage.getItem('blg-race-best-' + l) || 0); }
  function saveBest(l, s) { if (s > getBest(l)) localStorage.setItem('blg-race-best-' + l, s); }
  function refreshMenu() {
    for (let i = 0; i < 5; i++) {
      const s = getStars(i);
      const ct = document.getElementById('stars' + i);
      if (!ct) continue;
      ct.querySelectorAll('.s').forEach((el, idx) => el.classList.toggle('lit', idx < s));
    }
  }
  refreshMenu();

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  const CAR_COLORS = ['#ef4444','#3b82f6','#22c55e','#a855f7','#06b6d4'];
  let currentLevel = 0;
  let player = null;
  let enemies = [];
  let stripes = [];
  let score = 0, distance = 0, running = false;
  let inputLeft = false, inputRight = false;
  let lastTime = 0, lastSpawn = 0;
  let lastCheckpoint = 0;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      showScreen(gameScreen);
      setTimeout(() => { resize(); startGame(); }, 50);
    });
  });

  function startGame() {
    const lvl = LEVELS[currentLevel];
    player = { x: W / 2, y: H * 0.78, w: 44, h: 70, vx: 0 };
    enemies = [];
    score = 0;
    distance = 0;
    lastCheckpoint = 0;
    running = true;
    lastSpawn = 0;
    document.getElementById('scoreNum').textContent = '0';
    // listras da pista
    stripes = [];
    for (let i = 0; i < 8; i++) {
      stripes.push({ y: i * (H / 8) });
    }
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(2, (now - lastTime) / 16.67);
    lastTime = now;
    update(dt, now);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt, now) {
    const lvl = LEVELS[currentLevel];
    // movimento player
    if (inputLeft && !inputRight) player.vx = -5;
    else if (inputRight && !inputLeft) player.vx = 5;
    else player.vx *= 0.85;
    player.x += player.vx * dt;
    const roadL = W * 0.1, roadR = W * 0.9;
    if (player.x < roadL + player.w / 2) player.x = roadL + player.w / 2;
    if (player.x > roadR - player.w / 2) player.x = roadR - player.w / 2;

    // listras (animação)
    for (const s of stripes) {
      s.y += lvl.speed * dt;
      if (s.y > H) s.y = -40;
    }

    // spawn inimigos
    if (now - lastSpawn > lvl.spawnMs) {
      lastSpawn = now;
      const lanes = [W * 0.25, W * 0.5, W * 0.75];
      // Decide quantos spawnar (máximo 2 — sempre deixar 1 lane livre)
      const doSpawn2 = lvl.doubleProb > 0 && Math.random() < lvl.doubleProb;
      const numSpawn = doSpawn2 ? 2 : 1;
      // Embaralhar lanes e pegar as primeiras N
      const shuffled = lanes.slice().sort(() => Math.random() - 0.5);
      for (let i = 0; i < numSpawn; i++) {
        enemies.push({
          x: shuffled[i], y: -80, w: 40, h: 65,
          color: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)],
        });
      }
    }

    // mover inimigos
    for (const e of enemies) {
      e.y += lvl.speed * dt;
    }
    enemies = enemies.filter(e => e.y < H + 100);

    // colisão (AABB simples)
    for (const e of enemies) {
      if (Math.abs(e.x - player.x) < (e.w + player.w) / 2 - 6 &&
          Math.abs(e.y - player.y) < (e.h + player.h) / 2 - 6) {
        gameOver();
        return;
      }
    }

    // distância
    distance += lvl.speed * dt * 0.5;
    score = Math.floor(distance);
    document.getElementById('scoreNum').textContent = score;
    // checkpoint sons
    if (Math.floor(score / 100) > lastCheckpoint) {
      lastCheckpoint = Math.floor(score / 100);
      sndCheck();
    }
  }

  function render() {
    // céu / cenário lateral (verde grama)
    ctx.fillStyle = '#15803d';
    ctx.fillRect(0, 0, W, H);
    // pista
    const roadL = W * 0.1, roadR = W * 0.9;
    ctx.fillStyle = '#1f2937';
    ctx.fillRect(roadL, 0, roadR - roadL, H);
    // bordas
    ctx.fillStyle = '#fbbf24';
    ctx.fillRect(roadL - 4, 0, 4, H);
    ctx.fillRect(roadR, 0, 4, H);
    // listras central
    ctx.fillStyle = '#fde047';
    for (const s of stripes) {
      ctx.fillRect(W/2 - 3, s.y, 6, 24);
    }
    // inimigos
    for (const e of enemies) drawCar(e.x, e.y, e.w, e.h, e.color);
    // player
    drawCar(player.x, player.y, player.w, player.h, '#fb923c', true);
  }

  function drawCar(cx, cy, w, h, color, isPlayer=false) {
    const x = cx - w/2, y = cy - h/2;
    // corpo
    ctx.fillStyle = color;
    ctx.fillRect(x + 2, y, w - 4, h);
    // teto / vidro
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(x + 6, y + h * 0.2, w - 12, h * 0.25);
    ctx.fillRect(x + 6, y + h * 0.55, w - 12, h * 0.2);
    // rodas
    ctx.fillStyle = '#111';
    ctx.fillRect(x, y + 6, 4, 14);
    ctx.fillRect(x + w - 4, y + 6, 4, 14);
    ctx.fillRect(x, y + h - 20, 4, 14);
    ctx.fillRect(x + w - 4, y + h - 20, 4, 14);
    // faróis
    if (isPlayer) {
      ctx.fillStyle = '#fde047';
      ctx.fillRect(x + 6, y, 6, 4);
      ctx.fillRect(x + w - 12, y, 6, 4);
    } else {
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(x + 6, y + h - 4, 6, 4);
      ctx.fillRect(x + w - 12, y + h - 4, 6, 4);
    }
  }

  function gameOver() {
    running = false;
    sndCrash();
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, score);
    let earned = 0;
    if (score >= lvl.goal3) earned = 3;
    else if (score >= lvl.goal2) earned = 2;
    else if (score >= lvl.goal1) earned = 1;
    saveStars(currentLevel, earned);
    refreshMenu();

    document.getElementById('finalScore').textContent = score + 'm';
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent = score >= best ? '🏆 Novo recorde!' : `Melhor: ${best}m`;
    const es = document.getElementById('earnedStars');
    es.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      es.appendChild(s);
    }
    let emoji, title;
    if (earned === 3) { emoji = '🏆'; title = 'CRAQUE!'; }
    else if (earned === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else if (earned === 1) { emoji = '👍'; title = 'Bom!'; }
    else { emoji = '💥'; title = 'Bateu!'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;

    setTimeout(() => showScreen(endScreen), 700);
  }

  // CONTROLES
  function bindBtn(el, set) {
    el.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); set(true); el.classList.add('active'); }, { passive:false });
    el.addEventListener('touchend',   (e) => { e.preventDefault(); set(false); el.classList.remove('active'); }, { passive:false });
    el.addEventListener('touchcancel', () => { set(false); el.classList.remove('active'); });
    el.addEventListener('mousedown',  () => { ensureAudio(); set(true); el.classList.add('active'); });
    el.addEventListener('mouseup',    () => { set(false); el.classList.remove('active'); });
    el.addEventListener('mouseleave', () => { set(false); el.classList.remove('active'); });
  }
  bindBtn(document.getElementById('btnLeft'),  (v) => inputLeft = v);
  bindBtn(document.getElementById('btnRight'), (v) => inputRight = v);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputLeft = true;
    if (e.key === 'ArrowRight' || e.key === 'd') inputRight = true;
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputLeft = false;
    if (e.key === 'ArrowRight' || e.key === 'd') inputRight = false;
  });

  window.addEventListener('resize', () => { if (!gameScreen.classList.contains('hidden')) resize(); });

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    showScreen(gameScreen);
    setTimeout(() => { resize(); startGame(); }, 50);
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    running = false;
    showScreen(menuScreen);
  });

  // NAVEGAÇÃO (back + home)
  (function setupNav() {
    const backEl = document.getElementById('backBtn');
    const homeEl = document.getElementById('homeBtn');
    function goHub() { parent.postMessage('back-to-hub', '*'); }
    function tap() { if (typeof ensureAudio === 'function') ensureAudio(); if (typeof sndTap === 'function') sndTap(); }
    if (backEl) backEl.addEventListener('click', () => {
      tap();
      const menu = document.getElementById('menuScreen');
      if (!menu || !menu.classList.contains('hidden')) { goHub(); return; }
      if (typeof showScreen === 'function') showScreen(menu);
      else { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); menu.classList.remove('hidden'); }
    });
    if (homeEl) homeEl.addEventListener('click', () => { tap(); goHub(); });
  })();

})();

<script>
  // Helper global pra atualizar progresso após voltar de jogo
  window.refreshHubStats = function() {
    // Dash
    let totalDone = 0, totalCoins = 0;
    for (let i = 0; i < 11; i++) {
      if (localStorage.getItem('cubo-dash-done-' + i) === '1') totalDone++;
      totalCoins += +(localStorage.getItem('cubo-dash-coins-' + i) || 0);
    }
    const td = document.getElementById('totalTrophies');
    const ts = document.getElementById('totalStars');
    if (td) td.textContent = totalDone + '/11';
    if (ts) ts.textContent = totalCoins + '/55';
    const dashProg = document.querySelector('.card[data-game="dash"] .progress');
    if (dashProg) {
      const bar = dashProg.querySelector('div');
      const pct = Math.round((totalDone * 100) / 11);
      if (pct > 0 || totalCoins > 0) {
        dashProg.classList.add('show');
        bar.style.width = Math.max(5, pct) + '%';
      }
    }
    // Outros jogos
    const games = [
      ['conta', 'blg-conta-stars-', 3, 9],
      ['memory', 'blg-memory-stars-', 4, 12],
      ['snake', 'blg-snake-stars-', 3, 9],
      ['letroca', 'blg-letroca-stars-', 3, 9],
      ['skyhop', 'blg-skyhop-stars-', 3, 9],
      ['platformer', 'blg-mario-stars-', 5, 15],
      ['cruzadas', 'blg-cruzadas-stars-', 6, 18],
      ['balloons', 'blg-balloons-stars-', 6, 18],
      ['animals', 'blg-animal-stars-', 3, 9],
      ['mole', 'blg-mole-stars-', 4, 12],
      ['g2048', 'blg-2048-stars-', 3, 9],
      ['tetris', 'blg-tetris-stars-', 3, 9],
      ['breakout', 'blg-breakout-stars-', 3, 9],
      ['race', 'blg-race-stars-', 5, 15],
      ['sokoban', 'blg-sokoban-stars-', 25, 75],
      ['invaders', 'blg-invaders-stars-', 3, 9],
      ['pacman', 'blg-pacman-stars-', 5, 15],
      ['tower', 'blg-tower-stars-', 3, 9],
    ];
    for (const [game, prefix, levels, max] of games) {
      let stars = 0;
      for (let i = 0; i < levels; i++) stars += +(localStorage.getItem(prefix + i) || 0);
      const prog = document.querySelector('.card[data-game="' + game + '"] .progress');
      if (prog) {
        const bar = prog.querySelector('div');
        if (stars > 0) {
          prog.classList.add('show');
          bar.style.width = Math.max(5, (stars / max) * 100) + '%';
        }
      }
    }
    // Piano: 1 valor único
    const pianoS = +(localStorage.getItem('blg-piano-stars') || 0);
    const pianoP = document.querySelector('.card[data-game="piano"] .progress');
    if (pianoP) {
      const bar = pianoP.querySelector('div');
      if (pianoS > 0) {
        pianoP.classList.add('show');
        bar.style.width = Math.max(5, (pianoS / 3) * 100) + '%';
      }
    }
    // Sudoku: 3 sizes × 3 diffs
    let sudokuS = 0;
    for (const sz of [4, 6, 9]) for (const df of ['Fácil', 'Médio', 'Difícil']) {
      sudokuS += +(localStorage.getItem('blg-sudoku-' + sz + '-' + df + '-stars') || 0);
    }
    const sudokuP = document.querySelector('.card[data-game="sudoku"] .progress');
    if (sudokuP) {
      const bar = sudokuP.querySelector('div');
      if (sudokuS > 0) {
        sudokuP.classList.add('show');
        bar.style.width = Math.max(5, (sudokuS / 27) * 100) + '%';
      }
    }
    // RPG: 1 valor único
    const rpgS = +(localStorage.getItem('blg-rpg-best-stars') || 0);
    const rpgP = document.querySelector('.card[data-game="rpg"] .progress');
    if (rpgP) {
      const bar = rpgP.querySelector('div');
      if (rpgS > 0) {
        rpgP.classList.add('show');
        bar.style.width = Math.max(5, (rpgS / 3) * 100) + '%';
      }
    }
  };

  const LEVELS = [{"name":"Primeiro empurrão","grid":["#####","#.$@#","#####"],"optimal":1,"star3":2,"star2":3,"star1":8},{"name":"Pra cima","grid":["####","#. #","#$ #","#@ #","####"],"optimal":1,"star3":2,"star2":3,"star1":8},{"name":"Dá a volta","grid":["######","#  @ #","# $  #","#.   #","######"],"optimal":5,"star3":6,"star2":9,"star1":20},{"name":"Duas caixas","grid":["#######","#.   .#","#  $  #","#  $  #","#  @  #","#######"],"optimal":14,"star3":17,"star2":23,"star1":47},{"name":"O caminho longo","grid":["########","#.     #","### $  #","#   @  #","########"],"optimal":6,"star3":7,"star2":11,"star1":23},{"name":"Bem no meio","grid":["#######","#  .  #","#     #","#  $  #","#  @  #","#######"],"optimal":2,"star3":3,"star2":5,"star1":11},{"name":"Qual primeiro?","grid":["########","# .    #","# $    #","# $  . #","#    @ #","########"],"optimal":10,"star3":12,"star2":17,"star1":35},{"name":"Contorne","grid":["#######","#    .#","# ### #","# # $ #","# #   #","# @   #","#######"],"optimal":8,"star3":10,"star2":14,"star1":29},{"name":"Trio","grid":["########","# . . .#","#      #","# $ $ $#","#      #","#  @   #","########"],"optimal":16,"star3":19,"star2":26,"star1":53},{"name":"Travessia","grid":["#########","#.      #","#       #","#       #","#  $ @  #","#       #","#########"],"optimal":8,"star3":10,"star2":14,"star1":29},{"name":"Subindo","grid":["######","#  . #","#    #","#    #","# $  #","# @  #","######"],"optimal":6,"star3":7,"star2":11,"star1":23},{"name":"Dois cantos","grid":["########","#.    .#","#      #","#      #","# $  $ #","#  @   #","########"],"optimal":18,"star3":21,"star2":29,"star1":59},{"name":"Volta inteira","grid":["#######","#.    #","#     #","#  $  #","#     #","#   @ #","#######"],"optimal":8,"star3":10,"star2":14,"star1":29},{"name":"Três alvos","grid":["########","# . . .#","#      #","#  $$$ #","#      #","#   @  #","########"],"optimal":17,"star3":20,"star2":27,"star1":56},{"name":"Passagem","grid":["#########","#       #","#   .   #","#       #","## ### ##","#  $@   #","#       #","#########"],"optimal":10,"star3":12,"star2":17,"star1":35},{"name":"Volta longa","grid":["#######","#.    #","#     #","#  $  #","#     #","#  @  #","#######"],"optimal":7,"star3":9,"star2":12,"star1":26},{"name":"Espalhadas","grid":["#########","#.  .  .#","#       #","# $   $ #","#       #","#   $   #","#       #","#   @   #","#########"],"optimal":22,"star3":26,"star2":35,"star1":71},{"name":"Em volta","grid":["##########","#.       #","#        #","#        #","#   $    #","#        #","#   @    #","##########"],"optimal":9,"star3":11,"star2":15,"star1":32},{"name":"Quatro cantos","grid":["########","#.    .#","#      #","# $  $ #","# $  $ #","#      #","#.    .#","#  @   #","########"],"optimal":28,"star3":33,"star2":44,"star1":89},{"name":"Posicione","grid":["########","#.   . #","#      #","#      #","#      #","# $  $ #","#   @  #","########"],"optimal":17,"star3":20,"star2":27,"star1":56},{"name":"Planeja bem","grid":["##########","# . . .  #","#        #","#        #","# $ $ $  #","#        #","#   @    #","##########"],"optimal":22,"star3":26,"star2":35,"star1":71},{"name":"Caminho L","grid":["########","#      #","# .    #","#      #","#      #","#    $ #","#    @ #","########"],"optimal":8,"star3":10,"star2":14,"star1":29},{"name":"Quartento","grid":["#########","#.     .#","#       #","# $   $ #","#       #","#   @   #","#       #","# $   $ #","#       #","#.     .#","#########"],"optimal":38,"star3":44,"star2":59,"star1":119},{"name":"Quatro diagonais","grid":["##########","# . . . .#","#        #","# $      #","#  $     #","#   $    #","#    $   #","#     @  #","##########"],"optimal":37,"star3":43,"star2":57,"star1":116},{"name":"Mestre Sokoban","grid":["##########","#.      .#","#        #","# $    $ #","#        #","#   @    #","#        #","# $    $ #","#        #","#.      .#","##########"],"optimal":39,"star3":45,"star2":60,"star1":122}];

  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndStep() { beep(420, 0.03, 'triangle', 0.025); }
  function sndPush() { beep(180, 0.06, 'square', 0.045); setTimeout(() => beep(140, 0.05, 'square', 0.035), 30); }
  function sndOnGoal() { beep(880, 0.08, 'triangle', 0.06); setTimeout(() => beep(1175, 0.08, 'triangle', 0.05), 40); }
  function sndUndo() { beep(330, 0.05, 'triangle', 0.04); }
  function sndTap()  { beep(660, 0.04, 'triangle', 0.05); }
  function sndWin()  { [523, 659, 784, 880, 1047, 1318].forEach((f, i) => beep(f, 0.15, 'triangle', 0.06, i*0.08)); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // STATS
  function getStars(i) { return +(localStorage.getItem('blg-sokoban-stars-' + i) || 0); }
  function saveStars(i, n) { if (n > getStars(i)) localStorage.setItem('blg-sokoban-stars-' + i, n); }
  function getBest(i) { return +(localStorage.getItem('blg-sokoban-best-' + i) || 0); }
  function saveBest(i, m) {
    const b = getBest(i);
    if (b === 0 || m < b) localStorage.setItem('blg-sokoban-best-' + i, m);
  }

  // PARSER
  function parseLevel(grid) {
    const walls = new Set(), goals = new Set(), boxes = new Set();
    let player = null;
    const h = grid.length;
    let w = 0;
    for (const row of grid) w = Math.max(w, row.length);
    for (let y = 0; y < h; y++) {
      const row = grid[y].padEnd(w, ' ');
      for (let x = 0; x < w; x++) {
        const c = row[x];
        const k = x + ',' + y;
        if (c === '#') walls.add(k);
        else if (c === '.') goals.add(k);
        else if (c === '$') boxes.add(k);
        else if (c === '*') { boxes.add(k); goals.add(k); }
        else if (c === '@') player = [x, y];
        else if (c === '+') { player = [x, y]; goals.add(k); }
      }
    }
    return { w, h, walls, goals, boxes, player };
  }

  // STATE
  let currentLevel = 0;
  let levelData = null;
  let player = [0, 0];
  let boxes = new Set();
  let moves = 0;
  let history = [];
  let won = false;

  const canvas = document.getElementById('boardCanvas');
  const ctx = canvas.getContext('2d');
  let CELL = 0, OFFX = 0, OFFY = 0;

  function resize() {
    if (!levelData) return;
    const wrap = document.getElementById('boardWrap');
    const r = wrap.getBoundingClientRect();
    const maxW = r.width - 4;
    const maxH = r.height - 4;
    CELL = Math.floor(Math.min(maxW / levelData.w, maxH / levelData.h));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = levelData.w * CELL * dpr;
    canvas.height = levelData.h * CELL * dpr;
    canvas.style.width = (levelData.w * CELL) + 'px';
    canvas.style.height = (levelData.h * CELL) + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function refreshMenu() {
    const grid = document.getElementById('levelsGrid');
    grid.innerHTML = '';
    for (let i = 0; i < LEVELS.length; i++) {
      const stars = getStars(i);
      const card = document.createElement('div');
      card.className = 'lvlCard' + (stars > 0 ? ' done' : '');
      card.innerHTML = '<div class="lvlNum">' + (i + 1) + '</div>' +
        '<div class="lvlStars">' +
        ['★','★','★'].map((s, idx) => '<span class="s' + (idx < stars ? ' lit' : '') + '">' + s + '</span>').join('') +
        '</div>';
      card.addEventListener('click', () => {
        ensureAudio(); sndTap();
        currentLevel = i;
        startLevel();
      });
      grid.appendChild(card);
    }
  }

  function key(x, y) { return x + ',' + y; }

  function startLevel() {
    const lvl = LEVELS[currentLevel];
    levelData = parseLevel(lvl.grid);
    player = [...levelData.player];
    boxes = new Set(levelData.boxes);
    moves = 0;
    history = [];
    won = false;
    document.getElementById('headerText').textContent = 'Fase ' + (currentLevel + 1) + ': ' + lvl.name;
    document.getElementById('movesVal').textContent = '0';
    document.getElementById('movesVal').className = 'val';
    document.getElementById('optimalVal').textContent = lvl.optimal;
    showScreen(gameScreen);
    setTimeout(() => { resize(); render(); }, 30);
  }

  function tryMove(dx, dy) {
    if (won || !levelData) return;
    const [px, py] = player;
    const nx = px + dx, ny = py + dy;
    if (levelData.walls.has(key(nx, ny))) return;
    let pushed = false;
    let oldBoxes = null;
    if (boxes.has(key(nx, ny))) {
      const bx = nx + dx, by = ny + dy;
      if (levelData.walls.has(key(bx, by)) || boxes.has(key(bx, by))) return;
      oldBoxes = new Set(boxes);
      boxes.delete(key(nx, ny));
      boxes.add(key(bx, by));
      pushed = true;
    }
    history.push({ player: [px, py], boxes: oldBoxes });
    if (history.length > 200) history.shift();
    player = [nx, ny];
    moves++;
    document.getElementById('movesVal').textContent = moves;
    updateMovesColor();
    if (pushed) {
      if (levelData.goals.has(key(nx + dx, ny + dy))) sndOnGoal();
      else sndPush();
    } else {
      sndStep();
    }
    render();
    checkWin();
  }

  function updateMovesColor() {
    const lvl = LEVELS[currentLevel];
    const el = document.getElementById('movesVal');
    el.className = 'val';
    if (moves > lvl.star1) el.className = 'val crit';
    else if (moves > lvl.star2) el.className = 'val warn';
  }

  function undo() {
    if (history.length === 0 || won) return;
    const last = history.pop();
    player = [...last.player];
    if (last.boxes) boxes = new Set(last.boxes);
    moves++;  // undo CONTA como movimento (clássico Sokoban)
    document.getElementById('movesVal').textContent = moves;
    updateMovesColor();
    sndUndo();
    render();
  }

  function restart() {
    if (!levelData) return;
    player = [...levelData.player];
    boxes = new Set(levelData.boxes);
    moves = 0;
    history = [];
    won = false;
    document.getElementById('movesVal').textContent = '0';
    document.getElementById('movesVal').className = 'val';
    sndTap();
    render();
  }

  function checkWin() {
    for (const g of levelData.goals) {
      if (!boxes.has(g)) return;
    }
    won = true;
    sndWin();
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, moves);
    let stars = 0;
    if (moves <= lvl.star3) stars = 3;
    else if (moves <= lvl.star2) stars = 2;
    else if (moves <= lvl.star1) stars = 1;
    else stars = 1;  // sempre garante 1 estrela por completar
    saveStars(currentLevel, stars);
    showEndScreen(stars);
  }

  function showEndScreen(stars) {
    const lvl = LEVELS[currentLevel];
    document.getElementById('levelNameEnd').textContent = lvl.name;
    document.getElementById('finalMoves').textContent = moves;
    document.getElementById('finalOptimal').textContent = lvl.optimal;
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent = moves <= best ? '🏆 Seu melhor: ' + best + ' movs!' : 'Melhor: ' + best + ' movs';
    const es = document.getElementById('earnedStars');
    es.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < stars ? ' lit' : '');
      s.textContent = '★';
      es.appendChild(s);
    }
    let emoji, title;
    if (stars === 3) { emoji = '🏆'; title = 'PERFEITO!'; }
    else if (stars === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else { emoji = '👍'; title = 'Completou!'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;
    document.getElementById('nextBtn').textContent = (currentLevel < LEVELS.length - 1) ? 'Próxima →' : 'Menu';
    setTimeout(() => showScreen(endScreen), 600);
  }

  function render() {
    if (!levelData || !CELL) return;
    const w = levelData.w * CELL, h = levelData.h * CELL;
    ctx.fillStyle = '#2a1810';
    ctx.fillRect(0, 0, w, h);

    // Floor + walls
    for (let y = 0; y < levelData.h; y++) {
      for (let x = 0; x < levelData.w; x++) {
        const k = key(x, y);
        const px = x * CELL, py = y * CELL;
        if (levelData.walls.has(k)) {
          drawWall(px, py);
        } else {
          drawFloor(px, py);
        }
      }
    }

    // Goals (camada acima do floor, abaixo das boxes)
    for (const g of levelData.goals) {
      const [gx, gy] = g.split(',').map(Number);
      drawGoal(gx * CELL, gy * CELL);
    }

    // Boxes
    for (const b of boxes) {
      const [bx, by] = b.split(',').map(Number);
      const onGoal = levelData.goals.has(b);
      drawBox(bx * CELL, by * CELL, onGoal);
    }

    // Player
    drawPlayer(player[0] * CELL, player[1] * CELL);
  }

  function drawWall(x, y) {
    ctx.fillStyle = '#6b4423';
    ctx.fillRect(x, y, CELL, CELL);
    ctx.fillStyle = '#4a2f17';
    ctx.fillRect(x, y + CELL - 3, CELL, 3);
    ctx.fillRect(x + CELL - 3, y, 3, CELL);
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(x, y, CELL, 3);
    ctx.fillRect(x, y, 3, CELL);
    // brick pattern
    ctx.strokeStyle = 'rgba(0,0,0,.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y + CELL/2); ctx.lineTo(x + CELL, y + CELL/2);
    ctx.stroke();
  }
  function drawFloor(x, y) {
    ctx.fillStyle = '#d4a574';
    ctx.fillRect(x, y, CELL, CELL);
    ctx.fillStyle = 'rgba(0,0,0,.06)';
    ctx.fillRect(x + CELL - 1, y, 1, CELL);
    ctx.fillRect(x, y + CELL - 1, CELL, 1);
  }
  function drawGoal(x, y) {
    const cx = x + CELL/2, cy = y + CELL/2;
    ctx.fillStyle = 'rgba(251,191,36,.35)';
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 0.32, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 0.32, 0, Math.PI*2);
    ctx.stroke();
    // X marking
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 1.5;
    const m = CELL * 0.18;
    ctx.beginPath();
    ctx.moveTo(cx - m, cy - m); ctx.lineTo(cx + m, cy + m);
    ctx.moveTo(cx + m, cy - m); ctx.lineTo(cx - m, cy + m);
    ctx.stroke();
  }
  function drawBox(x, y, onGoal) {
    const m = 3;
    if (onGoal) {
      // verde
      const grad = ctx.createLinearGradient(x, y, x, y + CELL);
      grad.addColorStop(0, '#22c55e');
      grad.addColorStop(1, '#15803d');
      ctx.fillStyle = grad;
    } else {
      const grad = ctx.createLinearGradient(x, y, x, y + CELL);
      grad.addColorStop(0, '#a16207');
      grad.addColorStop(1, '#713f12');
      ctx.fillStyle = grad;
    }
    ctx.fillRect(x + m, y + m, CELL - m*2, CELL - m*2);
    ctx.strokeStyle = onGoal ? '#86efac' : '#fbbf24';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + m, y + m, CELL - m*2, CELL - m*2);
    // X interno (madeira)
    ctx.strokeStyle = onGoal ? 'rgba(255,255,255,.4)' : 'rgba(0,0,0,.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + m, y + m); ctx.lineTo(x + CELL - m, y + CELL - m);
    ctx.moveTo(x + CELL - m, y + m); ctx.lineTo(x + m, y + CELL - m);
    ctx.stroke();
  }
  function drawPlayer(x, y) {
    const cx = x + CELL/2, cy = y + CELL/2;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath();
    ctx.ellipse(cx, y + CELL - 4, CELL * 0.3, CELL * 0.08, 0, 0, Math.PI*2);
    ctx.fill();
    // body
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath();
    ctx.arc(cx, cy + 4, CELL * 0.28, 0, Math.PI*2);
    ctx.fill();
    // head
    ctx.fillStyle = '#fde68a';
    ctx.beginPath();
    ctx.arc(cx, cy - CELL*0.15, CELL * 0.18, 0, Math.PI*2);
    ctx.fill();
    // eyes
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(cx - CELL*0.07, cy - CELL*0.17, 1.5, 0, Math.PI*2);
    ctx.arc(cx + CELL*0.07, cy - CELL*0.17, 1.5, 0, Math.PI*2);
    ctx.fill();
  }

  // SCREENS
  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
    if (s === menuScreen) refreshMenu();
  }

  // BACK
  document.getElementById('backBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    if (!menuScreen.classList.contains('hidden')) {
      parent.postMessage('back-to-hub', '*');
    } else {
      showScreen(menuScreen);
    }
  });

  // CONTROLES
  document.getElementById('btnUp').addEventListener('click', () => { ensureAudio(); tryMove(0, -1); });
  document.getElementById('btnDown').addEventListener('click', () => { ensureAudio(); tryMove(0, 1); });
  document.getElementById('btnLeft').addEventListener('click', () => { ensureAudio(); tryMove(-1, 0); });
  document.getElementById('btnRight').addEventListener('click', () => { ensureAudio(); tryMove(1, 0); });
  document.getElementById('undoBtn').addEventListener('click', () => { ensureAudio(); undo(); });
  document.getElementById('restartBtn').addEventListener('click', () => { ensureAudio(); restart(); });

  // KEYBOARD
  window.addEventListener('keydown', (e) => {
    if (gameScreen.classList.contains('hidden')) return;
    if (e.key === 'ArrowUp' || e.key === 'w') { tryMove(0, -1); e.preventDefault(); }
    else if (e.key === 'ArrowDown' || e.key === 's') { tryMove(0, 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'a') { tryMove(-1, 0); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd') { tryMove(1, 0); e.preventDefault(); }
    else if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') { undo(); e.preventDefault(); }
    else if (e.key === 'r' || e.key === 'R') { restart(); }
  });

  // SWIPE no canvas
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    ensureAudio();
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive:true });
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
    if (Math.abs(dx) > Math.abs(dy)) tryMove(dx > 0 ? 1 : -1, 0);
    else tryMove(0, dy > 0 ? 1 : -1);
  }, { passive:true });

  // END BUTTONS
  document.getElementById('nextBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    if (currentLevel < LEVELS.length - 1) {
      currentLevel++;
      startLevel();
    } else {
      showScreen(menuScreen);
    }
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    showScreen(menuScreen);
  });

  window.addEventListener('resize', () => { if (!gameScreen.classList.contains('hidden')) { resize(); render(); } });
  refreshMenu();


  // HOME button
  document.getElementById('homeBtn').addEventListener('click', () => {
    if (typeof ensureAudio === 'function') ensureAudio();
    if (typeof sndTap === 'function') sndTap();
    parent.postMessage('back-to-hub', '*');
  });

})();

    // Dash
    let totalDone = 0, totalCoins = 0;

      if (localStorage.getItem('cubo-dash-done-' + i) === '1') totalDone++;
      totalCoins += +(localStorage.getItem('cubo-dash-coins-' + i) || 0);
    }
    const td = document.getElementById('totalTrophies');
    const ts = document.getElementById('totalStars');
    if (td) td.textContent = totalDone + '/11';
    if (ts) ts.textContent = totalCoins + '/55';
    const dashProg = document.querySelector('.card[data-game="dash"] .progress');
    if (dashProg) {
      const bar = dashProg.querySelector('div');
      const pct = Math.round((totalDone * 100) / 11);
      if (pct > 0 || totalCoins > 0) {
        dashProg.classList.add('show');
        bar.style.width = Math.max(5, pct) + '%';
      }
    }
    // Outros jogos
    const games = [
      ['conta', 'blg-conta-stars-', 3, 9],
      ['memory', 'blg-memory-stars-', 4, 12],
      ['snake', 'blg-snake-stars-', 3, 9],
      ['letroca', 'blg-letroca-stars-', 3, 9],
      ['skyhop', 'blg-skyhop-stars-', 3, 9],
      ['platformer', 'blg-mario-stars-', 5, 15],
      ['cruzadas', 'blg-cruzadas-stars-', 6, 18],
      ['balloons', 'blg-balloons-stars-', 6, 18],
      ['animals', 'blg-animal-stars-', 3, 9],
      ['mole', 'blg-mole-stars-', 4, 12],
      ['g2048', 'blg-2048-stars-', 3, 9],
      ['tetris', 'blg-tetris-stars-', 3, 9],
      ['breakout', 'blg-breakout-stars-', 3, 9],
      ['race', 'blg-race-stars-', 5, 15],
      ['sokoban', 'blg-sokoban-stars-', 25, 75],
      ['invaders', 'blg-invaders-stars-', 3, 9],
      ['pacman', 'blg-pacman-stars-', 5, 15],
      ['tower', 'blg-tower-stars-', 3, 9],
    ];
    for (const [game, prefix, levels, max] of games) {
      let stars = 0;
      for (let i = 0; i < levels; i++) stars += +(localStorage.getItem(prefix + i) || 0);
      const prog = document.querySelector('.card[data-game="' + game + '"] .progress');
      if (prog) {
        const bar = prog.querySelector('div');
        if (stars > 0) {
          prog.classList.add('show');
          bar.style.width = Math.max(5, (stars / max) * 100) + '%';
        }
      }
    }
    // Piano: 1 valor único
    const pianoS = +(localStorage.getItem('blg-piano-stars') || 0);
    const pianoP = document.querySelector('.card[data-game="piano"] .progress');
    if (pianoP) {
      const bar = pianoP.querySelector('div');
      if (pianoS > 0) {
        pianoP.classList.add('show');
        bar.style.width = Math.max(5, (pianoS / 3) * 100) + '%';
      }
    }
    // Sudoku: 3 sizes × 3 diffs
    let sudokuS = 0;
    for (const sz of [4, 6, 9]) for (const df of ['Fácil', 'Médio', 'Difícil']) {
      sudokuS += +(localStorage.getItem('blg-sudoku-' + sz + '-' + df + '-stars') || 0);
    }
    const sudokuP = document.querySelector('.card[data-game="sudoku"] .progress');
    if (sudokuP) {
      const bar = sudokuP.querySelector('div');
      if (sudokuS > 0) {
        sudokuP.classList.add('show');
        bar.style.width = Math.max(5, (sudokuS / 27) * 100) + '%';
      }
    }
    // RPG: 1 valor único
    const rpgS = +(localStorage.getItem('blg-rpg-best-stars') || 0);
    const rpgP = document.querySelector('.card[data-game="rpg"] .progress');
    if (rpgP) {
      const bar = rpgP.querySelector('div');
      if (rpgS > 0) {
        rpgP.classList.add('show');
        bar.style.width = Math.max(5, (rpgS / 3) * 100) + '%';
      }
    }
  };
</script>
</body>

</script>

<script>
(() => {
  const SPRITES = {
  octopusA: ["    XXXX    ", " XXXXXXXXXX ", "XXXXXXXXXXXX", "XXX  XX  XXX", "XXXXXXXXXXXX", "   XX  XX   ", "  XX XX XX  ", "XX        XX"],
  octopusB: ["    XXXX    ", " XXXXXXXXXX ", "XXXXXXXXXXXX", "XXX  XX  XXX", "XXXXXXXXXXXX", "  XXX  XXX  ", " XX  XX  XX ", "  XX    XX  "],
  crabA: ["  X     X  ", "   X   X   ", "  XXXXXXX  ", " XX XXX XX ", "XXXXXXXXXXX", "X XXXXXXX X", "X X     X X", "   XX XX   "],
  crabB: ["  X     X  ", "X  X   X  X", "X XXXXXXX X", "XXX XXX XXX", "XXXXXXXXXXX", " XXXXXXXXX ", "  X     X  ", " X       X "],
  squidA: ["   XX   ", "  XXXX  ", " XXXXXX ", "XX XX XX", "XXXXXXXX", "  X  X  ", " X XX X ", "X X  X X"],
  squidB: ["   XX   ", "  XXXX  ", " XXXXXX ", "XX XX XX", "XXXXXXXX", " X XX X ", "X  XX  X", " X    X "],
  ufo: ["     XXXXXX     ", "    XXXXXXXX    ", "   XXXXXXXXXX   ", "  XX XX XX XX   ", " XXXXXXXXXXXXXX ", "   XXX    XXX   ", "    X      X    "],
  player: ["      X      ", "     XXX     ", "     XXX     ", " XXXXXXXXXXX ", "XXXXXXXXXXXXX", "XXXXXXXXXXXXX", "XXXXXXXXXXXXX", "XXXXXXXXXXXXX"],
  playerExp: ["  X   X X    ", "X   X     X X", " X   X X   X ", "X X XXXXX X  ", " XXXXXXXXX X ", "X XXXXXXXXX X", "XXXXXXXXXXX X", "X XXXXXXXX  X"],
  playerBullet: ["X", "X", "X", "X"],
  alienBulletSquig: [" X ", "X  ", " X ", "  X"],
  alienBulletFast: ["X X", "XXX", " X ", " X ", "XXX", "X X"],
  alienBulletPlain: ["X", "X", "X", "X"],
};

  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndShoot()  { beep(880, 0.07, 'square', 0.04); setTimeout(() => beep(440, 0.06, 'sawtooth', 0.03), 30); }
  function sndHit()    { beep(180, 0.12, 'sawtooth', 0.06); }
  function sndUfo()    { beep(440, 0.10, 'triangle', 0.04); setTimeout(() => beep(660, 0.10, 'triangle', 0.04), 80); setTimeout(() => beep(880, 0.10, 'triangle', 0.04), 160); }
  function sndUfoKill(){ [1320, 1175, 1047, 880, 784].forEach((f, i) => beep(f, 0.08, 'triangle', 0.05, i*0.06)); }
  function sndPlayerDie() { beep(110, 0.3, 'sawtooth', 0.07); setTimeout(() => beep(80, 0.4, 'sawtooth', 0.06), 150); }
  function sndStep(idx) {
    // 4 tons descendentes pra marcha dos aliens
    const freqs = [220, 196, 175, 155];
    beep(freqs[idx % 4], 0.05, 'square', 0.03);
  }
  function sndTap()    { beep(660, 0.04, 'triangle', 0.05); }
  function sndWin()    { [523, 659, 784, 880, 1047, 1318].forEach((f, i) => beep(f, 0.15, 'triangle', 0.06, i*0.08)); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // LEVELS
  const LEVELS = [
    { name:'Wave 1', baseStepMs:550, bulletSpeed:3.0, shootChance:0.005, maxAlienBullets:2, goal3:1100, goal2:700, goal1:300 },
    { name:'Wave 2', baseStepMs:420, bulletSpeed:3.6, shootChance:0.008, maxAlienBullets:3, goal3:1400, goal2:900, goal1:400 },
    { name:'Wave 3', baseStepMs:320, bulletSpeed:4.2, shootChance:0.012, maxAlienBullets:4, goal3:1700, goal2:1100, goal1:500 },
  ];

  // STATS
  function getStars(l) { return +(localStorage.getItem('blg-invaders-stars-' + l) || 0); }
  function saveStars(l, n) { if (n > getStars(l)) localStorage.setItem('blg-invaders-stars-' + l, n); }
  function getBest(l) { return +(localStorage.getItem('blg-invaders-best-' + l) || 0); }
  function saveBest(l, s) { if (s > getBest(l)) localStorage.setItem('blg-invaders-best-' + l, s); }
  function refreshMenu() {
    for (let i = 0; i < 3; i++) {
      const s = getStars(i);
      const ct = document.getElementById('stars' + i);
      if (!ct) continue;
      ct.querySelectorAll('.s').forEach((el, idx) => el.classList.toggle('lit', idx < s));
    }
  }
  refreshMenu();

  // SPRITE CACHE (pre-renderiza cada sprite em canvas offscreen com cor)
  const spriteCache = {};
  function makeSprite(name, pixels, color, pixelSize) {
    const w = pixels[0].length, h = pixels.length;
    const c = document.createElement('canvas');
    c.width = w * pixelSize;
    c.height = h * pixelSize;
    const cx = c.getContext('2d');
    cx.fillStyle = color;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (pixels[y][x] === 'X') cx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
      }
    }
    spriteCache[name] = { canvas: c, w: w * pixelSize, h: h * pixelSize, pxW: w, pxH: h };
  }

  function buildSpriteCache(pixelSize) {
    makeSprite('octopusA', SPRITES.octopusA, '#a855f7', pixelSize);
    makeSprite('octopusB', SPRITES.octopusB, '#a855f7', pixelSize);
    makeSprite('crabA',    SPRITES.crabA,    '#22c55e', pixelSize);
    makeSprite('crabB',    SPRITES.crabB,    '#22c55e', pixelSize);
    makeSprite('squidA',   SPRITES.squidA,   '#fbbf24', pixelSize);
    makeSprite('squidB',   SPRITES.squidB,   '#fbbf24', pixelSize);
    makeSprite('ufo',      SPRITES.ufo,      '#ef4444', pixelSize);
    makeSprite('player',   SPRITES.player,   '#22c55e', pixelSize);
    makeSprite('playerExp', SPRITES.playerExp, '#fbbf24', pixelSize);
    makeSprite('playerBullet', SPRITES.playerBullet, '#fff', pixelSize);
    makeSprite('alienBulletSquig', SPRITES.alienBulletSquig, '#fff', pixelSize);
    makeSprite('alienBulletFast',  SPRITES.alienBulletFast,  '#fff', pixelSize);
    makeSprite('alienBulletPlain', SPRITES.alienBulletPlain, '#fff', pixelSize);
  }

  // CANVAS
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  let W = 0, H = 0, DPR = 1, PX = 2;
  const COLS = 8, ROWS = 5;
  // game coords são pixels do canvas (sem dpr)
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = false;
    // Pixel scale baseado na largura — pixels alien-sprite têm largura nominal ~13. 8 colunas = ~120 pixels nominais
    // PX = px por unit do sprite. Quero alien render ~30-40px wide. octopus=12, crab=11, squid=8
    PX = Math.max(2, Math.floor(W / 180));
    buildSpriteCache(PX);
  }

  // STATE
  let currentLevel = 0;
  let score = 0, lives = 0, running = false;
  let aliens = [];   // {col, row, type, alive}
  let fleetX = 0, fleetY = 0;
  let fleetDir = 1;  // 1 right, -1 left
  let fleetStepIdx = 0;
  let lastStep = 0;
  let stepInterval = 550;
  let playerX = 0, playerY = 0, playerW = 0, playerH = 0, playerVx = 0;
  let playerAlive = true, playerExplodeUntil = 0;
  let playerBullets = []; // até 2 simultâneos
  let alienBullets = [];   // {x, y, kind, vy}
  let ufo = null;          // {x, y, vx} when active
  let ufoNextSpawn = 0;
  let shields = [];        // array de matrizes
  let lastTime = 0;
  let inputLeft = false, inputRight = false;
  let pendingFire = false;
  let gameOverReason = '';  // 'killed', 'invaded'
  // dimensões calculadas em resize
  let alienSpacingX = 0, alienSpacingY = 0;
  let alienAreaTop = 0, alienAreaWidth = 0;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
    if (s === menuScreen) refreshMenu();
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      showScreen(gameScreen);
      setTimeout(() => { resize(); startGame(); }, 30);
    });
  });

  function startGame() {
    score = 0;
    lives = 3;
    running = true;
    document.getElementById('scoreVal').textContent = '0000';
    document.getElementById('livesEl').textContent = '▲▲▲';
    setupWave();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function setupWave() {
    const lvl = LEVELS[currentLevel];
    stepInterval = lvl.baseStepMs;
    // spacing
    alienSpacingX = Math.floor(W * 0.09);
    alienSpacingY = Math.floor(alienSpacingX * 0.75);
    alienAreaWidth = (COLS - 1) * alienSpacingX + alienSpacingX;
    alienAreaTop = Math.floor(H * 0.08);
    // aliens grid
    aliens = [];
    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        let type;
        if (row === 0) type = 'octopus';     // 50pts (era 30 no original; quis dar mais peso ao top)
        else if (row <= 2) type = 'crab';    // 30pts
        else type = 'squid';                 // 10pts
        aliens.push({ col, row, type, alive: true });
      }
    }
    fleetX = Math.floor((W - alienAreaWidth) / 2);
    fleetY = alienAreaTop;
    fleetDir = 1;
    fleetStepIdx = 0;
    lastStep = performance.now();
    // player
    const playerSprite = spriteCache.player || { w:30, h:18 };
    playerW = playerSprite.w; playerH = playerSprite.h;
    playerX = Math.floor((W - playerW) / 2);
    playerY = H - 100;  // acima da área dos controles
    playerAlive = true;
    playerExplodeUntil = 0;
    playerBullets = [];
    alienBullets = [];
    ufo = null;
    ufoNextSpawn = performance.now() + 15000 + Math.random() * 15000;
    // escudos: 4 escudos, cada um 24x16 pixels lógicos (8x6 bricks de 3x3 pixels)
    shields = [];
    const shieldCols = 8, shieldRows = 6;
    const brickSize = PX;
    const shieldW = shieldCols * brickSize;
    const shieldH = shieldRows * brickSize;
    const numShields = 4;
    const totalShieldsWidth = numShields * shieldW;
    const gapTotal = W - totalShieldsWidth;
    const gap = gapTotal / (numShields + 1);
    const shieldY = playerY - shieldH - 30;
    for (let i = 0; i < numShields; i++) {
      const sx = Math.floor(gap + i * (shieldW + gap));
      const m = [];
      for (let r = 0; r < shieldRows; r++) {
        const rr = [];
        for (let c = 0; c < shieldCols; c++) {
          let alive = 1;
          // arco em U: bricks 3,4 vazios nas 2 linhas de baixo
          if (r >= shieldRows - 2 && c >= 3 && c <= 4) alive = 0;
          // cantos superiores arredondados
          if (r === 0 && (c === 0 || c === shieldCols - 1)) alive = 0;
          rr.push(alive);
        }
        m.push(rr);
      }
      shields.push({ x: sx, y: shieldY, brickSize, cols: shieldCols, rows: shieldRows, m });
    }
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(2.5, (now - lastTime) / 16.67);
    lastTime = now;
    update(dt, now);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt, now) {
    const lvl = LEVELS[currentLevel];
    // PLAYER
    if (playerAlive) {
      if (inputLeft && !inputRight) playerVx = -3.5;
      else if (inputRight && !inputLeft) playerVx = 3.5;
      else playerVx *= 0.85;
      playerX += playerVx * dt;
      if (playerX < 4) playerX = 4;
      if (playerX > W - playerW - 4) playerX = W - playerW - 4;
      // FIRE: até 2 tiros simultâneos, mais rápidos
      if (pendingFire && playerBullets.length < 2) {
        const bs = spriteCache.playerBullet;
        playerBullets.push({
          x: playerX + playerW / 2 - bs.w / 2,
          y: playerY - bs.h,
          vy: -8.5,
        });
        sndShoot();
      }
      pendingFire = false;
    } else {
      if (now > playerExplodeUntil) {
        // respawn ou fim
        if (lives > 0) {
          playerAlive = true;
          playerX = Math.floor((W - playerW) / 2);
          playerVx = 0;
          alienBullets = [];
        } else {
          gameOver('killed');
          return;
        }
      }
    }

    // PLAYER BULLETS
    const bs = spriteCache.playerBullet;
    for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
      const pb = playerBullets[bi];
      pb.y += pb.vy * dt;
      if (pb.y + bs.h < 0) { playerBullets.splice(bi, 1); continue; }
      // colisão escudo
      let consumed = false;
      for (const sh of shields) {
        const r = collideShield(sh, pb.x, pb.y, bs.w, bs.h);
        if (r) { destroyShieldBrick(sh, r.row, r.col); consumed = true; break; }
      }
      if (consumed) { playerBullets.splice(bi, 1); continue; }
      // colisão alien
      let hitAlien = false;
      for (const a of aliens) {
        if (!a.alive) continue;
        const ap = alienAbsPos(a);
        const sp = spriteForAlien(a);
        if (aabb(pb.x, pb.y, bs.w, bs.h, ap.x, ap.y, sp.w, sp.h)) {
          a.alive = false;
          score += pointsFor(a.type);
          sndHit();
          updateHUD();
          hitAlien = true;
          break;
        }
      }
      if (hitAlien) { playerBullets.splice(bi, 1); continue; }
      // colisão UFO
      if (ufo) {
        const us = spriteCache.ufo;
        if (aabb(pb.x, pb.y, bs.w, bs.h, ufo.x, ufo.y, us.w, us.h)) {
          const pts = [100, 150, 200, 300][Math.floor(Math.random() * 4)];
          score += pts;
          sndUfoKill();
          ufo = null;
          ufoNextSpawn = now + 15000 + Math.random() * 15000;
          updateHUD();
          playerBullets.splice(bi, 1);
          continue;
        }
      }
    }

    // FLEET MOVIMENTO
    const aliveCount = aliens.filter(a => a.alive).length;
    if (aliveCount === 0) {
      // wave clear
      sndWin();
      setTimeout(() => waveComplete(), 600);
      running = false;
      return;
    }
    // velocidade: começa em baseStepMs e acelera ao restar menos aliens
    const totalAliens = COLS * ROWS;
    const speedup = Math.max(0.2, aliveCount / totalAliens);
    stepInterval = Math.max(60, lvl.baseStepMs * speedup);
    if (now - lastStep > stepInterval) {
      lastStep = now;
      stepFleet();
      sndStep(fleetStepIdx);
      fleetStepIdx++;
    }

    // ALIEN SHOOT
    if (Math.random() < lvl.shootChance * dt && alienBullets.length < lvl.maxAlienBullets) {
      // escolhe alien aleatório vivo
      const aliveAliens = aliens.filter(a => a.alive);
      if (aliveAliens.length > 0) {
        const shooter = aliveAliens[Math.floor(Math.random() * aliveAliens.length)];
        const ap = alienAbsPos(shooter);
        const sp = spriteForAlien(shooter);
        const kindRoll = Math.random();
        const kind = kindRoll < 0.4 ? 'alienBulletSquig' : (kindRoll < 0.8 ? 'alienBulletPlain' : 'alienBulletFast');
        const bs = spriteCache[kind];
        alienBullets.push({
          x: ap.x + sp.w / 2 - bs.w / 2,
          y: ap.y + sp.h,
          kind,
          vy: lvl.bulletSpeed,
        });
      }
    }

    // ALIEN BULLETS update
    for (const b of alienBullets) {
      b.y += b.vy * dt;
    }
    alienBullets = alienBullets.filter(b => b.y < H);
    // colisões alien bullet
    for (let i = alienBullets.length - 1; i >= 0; i--) {
      const b = alienBullets[i];
      const bs = spriteCache[b.kind];
      // shield
      let consumed = false;
      for (const sh of shields) {
        const r = collideShield(sh, b.x, b.y, bs.w, bs.h);
        if (r) { destroyShieldBrick(sh, r.row, r.col); consumed = true; break; }
      }
      // player
      if (!consumed && playerAlive && aabb(b.x, b.y, bs.w, bs.h, playerX, playerY, playerW, playerH)) {
        playerAlive = false;
        playerExplodeUntil = now + 1200;
        lives--;
        sndPlayerDie();
        updateHUD();
        consumed = true;
      }
      if (consumed) alienBullets.splice(i, 1);
    }

    // UFO
    if (!ufo && now > ufoNextSpawn) {
      const fromLeft = Math.random() < 0.5;
      const us = spriteCache.ufo;
      ufo = {
        x: fromLeft ? -us.w : W,
        y: Math.floor(H * 0.04),
        vx: fromLeft ? 1.5 : -1.5,
      };
      sndUfo();
    }
    if (ufo) {
      ufo.x += ufo.vx * dt;
      const us = spriteCache.ufo;
      if ((ufo.vx > 0 && ufo.x > W) || (ufo.vx < 0 && ufo.x + us.w < 0)) {
        ufo = null;
        ufoNextSpawn = now + 15000 + Math.random() * 15000;
      }
    }

    // check: alien chegou no chão (ou ao nível do jogador)
    for (const a of aliens) {
      if (!a.alive) continue;
      const ap = alienAbsPos(a);
      const sp = spriteForAlien(a);
      if (ap.y + sp.h >= playerY) {
        gameOver('invaded');
        return;
      }
    }
  }

  function stepFleet() {
    // determina próximo passo: se algum vivo passaria da borda, desce
    let willHitEdge = false;
    const step = Math.max(4, Math.floor(W * 0.012));
    for (const a of aliens) {
      if (!a.alive) continue;
      const ap = alienAbsPos(a);
      const sp = spriteForAlien(a);
      const nx = ap.x + fleetDir * step;
      if (nx < 4 || nx + sp.w > W - 4) { willHitEdge = true; break; }
    }
    if (willHitEdge) {
      fleetDir *= -1;
      fleetY += Math.max(8, Math.floor(H * 0.018));
    } else {
      fleetX += fleetDir * step;
    }
  }

  function alienAbsPos(a) {
    return {
      x: fleetX + a.col * alienSpacingX,
      y: fleetY + a.row * alienSpacingY,
    };
  }
  function spriteForAlien(a) {
    const frame = (fleetStepIdx % 2 === 0) ? 'A' : 'B';
    if (a.type === 'octopus') return spriteCache['octopus' + frame];
    if (a.type === 'crab')    return spriteCache['crab' + frame];
    return spriteCache['squid' + frame];
  }
  function pointsFor(type) {
    if (type === 'octopus') return 50;
    if (type === 'crab') return 30;
    return 10;
  }

  function aabb(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
  }

  function collideShield(sh, bx, by, bw, bh) {
    // testa se bullet overlap algum brick vivo do escudo
    for (let r = 0; r < sh.rows; r++) {
      for (let c = 0; c < sh.cols; c++) {
        if (!sh.m[r][c]) continue;
        const brX = sh.x + c * sh.brickSize;
        const brY = sh.y + r * sh.brickSize;
        if (aabb(bx, by, bw, bh, brX, brY, sh.brickSize, sh.brickSize)) {
          return { row: r, col: c };
        }
      }
    }
    return null;
  }

  function destroyShieldBrick(sh, row, col) {
    sh.m[row][col] = 0;
    // erode bricks adjacentes 30% (damage realista)
    const adj = [[-1,0],[1,0],[0,-1],[0,1]];
    for (const [dr, dc] of adj) {
      const r = row + dr, c = col + dc;
      if (r >= 0 && r < sh.rows && c >= 0 && c < sh.cols && Math.random() < 0.2) {
        sh.m[r][c] = 0;
      }
    }
  }

  function updateHUD() {
    document.getElementById('scoreVal').textContent = String(score).padStart(4, '0');
    document.getElementById('livesEl').textContent = '▲'.repeat(Math.max(0, lives));
  }

  function waveComplete() {
    // próxima wave do mesmo nível? Pra simplificar: encerra com vitória.
    endGame(true);
  }

  function gameOver(reason) {
    running = false;
    gameOverReason = reason;
    endGame(false);
  }

  function endGame(victory) {
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, score);
    let earned = 0;
    if (score >= lvl.goal3) earned = 3;
    else if (score >= lvl.goal2) earned = 2;
    else if (score >= lvl.goal1) earned = 1;
    saveStars(currentLevel, earned);
    document.getElementById('finalScore').textContent = score;
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent = score >= best ? '🏆 Novo recorde!' : 'Melhor: ' + best;
    const es = document.getElementById('earnedStars');
    es.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      es.appendChild(s);
    }
    let emoji, title;
    if (victory) { emoji = '🏆'; title = 'WAVE CLEAR!'; }
    else if (gameOverReason === 'invaded') { emoji = '👾'; title = 'INVADIDOS!'; }
    else { emoji = '💀'; title = 'GAME OVER'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;
    setTimeout(() => showScreen(endScreen), 700);
  }

  function render() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // linha verde no chão
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(0, playerY + playerH + 8, W, 2);

    // ALIENS
    for (const a of aliens) {
      if (!a.alive) continue;
      const ap = alienAbsPos(a);
      const sp = spriteForAlien(a);
      ctx.drawImage(sp.canvas, ap.x, ap.y);
    }

    // SHIELDS
    for (const sh of shields) {
      ctx.fillStyle = '#22c55e';
      for (let r = 0; r < sh.rows; r++) {
        for (let c = 0; c < sh.cols; c++) {
          if (!sh.m[r][c]) continue;
          ctx.fillRect(sh.x + c * sh.brickSize, sh.y + r * sh.brickSize, sh.brickSize, sh.brickSize);
        }
      }
    }

    // UFO
    if (ufo) {
      const us = spriteCache.ufo;
      ctx.drawImage(us.canvas, ufo.x, ufo.y);
    }

    // PLAYER
    if (playerAlive) {
      ctx.drawImage(spriteCache.player.canvas, playerX, playerY);
    } else {
      // pisca explosion
      if (Math.floor(performance.now() / 100) % 2 === 0) {
        ctx.drawImage(spriteCache.playerExp.canvas, playerX, playerY);
      }
    }

    // PLAYER BULLETS
    for (const pb of playerBullets) {
      ctx.drawImage(spriteCache.playerBullet.canvas, pb.x, pb.y);
    }
    // ALIEN BULLETS
    for (const b of alienBullets) {
      const bs = spriteCache[b.kind];
      ctx.drawImage(bs.canvas, b.x, b.y);
    }
  }

  // CONTROLES
  function bindHold(el, set) {
    el.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); set(true); el.classList.add('pressed'); }, { passive:false });
    el.addEventListener('touchend',   (e) => { e.preventDefault(); set(false); el.classList.remove('pressed'); }, { passive:false });
    el.addEventListener('touchcancel', () => { set(false); el.classList.remove('pressed'); });
    el.addEventListener('mousedown',  () => { ensureAudio(); set(true); el.classList.add('pressed'); });
    el.addEventListener('mouseup',    () => { set(false); el.classList.remove('pressed'); });
    el.addEventListener('mouseleave', () => { set(false); el.classList.remove('pressed'); });
  }
  bindHold(document.getElementById('btnLeft'),  (v) => inputLeft = v);
  bindHold(document.getElementById('btnRight'), (v) => inputRight = v);
  const btnFire = document.getElementById('btnFire');
  btnFire.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); pendingFire = true; btnFire.classList.add('pressed'); }, { passive:false });
  btnFire.addEventListener('touchend',   (e) => { e.preventDefault(); btnFire.classList.remove('pressed'); }, { passive:false });
  btnFire.addEventListener('mousedown',  () => { ensureAudio(); pendingFire = true; btnFire.classList.add('pressed'); });
  btnFire.addEventListener('mouseup',    () => { btnFire.classList.remove('pressed'); });

  // KEYBOARD
  window.addEventListener('keydown', (e) => {
    if (gameScreen.classList.contains('hidden')) return;
    if (e.key === 'ArrowLeft' || e.key === 'a') { inputLeft = true; e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd') { inputRight = true; e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { pendingFire = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') inputLeft = false;
    if (e.key === 'ArrowRight' || e.key === 'd') inputRight = false;
  });

  window.addEventListener('resize', () => { if (!gameScreen.classList.contains('hidden')) resize(); });

  document.getElementById('backBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    if (!menuScreen.classList.contains('hidden')) {
      parent.postMessage('back-to-hub', '*');
    } else {
      running = false;
      showScreen(menuScreen);
    }
  });
  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    showScreen(gameScreen);
    setTimeout(() => { resize(); startGame(); }, 30);
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    running = false;
    showScreen(menuScreen);
  });


  // HOME button
  document.getElementById('homeBtn').addEventListener('click', () => {
    if (typeof ensureAudio === 'function') ensureAudio();
    if (typeof sndTap === 'function') sndTap();
    parent.postMessage('back-to-hub', '*');
  });

})();

<script>
  // Helper global pra atualizar progresso após voltar de jogo
  window.refreshHubStats = function() {
    // Dash
    let totalDone = 0, totalCoins = 0;
    for (let i = 0; i < 11; i++) {
      if (localStorage.getItem('cubo-dash-done-' + i) === '1') totalDone++;
      totalCoins += +(localStorage.getItem('cubo-dash-coins-' + i) || 0);
    }
    const td = document.getElementById('totalTrophies');
    const ts = document.getElementById('totalStars');
    if (td) td.textContent = totalDone + '/11';
    if (ts) ts.textContent = totalCoins + '/55';
    const dashProg = document.querySelector('.card[data-game="dash"] .progress');
    if (dashProg) {
      const bar = dashProg.querySelector('div');
      const pct = Math.round((totalDone * 100) / 11);
      if (pct > 0 || totalCoins > 0) {
        dashProg.classList.add('show');
        bar.style.width = Math.max(5, pct) + '%';
      }
    }
    // Outros jogos
    const games = [
      ['conta', 'blg-conta-stars-', 3, 9],
      ['memory', 'blg-memory-stars-', 4, 12],
      ['snake', 'blg-snake-stars-', 3, 9],
      ['letroca', 'blg-letroca-stars-', 3, 9],
      ['skyhop', 'blg-skyhop-stars-', 3, 9],
      ['platformer', 'blg-mario-stars-', 5, 15],
      ['cruzadas', 'blg-cruzadas-stars-', 6, 18],
      ['balloons', 'blg-balloons-stars-', 6, 18],
      ['animals', 'blg-animal-stars-', 3, 9],
      ['mole', 'blg-mole-stars-', 4, 12],
      ['g2048', 'blg-2048-stars-', 3, 9],
      ['tetris', 'blg-tetris-stars-', 3, 9],
      ['breakout', 'blg-breakout-stars-', 3, 9],
      ['race', 'blg-race-stars-', 5, 15],
      ['sokoban', 'blg-sokoban-stars-', 25, 75],
      ['invaders', 'blg-invaders-stars-', 3, 9],
      ['pacman', 'blg-pacman-stars-', 5, 15],
      ['tower', 'blg-tower-stars-', 3, 9],
    ];
    for (const [game, prefix, levels, max] of games) {
      let stars = 0;
      for (let i = 0; i < levels; i++) stars += +(localStorage.getItem(prefix + i) || 0);
      const prog = document.querySelector('.card[data-game="' + game + '"] .progress');
      if (prog) {
        const bar = prog.querySelector('div');
        if (stars > 0) {
          prog.classList.add('show');
          bar.style.width = Math.max(5, (stars / max) * 100) + '%';
        }
      }
    }
    // Piano: 1 valor único
    const pianoS = +(localStorage.getItem('blg-piano-stars') || 0);
    const pianoP = document.querySelector('.card[data-game="piano"] .progress');
    if (pianoP) {
      const bar = pianoP.querySelector('div');
      if (pianoS > 0) {
        pianoP.classList.add('show');
        bar.style.width = Math.max(5, (pianoS / 3) * 100) + '%';
      }
    }
    // Sudoku: 3 sizes × 3 diffs
    let sudokuS = 0;
    for (const sz of [4, 6, 9]) for (const df of ['Fácil', 'Médio', 'Difícil']) {
      sudokuS += +(localStorage.getItem('blg-sudoku-' + sz + '-' + df + '-stars') || 0);
    }
    const sudokuP = document.querySelector('.card[data-game="sudoku"] .progress');
    if (sudokuP) {
      const bar = sudokuP.querySelector('div');
      if (sudokuS > 0) {
        sudokuP.classList.add('show');
        bar.style.width = Math.max(5, (sudokuS / 27) * 100) + '%';
      }
    }
    // RPG: 1 valor único
    const rpgS = +(localStorage.getItem('blg-rpg-best-stars') || 0);
    const rpgP = document.querySelector('.card[data-game="rpg"] .progress');
    if (rpgP) {
      const bar = rpgP.querySelector('div');
      if (rpgS > 0) {
        rpgP.classList.add('show');
        bar.style.width = Math.max(5, (rpgS / 3) * 100) + '%';
      }
    }
  };
