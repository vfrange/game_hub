  function sndStar()   { beep(880 + Math.random()*440, 0.08, 'sine', 0.04); setTimeout(() => beep(1318, 0.10, 'triangle', 0.03), 40); }
  function sndBrush()  { beep(200 + Math.random()*100, 0.04, 'sine', 0.02); }
  function sndTap()    { beep(660, 0.04, 'triangle', 0.05); }
  function sndClear()  { [880, 660, 440].forEach((f, i) => beep(f, 0.1, 'sine', 0.04, i*0.05)); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // CANVAS
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

  const COLORS = ['#ec4899','#f43f5e','#fb923c','#fbbf24','#a3e635','#22c55e','#06b6d4','#3b82f6','#a855f7','#d946ef'];
  function pickColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

  let particles = [];
  let stars = [];
  let lastPaint = null;
  let mode = 0;
  let running = false;

  const MODE_NAMES = ['💥 Fogos', '🌈 Pincel', '⭐ Estrelas'];

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  function showScreen(s) {
    [menuScreen, gameScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.modeCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();

  function start() {
    particles = []; stars = []; lastPaint = null;

  function loop() {
    if (!running) return;
    update();
    render();
    requestAnimationFrame(loop);

  function update() {
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.15;

    if (mode === 1) {
      // Pincel: não limpa, fade levíssimo
      ctx.fillStyle = 'rgba(0,0,0,0.005)';
      ctx.fillRect(0, 0, W, H);
    } else {

      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.fillRect(0, 0, W, H);
    }

    for (const p of particles) {
      const alpha = Math.max(0, Math.min(1, p.life / 30));
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;

      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const s of stars) {
      const alpha = Math.max(0, Math.min(1, s.life / 60));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = s.color;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      drawStar(ctx, 0, 0, s.size, s.size * 0.45, 5);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawStar(ctx, cx, cy, outer, inner, n) {
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 === 0 ? outer : inner;
      const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function fireworks(x, y) {
    sndPop();
    const color = pickColor();
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * Math.PI * 2;
      const speed = 2 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        size: 3 + Math.random() * 3,
        color: Math.random() < 0.3 ? pickColor() : color,
        life: 30 + Math.random() * 20,
      });
    }
  }

  function spawnStar(x, y) {
    sndStar();
    stars.push({
      x, y, vy: -3 - Math.random() * 2,
      rot: 0, rotSpeed: (Math.random() - 0.5) * 0.2,
      size: 18 + Math.random() * 14,
      color: pickColor(),
      life: 80,
    });
  }

  function paintBrush(x, y) {
    if (lastPaint) {
      const dx = x - lastPaint.x, dy = y - lastPaint.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const steps = Math.max(1, Math.floor(dist / 4));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const ix = lastPaint.x + dx * t, iy = lastPaint.y + dy * t;
        ctx.fillStyle = pickColor();
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.arc(ix, iy, 8 + Math.random() * 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if (Math.random() < 0.3) sndBrush();
    lastPaint = { x, y };
  }

  function handleStart(x, y) {
    if (mode === 0) fireworks(x, y);
    else if (mode === 1) { lastPaint = { x, y }; paintBrush(x, y); }
    else if (mode === 2) spawnStar(x, y);
  }
  function handleMove(x, y) {
    if (mode === 0 && Math.random() < 0.15) fireworks(x, y);
    else if (mode === 1) paintBrush(x, y);
    else if (mode === 2 && Math.random() < 0.08) spawnStar(x, y);

  function handleEnd() {
    lastPaint = null;
  }

  function touchToPoints(e) {
    const rect = canvas.getBoundingClientRect();
    return Array.from(e.touches || e.changedTouches || []).map(t => ({
      x: t.clientX - rect.left,
      y: t.clientY - rect.top,
    }));

    e.preventDefault();
    ensureAudio();
    const pts = touchToPoints(e);

    e.preventDefault();
    const pts = touchToPoints(e);

  let mouseDown = false;

    handleMove(e.clientX - rect.left, e.clientY - rect.top);

    document.getElementById('modeTitle').textContent = MODE_NAMES[mode];
    // limpa tela ao trocar
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    particles = []; stars = []; lastPaint = null;
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    ensureAudio(); sndClear();
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    particles = []; stars = []; lastPaint = null;
  });

  window.addEventListener('resize', () => { if (!gameScreen.classList.contains('hidden')) resize(); });

  // NAVEGAÇÃO (back + home)
  (function setupNav() {
    const backEl = document.getElementById('backBtn');
    const homeEl = document.getElementById('homeBtn');
    function goHub() { parent.postMessage('back-to-hub', '*'); }

      const menu = document.getElementById('menuScreen');
      if (!menu || !menu.classList.contains('hidden')) { goHub(); return; }
      if (typeof showScreen === 'function') showScreen(menu);
      else { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); menu.classList.remove('hidden'); }
    });
    if (homeEl) homeEl.addEventListener('click', () => { tap(); goHub(); });

      ['invaders', 'blg-invaders-stars-', 3, 9],
      ['pacman', 'blg-pacman-stars-', 5, 15],
      ['tower', 'blg-tower-stars-', 3, 9],

    for (const [game, prefix, levels, max] of games) {

<script>
(() => {
  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function note(freq, dur=0.4, vol=0.08) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime;
    o.type = 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndTap()  { note(660, 0.08, 0.04); }
  function sndWrong() { note(160, 0.4, 0.07); }
  function sndWin() { [523, 659, 784, 1047, 1318].forEach((f, i) => setTimeout(() => note(f, 0.18, 0.08), i*100)); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // NOTAS
  const NOTES = [
    { name:'Dó', freq:261.63, color:'#ef4444', color2:'#b91c1c' },
    { name:'Ré', freq:293.66, color:'#fb923c', color2:'#c2410c' },
    { name:'Mi', freq:329.63, color:'#fde047', color2:'#a16207' },
    { name:'Fá', freq:349.23, color:'#a3e635', color2:'#4d7c0f' },
    { name:'Sol',freq:392.00, color:'#06b6d4', color2:'#0e7490' },
    { name:'Lá', freq:440.00, color:'#3b82f6', color2:'#1d4ed8' },
    { name:'Si', freq:493.88, color:'#a855f7', color2:'#6b21a8' },
  ];

  // STATS
  function getSeqBest() { return +(localStorage.getItem('blg-piano-seq-best') || 0); }
  function saveSeqBest(n) { if (n > getSeqBest()) localStorage.setItem('blg-piano-seq-best', n); }
  function getSeqStars() { return +(localStorage.getItem('blg-piano-stars') || 0); }
  function saveSeqStars(n) { if (n > getSeqStars()) localStorage.setItem('blg-piano-stars', n); }
  function refreshMenu() {
    const s = getSeqStars();
    const ct = document.getElementById('seqStars');
    ct.querySelectorAll('.s').forEach((el, idx) => el.classList.toggle('lit', idx < s));
  }
  refreshMenu();

  // STATE
  let mode = 'free';
  let sequence = [], playerInput = [], waitingPlayer = false, sequenceLevel = 0;
  let acceptingInput = true;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.modeCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      mode = card.dataset.mode;
      document.getElementById('modeNameBar').textContent = mode === 'free' ? 'Livre' : 'Sequência';
      buildKeys();
      showScreen(gameScreen);
      if (mode === 'seq') {
        sequence = []; playerInput = []; sequenceLevel = 0;
        setStatus('<span class="label">Toque qualquer tecla pra começar</span>');
      } else {
        setStatus('<span class="label">🎵 Toque livremente</span>');
      }
    });
  });

  function setStatus(html) {
    document.getElementById('statusBar').innerHTML = html;
  }

  function buildKeys() {
    const board = document.getElementById('keysBoard');
    board.innerHTML = '';
    NOTES.forEach((note, i) => {
      const key = document.createElement('div');
      key.className = 'key';
      key.style.setProperty('--color', note.color);
      key.style.setProperty('--color2', note.color2);
      const lbl = document.createElement('span');
      lbl.className = 'label';
      lbl.textContent = note.name;
      key.appendChild(lbl);
      // Touch
      const press = (e) => {
        if (e) e.preventDefault();
        ensureAudio();
        playKey(i, true);
      };
      key.addEventListener('touchstart', press, { passive:false });
      key.addEventListener('mousedown', press);
      board.appendChild(key);
    });
  }

  function flashKey(idx, manual=false) {
    const key = document.querySelectorAll('.key')[idx];
    if (!key) return;
    if (manual) {
      // Player tocou: highlight rápido
      key.classList.remove('active');
      void key.offsetWidth;
      key.classList.add('active');
      setTimeout(() => key.classList.remove('active'), 250);
    } else {
      // Sequência tocando: cor sólida e mais duradoura
      key.classList.remove('active', 'flash');
      void key.offsetWidth;
      key.classList.add('active');
      setTimeout(() => key.classList.remove('active'), 450);
    }
  }

  function playKey(idx, fromPlayer=false) {
    note(NOTES[idx].freq, 0.4, 0.08);
    flashKey(idx, fromPlayer);

    if (mode === 'free') return;

    // Modo Sequência
    if (sequenceLevel === 0 && fromPlayer) {
      // Inicia sequência
      sequenceLevel = 1;
      startSequenceRound();
      return;
    }
    if (!waitingPlayer || !fromPlayer || !acceptingInput) return;

    playerInput.push(idx);
    const step = playerInput.length - 1;
    if (sequence[step] !== idx) {
      // Errou
      acceptingInput = false;
      sndWrong();
      setStatus(`<span class="label">Errou em</span> <span class="num">${sequenceLevel - 1}</span>`);
      setTimeout(() => endSequence(sequenceLevel - 1), 800);
      return;
    }
    if (playerInput.length === sequence.length) {
      // Completou
      waitingPlayer = false;
      sequenceLevel++;
      setStatus(`<span class="label">Acertou! Nível</span> <span class="num">${sequenceLevel - 1}</span>`);
      setTimeout(startSequenceRound, 700);
    }
  }

  function startSequenceRound() {
    playerInput = [];
    sequence.push(Math.floor(Math.random() * NOTES.length));
    setStatus(`<span class="label">Nível</span> <span class="num">${sequenceLevel}</span> <span class="label">— preste atenção</span>`);
    acceptingInput = false;
    waitingPlayer = false;
    // Toca a sequência
    const interval = 650;
    sequence.forEach((noteIdx, i) => {
      setTimeout(() => {
        note(NOTES[noteIdx].freq, 0.4, 0.08);
        flashKey(noteIdx, false);
      }, 500 + i * interval);
    });
    setTimeout(() => {
      waitingPlayer = true;
      acceptingInput = true;
      setStatus(`<span class="label">Sua vez! Nível</span> <span class="num">${sequenceLevel}</span>`);
    }, 500 + sequence.length * interval + 100);
  }

  function endSequence(reached) {
    saveSeqBest(reached);
    sndWin();
    let earned = 0;
    if (reached >= 12) earned = 3;
    else if (reached >= 7) earned = 2;
    else if (reached >= 3) earned = 1;
    saveSeqStars(earned);
    refreshMenu();

    document.getElementById('finalScore').textContent = reached;
    const best = getSeqBest();
    document.getElementById('bestMsg').textContent = reached >= best ? '🏆 Novo recorde!' : `Melhor: ${best}`;
    const es = document.getElementById('earnedStars');
    es.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      es.appendChild(s);
    }
    let emoji, title;
    if (earned === 3) { emoji = '🏆'; title = 'INCRÍVEL!'; }
    else if (earned === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else if (earned === 1) { emoji = '👍'; title = 'Bom!'; }
    else { emoji = '🎵'; title = 'Tenta de novo!'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;

    setTimeout(() => showScreen(endScreen), 500);
  }

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    sequence = []; playerInput = []; sequenceLevel = 0;
    showScreen(gameScreen);
    setStatus('<span class="label">Toque qualquer tecla pra começar</span>');
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    showScreen(menuScreen);
  });

  // NAVEGAÇÃO (back + home)
  (function setupNav() {
    const backEl = document.getElementById('backBtn');
    const homeEl = document.getElementById('homeBtn');
    function goHub() { parent.postMessage('back-to-hub', '*'); }
    function tap() { if (typeof ensureAudio === 'function') ensureAudio(); if (typeof sndTap === 'function') sndTap(); }
    if (backEl) backEl.addEventListener('click', () => {
      tap();
      const menu = document.getElementById('menuScreen');
      if (!menu || !menu.classList.contains('hidden')) { goHub(); return; }
      if (typeof showScreen === 'function') showScreen(menu);
      else { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); menu.classList.remove('hidden'); }
    });
    if (homeEl) homeEl.addEventListener('click', () => { tap(); goHub(); });
  })();

})();

<script>
(() => {
  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndHit()  { beep(880, 0.06, 'square', 0.06); setTimeout(() => beep(1320, 0.06, 'triangle', 0.05), 30); }
  function sndPop()  { beep(440, 0.04, 'triangle', 0.04); }
  function sndTap()  { beep(660, 0.04, 'triangle', 0.05); }
  function sndTick() { beep(800, 0.04, 'square', 0.03); }
  function sndWin()  { [523, 659, 784, 880, 1047, 1318].forEach((f, i) => beep(f, 0.15, 'triangle', 0.06, i*0.08)); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  const LEVELS = [
    { name:'Lento',   spawnMs:1300, visMs:1300, time:30, goal3:18, goal2:11, goal1:5  },
    { name:'Médio',   spawnMs:800,  visMs:900,  time:30, goal3:25, goal2:16, goal1:8  },
    { name:'Difícil', spawnMs:650,  visMs:780,  time:30, goal3:30, goal2:19, goal1:10 },
    { name:'Rápido',  spawnMs:500,  visMs:650,  time:30, goal3:35, goal2:22, goal1:12 },
  ];
  const MOLE_EMOJIS = ['🐹','🐭','🦔'];
  const N_HOLES = 9;

  function getStars(l) { return +(localStorage.getItem('blg-mole-stars-' + l) || 0); }
  function saveStars(l, n) { if (n > getStars(l)) localStorage.setItem('blg-mole-stars-' + l, n); }
  function getBest(l) { return +(localStorage.getItem('blg-mole-best-' + l) || 0); }
  function saveBest(l, s) { if (s > getBest(l)) localStorage.setItem('blg-mole-best-' + l, s); }
  function refreshMenu() {
    for (let i = 0; i < 4; i++) {
      const s = getStars(i);
      const ct = document.getElementById('stars' + i);
      if (!ct) continue;
      ct.querySelectorAll('.s').forEach((el, idx) => el.classList.toggle('lit', idx < s));
    }
  }
  refreshMenu();

  let currentLevel = 0, score = 0, running = false, timeLeft = 0, timerId = null, spawnId = null;
  let holes = [];  // [{ active, hideTimer, el, emoji }]

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      startGame();
    });
  });

  function buildGrid() {
    const grid = document.getElementById('holesGrid');
    grid.innerHTML = '';
    holes = [];
    for (let i = 0; i < N_HOLES; i++) {
      const hole = document.createElement('div');
      hole.className = 'hole';
      const mole = document.createElement('div');
      mole.className = 'mole';
      mole.textContent = MOLE_EMOJIS[Math.floor(Math.random() * MOLE_EMOJIS.length)];
      hole.appendChild(mole);
      const idx = i;
      hole.addEventListener('click', () => handleTap(idx));
      grid.appendChild(hole);
      holes.push({ active:false, hideTimer:null, el:hole, mole });
    }
  }

  function startGame() {
    score = 0;
    document.getElementById('scoreNum').textContent = '0';
    timeLeft = LEVELS[currentLevel].time;
    updateTimer();
    buildGrid();
    showScreen(gameScreen);
    running = true;
    // Timer
    if (timerId) clearInterval(timerId);
    timerId = setInterval(() => {
      timeLeft--;
      updateTimer();
      if (timeLeft <= 5 && timeLeft > 0) sndTick();
      if (timeLeft <= 0) endGame();
    }, 1000);
    // Spawn loop
    if (spawnId) clearInterval(spawnId);
    spawnId = setInterval(spawnMole, LEVELS[currentLevel].spawnMs);
    setTimeout(spawnMole, 200);  // primeiro logo
  }

  function updateTimer() {
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    const t = document.getElementById('timerEl');
    t.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    t.classList.toggle('warn', timeLeft <= 10 && timeLeft > 5);
    t.classList.toggle('crit', timeLeft <= 5);
  }

  function spawnMole() {
    if (!running) return;
    // escolha aleatória de buraco vazio
    const empty = holes.map((h, i) => h.active ? -1 : i).filter(i => i >= 0);
    if (empty.length === 0) return;
    const idx = empty[Math.floor(Math.random() * empty.length)];
    const h = holes[idx];
    h.active = true;
    h.mole.textContent = MOLE_EMOJIS[Math.floor(Math.random() * MOLE_EMOJIS.length)];
    h.el.classList.add('active');
    sndPop();
    h.hideTimer = setTimeout(() => {
      h.active = false;
      h.el.classList.remove('active');
    }, LEVELS[currentLevel].visMs);
  }

  function handleTap(idx) {
    if (!running) return;
    ensureAudio();
    const h = holes[idx];
    if (!h.active) return;  // ignora buraco vazio
    h.active = false;
    if (h.hideTimer) { clearTimeout(h.hideTimer); h.hideTimer = null; }
    h.el.classList.remove('active');
    h.el.classList.add('hit');
    setTimeout(() => h.el.classList.remove('hit'), 300);
    score++;
    document.getElementById('scoreNum').textContent = score;
    sndHit();
  }

  function endGame() {
    running = false;
    if (timerId) clearInterval(timerId);
    if (spawnId) clearInterval(spawnId);
    holes.forEach(h => { if (h.hideTimer) clearTimeout(h.hideTimer); h.el.classList.remove('active'); });
    sndWin();
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, score);
    let earned = 0;
    if (score >= lvl.goal3) earned = 3;
    else if (score >= lvl.goal2) earned = 2;
    else if (score >= lvl.goal1) earned = 1;
    saveStars(currentLevel, earned);
    refreshMenu();

    document.getElementById('finalScore').textContent = score;
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent = score >= best ? '🏆 Novo recorde!' : `Melhor: ${best}`;
    const es = document.getElementById('earnedStars');
    es.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      es.appendChild(s);
    }
    let emoji, title;
    if (earned === 3) { emoji = '🏆'; title = 'PERFEITO!'; }
    else if (earned === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else if (earned === 1) { emoji = '👍'; title = 'Bom!'; }
    else { emoji = '🎯'; title = 'Tenta de novo!'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;

    setTimeout(() => showScreen(endScreen), 600);
  }

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap(); startGame();
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    running = false;
    if (timerId) clearInterval(timerId);
    if (spawnId) clearInterval(spawnId);
    showScreen(menuScreen);
  });

  // NAVEGAÇÃO (back + home)
  (function setupNav() {
    const backEl = document.getElementById('backBtn');
    const homeEl = document.getElementById('homeBtn');
    function goHub() { parent.postMessage('back-to-hub', '*'); }
    function tap() { if (typeof ensureAudio === 'function') ensureAudio(); if (typeof sndTap === 'function') sndTap(); }
    if (backEl) backEl.addEventListener('click', () => {
      tap();
      const menu = document.getElementById('menuScreen');
      if (!menu || !menu.classList.contains('hidden')) { goHub(); return; }
      if (typeof showScreen === 'function') showScreen(menu);
      else { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); menu.classList.remove('hidden'); }
    });
    if (homeEl) homeEl.addEventListener('click', () => { tap(); goHub(); });
  })();

})();

<script>
  // Helper global pra atualizar progresso após voltar de jogo
  window.refreshHubStats = function() {
    // Dash
    let totalDone = 0, totalCoins = 0;
    for (let i = 0; i < 11; i++) {
      if (localStorage.getItem('cubo-dash-done-' + i) === '1') totalDone++;
      totalCoins += +(localStorage.getItem('cubo-dash-coins-' + i) || 0);
    }
    const td = document.getElementById('totalTrophies');
    const ts = document.getElementById('totalStars');
    if (td) td.textContent = totalDone + '/11';
    if (ts) ts.textContent = totalCoins + '/55';
    const dashProg = document.querySelector('.card[data-game="dash"] .progress');
    if (dashProg) {
      const bar = dashProg.querySelector('div');
      const pct = Math.round((totalDone * 100) / 11);
      if (pct > 0 || totalCoins > 0) {
        dashProg.classList.add('show');
        bar.style.width = Math.max(5, pct) + '%';
      }
    }
    // Outros jogos
    const games = [
      ['conta', 'blg-conta-stars-', 3, 9],
      ['memory', 'blg-memory-stars-', 4, 12],
      ['snake', 'blg-snake-stars-', 3, 9],
      ['letroca', 'blg-letroca-stars-', 3, 9],
      ['skyhop', 'blg-skyhop-stars-', 3, 9],
      ['platformer', 'blg-mario-stars-', 5, 15],
      ['cruzadas', 'blg-cruzadas-stars-', 6, 18],
      ['balloons', 'blg-balloons-stars-', 6, 18],
      ['animals', 'blg-animal-stars-', 3, 9],
      ['mole', 'blg-mole-stars-', 4, 12],
      ['g2048', 'blg-2048-stars-', 3, 9],
      ['tetris', 'blg-tetris-stars-', 3, 9],
      ['breakout', 'blg-breakout-stars-', 3, 9],
      ['race', 'blg-race-stars-', 5, 15],
      ['sokoban', 'blg-sokoban-stars-', 25, 75],
      ['invaders', 'blg-invaders-stars-', 3, 9],
      ['pacman', 'blg-pacman-stars-', 5, 15],
      ['tower', 'blg-tower-stars-', 3, 9],
    ];
    for (const [game, prefix, levels, max] of games) {
      let stars = 0;
      for (let i = 0; i < levels; i++) stars += +(localStorage.getItem(prefix + i) || 0);
      const prog = document.querySelector('.card[data-game="' + game + '"] .progress');
      if (prog) {
        const bar = prog.querySelector('div');
        if (stars > 0) {
          prog.classList.add('show');
          bar.style.width = Math.max(5, (stars / max) * 100) + '%';
        }
      }
    }
    // Piano: 1 valor único
    const pianoS = +(localStorage.getItem('blg-piano-stars') || 0);
    const pianoP = document.querySelector('.card[data-game="piano"] .progress');
    if (pianoP) {
      const bar = pianoP.querySelector('div');
      if (pianoS > 0) {
        pianoP.classList.add('show');
        bar.style.width = Math.max(5, (pianoS / 3) * 100) + '%';
      }
    }
    // Sudoku: 3 sizes × 3 diffs
    let sudokuS = 0;
    for (const sz of [4, 6, 9]) for (const df of ['Fácil', 'Médio', 'Difícil']) {
      sudokuS += +(localStorage.getItem('blg-sudoku-' + sz + '-' + df + '-stars') || 0);
    }
    const sudokuP = document.querySelector('.card[data-game="sudoku"] .progress');
    if (sudokuP) {
      const bar = sudokuP.querySelector('div');
      if (sudokuS > 0) {
        sudokuP.classList.add('show');
        bar.style.width = Math.max(5, (sudokuS / 27) * 100) + '%';
      }
    }
    // RPG: 1 valor único
    const rpgS = +(localStorage.getItem('blg-rpg-best-stars') || 0);
    const rpgP = document.querySelector('.card[data-game="rpg"] .progress');
    if (rpgP) {
      const bar = rpgP.querySelector('div');
      if (rpgS > 0) {
        rpgP.classList.add('show');
        bar.style.width = Math.max(5, (rpgS / 3) * 100) + '%';
      }
    }

<script>
(() => {
  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndSlide() { beep(440, 0.04, 'triangle', 0.04); }
  function sndMerge(v) {
    const base = Math.min(1320, 220 + Math.log2(v) * 90);
    beep(base, 0.08, 'triangle', 0.06);
    setTimeout(() => beep(base * 1.5, 0.08, 'triangle', 0.05), 30);
  }
  function sndTap()  { beep(660, 0.04, 'triangle', 0.05); }
  function sndOver() { beep(220, 0.25, 'sawtooth', 0.06); setTimeout(() => beep(165, 0.3, 'sawtooth', 0.05), 120); }
  function sndWin()  { [523, 659, 784, 880, 1047, 1318, 1568].forEach((f, i) => beep(f, 0.15, 'square', 0.06, i*0.09)); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  const LEVELS = [
    { name:'Fácil',   size:3, goal:256,  star2:128,  star1:32  },
    { name:'Médio',   size:4, goal:1024, star2:512,  star1:128 },
    { name:'Difícil', size:4, goal:2048, star2:1024, star1:256 },
  ];

  function getStars(l) { return +(localStorage.getItem('blg-2048-stars-' + l) || 0); }
  function saveStars(l, n) { if (n > getStars(l)) localStorage.setItem('blg-2048-stars-' + l, n); }
  function getBest(l) { return +(localStorage.getItem('blg-2048-best-' + l) || 0); }
  function saveBest(l, v) { if (v > getBest(l)) localStorage.setItem('blg-2048-best-' + l, v); }
  function refreshMenu() {
    for (let i = 0; i < 3; i++) {
      const s = getStars(i);
      const ct = document.getElementById('stars' + i);
      ct.querySelectorAll('.s').forEach((el, idx) => el.classList.toggle('lit', idx < s));
    }
  }
  refreshMenu();

  let currentLevel = 0, size = 4, board = [], score = 0, running = false, won = false;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      startGame();
    });
  });

  function startGame() {
    const lvl = LEVELS[currentLevel];
    size = lvl.size;
    board = Array.from({ length: size }, () => Array(size).fill(0));
    score = 0;
    won = false;
    running = true;
    document.getElementById('goalNum').textContent = lvl.goal;
    document.getElementById('scoreVal').textContent = '0';
    document.getElementById('maxVal').textContent = '0';
    addRandomTile();
    addRandomTile();
    renderBoard();
    showScreen(gameScreen);
  }

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
      if (board[r][c] === 0) empty.push([r, c]);
    }
    if (empty.length === 0) return false;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
    return true;
  }

  function renderBoard(animations={}) {
    const boardEl = document.getElementById('board');
    boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    boardEl.innerHTML = '';
    let maxVal = 0;
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const v = board[r][c];
        if (v > maxVal) maxVal = v;
        const tile = document.createElement('div');
        tile.className = 'tile';
        if (v > 0) {
          tile.dataset.val = v;
          tile.textContent = v;
          // tamanho da fonte adapta ao número de dígitos
          const d = v.toString().length;
          tile.style.fontSize = `clamp(14px, ${size === 3 ? 8 : 6}vw, ${d > 3 ? 26 : 36}px)`;
          const key = `${r},${c}`;
          if (animations[key] === 'new') tile.classList.add('new');
          else if (animations[key] === 'merged') tile.classList.add('merged');
        }
        boardEl.appendChild(tile);
      }
    }
    document.getElementById('maxVal').textContent = maxVal;
    document.getElementById('scoreVal').textContent = score;
    return maxVal;
  }

  function slideRow(row) {
    // Mover pra esquerda: comprime, depois funde, depois comprime de novo
    const filtered = row.filter(v => v !== 0);
    const result = [];
    const mergedFlags = [];
    let i = 0;
    while (i < filtered.length) {
      if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
        const newVal = filtered[i] * 2;
        result.push(newVal);
        mergedFlags.push(true);
        score += newVal;
        sndMerge(newVal);
        i += 2;
      } else {
        result.push(filtered[i]);
        mergedFlags.push(false);
        i++;
      }
    }
    while (result.length < size) { result.push(0); mergedFlags.push(false); }
    return { row: result, merged: mergedFlags };
  }

  function move(dir) {
    if (!running) return false;
    // Normaliza pra "slide pra esquerda" rotacionando
    let working = board.map(r => [...r]);
    if (dir === 'right')  working = working.map(r => r.reverse());
    if (dir === 'up')     working = transpose(working);
    if (dir === 'down')   working = transpose(working).map(r => r.reverse());

    let changed = false;
    const animations = {};
    const newBoard = [];
    for (let r = 0; r < size; r++) {
      const { row, merged } = slideRow(working[r]);
      newBoard.push(row);
      if (row.join() !== working[r].join()) changed = true;
      row.forEach((v, c) => {
        if (merged[c]) {
          // Calcula posição original no board
          let or = r, oc = c;
          if (dir === 'right') oc = size - 1 - c;
          if (dir === 'up') { or = c; oc = r; }
          if (dir === 'down') { or = size - 1 - c; oc = r; }
          animations[`${or},${oc}`] = 'merged';
        }
      });
    }

    // Reverte rotação
    let finalBoard = newBoard;
    if (dir === 'right')  finalBoard = finalBoard.map(r => r.reverse());
    if (dir === 'up')     finalBoard = transpose(finalBoard);
    if (dir === 'down')   finalBoard = transpose(finalBoard.map(r => r.reverse()));
    board = finalBoard;

    if (changed) {
      sndSlide();
      // Adiciona novo tile
      addRandomTile();
      const maxVal = renderBoard(animations);
      // Check win
      const goal = LEVELS[currentLevel].goal;
      if (!won && maxVal >= goal) {
        won = true;
        setTimeout(() => endGame(true), 400);
        return true;
      }
      // Check lose
      if (!canMove()) {
        setTimeout(() => endGame(false), 500);
      }
    }
    return changed;
  }

  function transpose(arr) {
    const n = arr.length;
    const out = Array.from({ length: n }, () => Array(n).fill(0));
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) out[c][r] = arr[r][c];
    return out;
  }

  function canMove() {
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
      if (board[r][c] === 0) return true;
      if (r + 1 < size && board[r][c] === board[r+1][c]) return true;
      if (c + 1 < size && board[r][c] === board[r][c+1]) return true;
    }
    return false;
  }

  function endGame(victory) {
    running = false;
    let maxVal = 0;
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
      if (board[r][c] > maxVal) maxVal = board[r][c];
    }
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, maxVal);
    let earned = 0;
    if (maxVal >= lvl.goal) earned = 3;
    else if (maxVal >= lvl.star2) earned = 2;
    else if (maxVal >= lvl.star1) earned = 1;
    saveStars(currentLevel, earned);
    refreshMenu();

    if (victory) sndWin(); else sndOver();
    document.getElementById('finalMax').textContent = maxVal;
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent = maxVal >= best ? '🏆 Novo recorde!' : `Melhor: ${best}`;
    const es = document.getElementById('earnedStars');
    es.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      es.appendChild(s);
    }
    let emoji, title;
    if (victory) { emoji = '🏆'; title = 'CONSEGUIU!'; }
    else if (earned === 2) { emoji = '🎉'; title = 'Bom resultado!'; }
    else if (earned === 1) { emoji = '👍'; title = 'Não desiste!'; }
    else { emoji = '🎯'; title = 'Tenta de novo!'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;

    showScreen(endScreen);
  }

  // SWIPE
  let touchStart = null;
  const boardEl = document.getElementById('board');
  boardEl.addEventListener('touchstart', (e) => {
    ensureAudio();
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive:true });
  boardEl.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) { touchStart = null; return; }
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
    touchStart = null;
  });

  // KEYBOARD
  window.addEventListener('keydown', (e) => {
    if (gameScreen.classList.contains('hidden')) return;
    if (e.key === 'ArrowUp' || e.key === 'w') move('up');
    else if (e.key === 'ArrowDown' || e.key === 's') move('down');
    else if (e.key === 'ArrowLeft' || e.key === 'a') move('left');
    else if (e.key === 'ArrowRight' || e.key === 'd') move('right');
  });

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap(); startGame();
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    running = false;
    showScreen(menuScreen);
  });

  // NAVEGAÇÃO (back + home)
  (function setupNav() {
    const backEl = document.getElementById('backBtn');
    const homeEl = document.getElementById('homeBtn');
    function goHub() { parent.postMessage('back-to-hub', '*'); }
    function tap() { if (typeof ensureAudio === 'function') ensureAudio(); if (typeof sndTap === 'function') sndTap(); }
    if (backEl) backEl.addEventListener('click', () => {
      tap();
      const menu = document.getElementById('menuScreen');
      if (!menu || !menu.classList.contains('hidden')) { goHub(); return; }
      if (typeof showScreen === 'function') showScreen(menu);
      else { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); menu.classList.remove('hidden'); }
    });
    if (homeEl) homeEl.addEventListener('click', () => { tap(); goHub(); });
  })();

})();

    const games = [
      ['conta', 'blg-conta-stars-', 3, 9],
      ['memory', 'blg-memory-stars-', 4, 12],
      ['snake', 'blg-snake-stars-', 3, 9],
      ['letroca', 'blg-letroca-stars-', 3, 9],
      ['skyhop', 'blg-skyhop-stars-', 3, 9],
      ['platformer', 'blg-mario-stars-', 5, 15],
      ['cruzadas', 'blg-cruzadas-stars-', 6, 18],
      ['balloons', 'blg-balloons-stars-', 6, 18],
      ['animals', 'blg-animal-stars-', 3, 9],
      ['mole', 'blg-mole-stars-', 4, 12],
      ['g2048', 'blg-2048-stars-', 3, 9],
      ['tetris', 'blg-tetris-stars-', 3, 9],
      ['breakout', 'blg-breakout-stars-', 3, 9],
      ['race', 'blg-race-stars-', 5, 15],
      ['sokoban', 'blg-sokoban-stars-', 25, 75],
      ['invaders', 'blg-invaders-stars-', 3, 9],
      ['pacman', 'blg-pacman-stars-', 5, 15],
      ['tower', 'blg-tower-stars-', 3, 9],
    ];
    for (const [game, prefix, levels, max] of games) {
      let stars = 0;
      for (let i = 0; i < levels; i++) stars += +(localStorage.getItem(prefix + i) || 0);
      const prog = document.querySelector('.card[data-game="' + game + '"] .progress');
      if (prog) {
        const bar = prog.querySelector('div');
        if (stars > 0) {
          prog.classList.add('show');
          bar.style.width = Math.max(5, (stars / max) * 100) + '%';
        }
      }
    }
    // Piano: 1 valor único
    const pianoS = +(localStorage.getItem('blg-piano-stars') || 0);
    const pianoP = document.querySelector('.card[data-game="piano"] .progress');
    if (pianoP) {
      const bar = pianoP.querySelector('div');
      if (pianoS > 0) {
        pianoP.classList.add('show');
        bar.style.width = Math.max(5, (pianoS / 3) * 100) + '%';
      }
    }
    // Sudoku: 3 sizes × 3 diffs
    let sudokuS = 0;
    for (const sz of [4, 6, 9]) for (const df of ['Fácil', 'Médio', 'Difícil']) {
      sudokuS += +(localStorage.getItem('blg-sudoku-' + sz + '-' + df + '-stars') || 0);
    }
    const sudokuP = document.querySelector('.card[data-game="sudoku"] .progress');
    if (sudokuP) {
      const bar = sudokuP.querySelector('div');
      if (sudokuS > 0) {
        sudokuP.classList.add('show');
        bar.style.width = Math.max(5, (sudokuS / 27) * 100) + '%';
      }
    }
    // RPG: 1 valor único
    const rpgS = +(localStorage.getItem('blg-rpg-best-stars') || 0);
    const rpgP = document.querySelector('.card[data-game="rpg"] .progress');
    if (rpgP) {
      const bar = rpgP.querySelector('div');
      if (rpgS > 0) {
        rpgP.classList.add('show');
        bar.style.width = Math.max(5, (rpgS / 3) * 100) + '%';
      }
    }
  };
</script>
</body>
</html>

</script>

  @keyframes bounce { 0% { transform:scale(0); } 60% { transform:scale(1.2); } 100% { transform:scale(1); } }

<body>

  <!-- MENU -->
  <div id="menuScreen" class="screen">
    <h1>Tetris</h1>

    <div class="levelGrid">
      <div class="levelCard" data-lvl="0">

        </div>
        <div class="lvlStars" id="stars0"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
      </div>
      <div class="levelCard" data-lvl="1">
        <div class="lvlIcon">⚡</div>
        <div class="lvlInfo">
          <div class="lvlName">Normal</div>
          <div class="lvlRange">Padrão</div>
        </div>

      </div>
      <div class="levelCard" data-lvl="2">
        <div class="lvlIcon">🔥</div>
        <div class="lvlInfo">
          <div class="lvlName">Profissional</div>
          <div class="lvlRange">Rápido desde já</div>
        </div>
        <div class="lvlStars" id="stars2"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>

  <div id="gameScreen" class="screen hidden">

      <div class="stat"><div class="lbl">Pontos</div><div class="val" id="scoreVal">0</div></div>
      <div class="stat"><div class="lbl">Linhas</div><div class="val" id="linesVal">0</div></div>
      <div class="stat"><div class="lbl">Nível</div><div class="val" id="levelVal">1</div></div>

    <div class="best" id="bestMsg"></div>

      <button class="primaryBtn" id="playAgainBtn">Jogar de novo</button>
    </div>
  </div>

<script>
(() => {
  // AUDIO
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndMove()  { beep(440, 0.03, 'triangle', 0.03); }
  function sndRotate(){ beep(660, 0.05, 'triangle', 0.04); }
  function sndDrop()  { beep(220, 0.06, 'square', 0.05); }
  function sndClear(n){
    const base = 523;
    for (let i = 0; i < (n || 1); i++) {
      beep(base * Math.pow(1.5, i), 0.10, 'triangle', 0.06, i*0.05);
    }
  }
  function sndTap()   { beep(660, 0.04, 'triangle', 0.05); }
  function sndGameOver() { [440, 330, 220, 165].forEach((f, i) => beep(f, 0.18, 'sawtooth', 0.06, i*0.12)); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  // CONSTS
  const COLS = 10, ROWS = 20;
  const PIECES = {
    I: { matrix:[[1,1,1,1]], color:'#22d3ee' },
    O: { matrix:[[1,1],[1,1]], color:'#fde047' },
    T: { matrix:[[0,1,0],[1,1,1]], color:'#a855f7' },
    L: { matrix:[[0,0,1],[1,1,1]], color:'#fb923c' },
    J: { matrix:[[1,0,0],[1,1,1]], color:'#3b82f6' },
    S: { matrix:[[0,1,1],[1,1,0]], color:'#22c55e' },
    Z: { matrix:[[1,1,0],[0,1,1]], color:'#ef4444' },
  };
  const PIECE_KEYS = Object.keys(PIECES);

  const LEVELS = [
    { name:'Iniciante',    initialSpeed:800, goal3:5000, goal2:2500, goal1:1000 },
    { name:'Normal',       initialSpeed:500, goal3:8000, goal2:4000, goal1:1500 },
    { name:'Profissional', initialSpeed:300, goal3:12000, goal2:6000, goal1:2500 },
  ];

  // STATS
  function getStars(l) { return +(localStorage.getItem('blg-tetris-stars-' + l) || 0); }
  function saveStars(l, n) { if (n > getStars(l)) localStorage.setItem('blg-tetris-stars-' + l, n); }
  function getBest(l) { return +(localStorage.getItem('blg-tetris-best-' + l) || 0); }
  function saveBest(l, s) { if (s > getBest(l)) localStorage.setItem('blg-tetris-best-' + l, s); }
  function refreshMenu() {
    for (let i = 0; i < 3; i++) {
      const s = getStars(i);
      const ct = document.getElementById('stars' + i);
      ct.querySelectorAll('.s').forEach((el, idx) => el.classList.toggle('lit', idx < s));
    }
  }
  refreshMenu();

  // CANVAS
  const canvas = document.getElementById('boardCanvas');
  const ctx = canvas.getContext('2d');
  let DPR = 1, CW = 0, CH = 0, CELL = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    CW = r.width; CH = r.height;
    canvas.width = CW * DPR; canvas.height = CH * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CELL = CW / COLS;
  }

  // STATE
  let currentLevel = 0;
  let board = [];   // board[r][c] = color or null
  let piece = null;
  let nextPiece = null;
  let score = 0, lines = 0, level = 1;
  let dropMs = 800;
  let dropTimer = null;
  let running = false;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      startGame();
    });
  });

  function randomPiece() {
    const k = PIECE_KEYS[Math.floor(Math.random() * PIECE_KEYS.length)];
    const p = PIECES[k];
    return {
      type: k,
      matrix: p.matrix.map(r => [...r]),
      color: p.color,
      x: Math.floor((COLS - p.matrix[0].length) / 2),
      y: 0,
    };
  }

  function startGame() {
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    score = 0; lines = 0; level = 1;
    dropMs = LEVELS[currentLevel].initialSpeed;
    piece = randomPiece();
    nextPiece = randomPiece();
    running = true;
    document.getElementById('bestNum').textContent = getBest(currentLevel);
    updateHUD();
    showScreen(gameScreen);
    setTimeout(() => { resize(); render(); startDropTimer(); }, 50);
  }

  function updateHUD() {
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('linesVal').textContent = lines;
    document.getElementById('levelVal').textContent = level;
  }

  function startDropTimer() {
    if (dropTimer) clearInterval(dropTimer);
    dropTimer = setInterval(() => {
      if (!running) return;
      tick();
    }, dropMs);
  }

  function collide(p, dx=0, dy=0, matrix=null) {
    const m = matrix || p.matrix;
    for (let r = 0; r < m.length; r++) {
      for (let c = 0; c < m[0].length; c++) {
        if (m[r][c] === 0) continue;
        const nx = p.x + c + dx;
        const ny = p.y + r + dy;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
        if (ny < 0) continue;
        if (board[ny][nx] !== null) return true;
      }
    }
    return false;
  }

  function merge(p) {
    for (let r = 0; r < p.matrix.length; r++) {
      for (let c = 0; c < p.matrix[0].length; c++) {
        if (p.matrix[r][c] === 0) continue;
        const nx = p.x + c, ny = p.y + r;
        if (ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS) board[ny][nx] = p.color;
      }
    }
  }

  function rotateMatrix(m) {
    const rows = m.length, cols = m[0].length;
    const out = Array.from({ length: cols }, () => Array(rows).fill(0));
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      out[c][rows - 1 - r] = m[r][c];
    }
    return out;
  }

  function tryRotate() {
    if (!running) return;
    const newMatrix = rotateMatrix(piece.matrix);
    // tenta na pos atual, depois -1, +1, -2, +2 (wall kick simples)
    for (const dx of [0, -1, 1, -2, 2]) {
      if (!collide(piece, dx, 0, newMatrix)) {
        piece.matrix = newMatrix;
        piece.x += dx;
        sndRotate();
        render();
        return;
      }
    }
  }

  function tryMove(dx) {
    if (!running) return;
    if (!collide(piece, dx, 0)) {
      piece.x += dx;
      sndMove();
      render();
    }
  }

  function softDrop() {
    if (!running) return;
    if (!collide(piece, 0, 1)) {
      piece.y++;
      score += 1;
      updateHUD();
      render();
    } else {
      lockPiece();
    }
  }

  function tick() {
    if (collide(piece, 0, 1)) {
      lockPiece();
    } else {
      piece.y++;
      render();
    }
  }

  function lockPiece() {
    merge(piece);
    sndDrop();
    // check lines
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r].every(v => v !== null)) {
        board.splice(r, 1);
        board.unshift(Array(COLS).fill(null));
        cleared++;
        r++;  // recheck same line
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] || 800;
      score += points * level;
      lines += cleared;
      sndClear(cleared);
      // level up a cada 10 linhas
      const newLevel = Math.floor(lines / 10) + 1;
      if (newLevel > level) {
        level = newLevel;
        dropMs = Math.max(80, LEVELS[currentLevel].initialSpeed - (level - 1) * 60);
        startDropTimer();
      }
      updateHUD();
    }
    // spawn next
    piece = nextPiece;
    nextPiece = randomPiece();
    if (collide(piece)) {
      gameOver();
      return;
    }
    render();
  }

  function gameOver() {
    running = false;
    if (dropTimer) { clearInterval(dropTimer); dropTimer = null; }
    sndGameOver();
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, score);
    let earned = 0;
    if (score >= lvl.goal3) earned = 3;
    else if (score >= lvl.goal2) earned = 2;
    else if (score >= lvl.goal1) earned = 1;
    saveStars(currentLevel, earned);
    refreshMenu();

    document.getElementById('finalScore').textContent = score;
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent = score >= best ? '🏆 Novo recorde!' : `Melhor: ${best}`;
    const es = document.getElementById('earnedStars');
    es.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      es.appendChild(s);
    }
    let emoji, title;
    if (earned === 3) { emoji = '🏆'; title = 'INCRÍVEL!'; }
    else if (earned === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else if (earned === 1) { emoji = '👍'; title = 'Bom!'; }
    else { emoji = '🎮'; title = 'Game Over'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;

    setTimeout(() => showScreen(endScreen), 500);
  }

  function render() {
    if (!CELL) return;
    ctx.fillStyle = '#020817';
    ctx.fillRect(0, 0, CW, CH);
    // grid sutil
    ctx.strokeStyle = 'rgba(255,255,255,.04)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, CH); ctx.stroke();
    }
    for (let i = 1; i < ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * CELL); ctx.lineTo(CW, i * CELL); ctx.stroke();
    }
    // board
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (board[r][c]) drawCell(c, r, board[r][c]);
    }
    // peça atual
    if (piece) {
      for (let r = 0; r < piece.matrix.length; r++) {
        for (let c = 0; c < piece.matrix[0].length; c++) {
          if (piece.matrix[r][c]) drawCell(piece.x + c, piece.y + r, piece.color);
        }
      }
    }
  }

  function drawCell(c, r, color) {
    const x = c * CELL, y = r * CELL;
    ctx.fillStyle = color;
    ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
    // highlight top-left
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(x + 1, y + 1, CELL - 2, 3);
    ctx.fillRect(x + 1, y + 1, 3, CELL - 2);
    // shadow bottom-right
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.fillRect(x + 1, y + CELL - 4, CELL - 2, 3);
    ctx.fillRect(x + CELL - 4, y + 1, 3, CELL - 2);
  }

  // CONTROLES
  document.getElementById('btnLeft').addEventListener('click', () => { ensureAudio(); tryMove(-1); });
  document.getElementById('btnRight').addEventListener('click', () => { ensureAudio(); tryMove(1); });
  document.getElementById('btnRotate').addEventListener('click', () => { ensureAudio(); tryRotate(); });
  document.getElementById('btnDown').addEventListener('click', () => { ensureAudio(); softDrop(); });

  // KEYBOARD
  window.addEventListener('keydown', (e) => {
    if (gameScreen.classList.contains('hidden')) return;
    if (e.key === 'ArrowLeft' || e.key === 'a') tryMove(-1);
    else if (e.key === 'ArrowRight' || e.key === 'd') tryMove(1);
    else if (e.key === 'ArrowDown' || e.key === 's') softDrop();
    else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') { tryRotate(); e.preventDefault(); }
  });

  window.addEventListener('resize', () => { if (!gameScreen.classList.contains('hidden')) { resize(); render(); } });

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap(); startGame();
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    running = false;
    if (dropTimer) { clearInterval(dropTimer); dropTimer = null; }
    showScreen(menuScreen);
  });

  // NAVEGAÇÃO (back + home)
  (function setupNav() {
    const backEl = document.getElementById('backBtn');
    const homeEl = document.getElementById('homeBtn');
    function goHub() { parent.postMessage('back-to-hub', '*'); }
    function tap() { if (typeof ensureAudio === 'function') ensureAudio(); if (typeof sndTap === 'function') sndTap(); }
    if (backEl) backEl.addEventListener('click', () => {
      tap();
      const menu = document.getElementById('menuScreen');
      if (!menu || !menu.classList.contains('hidden')) { goHub(); return; }
      if (typeof showScreen === 'function') showScreen(menu);
      else { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); menu.classList.remove('hidden'); }
    });
    if (homeEl) homeEl.addEventListener('click', () => { tap(); goHub(); });
  })();

})();

<script>
(() => {
  let audioCtx = null;
  let muted = localStorage.getItem('blg-mute') === '1';
  function ensureAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); }
  function beep(freq, dur=0.08, type='sine', vol=0.05, when=0) {
    if (!audioCtx || muted) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    const t = audioCtx.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  }
  function sndBlock() { beep(660 + Math.random()*200, 0.05, 'square', 0.05); }
  function sndPad()   { beep(330, 0.05, 'triangle', 0.05); }
  function sndWall()  { beep(440, 0.04, 'square', 0.03); }
  function sndLose()  { beep(220, 0.2, 'sawtooth', 0.06); }
  function sndTap()   { beep(660, 0.04, 'triangle', 0.05); }
  function sndWin()   { [523, 659, 784, 1047, 1318].forEach((f, i) => beep(f, 0.15, 'square', 0.06, i*0.08)); }

  const muteBtn = document.getElementById('muteBtn');
  function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  refreshMute();
  muteBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    localStorage.setItem('blg-mute', muted ? '1' : '0');
    refreshMute();
    if (!muted) sndTap();
  });

  const LEVELS = [
    { name:'Fácil',   paddleW:120, ballSpeed:4.0, brickRows:5,  brickCols:7,  lives:5, goal3:35, goal2:20, goal1:8 },
    { name:'Médio',   paddleW:90,  ballSpeed:5.2, brickRows:6,  brickCols:8,  lives:3, goal3:48, goal2:28, goal1:12 },
    { name:'Difícil', paddleW:70,  ballSpeed:6.5, brickRows:7,  brickCols:8,  lives:3, goal3:56, goal2:32, goal1:14 },
  ];

  function getStars(l) { return +(localStorage.getItem('blg-breakout-stars-' + l) || 0); }
  function saveStars(l, n) { if (n > getStars(l)) localStorage.setItem('blg-breakout-stars-' + l, n); }
  function getBest(l) { return +(localStorage.getItem('blg-breakout-best-' + l) || 0); }
  function saveBest(l, s) { if (s > getBest(l)) localStorage.setItem('blg-breakout-best-' + l, s); }
  function refreshMenu() {
    for (let i = 0; i < 3; i++) {
      const s = getStars(i);
      const ct = document.getElementById('stars' + i);
      ct.querySelectorAll('.s').forEach((el, idx) => el.classList.toggle('lit', idx < s));
    }
  }
  refreshMenu();

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  let currentLevel = 0;
  let paddle, ball, bricks = [], lives = 0, score = 0, running = false, lastTime = 0;
  let waitingLaunch = true;

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const endScreen = document.getElementById('endScreen');
  function showScreen(s) {
    [menuScreen, gameScreen, endScreen].forEach(el => el.classList.add('hidden'));
    s.classList.remove('hidden');
  }

  document.querySelectorAll('.levelCard').forEach(card => {
    card.addEventListener('click', () => {
      ensureAudio(); sndTap();
      currentLevel = +card.dataset.lvl;
      showScreen(gameScreen);
      setTimeout(() => { resize(); startGame(); }, 50);
    });
  });

  const BRICK_COLORS = ['#ef4444','#fb923c','#fde047','#a3e635','#22c55e','#06b6d4','#3b82f6','#a855f7'];

  function startGame() {
    const lvl = LEVELS[currentLevel];
    lives = lvl.lives;
    score = 0;
    updateHUD();
    paddle = { x: W/2 - lvl.paddleW/2, y: H - 100, w: lvl.paddleW, h: 12 };
    resetBall();
    buildBricks();
    running = true;
    waitingLaunch = true;
    document.getElementById('startHint').style.display = '';
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function resetBall() {
    ball = {
      x: paddle.x + paddle.w / 2,
      y: paddle.y - 12,
      r: 8,
      vx: 0,
      vy: 0,
    };
    waitingLaunch = true;
    document.getElementById('startHint').style.display = '';
  }

  function buildBricks() {
    const lvl = LEVELS[currentLevel];
    bricks = [];
    const cols = lvl.brickCols, rows = lvl.brickRows;
    const padding = 4;
    const topOffset = 80;
    const sideOffset = 8;
    const brickW = (W - sideOffset * 2 - padding * (cols - 1)) / cols;
    const brickH = 18;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        bricks.push({
          x: sideOffset + c * (brickW + padding),
          y: topOffset + r * (brickH + padding),
          w: brickW, h: brickH,
          color: BRICK_COLORS[r % BRICK_COLORS.length],
          alive: true,
        });
      }
    }
  }

  function updateHUD() {
    document.getElementById('livesEl').textContent = '❤️'.repeat(lives) + '🤍'.repeat(Math.max(0, LEVELS[currentLevel].lives - lives));
    document.getElementById('scoreNum').textContent = score;
  }

  function launchBall() {
    waitingLaunch = false;
    document.getElementById('startHint').style.display = 'none';
    const lvl = LEVELS[currentLevel];
    const angle = -Math.PI/2 + (Math.random() - 0.5) * 0.6;
    ball.vx = Math.cos(angle) * lvl.ballSpeed;
    ball.vy = Math.sin(angle) * lvl.ballSpeed;
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(2, (now - lastTime) / 16.67);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    if (waitingLaunch) {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - 12;
      return;
    }
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    // colisão paredes
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); sndWall(); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); sndWall(); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); sndWall(); }
    // paddle
    if (ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 5 &&
        ball.x >= paddle.x && ball.x <= paddle.x + paddle.w && ball.vy > 0) {
      ball.y = paddle.y - ball.r;
      // ângulo baseado no ponto de impacto
      const hit = (ball.x - paddle.x) / paddle.w; // 0..1
      const angle = -Math.PI / 2 + (hit - 0.5) * 1.4;
      const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
      ball.vx = Math.cos(angle) * speed;
      ball.vy = Math.sin(angle) * speed;
      sndPad();
    }
    // tijolos
    for (const b of bricks) {
      if (!b.alive) continue;
      if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
          ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
        b.alive = false;
        score++;
        // Eixo de overlap menor = lado por onde entrou
        const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (overlapX < overlapY) {
          // bateu na lateral: inverte vx e empurra pra fora horizontalmente
          ball.vx = -ball.vx;
          if (ball.x < b.x + b.w / 2) ball.x = b.x - ball.r - 0.5;
          else ball.x = b.x + b.w + ball.r + 0.5;
        } else {
          // bateu em cima/baixo: inverte vy e empurra pra fora verticalmente
          ball.vy = -ball.vy;
          if (ball.y < b.y + b.h / 2) ball.y = b.y - ball.r - 0.5;
          else ball.y = b.y + b.h + ball.r + 0.5;
        }
        sndBlock();
        updateHUD();
        break;
      }
    }
    // perdeu vida? (logo abaixo do paddle, não no fundo do canvas)
    if (ball.y - ball.r > paddle.y + paddle.h + 30) {
      lives--;
      sndLose();
      updateHUD();
      if (lives <= 0) { gameOver(); return; }
      resetBall();
    }
    // venceu tudo?
    if (bricks.every(b => !b.alive)) {
      sndWin();
      // bonus + próxima rodada com mais tijolos (não, MVP: termina como vitória)
      setTimeout(() => endGame(true), 600);
      running = false;
    }
  }

  function render() {
    ctx.fillStyle = '#26052a';
    ctx.fillRect(0, 0, W, H);
    // tijolos
    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = 'rgba(255,255,255,.3)';
      ctx.fillRect(b.x, b.y, b.w, 3);
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.fillRect(b.x, b.y + b.h - 3, b.w, 3);
    }
    // paddle
    const pgrad = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    pgrad.addColorStop(0, '#f9a8d4');
    pgrad.addColorStop(1, '#ec4899');
    ctx.fillStyle = pgrad;
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(paddle.x, paddle.y, paddle.w, paddle.h);
    // bola
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#ec4899';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function gameOver() {
    running = false;
    endGame(false);
  }

  function endGame(victory) {
    const lvl = LEVELS[currentLevel];
    saveBest(currentLevel, score);
    let earned = 0;
    if (score >= lvl.goal3) earned = 3;
    else if (score >= lvl.goal2) earned = 2;
    else if (score >= lvl.goal1) earned = 1;
    saveStars(currentLevel, earned);
    refreshMenu();

    document.getElementById('finalScore').textContent = score;
    const best = getBest(currentLevel);
    document.getElementById('bestMsg').textContent = score >= best ? '🏆 Novo recorde!' : `Melhor: ${best}`;
    const es = document.getElementById('earnedStars');
    es.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 's' + (i < earned ? ' lit' : '');
      s.textContent = '★';
      es.appendChild(s);
    }
    let emoji, title;
    if (victory) { emoji = '🏆'; title = 'LIMPOU!'; }
    else if (earned === 3) { emoji = '🏆'; title = 'PERFEITO!'; }
    else if (earned === 2) { emoji = '🎉'; title = 'Muito bem!'; }
    else if (earned === 1) { emoji = '👍'; title = 'Bom!'; }
    else { emoji = '🎯'; title = 'Game Over'; }
    document.getElementById('endEmoji').textContent = emoji;
    document.getElementById('endTitle').textContent = title;
    setTimeout(() => showScreen(endScreen), 500);
  }

  // CONTROLES touch (slide horizontal)
  function setPaddleX(x) {
    paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
  }
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    ensureAudio();
    const rect = canvas.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left;
    setPaddleX(x);
    if (waitingLaunch) launchBall();
  }, { passive:false });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left;
    setPaddleX(x);
  }, { passive:false });
  // Mouse fallback
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    setPaddleX(e.clientX - rect.left);
  });
  canvas.addEventListener('mousedown', () => { ensureAudio(); if (waitingLaunch) launchBall(); });
  window.addEventListener('keydown', (e) => {
    if (gameScreen.classList.contains('hidden')) return;
    if (e.key === ' ' || e.key === 'ArrowUp') { if (waitingLaunch) launchBall(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'a') { paddle.x = Math.max(0, paddle.x - 15); }
    else if (e.key === 'ArrowRight' || e.key === 'd') { paddle.x = Math.min(W - paddle.w, paddle.x + 15); }
  });

  window.addEventListener('resize', () => { if (!gameScreen.classList.contains('hidden')) resize(); });

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    showScreen(gameScreen);
    setTimeout(() => { resize(); startGame(); }, 50);
  });
  document.getElementById('backMenuBtn').addEventListener('click', () => {
    ensureAudio(); sndTap();
    running = false;
    showScreen(menuScreen);
  });

  // NAVEGAÇÃO (back + home)
  (function setupNav() {
    const backEl = document.getElementById('backBtn');
    const homeEl = document.getElementById('homeBtn');
    function goHub() { parent.postMessage('back-to-hub', '*'); }
    function tap() { if (typeof ensureAudio === 'function') ensureAudio(); if (typeof sndTap === 'function') sndTap(); }
    if (backEl) backEl.addEventListener('click', () => {
      tap();
      const menu = document.getElementById('menuScreen');
      if (!menu || !menu.classList.contains('hidden')) { goHub(); return; }
      if (typeof showScreen === 'function') showScreen(menu);
      else { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); menu.classList.remove('hidden'); }
    });
    if (homeEl) homeEl.addEventListener('click', () => { tap(); goHub(); });
  })();

})();

<script>
(() => {
  let audioCtx = null;
